<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>sctrial · Study workspace</title><style>:root {
  color-scheme: light;
  --ink: #17243b;
  --muted: #546478;
  --line: #dfe5ed;
  --violet: #684ce5;
  --teal: #087f78;
  --surface: #fff;
  --base: #f5f7fb;
  --nav: #131d36;
  --focus: #4143b8;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Arial,
    sans-serif;
  font-synthesis: none;
  color: var(--ink);
  background: var(--base);
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body,
h1,
h2,
h3,
p {
  margin: 0;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button {
  background: none;
  border: 0;
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #6861d6;
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
svg {
  display: block;
}
i[data-icon],
span[data-icon] {
  display: inline-flex;
  font-style: normal;
  flex-shrink: 0;
}
button {
  touch-action: manipulation;
}
[hidden] {
  display: none !important;
}
.skip {
  position: fixed;
  top: -80px;
  left: 10px;
  z-index: 20;
  background: white;
  padding: 12px;
}
.skip:focus {
  top: 8px;
}
.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr);
}
.rail {
  background: linear-gradient(172deg, #16203a 5%, #17213f 70%, #202749);
  color: #d8dff0;
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 15px;
  z-index: 6;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 31px;
  font-weight: 720;
  letter-spacing: -1.9px;
  color: #fff;
  padding: 24px 11px 29px;
  line-height: 1;
}
.study-switch {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 9px;
  color: #edf0f9;
  border: 1px solid #3a4461;
  border-radius: 9px;
  background: #232e4b;
  padding: 12px 8px 12px 10px;
  width: 100%;
}
.study-switch:hover,
.rail nav button:hover {
  background: #2c3756;
}
.dataset-icon {
  width: 30px;
  height: 33px;
  align-items: center;
  justify-content: center;
  background: #3c4567;
  color: #d4ceff;
  border-radius: 6px;
}
.study-switch-text {
  overflow: hidden;
  flex: 1;
  min-width: 0;
}
.study-switch-text b,
.study-switch-text small {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.study-switch-text b {
  font-size: 12px;
}
.study-switch-text small,
.rail-foot small {
  font-size: 11px;
  color: #b9c4db;
  margin-top: 4px;
}
.rail-label {
  padding: 27px 12px 10px;
  color: #a7b4ce;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.secondary-nav {
  padding-top: 30px;
}
.rail nav {
  display: grid;
  gap: 5px;
}
.rail nav button {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: center;
  border-radius: 7px;
  text-align: left;
  color: #d6dfef;
  padding: 11px 13px;
  font-size: 13px;
  font-weight: 510;
}
.rail nav button[aria-current='page'] {
  background: #3a3b69;
  color: white;
  box-shadow: inset 3px 0 #a99bff;
}
.rail nav button[aria-current='page'] i {
  color: #c6bbff;
}
.rail-foot {
  margin-top: auto;
  border-top: 1px solid #394360;
  padding: 19px 8px 22px;
}
.local-signal {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #eff4fa;
  font-size: 12px;
  font-weight: 600;
}
.local-signal span {
  width: 7px;
  height: 7px;
  background: #60d8ba;
  border-radius: 50%;
}
.rail-foot small {
  display: block;
  margin-left: 15px;
}
.body {
  min-width: 0;
}
.topbar {
  height: 57px;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(18px, 2.4vw, 39px);
}
.crumb,
.top-actions,
.title-line,
.actions,
.btn,
.section-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}
.crumb {
  font-size: 12px;
  color: var(--muted);
}
.crumb strong {
  color: var(--ink);
  font-weight: 600;
}
.crumb b {
  color: #9aa5b7;
  font-weight: 400;
  margin: 0 3px;
}
.crumb-symbol {
  color: #6d708f;
}
.top-divider {
  height: 21px;
  border-left: 1px solid var(--line);
  margin: 0 3px;
}
.search-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}
.search-btn kbd {
  font-family: inherit;
  border: 1px solid var(--line);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 11px;
}
.icon-btn {
  width: 32px;
  height: 32px;
  display: inline-grid;
  place-items: center;
  border-radius: 6px;
  color: #526079;
}
.icon-btn:hover,
.search-btn:hover {
  background: #f0f2f8;
}
.mobile {
  display: none;
}
main {
  max-width: 1680px;
  margin: 0 auto;
  padding: clamp(20px, 2.35vw, 38px);
  outline: none;
}
.titlebar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 21px;
}
.title-line {
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  font-size: clamp(27px, 2.35vw, 39px);
  line-height: 1.1;
  letter-spacing: -0.055em;
  font-weight: 690;
}
h2 {
  font-size: 17px;
  letter-spacing: -0.037em;
  line-height: 1.22;
  font-weight: 670;
}
h3 {
  font-size: 15px;
  letter-spacing: -0.024em;
}
.source-tag,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  line-height: 1.5;
  padding: 3px 8px;
  border-radius: 5px;
  background: #ebe8fb;
  color: #554093;
  font-weight: 600;
}
.source-tag:before {
  content: '';
  width: 5px;
  height: 5px;
  display: block;
  border-radius: 50%;
  background: #7955ba;
}
.subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 7px;
  overflow-wrap: anywhere;
}
.btn {
  border: 1px solid #d4dbe7;
  min-height: 36px;
  border-radius: 7px;
  padding: 7px 12px;
  background: white;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition:
    background 0.14s,
    border-color 0.14s;
}
.btn:hover {
  background: #f1f3f9;
  border-color: #a9b3c8;
}
.btn.primary {
  background: #5141b6;
  color: #fff;
  border-color: #5141b6;
}
.btn.primary:hover {
  background: #40318f;
}
.btn svg {
  width: 15px;
  height: 15px;
}
.muted,
.small {
  color: var(--muted);
}
.small {
  font-size: 12px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 2px 5px rgba(25, 42, 71, 0.035);
  min-width: 0;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.section-head p,
.section-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.select,
select.field-input,
input.field-input {
  background: #fff;
  border: 1px solid #cbd3e0;
  border-radius: 6px;
  min-height: 35px;
  padding: 6px 9px;
  color: var(--ink);
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.stat {
  padding: 16px 16px 14px;
  position: relative;
  overflow: hidden;
}
.stat-top {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #40506a;
  font-size: 12px;
  font-weight: 600;
}
.stat-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  color: var(--tone);
  background: var(--wash);
}
.stat-icon svg {
  width: 16px;
  height: 16px;
}
.stat-number {
  font-size: 32px;
  letter-spacing: -0.06em;
  line-height: 1.12;
  font-weight: 680;
  display: block;
  margin: 9px 0 4px;
  font-variant-numeric: tabular-nums;
}
.stat-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}
.stat-fraction {
  font: 500 15px/1 system-ui;
  color: var(--muted);
  letter-spacing: -0.04em;
}
.chart-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.38fr) minmax(0, 1fr);
  gap: 16px;
}
.chart-card {
  padding: 19px 18px 12px;
  display: flex;
  flex-direction: column;
}
.plot {
  min-width: 0;
  position: relative;
  margin-top: 6px;
}
.chart-tools {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin: 14px 0 3px;
}
.feature-select {
  max-width: 100%;
  padding: 5px 22px 5px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 12px;
  background: #fff;
  min-height: 30px;
}
.switcher {
  border-radius: 6px;
  border: 1px solid #dfe4ee;
  background: #f0f3f8;
  display: inline-flex;
  padding: 2px;
}
.switcher button {
  font-size: 11px;
  line-height: 1.3;
  border-radius: 4px;
  padding: 5px 8px;
  color: var(--muted);
}
.switcher button[aria-pressed='true'] {
  background: #fff;
  color: #3d3490;
  font-weight: 600;
  box-shadow: 0 1px 3px #cbd2df;
}
.text-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #504198;
  font-size: 12px;
  font-weight: 650;
  padding: 5px 2px;
}
.text-btn:hover {
  text-decoration: underline;
}
.text-btn svg {
  width: 13px;
  height: 13px;
}
.forest-meta {
  margin: 14px 0 3px;
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 30px;
  color: var(--muted);
  font-size: 11px;
}
.forest-meta .pill {
  background: #edf1f8;
  color: #485977;
}
.panel-footer {
  border-top: 1px solid var(--line);
  margin-top: auto;
  padding-top: 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  min-height: 33px;
}
.panel-footer .small {
  font-size: 11px;
}
.coverage {
  padding: 17px 18px 13px;
  margin-top: 16px;
}
.matrix-wrap {
  overflow: auto;
}
.matrix {
  width: 100%;
  border-spacing: 5px;
  margin: 8px -5px 1px;
  width: calc(100% + 10px);
  font-size: 12px;
}
.matrix th {
  font-weight: 600;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  padding-bottom: 4px;
}
.matrix td:first-child,
.matrix th:first-child {
  text-align: left;
}
.matrix td:first-child {
  font-weight: 600;
}
.arm-dot {
  display: inline-block;
  vertical-align: middle;
  width: 9px;
  height: 9px;
  border-radius: 3px;
  margin-right: 7px;
  background: var(--arm-color);
}
.matrix button {
  width: 100%;
  min-height: 29px;
  border-radius: 5px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.matrix button:hover {
  box-shadow: inset 0 0 0 2px var(--arm-color);
}
.matrix .denom {
  opacity: 0.86;
  font-size: 10px;
}
.coverage .section-head {
  align-items: flex-start;
}
.legend-note {
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}
.modal {
  width: min(calc(100% - 26px), 500px);
  max-height: 85dvh;
  border: 1px solid #cbd3df;
  border-radius: 14px;
  color: var(--ink);
  padding: 0;
  box-shadow: 0 18px 70px #13234344;
}
.modal::backdrop {
  background: #101b36a3;
}
.modal-head {
  padding: 19px 21px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px 21px 21px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}
.field {
  display: grid;
  align-content: start;
  gap: 5px;
  min-width: 0;
}
.field.wide {
  grid-column: 1/-1;
}
.field > span {
  font-size: 12px;
  font-weight: 620;
}
.field-input {
  width: 100%;
}
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 17px;
}
.hint {
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.contrast-note {
  margin-top: 14px;
  border-radius: 7px;
  background: #f2f1fc;
  color: #463e7b;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.45;
}
.choice {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 7px 0;
  background: #fff;
  cursor: pointer;
}
.choice:hover {
  border-color: #9b90d5;
  background: #f8f7fe;
}
.choice > i {
  color: #5948aa;
}
.choice span {
  display: grid;
  gap: 3px;
}
.choice strong {
  font-size: 13px;
}
.choice small {
  font-size: 12px;
  color: var(--muted);
}
.drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  border: 1px dashed #9e99be;
  border-radius: 9px;
  background: #f7f6ff;
  padding: 23px 12px;
  color: #42388e;
  cursor: pointer;
}
.drop-zone.over {
  border: 2px solid var(--violet);
}
.drop-zone .btn {
  margin: 3px;
}
.drop-zone strong {
  font-size: 15px;
}
.drop-zone small {
  color: var(--muted);
}
.error {
  border-left: 3px solid #b43f48;
  padding: 8px;
  color: #913342;
  background: #fff3f3;
  font-size: 12px;
  margin-top: 8px;
}
.modal-list {
  display: grid;
  max-height: 42vh;
  overflow: auto;
  margin-top: 10px;
}
.modal-list button {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  gap: 8px;
}
.modal-list button:hover {
  background: #f6f5fd;
}
.modal-list small {
  color: var(--muted);
}
.meta-list {
  display: grid;
  gap: 0;
}
.meta-list div {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 7px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.meta-list dt {
  color: var(--muted);
}
.meta-list dd {
  margin: 0;
}
.toast {
  position: fixed;
  z-index: 20;
  bottom: 22px;
  right: 20px;
  background: #1b2943;
  color: white;
  border-radius: 8px;
  box-shadow: 0 4px 18px #13234335;
  padding: 12px 15px;
  font-size: 13px;
}
.empty {
  color: var(--muted);
  padding: 15px;
  font-size: 13px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
@media (min-width: 1550px) {
  .shell {
    grid-template-columns: 230px minmax(0, 1fr);
  }
  .stat {
    padding: 18px 22px;
  }
  .chart-card {
    padding: 22px 24px 14px;
  }
}
@media (max-width: 1100px) {
  .shell {
    grid-template-columns: 172px minmax(0, 1fr);
  }
  .rail {
    padding: 0 9px;
  }
  .chart-grid {
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  }
  .chart-card,
  .stat {
    padding: 13px 11px;
  }
  .chart-tools {
    gap: 5px;
  }
  .chart-grid,
  .stats {
    gap: 11px;
  }
  .stat-top {
    gap: 4px;
  }
  .study-switch {
    padding: 10px 6px;
  }
  .stat-number {
    font-size: 29px;
  }
  main {
    padding: 19px 16px;
  }
}
@media (max-width: 840px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
  }
  .rail {
    position: fixed;
    inset: 0 auto 0 0;
    width: 215px;
    transform: translateX(-101%);
    visibility: hidden;
    transition: transform 0.15s ease;
    z-index: 8;
  }
  .rail.open {
    transform: translateX(0);
    visibility: visible;
  }
  .mobile {
    display: inline-grid;
  }
  #scrim {
    position: fixed;
    inset: 0;
    z-index: 7;
    background: #17243b65;
    width: 100%;
  }
  .topbar {
    height: 48px;
    padding: 0 12px;
  }
  .topbar .crumb-symbol {
    display: none;
  }
  .stats {
    gap: 9px;
  }
  .titlebar {
    margin-bottom: 15px;
  }
}
@media (max-width: 680px) {
  main {
    padding: 17px 12px;
  }
  .titlebar {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
  }
  .actions {
    gap: 6px;
  }
  .title-line {
    gap: 7px;
  }
  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-bottom: 11px;
  }
  .stat {
    padding: 10px 12px;
  }
  .stat-number {
    font-size: 25px;
    margin: 4px 0 1px;
  }
  .stat-icon {
    width: 22px;
    height: 22px;
    border-radius: 5px;
  }
  .stat-icon svg {
    width: 14px;
    height: 14px;
  }
  .stat-note {
    font-size: 10.5px;
  }
  .chart-grid {
    grid-template-columns: 1fr;
  }
  .chart-card,
  .coverage {
    padding: 15px 12px 10px;
  }
  .coverage {
    margin-top: 11px;
  }
  .section-head {
    gap: 5px;
  }
  .search-btn span,
  .search-btn kbd {
    display: none;
  }
  .top-divider {
    margin: 0;
  }
  .subtitle {
    font-size: 12px;
  }
  .chart-tools,
  .forest-meta {
    margin-top: 10px;
  }
  .fields {
    gap: 9px;
  }
  .source-tag {
    font-size: 10px;
  }
  .matrix td:first-child {
    white-space: nowrap;
  }
  .panel-footer {
    margin-top: 6px;
  }
  .btn {
    min-height: 34px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
.stat {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  align-content: start;
}
.stat-top,
.stat-note {
  grid-column: 1/-1;
}
.stat-top {
  margin-bottom: 1px;
}
.stat-number {
  grid-column: 1;
}
.stat-mini {
  grid-column: 2;
  grid-row: 2;
  color: var(--tone);
  display: flex;
  align-items: center;
  margin: 4px 2px 0 0;
}
.stat-mini > svg {
  width: 33px;
  height: 33px;
}
.micro-split {
  display: flex;
  gap: 3px;
  width: 43px;
  height: 7px;
}
.micro-split i {
  border-radius: 3px;
}
.micro-bars {
  display: flex;
  gap: 3px;
  align-items: end;
  height: 30px;
}
.micro-bars i {
  width: 7px;
  border-radius: 2px 2px 1px 1px;
}
.micro-visits {
  display: flex;
  align-items: center;
  gap: 5px;
  background: linear-gradient(#d9ba98, #d9ba98) center/88% 1px no-repeat;
}
.micro-visits i {
  width: 7px;
  height: 7px;
  border: 1px solid #b9864d;
  background: #fff;
  border-radius: 50%;
}
.micro-visits i.on {
  background: #aa6b24;
}
.matrix {
  margin: 8px 0 1px;
  width: 100%;
}
.plot > div {
  animation: plot-enter 0.18s ease-out;
}
@keyframes plot-enter {
  from {
    opacity: 0.45;
  }
  to {
    opacity: 1;
  }
}
@media (max-width: 680px) {
  .stat-mini > svg {
    height: 24px;
    width: 24px;
  }
  .micro-split {
    width: 31px;
  }
  .stat-mini {
    margin: 0;
  }
  .micro-bars {
    height: 24px;
    transform: scale(0.8);
    transform-origin: right center;
  }
  .micro-visits {
    gap: 3px;
  }
}

.pe.card {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 15px;
  background: white;
  color: var(--ink, #17243b);
}
.pe-head,
.pe-filters,
.pe-footer,
.pe-notes {
  padding-inline: clamp(16px, 2vw, 28px);
}
.pe-head {
  padding-top: 21px;
}
.pe-head h2,
.pe-detail h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.035em;
  color: var(--ink, #17243b);
}
.pe-sub,
.pe-dialog-sub {
  margin: 5px 0 0;
  font-size: 13px;
  color: #53647a;
}
.pe-filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  padding-block: 16px;
}
.pe-control {
  display: grid;
  gap: 5px;
  min-width: 132px;
}
.pe-label,
.pe-dialog-label {
  font-size: 12px;
  color: #52617a;
  font-weight: 600;
}
.pe-search {
  flex: 1 1 185px;
}
.pe-input,
.pe-control select {
  max-width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 10px;
  border: 1px solid #c5cede;
  border-radius: 7px;
  background: white;
  color: var(--ink, #17243b);
  font: inherit;
  font-size: 13px;
}
.pe-control select {
  cursor: pointer;
  min-width: 118px;
}
.pe-input::placeholder {
  color: #637086;
}
.pe :focus-visible,
.pe-detail :focus-visible {
  outline: 3px solid #5743c7;
  outline-offset: 2px;
}
.pe-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.pe-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
  margin: 0;
}
.pe-table th,
.pe-table td {
  text-align: left;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid #e9edf3;
  color: #35445b;
  background: transparent;
}
.pe-table th:first-child,
.pe-table td:first-child {
  padding-left: clamp(16px, 2vw, 28px);
}
.pe-table th:last-child,
.pe-table td:last-child {
  padding-right: clamp(16px, 2vw, 28px);
}
.pe-table thead th {
  padding-block: 9px;
  background: #f4f6fb;
  font-weight: 600;
  font-size: 12px;
  color: #54627a;
  border-block: 1px solid #e2e6ee;
}
.pe-table tbody th {
  font-weight: 550;
}
.pe-table tbody tr:hover td,
.pe-table tbody tr:hover th {
  background: #f8f9fe;
}
.pe-person {
  color: #3d3289;
  background: transparent;
  border: 0;
  padding: 4px 3px 4px 0;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.pe-person:hover {
  text-decoration: underline;
}
.pe-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pe-group::before {
  content: '';
  display: block;
  height: 8px;
  width: 8px;
  border-radius: 3px;
  background: var(--violet, #684ce5);
}
.pe-group.pe-second::before {
  background: var(--teal, #087f78);
}
.pe-num,
.pe-page-number,
.pe-detail-table {
  font-variant-numeric: tabular-nums;
}
.pe-mark {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  box-sizing: border-box;
  vertical-align: -1px;
}
.pe-yes {
  background: #11887e;
  box-shadow: inset 0 0 0 1px #087267;
}
.pe-partial {
  border: 1px solid #997120;
  background: repeating-linear-gradient(135deg, #f9e9bb 0 2px, #fff8e6 2px 4px);
}
.pe-no {
  border: 1px dashed #78879d;
  background: white;
}
.pe-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.pe-covered {
  color: #126359;
  background: #e5f5ef;
}
.pe-incomplete {
  color: #79540b;
  background: #fff2d3;
}
.pe-outside {
  color: #536278;
  background: #edf0f4;
}
.pe-table .pe-empty {
  padding: 22px;
  color: #53647a;
  text-align: center;
}
.pe-footer,
.pe-pages {
  display: flex;
  align-items: center;
}
.pe-footer {
  min-height: 48px;
  padding-block: 8px;
  justify-content: space-between;
  gap: 8px;
}
.pe-range,
.pe-note,
.pe-legend,
.pe-page-number {
  margin: 0;
  font-size: 12px;
  color: #52617a;
}
.pe-pages {
  gap: 8px;
}
.pe-step,
.pe-close {
  padding: 5px 9px;
  border: 1px solid #c9d1de;
  border-radius: 6px;
  color: #293449;
  background: white;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.pe-step:disabled {
  opacity: 0.45;
  cursor: default;
}
.pe-notes {
  background: #f9fafd;
  padding-block: 12px;
  border-top: 1px solid #e2e6ee;
}
.pe-legend,
.pe-key {
  display: flex;
  align-items: center;
}
.pe-legend {
  gap: 4px 16px;
  flex-wrap: wrap;
}
.pe-key {
  gap: 5px;
}
.pe-key .pe-mark {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}
.pe-note {
  margin-top: 6px;
  line-height: 1.5;
}
.pe-detail {
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(610px, calc(100% - 24px));
  max-width: none;
  max-height: 86dvh;
  padding: 22px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 14px;
  color: var(--ink, #17243b);
  box-shadow: 0 20px 80px #17243b38;
}
.pe-detail::backdrop {
  background: #15223c75;
}
.pe-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pe-dialog-label {
  margin: 0 0 4px;
}
.pe-dialog-sub {
  margin-bottom: 15px;
}
.pe-detail .pe-table th,
.pe-detail .pe-table td {
  padding-inline: 9px;
}
.pe-detail-table thead th:last-child {
  min-width: 78px;
  white-space: normal;
}
.pe-detail-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
@media (max-width: 600px) {
  .pe-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .pe-control {
    min-width: 0;
  }
  .pe-control select {
    min-width: 0;
  }
  .pe-search {
    grid-column: 1 / -1;
  }
  .pe-table {
    font-size: 12px;
  }
  .pe-table th,
  .pe-table td {
    padding: 9px;
  }
  .pe-footer {
    flex-wrap: wrap;
  }
  .pe-detail {
    padding: 16px;
  }
}

.results-layout {
  display: grid;
  gap: 18px;
  min-width: 0;
}
.results-layout .card {
  min-width: 0;
  overflow: hidden;
}
.results-layout h2 {
  margin: 0;
  font-size: 17px;
  line-height: 1.3;
  letter-spacing: -0.035em;
}
.results-layout .result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 19px 21px;
}
.results-layout .results-scroll {
  overflow-x: auto;
  overscroll-behavior-x: contain;
}
.results-layout .results-table {
  width: 100%;
  min-width: 500px;
  border-collapse: collapse;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.results-layout .results-table th,
.results-layout .results-table td {
  border-bottom: 1px solid var(--line, #e2e6ec);
  padding: 11px 14px;
  text-align: right;
  white-space: nowrap;
}
.results-layout .results-table thead th {
  font-size: 11px;
  font-weight: 650;
  color: #566178;
  background: #f7f8fb;
}
.results-layout .results-table tr > *:first-child {
  padding-left: 21px;
  text-align: left;
}
.results-layout .results-table tr > *:last-child {
  padding-right: 21px;
}
.results-layout .sort-head,
.results-layout .feature-link {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 0;
  margin: 0;
  padding: 3px 1px;
  cursor: pointer;
}
.results-layout .sort-head {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  line-height: 1.25;
}
.results-layout .sort-arrow {
  color: #66718b;
}
.results-layout .feature-link {
  text-align: left;
  color: var(--ink, #192238);
  font-weight: 600;
  white-space: normal;
}
.results-layout .results-table tbody tr {
  cursor: pointer;
}
.results-layout .results-table tbody tr:hover {
  background: #f6f6fd;
}
.results-layout .results-table .chosen-feature {
  background: #f1effc;
}
.results-layout .chosen-feature .feature-link {
  color: #5036ae;
}
.results-layout .result-number {
  font-weight: 550;
}
.results-layout .result-interval {
  color: #4a5267;
}
.results-layout .result-empty {
  white-space: normal;
  cursor: default;
}
.results-layout .result-foot {
  margin: 0;
  padding: 13px 21px;
  font-size: 12px;
  line-height: 1.45;
}
.results-layout .result-detail {
  padding: 20px 21px;
}
.results-layout .result-detail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.results-layout .detail-kicker {
  display: block;
  margin: 0 0 4px;
  color: #5b647b;
  font-size: 11px;
  font-weight: 650;
}
.results-layout .detail-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 32px;
  margin: 21px 0 17px;
}
.results-layout .fact dt,
.results-layout .selected-contrast > span {
  color: #5b647b;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
}
.results-layout .fact dd {
  margin: 4px 0 0;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.results-layout .feature-estimate dd {
  font-size: 23px;
  line-height: 1;
  color: #5036ae;
}
.results-layout .selected-contrast {
  border-top: 1px solid var(--line, #e2e6ec);
  padding-top: 12px;
}
.results-layout .selected-contrast p {
  margin: 3px 0 0;
  line-height: 1.45;
  font-size: 14px;
}
@media (max-width: 600px) {
  .results-layout .result-head,
  .results-layout .result-detail {
    padding: 16px;
  }
  .results-layout .results-table tr > :first-child {
    padding-left: 16px;
  }
  .results-layout .results-table th,
  .results-layout .results-table td {
    padding: 10px;
  }
  .results-layout .result-foot {
    padding: 12px 16px;
  }
  .results-layout .detail-facts {
    gap: 15px 22px;
  }
}

 <script>/* Local participant-level summaries. A missing specimen is represented by an omitted row. */
(() => {
  'use strict';

  const required = ['participant', 'arm', 'visit', 'population', 'cells'];
  const maxRows = 50000;
  const maxFeatures = 32;
  const maxBytes = 8 * 1024 * 1024;
  const decimal = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;

  function fieldLabel(value, name, line) {
    const result = value.trim();
    if (!result) throw new Error('Row ' + line + ' has an empty ' + name + '.');
    if (result.length > 160 || /[\u0000-\u001f\u007f]/.test(result)) {
      throw new Error(
        'Row ' + line + ' has an invalid ' + name + '. Use a single line of up to 160 characters.',
      );
    }
    return result;
  }

  function parseRows(text, accept) {
    let field = '',
      fields = [],
      quoted = false,
      closed = false;
    let line = 1,
      start = 1;

    function endField() {
      fields.push(field);
      if (fields.length > required.length + maxFeatures) {
        throw new Error(
          'Row ' + start + ' has too many fields. Include up to ' + maxFeatures + ' score columns.',
        );
      }
      field = '';
      closed = false;
    }

    function endRow() {
      endField();
      if (fields.length !== 1 || fields[0].trim()) accept(fields, start);
      fields = [];
    }

    for (let i = 0; i < text.length; i++) {
      const character = text[i];
      if (character === '\r' || character === '\n') {
        if (character === '\r' && text[i + 1] === '\n') i++;
        if (quoted) field += '\n';
        else endRow();
        line++;
        if (!quoted) start = line;
      } else if (quoted) {
        if (character !== '"') field += character;
        else if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = false;
          closed = true;
        }
      } else if (character === ',') {
        endField();
      } else if (closed) {
        if (character !== ' ' && character !== '\t') {
          throw new Error(
            'Row ' + line + ' has text after a closing quote. Use a comma between fields.',
          );
        }
      } else if (character === '"') {
        if (field.trim())
          throw new Error('Row ' + line + ' has a misplaced quote. Enclose the whole field in quotes.');
        field = '';
        quoted = true;
      } else field += character;
    }
    if (quoted) throw new Error('Row ' + start + ' has an unclosed quoted field.');
    endRow();
  }

  function readStudyCSV(text, fileName) {
    if (typeof text !== 'string') throw new Error('Choose a UTF-8 CSV file.');
    if (text.length > maxBytes || new Blob([text]).size > maxBytes) {
      throw new Error(
        'This preview supports CSV files up to 8 MiB. Select a smaller set of participant summaries.',
      );
    }
    const groups = new Set(),
      people = new Map(),
      visits = new Set(),
      populations = new Set();
    const keys = new Set(),
      observations = [];
    let positions, features, columnCount;

    function readHeader(fields, line) {
      const headers = fields.map((value) => fieldLabel(value, 'column name', line));
      const names = headers.map((name) => name.toLowerCase());
      if (new Set(names).size !== names.length)
        throw new Error('The header has duplicate column names. Give each column a unique name.');
      const missing = required.filter((name) => !names.includes(name));
      if (missing.length) throw new Error('Add the required CSV columns ' + missing.join(', ') + '.');
      positions = Object.fromEntries(required.map((name) => [name, names.indexOf(name)]));
      features = headers.flatMap((label, index) =>
        required.includes(names[index]) ? [] : [{ id: 'score_' + (index + 1), label, index }],
      );
      if (!features.length)
        throw new Error('Include at least one numeric score column after the study fields.');
      columnCount = fields.length;
    }

    function readObservation(fields, line) {
      if (observations.length >= maxRows)
        throw new Error('This preview supports up to 50,000 participant-level rows.');
      if (fields.length !== columnCount) {
        throw new Error(
          'Row ' + line + ' has ' + fields.length + ' fields. The header has ' + columnCount + '.',
        );
      }
      const id = fieldLabel(fields[positions.participant], 'participant ID', line);
      const arm = fieldLabel(fields[positions.arm], 'group label', line);
      const visit = fieldLabel(fields[positions.visit], 'visit label', line);
      const population = fieldLabel(fields[positions.population], 'population label', line);
      const previous = people.get(id);
      if (previous !== undefined && previous !== arm) {
        throw new Error(
          'Row ' + line + ' assigns ' + id + ' to a second group. Use one group per participant.',
        );
      }
      if (groups.size === 2 && !groups.has(arm)) {
        throw new Error(
          'Row ' + line + ' adds a third group. Import one or two groups for this comparison.',
        );
      }
      const key = JSON.stringify([id, visit, population]);
      if (keys.has(key)) {
        throw new Error(
          'Row ' +
            line +
            ' repeats ' +
            id +
            ' / ' +
            visit +
            ' / ' +
            population +
            '. Combine replicates before import.',
        );
      }
      const countText = fields[positions.cells].trim();
      const cells = Number(countText);
      if (!decimal.test(countText) || !Number.isSafeInteger(cells) || cells < 1) {
        throw new Error(
          'Row ' + line + ' requires a positive whole cell count. Omit rows with no observed cells.',
        );
      }
      const scores = {};
      for (const feature of features) {
        const value = fields[feature.index].trim();
        const score = Number(value);
        if (!decimal.test(value) || !Number.isFinite(score)) {
          throw new Error(
            'Row ' + line + ' requires a finite numeric value in “' + feature.label + '”.',
          );
        }
        scores[feature.id] = score;
      }
      keys.add(key);
      groups.add(arm);
      people.set(id, arm);
      visits.add(visit);
      populations.add(population);
      observations.push({ id, arm, visit, population, cells, scores });
    }

    parseRows(text.replace(/^\uFEFF/, ''), (fields, line) => {
      if (positions) readObservation(fields, line);
      else readHeader(fields, line);
    });
    if (!positions) throw new Error('The CSV is empty. Start with the example template.');
    if (!observations.length)
      throw new Error('The CSV contains a header only. Add at least one participant observation.');
    const stem = String(fileName || '')
      .split(/[\\/]/)
      .pop()
      .replace(/\.csv$/i, '')
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .trim();
    return {
      title: stem.slice(0, 100) || 'Imported study',
      source: 'import',
      participants: Array.from(people, ([id, arm]) => ({ id, arm })),
      visits: Array.from(visits),
      populations: Array.from(populations),
      features: features.map(({ id, label }) => ({ id, label })),
      observations,
      results: {},
    };
  }

  function studyCSVTemplate() {
    const lines = ['participant,arm,visit,population,cells,Interferon response,Cytotoxicity'];
    const visits = ['Baseline', 'Week 4', 'Week 12'];
    const populations = ['CD8 T cells', 'B cells'];
    for (let person = 0; person < 6; person++) {
      const first = person < 3;
      const participant = (first ? 'A' : 'B') + '0' + ((person % 3) + 1);
      for (let t = 0; t < visits.length; t++) {
        if (person === 5 && t === 2) continue;
        for (let c = 0; c < populations.length; c++) {
          const baseline = (person % 3) * 0.08;
          const response = 0.62 + baseline + (first ? 0.27 : 0.13) * t - c * 0.11;
          const cytotoxicity = 0.88 + baseline + (first ? 0.16 : 0.09) * t - c * 0.49;
          lines.push(
            [
              participant,
              first ? 'Arm A' : 'Arm B',
              visits[t],
              populations[c],
              32 + person * 3 + t * 4 + c,
              response.toFixed(2),
              cytotoxicity.toFixed(2),
            ].join(','),
          );
        }
      }
    }
    return lines.join('\r\n') + '\r\n';
  }

  globalThis.readStudyCSV = readStudyCSV;
  globalThis.studyCSVTemplate = studyCSVTemplate;
})();

  const ink = '#273246',
    muted = '#526078',
    grid = '#e4e8f0';
  const colors = ['#684ce5', '#078776'];
  const active = new WeakMap();
  let sequence = 0;

  function node(parent, tag, attrs = {}, content) {
    const out = document.createElementNS(NS, tag);
    for (const [name, value] of Object.entries(attrs)) out.setAttribute(name, String(value));
    if (content !== undefined) out.textContent = content;
    parent.append(out);
    return out;
  }

  function label(parent, x, y, value, extra = {}) {
    return node(parent, 'text', { x, y, fill: muted, 'font-size': 11, ...extra }, value);
  }

  function fitLabel(text, maxWidth, addHint = true) {
    const full = text.textContent;
    if (text.getComputedTextLength() <= maxWidth) return;
    let low = 0,
      high = full.length;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      text.textContent = full.slice(0, middle) + '…';
      if (text.getComputedTextLength() <= maxWidth) low = middle;
      else high = middle - 1;
    }
    text.textContent = full.slice(0, low) + '…';
    if (addHint) {
      text.setAttribute('aria-label', full);
      node(text, 'title', {}, full);
    }
  }

  function number(value, digits = 2, signed = false) {
    if (!Number.isFinite(value)) return 'unavailable';
    const v = Math.abs(value) < 0.5 * 10 ** -digits ? 0 : value;
    return (
      (v < 0 ? '−' : signed && v > 0 ? '+' : '') +
      Math.abs(v).toLocaleString('en-US', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      })
    );
  }

  function tickText(v, step) {
    const precision = Math.max(
      0,
      Math.min(
        6,
        -Math.floor(Math.log10(step)) +
          (Number((step / 10 ** Math.floor(Math.log10(step))).toFixed(4)) === 2.5 ? 1 : 0),
      ),
    );
    return number(v, precision);
  }

  function stepSize(span, intervals) {
    const raw = Math.max(span / intervals, 1e-10);
    const power = 10 ** Math.floor(Math.log10(raw));
    return ([1, 2, 2.5, 5, 10].find((factor) => factor * power >= raw - 1e-12) || 10) * power;
  }

  function yDomain(values) {
    let min = Infinity,
      max = -Infinity;
    for (const value of values) {
      min = Math.min(min, value);
      max = Math.max(max, value);
    }
    const delta = Math.max(max - min, Math.abs(max || 1) * 0.08, 0.02);
    const step = stepSize(delta * 1.15, 4);
    return {
      min: Math.floor((min - delta * 0.06) / step) * step,
      max: Math.ceil((max + delta * 0.06) / step) * step,
      step,
    };
  }

  function ticks(domain) {
    const count = Math.round((domain.max - domain.min) / domain.step);
    return Array.from({ length: count + 1 }, (_, i) => domain.min + i * domain.step);
  }

  function pointMark(parent, x, y, size, color, index, hollow = true) {
    const attrs = { fill: hollow ? '#fff' : color, stroke: color, 'stroke-width': hollow ? 2.5 : 0 };
    if (index % 2) {
      return node(parent, 'path', {
        d:
          'M ' +
          x +
          ' ' +
          (y - size) +
          ' l ' +
          size +
          ' ' +
          size +
          ' -' +
          size +
          ' ' +
          size +
          ' -' +
          size +
          ' -' +
          size +
          ' Z',
        ...attrs,
      });
    }
    return node(parent, 'circle', { cx: x, cy: y, r: size, ...attrs });
  }

  function mount(container, options, paint) {
    if (!container) return;
    let store = active.get(container);
    if (!store) {
      store = { width: -1 };
      active.set(container, store);
      const redraw = () => {
        const currentWidth = Math.round(container.getBoundingClientRect().width);
        if (currentWidth > 0 && currentWidth !== store.width) {
          store.width = currentWidth;
          store.paint(container, store.options, currentWidth);
        }
      };
      if (typeof ResizeObserver === 'function') {
        store.observer = new ResizeObserver(redraw);
        store.observer.observe(container);
      }
    }
    store.options = options;
    store.paint = paint;
    store.width = Math.round(container.getBoundingClientRect().width) || 480;
    paint(container, options, store.width);
  }

  function frame(container, width, height, title, description) {
    container.replaceChildren();
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:100%;min-width:0';
    container.append(wrap);
    const id = 'sct-chart-' + ++sequence;
    const svg = node(wrap, 'svg', {
      viewBox: '0 0 ' + width + ' ' + height,
      width: '100%',
      height,
      role: 'group',
      'aria-labelledby': id + '-title',
      'aria-describedby': id + '-desc',
      style: 'display:block;overflow:visible;font-family:inherit;font-variant-numeric:tabular-nums',
    });
    node(svg, 'title', { id: id + '-title' }, title);
    node(svg, 'desc', { id: id + '-desc' }, description);
    node(
      svg,
      'style',
      {},
      '.sct-hit:focus-visible{outline:2px solid #4935bc;outline-offset:1px}' +
        '.sct-effect:hover .sct-rowfill{fill:#efedff}.sct-hit{outline:none}',
    );
    const tip = document.createElement('div');
    tip.hidden = true;
    tip.setAttribute('aria-hidden', 'true');
    tip.style.cssText =
      'position:absolute;z-index:4;pointer-events:none;background:#253044;' +
      'color:white;padding:7px 10px;border-radius:7px;font:500 12px/1.5 system-ui,sans-serif;' +
      'box-shadow:0 3px 10px #1d29492b;max-width:calc(100% - 8px);width:max-content;white-space:normal';
    wrap.append(tip);
    function bind(target, message, action, anchor = target) {
      target.setAttribute('tabindex', '0');
      target.setAttribute('class', (target.getAttribute('class') || '') + ' sct-hit');
      target.setAttribute('role', action ? 'button' : 'img');
      target.setAttribute('aria-label', message);
      if (action) target.style.cursor = 'pointer';
      const show = () => {
        tip.textContent = message;
        tip.hidden = false;
        const box = wrap.getBoundingClientRect(),
          rect = anchor.getBoundingClientRect();
        const x = rect.left - box.left + rect.width / 2;
        tip.style.left =
          Math.max(4, Math.min(box.width - tip.offsetWidth - 4, x - tip.offsetWidth / 2)) + 'px';
        const y = rect.top - box.top;
        tip.style.top =
          Math.max(0, y < tip.offsetHeight + 5 ? rect.bottom - box.top + 3 : y - tip.offsetHeight - 4) +
          'px';
      };
      const hide = () => {
        tip.hidden = true;
      };
      target.addEventListener('pointerenter', show);
      target.addEventListener('pointerleave', hide);
      target.addEventListener('focus', show);
      target.addEventListener('blur', hide);
      target.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hide();
        if (action && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          action();
        }
      });
      if (action) target.addEventListener('click', action);
    }
    return { svg, bind };
  }

  // Start a new segment at each gap, including gaps inside a person's repeated visits.
  function segments(parent, values, attrs) {
    let path = '',
      connected = false;
    for (const p of values) {
      if (!p) {
        connected = false;
        continue;
      }
      path += (connected ? ' L ' : ' M ') + p.x + ' ' + p.y;
      connected = true;
    }
    node(parent, 'path', {
      d: path,
      fill: 'none',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      ...attrs,
    });
  }

  function trajectory(container, opt, width) {
    const series = opt.series || [],
      visits = opt.visits || [];
    const points = series.map((s) =>
      visits.map((visit) =>
        (s.means || []).find(
          (p) => p.visit === visit && Number.isFinite(p.mean) && (p.n === undefined || p.n > 0),
        ),
      ),
    );
    const values = points
      .flat()
      .filter(Boolean)
      .map((p) => p.mean);
    if (opt.showIndividuals) {
      for (const s of series)
        for (const person of s.people || []) {
          for (const p of person.points || [])
            if (visits.includes(p.visit) && Number.isFinite(p.value)) values.push(p.value);
        }
    }
    const height = width < 360 ? 202 : 226;
    const { svg, bind } = frame(
      container,
      width,
      height,
      (opt.featureLabel || 'Outcome') + ' by visit',
      'Points show descriptive group means. Focus a point for its value and participant count.' +
        (opt.showIndividuals ? ' Thin lines link observations from the same participant.' : ''),
    );
    const left = width < 360 ? 32 : 40,
      right = width < 360 ? 24 : 32,
      top = 50,
      bottom = height - 34;
    if (!values.length || !visits.length) {
      label(svg, width / 2, height / 2, 'No observations for this selection', {
        'text-anchor': 'middle',
      });
      return;
    }
    const domain = yDomain(values);
    const xAt = (index) =>
      visits.length === 1
        ? (left + width - right) / 2
        : left + 12 + (index * (width - right - left - 24)) / (visits.length - 1);
    const yAt = (value) => bottom - ((value - domain.min) * (bottom - top)) / (domain.max - domain.min);
    label(svg, 2, 15, opt.unit || 'Score', { 'font-size': 10, 'font-weight': 600 });
    // Anchor the legend to the right, leaving the scale visible above the y-axis.
    const preferred = series.map((s) => 32 + String(s.label).length * 6.4);
    const available = Math.max(30, width - 4);
    const useSecondLine =
      preferred.reduce((a, b) => a + b, 0) + String(opt.unit || 'Score').length * 6 + 8 > available;
    const widths = preferred.map((w) => Math.min(w, available / Math.max(series.length, 1)));
    let lx = Math.max(3, width - widths.reduce((a, b) => a + b, 0));
    series.forEach((s, i) => {
      const ly = useSecondLine ? 30 : 12;
      const color = s.color || colors[i % colors.length];
      node(svg, 'line', { x1: lx, x2: lx + 15, y1: ly, y2: ly, stroke: color, 'stroke-width': 2 });
      pointMark(svg, lx + 7.5, ly, 3.2, color, i);
      const text = label(svg, lx + 20, ly + 3.5, s.label, { 'font-size': 10.4, fill: ink });
      fitLabel(text, Math.max(8, widths[i] - 26));
      lx += widths[i];
    });
    for (const value of ticks(domain)) {
      const y = yAt(value);
      node(svg, 'line', {
        x1: left,
        x2: width - right + 6,
        y1: y,
        y2: y,
        stroke: grid,
        'stroke-width': 1,
      });
      label(svg, left - 7, y + 4, tickText(value, domain.step), {
        'text-anchor': 'end',
        'font-size': 10,
      });
    }
    const visibleCount = Math.max(2, Math.floor((width - right - left) / 68));
    const visibleTicks = new Set(
      Array.from({ length: Math.min(visits.length, visibleCount) }, (_, i) =>
        Math.round((i * (visits.length - 1)) / Math.max(1, Math.min(visits.length, visibleCount) - 1)),
      ),
    );
    const visibleSpacing = (width - right - left - 24) / Math.max(1, visibleTicks.size - 1);
    visits.forEach((visit, i) => {
      const x = xAt(i);
      node(svg, 'line', {
        x1: x,
        x2: x,
        y1: top,
        y2: bottom,
        stroke: '#e9ebf4',
        'stroke-dasharray': '2 5',
      });
      if (visibleTicks.has(i)) {
        const text = label(svg, x, bottom + 20, visit, { 'text-anchor': 'middle', 'font-size': 11 });
        fitLabel(text, Math.max(18, Math.min(visibleSpacing - 5, 2 * x - 4, 2 * (width - x) - 4)));
      }
    });
    if (opt.showIndividuals) {
      series.forEach((s, i) => {
        const color = s.color || colors[i % colors.length];
        for (const person of s.people || []) {
          const lookup = new Map((person.points || []).map((p) => [p.visit, p.value]));
          const coords = visits.map((v, j) =>
            Number.isFinite(lookup.get(v)) ? { x: xAt(j), y: yAt(lookup.get(v)) } : null,
          );
          segments(svg, coords, { stroke: color, 'stroke-width': 1.05, opacity: 0.25 });
          coords
            .filter(Boolean)
            .forEach((p) =>
              node(svg, 'circle', { cx: p.x, cy: p.y, r: 1.8, fill: color, opacity: 0.34 }),
            );
        }
      });
    }
    const markers = [];
    series.forEach((s, i) => {
      const color = s.color || colors[i % colors.length];
      const coords = points[i].map((p, j) => (p ? { x: xAt(j), y: yAt(p.mean), p } : null));
      segments(svg, coords, { stroke: color, 'stroke-width': 3.1 });
      for (const c of coords.filter(Boolean)) markers.push({ ...c, color, i, label: s.label });
    });
    for (const m of markers) {
      const g = node(svg, 'g');
      node(g, 'circle', { cx: m.x, cy: m.y, r: 10, fill: 'transparent' });
      const mark = pointMark(g, m.x, m.y, 5.2, m.color, m.i);
      const count = Number.isFinite(m.p.n) ? ' · n = ' + m.p.n : '';
      const message = m.label + ' · ' + m.p.visit + ' · Mean ' + number(m.p.mean) + count;
      bind(g, message, opt.onPoint ? () => opt.onPoint({ label: m.label, ...m.p }) : undefined, mark);
    }
  }

  function endpoint(v) {
    if (v === Infinity || v === 'Infinity' || v === '+Infinity' || v === 'inf') return Infinity;
    if (v === -Infinity || v === '-Infinity' || v === '-inf') return -Infinity;
    return Number.isFinite(v) ? v : null;
  }

  function forest(container, opt, width) {
    const rows = opt.rows || [];
    const rowHeight = 37,
      top = 24,
      bottom = top + Math.max(rows.length, 1) * rowHeight,
      height = bottom + 43;
    const { svg, bind } = frame(
      container,
      width,
      height,
      'Feature effects',
      'Select a feature to view its trajectory. Focus a row for the effect and available interval endpoints.',
    );
    if (!rows.length) {
      label(svg, width / 2, height / 2, 'No estimates for this comparison', { 'text-anchor': 'middle' });
      return;
    }
    const left = Math.min(width * 0.4, 153),
      right = width - (width < 350 ? 47 : 60);
    const numeric = rows
      .flatMap((r) => [r.estimate, endpoint(r.lo), endpoint(r.hi)])
      .filter(Number.isFinite);
    const range = Math.max(...numeric.map(Math.abs), 0.015);
    const step = stepSize(range, width >= 440 ? 2 : 1);
    const extent = Math.ceil(range / step) * step;
    const domain = { min: -extent, max: extent, step };
    const xAt = (v) => left + ((v + extent) * (right - left)) / (extent * 2);
    label(svg, 7, 13, 'Feature', { 'font-size': 10.5, 'font-weight': 600 });
    label(svg, width - 7, 13, 'Estimate', {
      'text-anchor': 'end',
      'font-size': 10.5,
      'font-weight': 600,
    });
    const gx = node(svg, 'g');
    rows.forEach((r, i) => {
      if (r.id === opt.selected)
        node(gx, 'rect', {
          x: 0,
          y: top + i * rowHeight + 1,
          width,
          height: rowHeight - 2,
          rx: 5,
          fill: '#f3f1ff',
        });
    });
    for (const tick of ticks(domain)) {
      const x = xAt(tick);
      node(svg, 'line', {
        x1: x,
        x2: x,
        y1: top,
        y2: bottom,
        stroke: tick === 0 ? '#989fb0' : grid,
        'stroke-dasharray': tick === 0 ? '3 3' : '1 4',
        'stroke-width': 1,
      });
      label(svg, x, bottom + 13, tickText(tick, step), { 'text-anchor': 'middle', 'font-size': 9.5 });
    }
    rows.forEach((r, i) => {
      const y = top + (i + 0.5) * rowHeight;
      const chosen = r.id === opt.selected;
      const color = chosen ? '#6747db' : '#526078';
      const group = node(svg, 'g', { class: 'sct-effect', 'aria-pressed': String(chosen) });
      node(group, 'rect', {
        class: 'sct-rowfill',
        x: 0,
        y: y - rowHeight / 2 + 1,
        width,
        height: rowHeight - 2,
        rx: 5,
        fill: 'transparent',
        opacity: 0.53,
      });
      if (chosen) node(group, 'rect', { x: 0, y: y - 8, width: 2.5, height: 16, rx: 1.25, fill: color });
      const labelText = String(r.label || r.id);
      const title = label(group, 7, y + 3.8, labelText, {
        fill: chosen ? '#45359a' : ink,
        'font-size': width < 365 ? 10.5 : 11.5,
        'font-weight': chosen ? 650 : 500,
      });
      // Use actual font metrics so wide glyphs do not overlap the intervals.
      fitLabel(title, left - 17, false);
      const lo = endpoint(r.lo),
        hi = endpoint(r.hi);
      const interval = lo !== null && hi !== null && lo <= hi && lo !== Infinity && hi !== -Infinity;
      if (interval) {
        const l = lo === -Infinity ? left : xAt(lo),
          h = hi === Infinity ? right : xAt(hi);
        node(group, 'line', { x1: l, x2: h, y1: y, y2: y, stroke: color, 'stroke-width': 2.1 });
        [
          [l, lo, -1],
          [h, hi, 1],
        ].forEach(([x, end, direction]) => {
          if (Number.isFinite(end))
            node(group, 'line', {
              x1: x,
              x2: x,
              y1: y - 4,
              y2: y + 4,
              stroke: color,
              'stroke-width': 1.5,
            });
          else
            node(group, 'path', {
              d:
                'M ' +
                (x - direction * 4) +
                ' ' +
                (y - 3) +
                ' L ' +
                x +
                ' ' +
                y +
                ' L ' +
                (x - direction * 4) +
                ' ' +
                (y + 3),
              fill: 'none',
              stroke: color,
              'stroke-width': 1.5,
            });
        });
      }
      if (Number.isFinite(r.estimate))
        node(group, 'circle', {
          cx: xAt(r.estimate),
          cy: y,
          r: chosen ? 4.8 : 3.9,
          fill: color,
          stroke: '#fff',
          'stroke-width': 1.3,
        });
      const displayEstimate = Number.isFinite(r.estimate) ? number(r.estimate, 2, true) : '—';
      label(group, width - 7, y + 3.8, displayEstimate, {
        'text-anchor': 'end',
        'font-size': 11,
        'font-weight': chosen ? 680 : 550,
        fill: chosen ? '#4936a4' : ink,
      });
      const printed = (x) => (x === -Infinity ? '−∞' : x === Infinity ? '+∞' : number(x));
      const desc =
        labelText +
        ' · Estimate ' +
        number(r.estimate) +
        (interval ? ' · 95% CI ' + printed(lo) + ' to ' + printed(hi) : ' · Interval unavailable');
      bind(group, desc, opt.onSelect ? () => opt.onSelect(r.id) : undefined);
      group.setAttribute('aria-label', title.textContent + ' ' + displayEstimate);
      const descId = 'sct-effect-desc-' + sequence + '-' + i;
      node(svg, 'desc', { id: descId }, desc);
      group.setAttribute('aria-describedby', descId);
    });
    label(svg, (left + right) / 2, bottom + 33, opt.unit || 'Effect', {
      'text-anchor': 'middle',
      'font-size': 10.5,
    });
  }

  window.disposeStudyPlot = (container) => {
    const store = active.get(container);
    if (!store) return;
    if (store.observer) store.observer.disconnect();
    active.delete(container);
  };
  window.drawTrajectory = (container, options) => mount(container, options, trajectory);
  window.drawForest = (container, options) => mount(container, options, forest);
})();

(() => {
  'use strict';

  const recordsPerPage = 12;
  const previousViews = new WeakMap();
  const counts = new Intl.NumberFormat('en-US');
  const scores = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
  let nextId = 0;

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function makeButton(label, className, handler) {
    const button = node('button', className, label);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  function makeSelect(name, items, initial, change) {
    const field = node('label', 'pe-control');
    field.append(node('span', 'pe-label', name));
    const select = node('select', 'select');
    select.setAttribute('aria-label', name);
    for (const [value, label] of items) select.add(new Option(label, value));
    select.value = initial;
    select.addEventListener('change', () => change(select.value));
    field.append(select);
    return field;
  }

  function indexVisits(observations, population) {
    const index = new Map();
    for (const obs of observations) {
      let visits = index.get(obs.id);
      if (!visits) {
        visits = new Map();
        index.set(obs.id, visits);
      }
      // A specimen may contain other populations but no observations in the selected one.
      if (!visits.has(obs.visit)) visits.set(obs.visit, null);
      if (obs.population === population && obs.cells > 0) visits.set(obs.visit, obs);
    }
    return index;
  }

  function visitMark(entry) {
    const present = Boolean(entry);
    const label = present
      ? 'Observed'
      : entry === null
        ? 'Population absent from summary'
        : 'No specimen recorded';
    const mark = node('span', 'pe-mark pe-' + (present ? 'yes' : entry === null ? 'partial' : 'no'));
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', label);
    mark.title = label;
    return mark;
  }

  function status(entry) {
    return entry === undefined
      ? 'No specimen recorded'
      : entry === null
        ? 'Population absent from summary'
        : 'Observed';
  }

  function pageControls(page, pageCount, onPage) {
    const pager = node('div', 'pe-pages');
    const prev = makeButton('Previous', 'pe-step', () => onPage(page - 1));
    const next = makeButton('Next', 'pe-step', () => onPage(page + 1));
    prev.disabled = page === 0;
    next.disabled = page >= pageCount - 1;
    pager.append(prev, node('span', 'pe-page-number', page + 1 + ' / ' + pageCount), next);
    return pager;
  }

  function renderPeople(container, model, actions = {}) {
    const old = previousViews.get(container);
    const state =
      old && old.study === model.participants
        ? old
        : {
            study: model.participants,
            arm: '',
            coverage: '',
            query: '',
            page: 0,
          };
    const prefix = 'pe-' + ++nextId;
    const { participants, arms, visits, population, feature } = model;
    const selected = [...new Set(model.selectedVisits)];
    const analysisArms = new Set(model.analysisArms);
    const index = indexVisits(model.observations, population);
    const shownVisits = visits.length <= 5 ? visits : selected;
    const unused = new Map();
    if (model.filterArm !== undefined && model.filterArm !== state.requestedArm) {
      state.arm = model.filterArm;
      state.requestedArm = model.filterArm;
    }
    if (model.query !== undefined && model.query !== state.requestedQuery) {
      state.query = model.query;
      state.requestedQuery = model.query;
    }
    if (!arms.includes(state.arm)) state.arm = '';
    const rows = participants.map((person) => {
      const visitsByPerson = index.get(person.id) || unused;
      const observed = selected.map((v) => visitsByPerson.get(v));
      const inArm = analysisArms.has(person.arm);
      const covered = inArm && selected.length > 0 && observed.every(Boolean);
      const cells = observed.reduce((sum, obs) => sum + (obs?.cells || 0), 0);
      return { person, visitsByPerson, inArm, covered, cells };
    });
    previousViews.set(container, state);

    const root = node('section', 'pe card');
    root.setAttribute('aria-labelledby', prefix + '-title');
    const head = node('div', 'pe-head');
    const title = node('h2', '', 'Visit coverage');
    title.id = prefix + '-title';
    head.append(
      title,
      node('p', 'pe-sub', [population, selected.join(' and ')].filter(Boolean).join(' · ')),
    );
    const filters = node('div', 'pe-filters');
    const searchField = node('label', 'pe-control pe-search');
    searchField.append(node('span', 'pe-label', 'Participant ID'));
    const input = node('input', 'pe-input');
    input.type = 'search';
    input.placeholder = 'Search participants';
    input.value = state.query;
    searchField.append(input);
    const groupSelect = makeSelect(
      'Group',
      [['', 'All groups'], ...arms.map((a) => [a, a])],
      state.arm,
      (value) => {
        state.arm = value;
        state.page = 0;
        update();
      },
    );
    const coverageSelect = makeSelect(
      'Coverage',
      [
        ['', 'All participants'],
        ['included', 'Eligible by coverage'],
        ['missing', 'Incomplete coverage'],
        ['outside', 'Outside selected groups'],
      ],
      state.coverage,
      (value) => {
        state.coverage = value;
        state.page = 0;
        update();
      },
    );

    const scroller = node('div', 'pe-scroll');
    const table = node('table', 'pe-table');
    table.setAttribute('aria-label', 'Participant visit coverage');
    const tableHead = table.createTHead().insertRow();
    ['Participant', 'Group', ...shownVisits, 'Cells¹', 'Coverage'].forEach((header) => {
      const th = node('th', '', header);
      th.scope = 'col';
      tableHead.append(th);
    });

    const footer = node('div', 'pe-footer'),
      range = node('p', 'pe-range');
    range.setAttribute('aria-live', 'polite');
    const pager = node('div');
    footer.append(range, pager);
    const legend = node('div', 'pe-legend');
    for (const [entry, label] of [
      [true, 'Observed'],
      [null, 'Population unobserved'],
      [undefined, 'Specimen unrecorded'],
    ]) {
      const k = node('span', 'pe-key');
      const mark = visitMark(entry);
      mark.setAttribute('aria-hidden', 'true');
      k.append(mark, node('span', '', label));
      legend.append(k);
    }
    const note = node(
      'p',
      'pe-note',
      '¹ Cells in the selected population and visits. Coverage describes specimen availability. Fitted counts can vary by feature.',
    );
    const extras = node('div', 'pe-notes');
    extras.append(legend, note);
    root.append(head, filters, scroller, footer, extras);
    container.replaceChildren(root);

    function update() {
      const needle = state.query.trim().toLocaleLowerCase();
      const visible = rows.filter(
        (r) =>
          (!needle || String(r.person.id).toLocaleLowerCase().includes(needle)) &&
          (!state.arm || r.person.arm === state.arm) &&
          (!state.coverage ||
            (state.coverage === 'included' && r.covered) ||
            (state.coverage === 'missing' && r.inArm && !r.covered) ||
            (state.coverage === 'outside' && !r.inArm)),
      );
      const pages = Math.max(1, Math.ceil(visible.length / recordsPerPage));
      state.page = Math.max(0, Math.min(state.page, pages - 1));
      const first = state.page * recordsPerPage;
      body.replaceChildren();
      visible.slice(first, first + recordsPerPage).forEach((record) => {
        const tr = body.insertRow();
        const id = node('th');
        id.scope = 'row';
        const open = makeButton(String(record.person.id), 'pe-person', () => openParticipant(record));
        open.setAttribute('aria-label', 'Inspect participant ' + record.person.id);
        id.append(open);
        tr.append(id);
        const group = tr.insertCell();
        const badge = node('span', 'pe-group', record.person.arm);
        badge.classList.toggle('pe-second', arms.indexOf(record.person.arm) === 1);
        group.append(badge);
        shownVisits.forEach((v) => tr.insertCell().append(visitMark(record.visitsByPerson.get(v))));
        tr.insertCell().append(node('span', 'pe-num', counts.format(record.cells)));
        const label = record.covered ? 'Eligible' : record.inArm ? 'Incomplete' : 'Outside groups';
        tr.insertCell().append(
          node(
            'span',
            'pe-status pe-' + (record.covered ? 'covered' : record.inArm ? 'incomplete' : 'outside'),
            label,
          ),
        );
      });
      if (!visible.length) {
        const td = body.insertRow().insertCell();
        td.colSpan = shownVisits.length + 4;
        td.className = 'pe-empty';
        td.textContent = 'No participants match these filters.';
      }
      const last = Math.min(first + recordsPerPage, visible.length);
      range.textContent = visible.length
        ? first + 1 + '–' + last + ' of ' + counts.format(visible.length) + ' participants'
        : '0 participants';
      pager.replaceChildren();
      if (pages > 1) {
        const move = (page) => {
          state.page = page;
          update();
          const preferred = page > 0 ? 'button:first-child' : 'button:last-child';
          pager.querySelector(preferred)?.focus();
        };
        pager.append(pageControls(state.page, pages, move));
      }
    }

    function openParticipant(record) {
      const dialog = node('dialog', 'pe-detail');
      const title = node('h2', '', String(record.person.id));
      title.id = prefix + '-detail-title';
      dialog.setAttribute('aria-labelledby', title.id);
      const heading = node('div', 'pe-dialog-head');
      const titleBlock = node('div');
      titleBlock.append(node('p', 'pe-dialog-label', 'Participant'), title);
      const close = makeButton('Close', 'pe-close', () => dialog.close());
      heading.append(titleBlock, close);
      const context = node('p', 'pe-dialog-sub', record.person.arm + ' · ' + population);
      const panel = node('div', 'pe-scroll');
      const detail = node('table', 'pe-table pe-detail-table');
      const thead = detail.createTHead().insertRow();
      for (const h of ['Visit', 'Status', 'Cells', feature.label]) {
        const th = node('th', '', h);
        th.scope = 'col';
        thead.append(th);
      }
      const detailBody = detail.createTBody();
      panel.append(detail);
      const nav = node('div', 'pe-detail-nav');
      const totalPages = Math.max(1, Math.ceil(visits.length / recordsPerPage));
      function detailPage(page) {
        detailBody.replaceChildren();
        visits.slice(page * recordsPerPage, (page + 1) * recordsPerPage).forEach((v) => {
          const obs = record.visitsByPerson.get(v);
          const tr = detailBody.insertRow();
          const th = node('th', '', v);
          th.scope = 'row';
          tr.append(th);
          tr.insertCell().textContent = status(obs);
          tr.insertCell().textContent = obs ? counts.format(obs.cells) : '—';
          const val = obs?.scores?.[feature.id];
          tr.insertCell().textContent = Number.isFinite(val) ? scores.format(val) : '—';
        });
        nav.replaceChildren();
        if (totalPages > 1) nav.append(pageControls(page, totalPages, detailPage));
      }
      detailPage(0);
      dialog.append(heading, context, panel, nav);
      root.append(dialog);
      dialog.addEventListener('close', () => dialog.remove(), { once: true });
      dialog.showModal();
      close.focus();
      if (typeof actions.onParticipant === 'function') actions.onParticipant(record.person.id);
    }

    input.addEventListener('input', () => {
      state.query = input.value;
      state.page = 0;
      update();
    });
    update();
    if (model.initialId !== undefined) {
      const initial = rows.find((record) => record.person.id === model.initialId);
      if (initial) openParticipant(initial);
    }
  }

  globalThis.renderPeople = renderPeople;
})();

(() => {
  'use strict';

  const sorting = new WeakMap();
  const formatDecimal = new Intl.NumberFormat('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const signed = (n) =>
    Number.isFinite(n) ? (n < 0 ? '−' : n > 0 ? '+' : '') + formatDecimal.format(Math.abs(n)) : '—';
  const bound = (n) => (n === Infinity ? '∞' : n === -Infinity ? '−∞' : signed(n));
  const interval = (row) =>
    row.lo === null ||
    row.lo === undefined ||
    Number.isNaN(row.lo) ||
    row.hi === null ||
    row.hi === undefined ||
    Number.isNaN(row.hi)
      ? '—'
      : bound(row.lo) + ' to ' + bound(row.hi);
  function probability(n) {
    if (!Number.isFinite(n)) return '—';
    if (n === 0) return '0';
    return n < 0.001 ? n.toExponential(1).replace('e-', 'e−') : n.toFixed(3);
  }
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderResults(container, model, actions) {
    const isMean = !model.reference && Boolean(model.isMean);
    const currentFocus = container.contains(document.activeElement)
      ? document.activeElement.dataset.resultFocus
      : undefined;
    const sort = sorting.get(container) || { key: '', ascending: true };
    const source = Array.isArray(model.rows) ? model.rows : [];
    const selected = source.find((row) => row.id === model.selected) || source[0];
    const rows = [...source];
    const available = model.reference
      ? ['label', 'estimate', 'p', 'q', 'n']
      : ['label', 'estimate', 'n'];
    if (available.includes(sort.key)) {
      rows.sort((a, b) => {
        if (sort.key === 'label') return a.label.localeCompare(b.label) * (sort.ascending ? 1 : -1);
        const x = a[sort.key],
          y = b[sort.key];
        if (!Number.isFinite(x)) return Number.isFinite(y) ? 1 : 0;
        if (!Number.isFinite(y)) return -1;
        return (x - y) * (sort.ascending ? 1 : -1);
      });
    }
    const layout = el('div', 'results-layout');
    const card = el('section', 'card results-table-card');
    const heading = el('div', 'section-head result-head');
    const left = el('div');
    left.append(
      el(
        'h2',
        '',
        model.reference ? 'Feature estimates' : isMean ? 'Participant means' : 'Descriptive contrasts',
      ),
    );
    heading.append(left);
    const exportButton = el('button', 'btn small', 'Export CSV');
    exportButton.type = 'button';
    exportButton.dataset.resultFocus = 'export';
    exportButton.disabled = source.length === 0;
    exportButton.addEventListener('click', actions.onExport);
    heading.append(exportButton);
    card.append(heading);

    const scroller = el('div', 'results-scroll');
    const table = el('table', 'results-table');
    table.setAttribute(
      'aria-label',
      model.reference
        ? 'Feature estimates and uncertainty'
        : isMean
          ? 'Participant means by feature'
          : 'Descriptive participant-level contrasts',
    );
    const header = table.createTHead().insertRow();
    function createColumn(key, name) {
      const th = el('th');
      th.scope = 'col';
      if (!available.includes(key)) {
        th.textContent = name;
        header.append(th);
        return;
      }
      const sorted = sort.key === key;
      if (sorted) th.setAttribute('aria-sort', sort.ascending ? 'ascending' : 'descending');
      const button = el('button', 'sort-head');
      button.type = 'button';
      button.title = 'Sort by ' + name;
      button.dataset.resultFocus = 'sort-' + key;
      const glyph = el('span', 'sort-arrow', sorted ? (sort.ascending ? '↑' : '↓') : '↕');
      glyph.setAttribute('aria-hidden', 'true');
      button.append(document.createTextNode(name), glyph);
      button.addEventListener('click', () => {
        sorting.set(container, {
          key,
          ascending: sorted ? !sort.ascending : key !== 'n' && key !== 'estimate',
        });
        renderResults(container, model, actions);
      });
      th.append(button);
      header.append(th);
    }
    createColumn('label', 'Feature');
    createColumn('estimate', model.reference ? 'Estimate' : isMean ? 'Mean' : 'Difference');
    if (model.reference) {
      createColumn('ci', '95% CI');
      createColumn('p', 'p');
      createColumn('q', 'FDR');
    }
    createColumn('n', 'n');
    const body = table.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      if (row.id === selected?.id) tr.classList.add('chosen-feature');
      const nameCell = el('th', 'feature-cell');
      nameCell.scope = 'row';
      const featureButton = el('button', 'feature-link', row.label);
      featureButton.type = 'button';
      featureButton.dataset.resultFocus = 'feature-' + row.id;
      featureButton.setAttribute('aria-pressed', String(row.id === selected?.id));
      function selectRow() {
        actions.onSelect(row.id);
      }
      featureButton.addEventListener('click', selectRow);
      tr.addEventListener('click', (event) => {
        if (!featureButton.contains(event.target)) selectRow();
      });
      nameCell.append(featureButton);
      tr.append(nameCell);
      tr.append(el('td', 'result-number', signed(row.estimate)));
      if (model.reference) {
        tr.append(
          el('td', 'result-interval', interval(row)),
          el('td', 'result-number', probability(row.p)),
          el('td', 'result-number', probability(row.q)),
        );
      }
      tr.append(el('td', 'result-number', Number.isFinite(row.n) ? String(row.n) : '—'));
    }
    if (!source.length) {
      const td = el('td', 'result-empty', 'No features are available for this comparison.');
      td.colSpan = header.cells.length;
      body.insertRow().append(td);
    }
    scroller.append(table);
    card.append(scroller);
    const foot = el(
      'p',
      'result-foot muted',
      model.reference
        ? 'n = contributing participants. FDR is reported across the tested features.'
        : isMean
          ? 'Each participant contributes one summary at the selected visit.'
          : 'Differences are calculated from the imported participant summaries.',
    );
    card.append(foot);
    layout.append(card);

    if (selected) {
      const detail = el('section', 'card result-detail');
      const group = el('div', 'result-detail-top');
      const name = el('div');
      name.append(el('span', 'detail-kicker', 'Selected feature'), el('h2', '', selected.label));
      group.append(name);
      const trace = el('button', 'btn small', 'View trajectory');
      trace.type = 'button';
      trace.dataset.resultFocus = 'trace';
      trace.addEventListener('click', () => actions.onShowOverview(selected.id));
      group.append(trace);
      detail.append(group);
      const facts = el('dl', 'detail-facts');
      function fact(label, value, special) {
        const div = el('div', special ? 'fact feature-estimate' : 'fact');
        div.append(el('dt', '', label), el('dd', '', value));
        facts.append(div);
      }
      fact(
        model.reference ? 'Estimate' : isMean ? 'Participant mean' : 'Descriptive difference',
        signed(selected.estimate),
        true,
      );
      if (model.reference) fact('95% confidence interval', interval(selected));
      fact('Participants', Number.isFinite(selected.n) ? String(selected.n) : '—');
      if (model.unit) fact('Units', model.unit);
      detail.append(facts);
      if (model.contrast) {
        const contrast = el('div', 'selected-contrast');
        contrast.append(el('span', '', isMean ? 'Summary' : 'Contrast'), el('p', '', model.contrast));
        detail.append(contrast);
      }
      layout.append(detail);
    }
    container.replaceChildren(layout);
    if (currentFocus)
      Array.from(container.querySelectorAll('[data-result-focus]'))
        .find((node) => node.dataset.resultFocus === currentFocus)
        ?.focus({ preventScroll: true });
  }
  globalThis.renderResults = renderResults;
})();

        r.estimate,
        r.n,
        ...(reference() ? [r.lo, r.hi, r.p, r.q] : []),
      ]);
      download('sctrial-results.csv', csv([headers, ...rows]), 'text/csv');
    } else {
      const header = [
        'participant',
        'arm',
        'visit',
        'population',
        'cells',
        ...study.features.map((f) => f.label),
      ];
      const rows = (byPopulation.get(state.population) || [])
        .filter((r) => armsIn().includes(r.arm) && datesIn().includes(r.visit))
        .map((r) => [
          r.id,
          r.arm,
          r.visit,
          r.population,
          r.cells,
          ...study.features.map((f) => r.scores[f.id]),
        ]);
      download('sctrial-participant-summaries.csv', csv([header, ...rows]), 'text/csv');
    }
    toast('Export downloaded');
  }
  function exportMenu() {
    modal(
      'Export study data',
      choice(
        'resFile',
        'chart',
        'Feature results · CSV',
        reference()
          ? 'Estimates, intervals, p-values and fitted counts'
          : 'Descriptive estimates and participant counts',
      ) +
        choice(
          'setFile',
          'code',
          'Comparison settings · JSON',
          'Group order, visits, population and feature panel',
        ) +
        choice(
          'obsFile',
          'people',
          'Participant summaries · CSV',
          'Includes participant IDs for the selected groups and visits',
        ),
    );
    for (const [id, kind] of [
      ['resFile', 'results'],
      ['setFile', 'settings'],
      ['obsFile', 'observations'],
    ])
      $(id).onclick = () => {
        finish();
        exportFile(kind);
      };
  }
  function info() {
    const entries = [
      ['Study', name()],
      ['Source', reference() ? 'Synthetic reference cohort' : 'Local participant summary CSV'],
      ['Unit', displayUnit()],
      [
        'Method',
        reference()
          ? study.study.methods[state.design]
          : 'Unadjusted descriptive summary by participant.',
      ],
      ...(reference()
        ? [
            ['Package', study.study.package],
            ['Multiplicity', study.study.multiplicity],
            ['Interpretation', study.study.smallSample],
          ]
        : []),
    ];
    modal(
      'Study information',
      '<dl class="meta-list">' +
        entries.map(([a, b]) => '<div><dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd></div>').join('') +
        '</dl>',
    );
  }
  const actions = {
    open: openStudy,
    configure,
    export: exportMenu,
    search,
    info,
    results: () => navigate('results'),
    people: () => navigate('participants'),
  };
  document.addEventListener('click', (e) => {
    const view = e.target.closest('[data-view]');
    if (view) {
      navigate(view.dataset.view);
      return;
    }
    const b = e.target.closest('[data-action]');
    if (b) {
      closeMenu();
      actions[b.dataset.action]?.();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const wasOpen = $('rail').classList.contains('open');
      closeMenu();
      if (wasOpen) $('menu').focus();
      return;
    }
    if (
      e.key === '/' &&
      !e.ctrlKey &&
      !e.metaKey &&
      !e.altKey &&
      !document.querySelector('dialog[open]') &&
      !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)
    ) {
      e.preventDefault();
      search();
    }
  });
  $('menu').onclick = () => {
    const open = $('rail').classList.toggle('open');
    $('scrim').hidden = !open;
    document.querySelector('.body').inert = open;
    $('menu').setAttribute('aria-expanded', String(open));
    if (open) $('rail').querySelector('[aria-current="page"]').focus();
  };
  $('scrim').onclick = () => {
    closeMenu();
    $('menu').focus();
  };
  window.matchMedia('(min-width:841px)').addEventListener('change', (e) => {
    if (e.matches) closeMenu();
  });
  init(sample);
})();
</script>
 </body></html>
