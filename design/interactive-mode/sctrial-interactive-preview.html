.modal {
  width: min(calc(100% - 26px), 500px);
  max-height: 85dvh;
  border: 1px solid #cbd3df;
  border-radius: 14px;
  color: var(--ink);
  padding: 0;
  box-shadow: 0 18px 70px #24392e44;
}
.modal::backdrop {
  background: #101b36a3;
}
.modal-head {
  padding: 19px 21px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px 21px 21px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}
.field {
  display: grid;
  align-content: start;
  gap: 5px;
  min-width: 0;
}
.field.wide {
  grid-column: 1/-1;
}
.field > span {
  font-size: 12px;
  font-weight: 620;
}
.field-input {
  width: 100%;
}
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 17px;
}
.hint {
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.contrast-note {
  margin-top: 14px;
  border-radius: 7px;
  background: #f2f1fc;
  color: #463e7b;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.45;
}
.choice {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 7px 0;
  background: #fff;
  cursor: pointer;
}
.choice:hover {
  border-color: #8db29a;
  background: #f2f8f0;
}
.choice > i {
  color: #397661;
}
.choice span {
  display: grid;
  gap: 3px;
}
.choice strong {
  font-size: 13px;
}
.choice small {
  font-size: 12px;
  color: var(--muted);
}
.drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  border: 1px dashed #98b4a2;
  border-radius: 9px;
  background: #f1f6ed;
  padding: 23px 12px;
  color: #2d654e;
  cursor: pointer;
}
.drop-zone.over {
  border: 2px solid var(--violet);
}
.drop-zone .btn {
  margin: 3px;
}
.drop-zone strong {
  font-size: 15px;
}
.drop-zone small {
  color: var(--muted);
}
.error {
  border-left: 3px solid #b43f48;
  padding: 8px;
  color: #913342;
  background: #fff3f3;
  font-size: 12px;
  margin-top: 8px;
}
.modal-list {
  display: grid;
  max-height: 42vh;
  overflow: auto;
  margin-top: 10px;
}
.modal-list button {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  gap: 8px;
}
.modal-list button:hover {
  background: #f6f5fd;
}
.modal-list small {
  color: var(--muted);
}
.meta-list {
  display: grid;
  gap: 0;
}
.meta-list div {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 7px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.meta-list dt {
  color: var(--muted);
}
.meta-list dd {
  margin: 0;
}
.toast {
  position: fixed;
  z-index: 20;
  bottom: 22px;
  right: 20px;
  background: #1b392d;
  color: white;
  border-radius: 8px;
  box-shadow: 0 4px 18px #24392e35;
  padding: 12px 15px;
  font-size: 13px;
}
.empty {
  color: var(--muted);
  padding: 15px;
  font-size: 13px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.pe.card {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 15px;
  background: white;
  color: var(--ink, #17243b);
}
.pe-head,
.pe-filters,
.pe-footer,
.pe-notes {
  padding-inline: clamp(16px, 2vw, 28px);
}
.pe-head {
  padding-top: 21px;
}
.pe-head h2,
.pe-detail h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.035em;
  color: var(--ink, #17243b);
}
.pe-sub,
.pe-dialog-sub {
  margin: 5px 0 0;
  font-size: 13px;
  color: #53647a;
}
.pe-filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  padding-block: 16px;
}
.pe-control {
  display: grid;
  gap: 5px;
  min-width: 132px;
}
.pe-label,
.pe-dialog-label {
  font-size: 12px;
  color: #52617a;
  font-weight: 600;
}
.pe-search {
  flex: 1 1 185px;
}
.pe-input,
.pe-control select {
  max-width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 10px;
  border: 1px solid #c5cede;
  border-radius: 7px;
  background: white;
  color: var(--ink, #17243b);
  font: inherit;
  font-size: 13px;
}
.pe-control select {
  cursor: pointer;
  min-width: 118px;
}
.pe-input::placeholder {
  color: #637086;
}
.pe :focus-visible,
.pe-detail :focus-visible {
  outline: 3px solid #237f60;
  outline-offset: 2px;
}
.pe-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.pe-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
  margin: 0;
}
.pe-table th,
.pe-table td {
  text-align: left;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid #e9edf3;
  color: #35445b;
  background: transparent;
}
.pe-table th:first-child,
.pe-table td:first-child {
  padding-left: clamp(16px, 2vw, 28px);
}
.pe-table th:last-child,
.pe-table td:last-child {
  padding-right: clamp(16px, 2vw, 28px);
}
.pe-table thead th {
  padding-block: 9px;
  background: #f4f6fb;
  font-weight: 600;
  font-size: 12px;
  color: #54627a;
  border-block: 1px solid #e2e6ee;
}
.pe-table tbody th {
  font-weight: 550;
}
.pe-table tbody tr:hover td,
.pe-table tbody tr:hover th {
  background: #f8f9fe;
}
.pe-person {
  color: #3d3289;
  background: transparent;
  border: 0;
  padding: 4px 3px 4px 0;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.pe-person:hover {
  text-decoration: underline;
}
.pe-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pe-group::before {
  content: '';
  display: block;
  height: 8px;
  width: 8px;
  border-radius: 3px;
  background: var(--violet, #34735c);
}
.pe-group.pe-second::before {
  background: var(--teal, #087f78);
}
.pe-num,
.pe-page-number,
.pe-detail-table {
  font-variant-numeric: tabular-nums;
}
.pe-mark {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  box-sizing: border-box;
  vertical-align: -1px;
}
.pe-yes {
  background: #11887e;
  box-shadow: inset 0 0 0 1px #087267;
}
.pe-partial {
  border: 1px solid #997120;
  background: repeating-linear-gradient(135deg, #f9e9bb 0 2px, #fff8e6 2px 4px);
}
.pe-no {
  border: 1px dashed #78879d;
  background: white;
}
.pe-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.pe-covered {
  color: #126359;
  background: #e5f5ef;
}
.pe-incomplete {
  color: #79540b;
  background: #fff2d3;
}
.pe-outside {
  color: #536278;
  background: #edf0f4;
}
.pe-table .pe-empty {
  padding: 22px;
  color: #53647a;
  text-align: center;
}
.pe-footer,
.pe-pages {
  display: flex;
  align-items: center;
}
.pe-footer {
  min-height: 48px;
  padding-block: 8px;
  justify-content: space-between;
  gap: 8px;
}
.pe-range,
.pe-note,
.pe-legend,
.pe-page-number {
  margin: 0;
  font-size: 12px;
  color: #52617a;
}
.pe-pages {
  gap: 8px;
}
.pe-step,
.pe-close {
  padding: 5px 9px;
  border: 1px solid #c9d1de;
  border-radius: 6px;
  color: #293449;
  background: white;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.pe-step:disabled {
  opacity: 0.45;
  cursor: default;
}
.pe-notes {
  background: #f9fafd;
  padding-block: 12px;
  border-top: 1px solid #e2e6ee;
}
.pe-legend,
.pe-key {
  display: flex;
  align-items: center;
}
.pe-legend {
  gap: 4px 16px;
  flex-wrap: wrap;
}
.pe-key {
  gap: 5px;
}
.pe-key .pe-mark {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}
.pe-note {
  margin-top: 6px;
  line-height: 1.5;
}
.pe-detail {
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(610px, calc(100% - 24px));
  max-width: none;
  max-height: 86dvh;
  padding: 22px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 14px;
  color: var(--ink, #17243b);
  box-shadow: 0 20px 80px #17243b38;
}
.pe-detail::backdrop {
  background: #15223c75;
}
.pe-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pe-dialog-label {
  margin: 0 0 4px;
}
.pe-dialog-sub {
  margin-bottom: 15px;
}
.pe-detail .pe-table th,
.pe-detail .pe-table td {
  padding-inline: 9px;
}
.pe-detail-table thead th:last-child {
  min-width: 78px;
  white-space: normal;
}
.pe-detail-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
@media (max-width: 600px) {
  .pe-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .pe-control {
    min-width: 0;
  }
  .pe-control select {
    min-width: 0;
  }
  .pe-search {
    grid-column: 1 / -1;
  }
  .pe-table {
    font-size: 12px;
  }
  .pe-table th,
  .pe-table td {
    padding: 9px;
  }
  .pe-footer {

.cbench {
  --cb-ink: #132f37;
  --cb-muted: #516974;
  --cb-line: #d5dedf;
  --cb-paper: #fff;
  --cb-a: #08766e;
  --cb-b: #995421;
  display: grid;
  gap: 18px;
  color: var(--cb-ink);
  min-width: 0;
}
.cbench * {
  box-sizing: border-box;
}
.cbench h2,
.cbench h3,
.cbench p {
  margin: 0;
}
.cbench h2 {
  font-size: clamp(20px, 2vw, 27px);
  letter-spacing: -0.045em;
  line-height: 1.1;
}
.cbench h3 {
  font-size: 16px;
  letter-spacing: -0.025em;
}
.cbench-main,
.cbench-shelf {
  border: 1px solid var(--cb-line);
  background: var(--cb-paper);
  border-radius: 12px;
  min-width: 0;
}
.cbench-header,
.cbench-shelf-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 15px;
}
.cbench-button {
  color: var(--cb-ink);
  background: #fff;
  border: 1px solid var(--cb-line);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 10px;
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  line-height: 1.4;
  min-height: 33px;
  cursor: pointer;
  white-space: nowrap;
}
.cbench-button:focus-visible,
.cbench select:focus-visible,
.cbench input:focus-visible {
  outline: 3px solid #00877c;
  outline-offset: 3px;
}
.cbench-button:hover {
  background: #edf4f0;
}
.cbench-button:disabled {
  opacity: 0.35;
  cursor: default;
}
.cbench-strong {
  background: #183b3d;
  border-color: #183b3d;
  color: #fff;
}
.cbench-strong:hover {
  background: #22554f;
}
.cbench-icon {
  padding: 4px;
  width: 31px;
  min-height: 31px;
  border: 0;
  background: transparent;
  color: var(--cb-muted);
}
.cbench-text {
  border: 0;
  color: var(--cb-a);
  padding: 3px 6px;
  background: transparent;
}
.cbench-pair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
  align-items: stretch;
  gap: 7px;
  margin: 0 22px 17px;
}
.cbench-side {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 12px;
  border: 1px solid var(--cb-line);
  border-top: 3px solid currentColor;
  border-radius: 6px;
}
.cbench-a {
  color: var(--cb-a);
}
.cbench-b {
  color: var(--cb-b);
}
.cbench-letter,
.cbench-dot {
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  font-weight: 750;
  font-family: ui-monospace, monospace;
  flex-shrink: 0;
}
.cbench-letter {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: #e5f2ed;
}
.cbench-b .cbench-letter {
  background: #f7eadf;
}
.cbench-choice {
  min-width: 0;
  flex: 1;
}
.cbench-select {
  width: 100%;
  color: var(--cb-ink);
  padding: 3px 17px 4px 0;
  min-height: 24px;
  border: 0;
  border-radius: 0;
  background: transparent;
  text-overflow: ellipsis;
  font-weight: 650;
  font-size: 13px;
  cursor: pointer;
}
.cbench-select:disabled {
  opacity: 0.7;
  cursor: default;
}
.cbench-side small,
.cbench-row-label small,
.cbench-value small {
  display: block;
  color: var(--cb-muted);
  font-size: 11px;
  line-height: 1.6;
}
.cbench-swap {
  align-self: center;
}
.cbench-empty {
  min-height: 142px;
  display: grid;
  align-content: center;
  gap: 6px;
  text-align: center;
  padding: 24px;
  border-top: 1px solid var(--cb-line);
}
.cbench-empty > .cbench-text {
  justify-self: center;
}
.cbench-empty p,
.cbench-tip,
.cbench-storage {
  font-size: 12px;
  line-height: 1.5;
  color: var(--cb-muted);
}
.cbench-tip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #f4f6f2;
  border-block: 1px solid var(--cb-line);
  padding: 8px 22px;
}
.cbench-scroll {
  overflow: auto;
  max-height: 58vh;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
}
.cbench-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  table-layout: fixed;
}
.cbench-table th,
.cbench-table td {
  padding: 11px 18px;
  border-top: 1px solid var(--cb-line);
  overflow-wrap: anywhere;
  vertical-align: top;
}
.cbench-table thead th {
  font-size: 11px;
  color: var(--cb-muted);
  background: #f5f7f5;
  font-weight: 650;
  position: sticky;
  top: 0;
  z-index: 1;
}
.cbench-table tbody th {
  font-size: 13px;
  font-weight: 600;
}
.cbench-value {
  font-variant-numeric: tabular-nums;
}
.cbench-value strong {
  display: block;
  line-height: 1.4;
  font-size: 16px;
  letter-spacing: -0.03em;
}
.cbench-unavailable {
  color: var(--cb-muted);
}
.cbench-shelf-head {
  justify-content: flex-start;
  padding: 15px 20px 11px;
}
.cbench-count {
  font-size: 11px;
  font-weight: 650;
  color: var(--cb-muted);
  background: #edf2f1;
  border-radius: 4px;
  padding: 1px 5px;
}
.cbench-shelf-head .cbench-text {
  margin-left: auto;
}
.cbench-pins {
  list-style: none;
  margin: 0;
  padding: 0 20px;
}
.cbench-pin {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 0;
  border-top: 1px solid var(--cb-line);
}
.cbench-dot {
  align-self: flex-start;
  width: 21px;
  height: 22px;
  margin-top: 4px;
  border: 1px solid #d4dcdd;
  color: #667b82;
  border-radius: 4px;
}
.cbench-dot.cbench-a {
  background: #e5f2ed;
  color: var(--cb-a);
  border-color: #c4ddd6;
}
.cbench-dot.cbench-b {
  background: #f7eadf;
  color: var(--cb-b);
  border-color: #ead6c1;
}
.cbench-row-label {
  min-width: 0;
  flex: 1;
}
.cbench-row-label strong {
  font-size: 13px;
  overflow-wrap: anywhere;
}
.cbench-pin-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.cbench-storage {
  padding: 7px 20px 13px;
  font-size: 11px;
}
.cbench-name-form {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.cbench-name-input {
  appearance: none;
  flex: 1;
  min-width: 0;
  padding: 7px;
  border: 1px solid var(--cb-line);
  border-radius: 5px;
  font: inherit;
}
@media (max-width: 700px) {
  .cbench {
    gap: 12px;
  }
  .cbench-header {
    padding: 15px 12px 12px;
  }
  .cbench-header h2 {
    font-size: 18px;
  }
  .cbench-pair {
    margin: 0 12px 12px;
    gap: 5px;
    grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr);
  }
  .cbench-side {
    display: block;
    padding: 8px;
  }
  .cbench-letter {
    width: 20px;
    height: 20px;
  }
  .cbench-swap {
    width: 22px;
  }
  .cbench-table th,
  .cbench-table td {
    padding: 8px;
  }
  .cbench-shelf-head {
    padding: 12px;
  }
  .cbench-pins {
    padding: 0 12px;
  }
  .cbench-storage,
  .cbench-tip {
    padding: 8px 12px;
  }
  .cbench-pin-actions {
    gap: 0;
  }
}
.cbench-scroll:focus-visible {
  outline: 3px solid #00877c;
  outline-offset: -3px;
}
.cbench-table.cbench-with-forest thead th:first-child {
  width: 40%;
}
.cbench-with-forest tbody th {
  vertical-align: middle;
}
.cbench-axis {
  height: 14px;
  position: relative;
  margin-top: 2px;
  font:
    550 9px/1.35 ui-monospace,
    monospace;
  letter-spacing: -0.03em;
}
.cbench-axis span {
  position: absolute;
  top: 0;
}
.cbench-tick-lo {
  left: 5%;
}
.cbench-tick-zero {
  left: 50%;
  transform: translateX(-50%);
}
.cbench-tick-hi {
  right: 5%;
}
.cbench-forest {
  display: block;
  min-width: 0;
  margin-top: 5px;
}

.cbench-key {
  display: inline-block;
  vertical-align: 1px;
  width: 7px;
  height: 7px;
  margin-right: 6px;
}
.cbench-key-1 {
  background: var(--cb-a);
  border-radius: 50%;
}
.cbench-key-2 {
  background: var(--cb-b);
  transform: rotate(45deg);
}

.cc-surface {
  --cc-base: #111c31;
  --cc-ink: #eff4ff;
  --cc-secondary: #b3c2d7;
  position: relative;
  width: 100%;
  overflow: hidden;
  isolation: isolate;
  color: var(--cc-ink);
  background:
    radial-gradient(ellipse at 77% -20%, #24344f 0%, transparent 60%),
    linear-gradient(155deg, #152238, #111b2e 75%);
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.cc-surface svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.cc-surface svg text {
  font-family: inherit;
}
.cc-surface svg .cc-number {
  font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
}
.cc-surface .cc-interactive {
  outline: none;
}
.cc-person,
.cc-visit {
  cursor: pointer;
}
.cc-person .cc-ink {
  transition:
    opacity 110ms ease,
    stroke-width 110ms ease;
}
.cc-person.cc-active .cc-ink {
  opacity: 1;
  stroke-width: 2.6px;
}
.cc-person.cc-muted .cc-ink {
  opacity: 0.17;
}
.cc-person.cc-active .cc-dot {
  opacity: 1;
}
.cc-person[aria-pressed='true'] .cc-focus {
  opacity: 1;
}
.cc-person.cc-muted .cc-dot {
  opacity: 0.25;
}
.cc-person:focus-visible .cc-focus,
.cc-visit:focus-visible .cc-focus,
.cc-handle:focus-visible .cc-focus,
.cc-mean:focus-visible .cc-focus {
  opacity: 1;
}
.cc-visit:hover .cc-chip,
.cc-visit:focus-visible .cc-chip {
  fill: #374962;
  stroke: #8cabc8;
}
.cc-visit-head {
  cursor: pointer;
  touch-action: manipulation;
}
.cc-visit-head:hover .cc-destination,
.cc-visit-head.cc-aim .cc-destination {
  fill: #a0b9d4;
  stroke: #e2edfc;
}
.cc-handle:hover .cc-grip,
.cc-handle:focus-visible .cc-grip,
.cc-handle.cc-dragging .cc-grip {
  fill: #f3f8ff;
  stroke: #9cc5f2;
}
.cc-handle.cc-dragging {
  cursor: grabbing;
}
.cc-visit {
  touch-action: manipulation;
}
.cc-visit:not(:hover) .cc-chip {
  transition: fill 140ms ease;
}
.cc-handle {
  cursor: ew-resize;
  touch-action: none;
}
.cc-readout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  min-height: 39px;
  padding: 7px 16px 8px;
  border-top: 1px solid #304056;
  color: #c1cee1;
  background: #101a2e;
  font-size: 11px;
  line-height: 1.45;
}
.cc-readout-main {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 5px 10px;
  align-items: center;
  min-width: 0;
}
.cc-readout-main strong {
  color: #f0f4ff;
  font-weight: 650;
}
.cc-readout-main span,
.cc-legend {
  overflow-wrap: anywhere;
}
.cc-readout-arm {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mark-color);
  flex: 0 0 auto;
}
.cc-legend {
  display: flex;
  gap: 10px;
  align-items: center;
  color: #c1cee1;
}
.cc-legend span {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  white-space: nowrap;
}
.cc-key {
  display: inline-block;
  width: 16px;
  height: 0;
  border-top: 1.5px solid #a3b2c8;
}
.cc-key.cc-key-mean {
  border-top: 3px solid #dde7f4;
  position: relative;
}
.cc-key.cc-key-mean:before {
  content: '';
  position: absolute;
  border: 1.5px solid #dde7f4;
  background: #172239;
  border-radius: 50%;
  width: 4px;
  height: 4px;
  left: 5px;
  top: -4.5px;
}
.cc-key.cc-key-dot {
  border: none;
  width: 7px;
  height: 7px;
  background: #c4d2e7;
  border-radius: 50%;
}
.cc-key.cc-key-diamond {
  border: none;
  width: 7px;
  height: 7px;
  background: #e7edf9;
  transform: rotate(45deg);
}
.cc-tip {
  position: absolute;
  z-index: 2;
  max-width: min(245px, 85%);
  pointer-events: none;
  padding: 6px 9px;
  border: 1px solid #536880;
  border-radius: 5px;
  color: #f2f7ff;
  background: #0e192bf2;
  box-shadow: 0 5px 18px #060a1640;
  font-size: 11px;
  line-height: 1.45;
}
.cc-tip[hidden] {
  display: none;
}
.cc-surface .cc-empty {
  fill: #d7e3f2;
  font-size: 14px;
}
@media (max-width: 540px) {
  .cc-readout {
    padding: 7px 9px;
    gap: 5px 8px;
    font-size: 10px;
  }
  .cc-legend {
    gap: 7px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .cc-surface *,
  .cc-surface *::before {
    transition: none !important;
    animation: none !important;
  }
}

  flex: none;
  width: 34px;
  height: 36px;
  display: grid;
  place-items: center;
  background: #e2eee4;
  color: #205f4b;
  border: 1px solid #c8dbcd;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.045em;
}
.local-mapping .lm-file b {
  display: block;
  font-size: 14px;
  font-weight: 620;
  overflow-wrap: anywhere;
}
.local-mapping .lm-file small {
  display: block;
  color: var(--mapping-muted);
  font-size: 12px;
  margin-top: 1px;
}
.local-mapping .lm-section {
  margin: 18px 0;
}
.local-mapping .lm-section h3 {
  font-size: 15px;
  letter-spacing: -0.025em;
  font-weight: 670;
}
.local-mapping .lm-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 13px;
  margin-top: 9px;
}
.local-mapping .lm-field {
  display: grid;
  min-width: 0;
  gap: 4px;
}
.local-mapping .lm-field > span {
  font-size: 12px;
  font-weight: 600;
  color: #435456;
}
.local-mapping select,
.local-mapping input[type='search'] {
  min-width: 0;
  width: 100%;
  color: var(--mapping-ink);
  border-radius: 6px;
  background: #fff;
  border: 1px solid #b9c7be;
  padding: 6px 9px;
  min-height: 36px;
  font-size: 13px;
}
.local-mapping select {
  cursor: pointer;
}
.local-mapping .lm-outcome-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}
.local-mapping .lm-count {
  font-size: 11px;
  color: var(--mapping-muted);
}
.local-mapping .lm-scores {
  margin-top: 7px;
  max-height: 133px;
  overflow: auto;
  border: 1px solid var(--mapping-line);
  border-radius: 6px;
  background: #fff;
}
.local-mapping .lm-score {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 33px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.local-mapping .lm-score + .lm-score {
  border-top: 1px solid #e5ebe6;
}
.local-mapping .lm-score:has(input:checked) {
  background: #edf6ed;
}
.local-mapping .lm-score input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--mapping-action);
  flex: none;
}
.local-mapping .lm-score:has(input:disabled) {
  color: #65746b;
  cursor: default;
}
.local-mapping .lm-empty,
.local-mapping .lm-note,
.local-mapping .lm-progress {
  color: var(--mapping-muted);
  font-size: 12px;
  line-height: 1.45;
}
.local-mapping .lm-empty {
  padding: 9px 10px;
}
.local-mapping .lm-note {
  margin-top: 5px;
}
.local-mapping .lm-progress {
  padding: 12px 0 17px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.local-mapping .lm-spinner {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid #bdcfc6;
  border-top-color: var(--mapping-action);
  animation: lm-turn 0.8s linear infinite;
}
.local-mapping .lm-error {
  background: #fff4e7;
  color: #6f3918;
  border: 1px solid #dfb285;
  border-radius: 6px;
  font-size: 12px;
  padding: 9px 11px;
  overflow-wrap: anywhere;
}
.local-mapping .lm-foot {
  position: sticky;
  bottom: 0;
  background: #fcfcf7;
  border-top: 1px solid var(--mapping-line);
  padding: 12px 25px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.local-mapping .lm-action {
  border-radius: 6px;
  min-height: 35px;
  padding: 7px 13px;
  border: 1px solid var(--mapping-line);
  background: #fff;
  color: var(--mapping-ink);
  font-size: 12px;
  font-weight: 630;
}
.local-mapping .lm-primary {
  color: #fff;
  background: var(--mapping-action);
  border-color: var(--mapping-action);
}
.local-mapping .lm-primary:enabled:hover {
  background: #0c5648;
}
.local-mapping [hidden] {
  display: none !important;
}
@keyframes lm-turn {
  to {
    transform: rotate(360deg);
  }
}
@media (max-width: 480px) {
  .local-mapping .lm-header {
    padding: 15px 16px 12px;
  }
  .local-mapping .lm-body {
    padding: 12px 16px 2px;
  }
  .local-mapping .lm-foot {
    padding: 10px 16px;
  }
  .local-mapping .lm-fields {
    gap: 9px 8px;
  }
  .local-mapping .lm-header h2 {
    font-size: 22px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .local-mapping .lm-spinner {
    animation: none;
  }
}

:root {
  color-scheme: light;
  --ink: #1b2927;
  --muted: #586961;
  --line: #d4ddd5;
  --base: #f2f4ef;
  --surface: #fffffc;
  --violet: #206c5e;
  --teal: #08776a;
  --focus: #287f6b;
  --pine: #153f36;
  --mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
  font:
    14px/1.45 Manrope,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Arial,
    sans-serif;
  color: var(--ink);
  background: var(--base);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body,
h1,
h2,
h3,
p {
  margin: 0;
}
button,
select,
input {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button {
  background: none;
  border: 0;
  touch-action: manipulation;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #27816e;
  outline-offset: 3px;
}
svg {
  display: block;
}
i {
  font-style: normal;
}
[data-icon] {
  display: inline-flex;
  justify-content: center;
  align-items: center;
}
button > i {
  display: inline-flex;
  flex-shrink: 0;
}
[hidden] {
  display: none !important;
}
.skip {
  position: fixed;
  top: -80px;
  left: 8px;
  z-index: 50;
  padding: 12px;
  background: #fff;
}
.skip:focus {
  top: 8px;
}
.app-head {
  height: 58px;
  background: #172624;
  color: #e9f4ed;
  display: flex;
  align-items: center;
  padding: 0 22px 0 17px;
  gap: 19px;
  position: relative;
  z-index: 3;
  border-bottom: 1px solid #35433f;
}
.identity {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #f3fbf5;
}
.identity strong {
  letter-spacing: -0.075em;
  font-size: 29px;
  line-height: 1;
  font-weight: 760;
}
.head-rule {
  height: 21px;
  width: 1px;
  background: #46544e;
}
.study-button,
.head-actions,
.find,
.head-open {
  display: flex;
  align-items: center;
  gap: 8px;
}
.study-button {
  color: #dbe8df;
  min-width: 0;
  padding: 7px 3px;
}
.study-button b {
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 570;
}
.study-button i:first-child {
  color: #b2c0b8;
}
.study-button i:last-child svg {
  width: 12px;
}
.head-actions {
  margin-left: auto;
  gap: 20px;
}
.find,
.head-open {
  color: #dce8e1;
  font-size: 12px;
}
.find kbd {
  border: 1px solid #58665e;
  font-family: var(--mono);
  border-radius: 3px;
  padding: 0 5px;
  color: #c2d2c8;
}
.head-open {
  border: 1px solid #64736b;
  border-radius: 5px;
  padding: 6px 10px;
}
.head-open:hover,
.find:hover,
.study-button:hover {
  color: #fff;
  background: #283c34;
}
.app-layout {
  display: grid;
  grid-template-columns: 75px minmax(0, 1fr);
  min-height: calc(100dvh - 58px);
}
.dock {
  background: #1c2b28;
  color: #b9c7bf;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 18px 7px 12px;
  position: sticky;
  top: 0;
  height: calc(100dvh - 0px);
  max-height: 100%;
  z-index: 2;
  border-right: 1px solid #37423d;
}
.dock > button,
.dock-end button {
  width: 100%;
  min-height: 54px;
  border: 1px solid transparent;
  border-radius: 6px;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
}
.dock button i svg {
  width: 19px;
  height: 19px;
}
.dock button span {
  font-size: 10px;
  font-weight: 620;
  letter-spacing: 0.012em;
}
.dock button[aria-current='page'] {
  background: #354d43;
  border-color: #496454;
  color: #d5f9e2;
  box-shadow: inset 0 -2px #9bdabb;
}
.dock button:hover {
  background: #2c4138;
  color: #fff;
}
.dock-end {
  margin-top: auto;
  width: 100%;
}
.dock button b {
  position: absolute;
  right: 4px;
  top: 3px;
  color: #1b3026;
  background: #b7eacb;
  border-radius: 4px;
  font: 700 9px/13px var(--mono);
  min-width: 13px;
}
main {
  padding: clamp(18px, 2vw, 32px) clamp(16px, 2.3vw, 45px) 24px;
  min-width: 0;
  width: 100%;
  max-width: 1790px;
  margin: 0 auto;
  outline: none;
}
.work-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 16px;
}
.study-meta,
.main-actions,
.btn,
.stage-buttons,
.stage-toggle,
.source-inline {
  display: flex;
  align-items: center;
  gap: 8px;
}
.study-meta {
  font-size: 10.5px;
  font-weight: 650;
  color: #53665a;
  line-height: 1.4;
  letter-spacing: 0.012em;
}
.study-light {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4b9777;
}
.middot {
  color: #93a098;
}
.work-head h1 {
  font-size: clamp(30px, 2.7vw, 46px);
  letter-spacing: -0.064em;
  line-height: 1.16;
  font-weight: 720;
  margin-top: 3px;
}
h2,
h3 {
  letter-spacing: -0.04em;
}
h2 {
  font-size: 18px;
  line-height: 1.3;
}
h3 {
  font-size: 15px;
}
.btn {
  justify-content: center;
  gap: 7px;
  min-height: 34px;
  padding: 6px 12px;
  border: 1px solid #bfccc2;
  border-radius: 5px;
  background: #fcfdf9;
  font-weight: 660;
  font-size: 12px;
  white-space: nowrap;
}
.btn:hover {
  background: #e9efe7;
}
.btn.accent,
.btn.primary {
  background: var(--pine);
  color: white;
  border-color: var(--pine);
}
.btn.accent:hover,
.btn.primary:hover {
  background: #245649;
}
.btn svg {
  width: 15px;
  height: 15px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 5px;
  color: var(--muted);
}
.icon-btn:hover {
  background: #e9efe8;
}
.small,
.muted {
  font-size: 12px;
  color: var(--muted);
}
.card {
  background: #fffffc;
  border: 1px solid var(--line);
  border-radius: 8px;
  min-width: 0;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
}
.pill {
  border-radius: 4px;
  background: #e6ede5;
  color: #395447;
  padding: 3px 7px;
  font-size: 11px;
  font-weight: 660;
}
.controlbar {
  display: flex;
  align-items: stretch;
  gap: 0;
  border: 1px solid var(--line);
  border-bottom-color: #bac7bb;
  background: #fffffc;
  border-radius: 8px 8px 0 0;
  min-height: 56px;
  overflow: visible;
}
.control {
  position: relative;
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 1 1 auto;
  gap: 10px;
  padding: 8px clamp(10px, 1.2vw, 21px);
  border-right: 1px solid var(--line);
  cursor: pointer;
}
.control:last-child {
  border-right: 0;
}
.control .label-icon {
  color: #587362;
}
.control > span:nth-child(2) {
  display: block;
  min-width: 0;
}
.control small,
.visit-counts small,
.ins-subtitle,
.roster-head small {
  display: block;
  font-size: 10px;
  font-weight: 650;
  color: var(--muted);
  letter-spacing: 0.012em;
}
.control b {
  display: block;
  font-size: 12.5px;
  line-height: 1.55;
  font-weight: 675;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.control > i:last-child {
  margin-left: auto;
  color: #65776b;
}
.control > i:last-child svg {
  width: 12px;
}
.control select {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
}
.control:focus-within {
  outline: 2px solid #58846c;
  outline-offset: -3px;
}
.control:hover {
  background: #f4f7ef;
}
.studio-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(276px, 25%);
  align-items: stretch;
  border: 1px solid #c6d0c6;
  border-top: 0;
  border-radius: 0 0 10px 10px;
  overflow: hidden;
  background: #fffffc;
  box-shadow: 0 4px 10px #16322409;
}
.stage {
  min-width: 0;
  background: #101b24;
  color: #eaf0ec;
  display: flex;
  flex-direction: column;
}
.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 18px 20px 12px;
}
.stage-context {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #b4c7c8;
  font-size: 11px;
  margin-bottom: 2px;
}
.stage-head h2 {
  font-size: clamp(19px, 2vw, 30px);
  font-weight: 635;
  line-height: 1.24;
  letter-spacing: -0.045em;
}
.stage-toggle {
  gap: 0;
  background: #172731;
  border: 1px solid #435058;
  border-radius: 5px;
  padding: 2px;
}
.stage-toggle button {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #afc0c4;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 620;
  padding: 5px 8px;
}
.stage-toggle button svg {
  width: 13px;
  height: 13px;
}
.stage-toggle button[aria-pressed='true'] {
  background: #d6e6dc;
  color: #172d23;
}
.stage-expand {
  color: #b9c9cb;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid #41525a;
  border-radius: 5px;
}
.stage-expand:hover {
  background: #243640;
}
.stage-plot {
  min-width: 0;
  flex: 1;
}
.stage-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: #17242b;
  border-top: 1px solid #33424a;
  padding: 9px 17px;
  color: #cbdbd6;
  min-height: 43px;
  font-size: 11px;
}
.stage-foot .group-keys,
.stage-foot .group-keys span {
  display: flex;
  align-items: center;
  gap: 7px;
}
.stage-foot .group-keys {
  gap: 17px;
  min-width: 0;
  flex-wrap: wrap;
}
.keymark {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--color);
  border-radius: 50%;
}
.keymark.diamond {
  border-radius: 1px;
  transform: rotate(45deg);
}
.coverage-short {
  color: #c4d1d0;
  font: 11px/1.4 var(--mono);
  text-align: right;
}
.inspector {
  min-width: 0;
  background: linear-gradient(125deg, #fffffc, #f8faf5);
  padding: 17px 17px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ins-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: #43594c;
  font-size: 11px;
  font-weight: 680;
}
.ins-head span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ins-method {
  font-size: 10px;
  color: var(--muted);
}
.est-num {
  font: 570 clamp(34px, 3.3vw, 56px)/1.12 var(--mono);
  letter-spacing: -0.09em;
  color: #163e33;
}
.est-caption {
  font-size: 12px;
  color: #4c6358;
  line-height: 1.55;
}
.est-box {
  border-bottom: 1px solid var(--line);
  padding: 0 0 10px;
}
.est-box h3 {
  margin: 4px 0 2px;
  font-size: 13px;
}
.estimate-ticks {
  display: flex;
  gap: 14px;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 10.5px;
  color: #586b60;
}
.estimate-ticks b {
  font: 600 12px var(--mono);
  display: block;
  color: var(--ink);
  margin-top: 1px;
}
.outcomes-head,
.roster-head,
.ins-values-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.outcomes-head h3 {
  font-size: 13px;
}
.outcomes-head span {
  font: 10px var(--mono);
  color: var(--muted);
}
.outcomes {
  display: grid;
  gap: 3px;
}
.outcome {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  min-height: 32px;
  padding: 4px 7px;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #33493b;
}
.outcome:hover {
  background: #eaf1e9;
}
.outcome[aria-pressed='true'] {
  background: #e4f0e6;
  border-color: #b7cfbc;
  color: #174836;
}
.outcome .radio {
  width: 9px;
  height: 9px;
  border: 1px solid #8b9e91;
  border-radius: 50%;
  flex: none;
}
.outcome[aria-pressed='true'] .radio {
  border: 3px solid #39846b;
}
.outcome .flabel {
  font-size: 12px;
  font-weight: 600;
  flex: 1;
  overflow-wrap: anywhere;
}
.outcome strong {
  font: 550 11px var(--mono);
  color: #52665a;
}
.outcomes-shell {
  max-height: 230px;
  overflow: auto;
}
.text-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px;
  color: #326d54;
  font-size: 11px;
  font-weight: 690;
}
.text-btn:hover {
  text-decoration: underline;
}
.text-btn svg {
  width: 13px;
  height: 13px;
}
.ins-bottom {
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.ins-error {
  font-size: 12px;
  color: #883f31;
}
.ins-tbl {
  width: 100%;
  border-collapse: collapse;
}
.ins-tbl td,
.ins-tbl th {
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
  text-align: right;
  font: 11px var(--mono);
}
.ins-tbl th {
  font-family: inherit;
  font-size: 10px;
  color: var(--muted);
}
.ins-tbl td:first-child,
.ins-tbl th:first-child {
  text-align: left;
}
.ins-tbl tr.in td:first-child {
  color: #1c684d;
  font-weight: 700;
}
.roster {
  margin-top: 16px;
  padding: 13px 17px 14px;
  border: 1px solid #cdd6cc;
  background: #fbfcf8;
  border-radius: 8px;
}
.roster-head {
  margin-bottom: 11px;
}
.roster-head h2 {
  display: inline;
  font-size: 15px;
  margin-right: 8px;
}
.roster-head small {
  display: inline;
  font-weight: 500;
}
.roster-groups {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
  gap: 13px 24px;
}
.roster-group {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.roster-label {
  font-size: 11px;
  font-weight: 680;
  min-width: 40px;
  overflow-wrap: anywhere;
  max-width: 95px;
}
.roster-keys {

      /* Local participant-level summaries. A missing specimen is represented by an omitted row. */
(() => {
  'use strict';

  const required = ['participant', 'arm', 'visit', 'population', 'cells'];
  const maxRows = 50000;
  const maxFeatures = 32;
  const maxBytes = 8 * 1024 * 1024;
  const decimal = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;

  function fieldLabel(value, name, line) {
    const result = value.trim();
    if (!result) throw new Error('Row ' + line + ' has an empty ' + name + '.');
    if (result.length > 160 || /[\u0000-\u001f\u007f]/.test(result)) {
      throw new Error(
        'Row ' + line + ' has an invalid ' + name + '. Use a single line of up to 160 characters.',
      );
    }
    return result;
  }

  function parseRows(text, accept) {
    let field = '',
      fields = [],
      quoted = false,
      closed = false;
    let line = 1,
      start = 1;

    function endField() {
      fields.push(field);
      if (fields.length > required.length + maxFeatures) {
        throw new Error(
          'Row ' + start + ' has too many fields. Include up to ' + maxFeatures + ' score columns.',
        );
      }
      field = '';
      closed = false;
    }

    function endRow() {
      endField();
      if (fields.length !== 1 || fields[0].trim()) accept(fields, start);
      fields = [];
    }

    for (let i = 0; i < text.length; i++) {
      const character = text[i];
      if (character === '\r' || character === '\n') {
        if (character === '\r' && text[i + 1] === '\n') i++;
        if (quoted) field += '\n';
        else endRow();
        line++;
        if (!quoted) start = line;
      } else if (quoted) {
        if (character !== '"') field += character;
        else if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = false;
          closed = true;
        }
      } else if (character === ',') {
        endField();
      } else if (closed) {
        if (character !== ' ' && character !== '\t') {
          throw new Error(
            'Row ' + line + ' has text after a closing quote. Use a comma between fields.',
          );
        }
      } else if (character === '"') {
        if (field.trim())
          throw new Error('Row ' + line + ' has a misplaced quote. Enclose the whole field in quotes.');
        field = '';
        quoted = true;
      } else field += character;
    }
    if (quoted) throw new Error('Row ' + start + ' has an unclosed quoted field.');
    endRow();
  }

  function readStudyCSV(text, fileName) {
    if (typeof text !== 'string') throw new Error('Choose a UTF-8 CSV file.');
    if (text.length > maxBytes || new Blob([text]).size > maxBytes) {
      throw new Error(
        'This preview supports CSV files up to 8 MiB. Select a smaller set of participant summaries.',
      );
    }
    const groups = new Set(),
      people = new Map(),
      visits = new Set(),
      populations = new Set();
    const keys = new Set(),
      observations = [];
    let positions, features, columnCount;

    function readHeader(fields, line) {
      const headers = fields.map((value) => fieldLabel(value, 'column name', line));
      const names = headers.map((name) => name.toLowerCase());
      if (new Set(names).size !== names.length)
        throw new Error('The header has duplicate column names. Give each column a unique name.');
      const missing = required.filter((name) => !names.includes(name));
      if (missing.length) throw new Error('Add the required CSV columns ' + missing.join(', ') + '.');
      positions = Object.fromEntries(required.map((name) => [name, names.indexOf(name)]));
      features = headers.flatMap((label, index) =>
        required.includes(names[index]) ? [] : [{ id: 'score_' + (index + 1), label, index }],
      );
      if (!features.length)
        throw new Error('Include at least one numeric score column after the study fields.');
      columnCount = fields.length;
    }

    function readObservation(fields, line) {
      if (observations.length >= maxRows)
        throw new Error('This preview supports up to 50,000 participant-level rows.');
      if (fields.length !== columnCount) {
        throw new Error(
          'Row ' + line + ' has ' + fields.length + ' fields. The header has ' + columnCount + '.',
        );
      }
      const id = fieldLabel(fields[positions.participant], 'participant ID', line);
      const arm = fieldLabel(fields[positions.arm], 'group label', line);
      const visit = fieldLabel(fields[positions.visit], 'visit label', line);
      const population = fieldLabel(fields[positions.population], 'population label', line);
      const previous = people.get(id);
      if (previous !== undefined && previous !== arm) {
        throw new Error(
          'Row ' + line + ' assigns ' + id + ' to a second group. Use one group per participant.',
        );
      }
      if (groups.size === 2 && !groups.has(arm)) {
        throw new Error(
          'Row ' + line + ' adds a third group. Import one or two groups for this comparison.',
        );
      }
      const key = JSON.stringify([id, visit, population]);
      if (keys.has(key)) {
        throw new Error(
          'Row ' +
            line +
            ' repeats ' +
            id +
            ' / ' +
            visit +
            ' / ' +
            population +
            '. Combine replicates before import.',
        );
      }
      const countText = fields[positions.cells].trim();
      const cells = Number(countText);
      if (!decimal.test(countText) || !Number.isSafeInteger(cells) || cells < 1) {
        throw new Error(
          'Row ' + line + ' requires a positive whole cell count. Omit rows with no observed cells.',
        );

      for (const feature of features) {
        const value = fields[feature.index].trim();
        const score = Number(value);
        if (!decimal.test(value) || !Number.isFinite(score)) {
          throw new Error(
            'Row ' + line + ' requires a finite numeric value in “' + feature.label + '”.',
          );
        }
        scores[feature.id] = score;
      }
      keys.add(key);
      groups.add(arm);
      people.set(id, arm);
      visits.add(visit);
      populations.add(population);
      observations.push({ id, arm, visit, population, cells, scores });
    }

    parseRows(text.replace(/^\uFEFF/, ''), (fields, line) => {
      if (positions) readObservation(fields, line);
      else readHeader(fields, line);
    });
    if (!positions) throw new Error('The CSV is empty. Start with the example template.');
    if (!observations.length)
      throw new Error('The CSV contains a header only. Add at least one participant observation.');
    const stem = String(fileName || '')
      .split(/[\\/]/)
      .pop()
      .replace(/\.csv$/i, '')
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .trim();
    return {
      title: stem.slice(0, 100) || 'Imported study',
      source: 'import',
      participants: Array.from(people, ([id, arm]) => ({ id, arm })),
      visits: Array.from(visits),
      populations: Array.from(populations),
      features: features.map(({ id, label }) => ({ id, label })),
      observations,
      results: {},
    };
  }

  function studyCSVTemplate() {
    const lines = ['participant,arm,visit,population,cells,Interferon response,Cytotoxicity'];
    const visits = ['Baseline', 'Week 4', 'Week 12'];
    const populations = ['CD8 T cells', 'B cells'];
    for (let person = 0; person < 6; person++) {
      const first = person < 3;
      const participant = (first ? 'A' : 'B') + '0' + ((person % 3) + 1);
      for (let t = 0; t < visits.length; t++) {
        if (person === 5 && t === 2) continue;
        for (let c = 0; c < populations.length; c++) {
          const baseline = (person % 3) * 0.08;
          const response = 0.62 + baseline + (first ? 0.27 : 0.13) * t - c * 0.11;
          const cytotoxicity = 0.88 + baseline + (first ? 0.16 : 0.09) * t - c * 0.49;
          lines.push(
            [
              participant,
              first ? 'Arm A' : 'Arm B',
              visits[t],
              populations[c],
              32 + person * 3 + t * 4 + c,
              response.toFixed(2),
              cytotoxicity.toFixed(2),
            ].join(','),
          );
        }
      }
    }
    return lines.join('\r\n') + '\r\n';
  }

  globalThis.readStudyCSV = readStudyCSV;
  globalThis.studyCSVTemplate = studyCSVTemplate;

  const previousViews = new WeakMap();
  const counts = new Intl.NumberFormat('en-US');
  const scores = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
  let nextId = 0;

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function makeButton(label, className, handler) {
    const button = node('button', className, label);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  function makeSelect(name, items, initial, change) {
    const field = node('label', 'pe-control');
    field.append(node('span', 'pe-label', name));
    const select = node('select', 'select');
    select.setAttribute('aria-label', name);
    for (const [value, label] of items) select.add(new Option(label, value));
    select.value = initial;
    select.addEventListener('change', () => change(select.value));
    field.append(select);
    return field;
  }

  function indexVisits(observations, population) {
    const index = new Map();
    for (const obs of observations) {
      let visits = index.get(obs.id);
      if (!visits) {
        visits = new Map();
        index.set(obs.id, visits);
      }
      // A specimen may contain other populations but no observations in the selected one.
      if (!visits.has(obs.visit)) visits.set(obs.visit, null);
      if (obs.population === population && obs.cells > 0) visits.set(obs.visit, obs);
    }
    return index;
  }

  function visitMark(entry) {
    const present = Boolean(entry);
    const label = present
      ? 'Observed'
      : entry === null
        ? 'Population absent from summary'
        : 'No specimen recorded';
    const mark = node('span', 'pe-mark pe-' + (present ? 'yes' : entry === null ? 'partial' : 'no'));
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', label);
    mark.title = label;
    return mark;
  }

  function status(entry) {
    return entry === undefined
      ? 'No specimen recorded'
      : entry === null
        ? 'Population absent from summary'
        : 'Observed';
  }

  function pageControls(page, pageCount, onPage) {
    const pager = node('div', 'pe-pages');
    const prev = makeButton('Previous', 'pe-step', () => onPage(page - 1));
    const next = makeButton('Next', 'pe-step', () => onPage(page + 1));
    prev.disabled = page === 0;
    next.disabled = page >= pageCount - 1;
    pager.append(prev, node('span', 'pe-page-number', page + 1 + ' / ' + pageCount), next);
    return pager;
  }

  function renderPeople(container, model, actions = {}) {
    const old = previousViews.get(container);
    const state =
      old && old.study === model.participants
        ? old
        : {
            study: model.participants,
            arm: '',
            coverage: '',
            query: '',
            page: 0,
          };
    const prefix = 'pe-' + ++nextId;
    const { participants, arms, visits, population, feature } = model;
    const selected = [...new Set(model.selectedVisits)];
    const analysisArms = new Set(model.analysisArms);
    const index = indexVisits(model.observations, population);
    const shownVisits = visits.length <= 5 ? visits : selected;
    const unused = new Map();
    if (model.filterArm !== undefined && model.filterArm !== state.requestedArm) {
      state.arm = model.filterArm;
      state.requestedArm = model.filterArm;
    }
    if (model.query !== undefined && model.query !== state.requestedQuery) {
      state.query = model.query;
      state.requestedQuery = model.query;
    }
    if (!arms.includes(state.arm)) state.arm = '';
    const rows = participants.map((person) => {
      const visitsByPerson = index.get(person.id) || unused;
      const observed = selected.map((v) => visitsByPerson.get(v));
      const inArm = analysisArms.has(person.arm);
      const covered = inArm && selected.length > 0 && observed.every(Boolean);
      const cells = observed.reduce((sum, obs) => sum + (obs?.cells || 0), 0);
      return { person, visitsByPerson, inArm, covered, cells };
    });
    previousViews.set(container, state);

    const root = node('section', 'pe card');
    root.setAttribute('aria-labelledby', prefix + '-title');
    const head = node('div', 'pe-head');
    const title = node('h2', '', 'Visit coverage');
    title.id = prefix + '-title';
    head.append(
      title,
      node('p', 'pe-sub', [population, selected.join(' and ')].filter(Boolean).join(' · ')),
    );
    const filters = node('div', 'pe-filters');
    const searchField = node('label', 'pe-control pe-search');
    searchField.append(node('span', 'pe-label', 'Participant ID'));
    const input = node('input', 'pe-input');
    input.type = 'search';
    input.placeholder = 'Search participants';
    input.value = state.query;
    searchField.append(input);
    const groupSelect = makeSelect(
      'Group',
      [['', 'All groups'], ...arms.map((a) => [a, a])],
      state.arm,
      (value) => {
        state.arm = value;
        state.page = 0;
        update();
      },
    );
    const coverageSelect = makeSelect(
      'Coverage',
      [
        ['', 'All participants'],
        ['included', 'Eligible by coverage'],
        ['missing', 'Incomplete coverage'],
        ['outside', 'Outside selected groups'],
      ],
      state.coverage,
      (value) => {
        state.coverage = value;
        state.page = 0;
        update();
      },
    );
    filters.append(searchField, groupSelect, coverageSelect);
    const scroller = node('div', 'pe-scroll');
    const table = node('table', 'pe-table');
    table.setAttribute('aria-label', 'Participant visit coverage');
    const tableHead = table.createTHead().insertRow();
    ['Participant', 'Group', ...shownVisits, 'Cells¹', 'Coverage'].forEach((header) => {
      const th = node('th', '', header);
      th.scope = 'col';
      tableHead.append(th);
    });
    const body = table.createTBody();
    scroller.append(table);
    const footer = node('div', 'pe-footer'),
      range = node('p', 'pe-range');
    range.setAttribute('aria-live', 'polite');
    const pager = node('div');
    footer.append(range, pager);
    const legend = node('div', 'pe-legend');
    for (const [entry, label] of [
      [true, 'Observed'],
      [null, 'Population unobserved'],
      [undefined, 'Specimen unrecorded'],
    ]) {
      const k = node('span', 'pe-key');
      const mark = visitMark(entry);
      mark.setAttribute('aria-hidden', 'true');
      k.append(mark, node('span', '', label));
      legend.append(k);
    }
    const note = node(
      'p',
      'pe-note',
      '¹ Cells in the selected population and visits. Coverage describes specimen availability. Fitted counts can vary by feature.',
    );
    const extras = node('div', 'pe-notes');
    extras.append(legend, note);
    root.append(head, filters, scroller, footer, extras);
    container.replaceChildren(root);

    function update() {
      const needle = state.query.trim().toLocaleLowerCase();
      const visible = rows.filter(
        (r) =>
          (!needle || String(r.person.id).toLocaleLowerCase().includes(needle)) &&
          (!state.arm || r.person.arm === state.arm) &&
          (!state.coverage ||
            (state.coverage === 'included' && r.covered) ||
            (state.coverage === 'missing' && r.inArm && !r.covered) ||
            (state.coverage === 'outside' && !r.inArm)),
      );
      const pages = Math.max(1, Math.ceil(visible.length / recordsPerPage));
      state.page = Math.max(0, Math.min(state.page, pages - 1));
      const first = state.page * recordsPerPage;
      body.replaceChildren();
      visible.slice(first, first + recordsPerPage).forEach((record) => {
        const tr = body.insertRow();
        const id = node('th');
        id.scope = 'row';
        const open = makeButton(String(record.person.id), 'pe-person', () => openParticipant(record));
        open.setAttribute('aria-label', 'Inspect participant ' + record.person.id);
        id.append(open);
        tr.append(id);
        const group = tr.insertCell();
        const badge = node('span', 'pe-group', record.person.arm);
        badge.classList.toggle('pe-second', arms.indexOf(record.person.arm) === 1);
        group.append(badge);
        shownVisits.forEach((v) => tr.insertCell().append(visitMark(record.visitsByPerson.get(v))));
        tr.insertCell().append(node('span', 'pe-num', counts.format(record.cells)));
        const label = record.covered ? 'Eligible' : record.inArm ? 'Incomplete' : 'Outside groups';
        tr.insertCell().append(
          node(
            'span',
            'pe-status pe-' + (record.covered ? 'covered' : record.inArm ? 'incomplete' : 'outside'),
            label,
          ),
        );
      });
      if (!visible.length) {
        const td = body.insertRow().insertCell();
        td.colSpan = shownVisits.length + 4;
        td.className = 'pe-empty';
        td.textContent = 'No participants match these filters.';
      }
      const last = Math.min(first + recordsPerPage, visible.length);
      range.textContent = visible.length
        ? first + 1 + '–' + last + ' of ' + counts.format(visible.length) + ' participants'
        : '0 participants';
      pager.replaceChildren();
      if (pages > 1) {
        const move = (page) => {
          state.page = page;
          update();
          const preferred = page > 0 ? 'button:first-child' : 'button:last-child';
          pager.querySelector(preferred)?.focus();
        };
        pager.append(pageControls(state.page, pages, move));
      }
    }

    function openParticipant(record) {
      const dialog = node('dialog', 'pe-detail');
      const title = node('h2', '', String(record.person.id));
      title.id = prefix + '-detail-title';
      dialog.setAttribute('aria-labelledby', title.id);
      const heading = node('div', 'pe-dialog-head');
      const titleBlock = node('div');
      titleBlock.append(node('p', 'pe-dialog-label', 'Participant'), title);
      const close = makeButton('Close', 'pe-close', () => dialog.close());
      heading.append(titleBlock, close);
      const context = node('p', 'pe-dialog-sub', record.person.arm + ' · ' + population);
      const panel = node('div', 'pe-scroll');
      const detail = node('table', 'pe-table pe-detail-table');
      const thead = detail.createTHead().insertRow();
      for (const h of ['Visit', 'Status', 'Cells', feature.label]) {
        const th = node('th', '', h);
        th.scope = 'col';
        thead.append(th);
      }
      const detailBody = detail.createTBody();
      panel.append(detail);
      const nav = node('div', 'pe-detail-nav');
      const totalPages = Math.max(1, Math.ceil(visits.length / recordsPerPage));
      function detailPage(page) {
        detailBody.replaceChildren();
        visits.slice(page * recordsPerPage, (page + 1) * recordsPerPage).forEach((v) => {
          const obs = record.visitsByPerson.get(v);
          const tr = detailBody.insertRow();
          const th = node('th', '', v);
          th.scope = 'row';
          tr.append(th);
          tr.insertCell().textContent = status(obs);
          tr.insertCell().textContent = obs ? counts.format(obs.cells) : '—';
          const val = obs?.scores?.[feature.id];
          tr.insertCell().textContent = Number.isFinite(val) ? scores.format(val) : '—';
        });
        nav.replaceChildren();
        if (totalPages > 1) nav.append(pageControls(page, totalPages, detailPage));
      }
      detailPage(0);
      dialog.append(heading, context, panel, nav);
      root.append(dialog);
      dialog.addEventListener('close', () => dialog.remove(), { once: true });
      dialog.showModal();
      close.focus();
      if (typeof actions.onParticipant === 'function') actions.onParticipant(record.person.id);
    }

    input.addEventListener('input', () => {
      state.query = input.value;
      state.page = 0;
      update();
    });
    update();
    if (model.initialId !== undefined) {
      const initial = rows.find((record) => record.person.id === model.initialId);
      if (initial) openParticipant(initial);
    }
  }

  globalThis.renderPeople = renderPeople;
})();

(() => {
  'use strict';

  const sorting = new WeakMap();
  const formatDecimal = new Intl.NumberFormat('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const signed = (n) =>
    Number.isFinite(n) ? (n < 0 ? '−' : n > 0 ? '+' : '') + formatDecimal.format(Math.abs(n)) : '—';
  const bound = (n) => (n === Infinity ? '∞' : n === -Infinity ? '−∞' : signed(n));
  const interval = (row) =>
    row.lo === null ||
    row.lo === undefined ||
    Number.isNaN(row.lo) ||
    row.hi === null ||
    row.hi === undefined ||
    Number.isNaN(row.hi)
      ? '—'
      : bound(row.lo) + ' to ' + bound(row.hi);
  function probability(n) {
    if (!Number.isFinite(n)) return '—';
    if (n === 0) return '0';
    return n < 0.001 ? n.toExponential(1).replace('e-', 'e−') : n.toFixed(3);
  }
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderResults(container, model, actions) {
    const isMean = !model.reference && Boolean(model.isMean);
    const currentFocus = container.contains(document.activeElement)
      ? document.activeElement.dataset.resultFocus
      : undefined;
    const sort = sorting.get(container) || { key: '', ascending: true };
    const source = Array.isArray(model.rows) ? model.rows : [];
    const selected = source.find((row) => row.id === model.selected) || source[0];
    const rows = [...source];
    const available = model.reference
      ? ['label', 'estimate', 'p', 'q', 'n']
      : ['label', 'estimate', 'n'];
    if (available.includes(sort.key)) {
      rows.sort((a, b) => {
        if (sort.key === 'label') return a.label.localeCompare(b.label) * (sort.ascending ? 1 : -1);
        const x = a[sort.key],
          y = b[sort.key];
        if (!Number.isFinite(x)) return Number.isFinite(y) ? 1 : 0;
        if (!Number.isFinite(y)) return -1;
        return (x - y) * (sort.ascending ? 1 : -1);
      });
    }
    const layout = el('div', 'results-layout');
    const card = el('section', 'card results-table-card');
    const heading = el('div', 'section-head result-head');
    const left = el('div');
    left.append(
      el(
        'h2',
        '',
        model.reference ? 'Feature estimates' : isMean ? 'Participant means' : 'Descriptive contrasts',
      ),
    );
    heading.append(left);
    const exportButton = el('button', 'btn small', 'Export CSV');
    exportButton.type = 'button';
    exportButton.dataset.resultFocus = 'export';
    exportButton.disabled = source.length === 0;
    exportButton.addEventListener('click', actions.onExport);
    heading.append(exportButton);
    card.append(heading);

    const scroller = el('div', 'results-scroll');
    const table = el('table', 'results-table');
    table.setAttribute(
      'aria-label',
      model.reference
        ? 'Feature estimates and uncertainty'
        : isMean
          ? 'Participant means by feature'
          : 'Descriptive participant-level contrasts',
    );
    const header = table.createTHead().insertRow();
    function createColumn(key, name) {
      const th = el('th');
      th.scope = 'col';
      if (!available.includes(key)) {
        th.textContent = name;
        header.append(th);
        return;
      }
      const sorted = sort.key === key;
      if (sorted) th.setAttribute('aria-sort', sort.ascending ? 'ascending' : 'descending');
      const button = el('button', 'sort-head');
      button.type = 'button';
      button.title = 'Sort by ' + name;
      button.dataset.resultFocus = 'sort-' + key;
      const glyph = el('span', 'sort-arrow', sorted ? (sort.ascending ? '↑' : '↓') : '↕');
      glyph.setAttribute('aria-hidden', 'true');
      button.append(document.createTextNode(name), glyph);
      button.addEventListener('click', () => {
        sorting.set(container, {
          key,
          ascending: sorted ? !sort.ascending : key !== 'n' && key !== 'estimate',
        });
        renderResults(container, model, actions);
      });
      th.append(button);
      header.append(th);
    }
    createColumn('label', 'Feature');
    createColumn('estimate', model.reference ? 'Estimate' : isMean ? 'Mean' : 'Difference');
    if (model.reference) {
      createColumn('ci', '95% CI');
      createColumn('p', 'p');
      createColumn('q', 'FDR');
    }
    createColumn('n', 'n');
    const body = table.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      if (row.id === selected?.id) tr.classList.add('chosen-feature');
      const nameCell = el('th', 'feature-cell');
      nameCell.scope = 'row';
      const featureButton = el('button', 'feature-link', row.label);
      featureButton.type = 'button';
      featureButton.dataset.resultFocus = 'feature-' + row.id;
      featureButton.setAttribute('aria-pressed', String(row.id === selected?.id));
      function selectRow() {
        actions.onSelect(row.id);
      }
      featureButton.addEventListener('click', selectRow);
      tr.addEventListener('click', (event) => {
        if (!featureButton.contains(event.target)) selectRow();
      });
      nameCell.append(featureButton);
      tr.append(nameCell);
      tr.append(el('td', 'result-number', signed(row.estimate)));
      if (model.reference) {
        tr.append(
          el('td', 'result-interval', interval(row)),
          el('td', 'result-number', probability(row.p)),
          el('td', 'result-number', probability(row.q)),
        );
      }
      tr.append(el('td', 'result-number', Number.isFinite(row.n) ? String(row.n) : '—'));
    }
    if (!source.length) {
      const td = el('td', 'result-empty', 'No features are available for this comparison.');
      td.colSpan = header.cells.length;
      body.insertRow().append(td);
    }
    scroller.append(table);
    card.append(scroller);
    const foot = el(
      'p',
      'result-foot muted',
      model.reference
        ? 'n = contributing participants. FDR is reported across the tested features.'
        : isMean
          ? 'Each participant contributes one summary at the selected visit.'
          : 'Differences are calculated from the imported participant summaries.',
    );
    card.append(foot);
    layout.append(card);

    if (selected) {
      const detail = el('section', 'card result-detail');
      const group = el('div', 'result-detail-top');
      const name = el('div');
      name.append(el('span', 'detail-kicker', 'Selected feature'), el('h2', '', selected.label));
      group.append(name);
      const trace = el('button', 'btn small', 'View trajectory');
      trace.type = 'button';
      trace.dataset.resultFocus = 'trace';
      trace.addEventListener('click', () => actions.onShowOverview(selected.id));
      group.append(trace);
      detail.append(group);
      const facts = el('dl', 'detail-facts');
      function fact(label, value, special) {
        const div = el('div', special ? 'fact feature-estimate' : 'fact');
        div.append(el('dt', '', label), el('dd', '', value));
        facts.append(div);
      }
      fact(
        model.reference ? 'Estimate' : isMean ? 'Participant mean' : 'Descriptive difference',
        signed(selected.estimate),
        true,
      );
      if (model.reference) fact('95% confidence interval', interval(selected));
      fact('Participants', Number.isFinite(selected.n) ? String(selected.n) : '—');
      if (model.unit) fact('Units', model.unit);
      detail.append(facts);
      if (model.contrast) {
        const contrast = el('div', 'selected-contrast');
        contrast.append(el('span', '', isMean ? 'Summary' : 'Contrast'), el('p', '', model.contrast));
        detail.append(contrast);
      }
      layout.append(detail);
    }
    container.replaceChildren(layout);
    if (currentFocus)
      Array.from(container.querySelectorAll('[data-result-focus]'))
        .find((node) => node.dataset.resultFocus === currentFocus)
        ?.focus({ preventScroll: true });
  }
  globalThis.renderResults = renderResults;
})();

(() => {
  'use strict';

  const storageVersion = 1;
  const prefix = 'sctrial.pinned-contrasts.v1.';
  const icons = {
    pin: 'M16 3l5 5-3 1-4 5v3l-2 2-3-5-5-3 2-2h3l5-4zM8 16l-5 5',
    pencil: 'M14 5l5 5M4 20l5-1L21 7l-5-5L4 14z',
    close: 'M7 7l10 10M17 7L7 17',
    open: 'M5 12h13m-5-5 5 5-5 5',
    swap: 'M3 8h16m-4-4 4 4-4 4M21 16H5m4-4-4 4 4 4',
  };

  function el(name, className, text) {
    const node = document.createElement(name);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function shape(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    Object.entries({
      viewBox: '0 0 24 24',
      width: '15',
      height: '15',
      fill: 'none',
      stroke: 'currentColor',
      'stroke-width': '1.7',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      'aria-hidden': 'true',
    }).forEach(([key, value]) => svg.setAttribute(key, value));
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', icons[name]);
    svg.append(path);
    return svg;
  }

  function button(text, style, click, glyph) {
    const node = el('button', 'cbench-button ' + style);
    node.type = 'button';
    if (glyph) node.append(shape(glyph));
    if (text) node.append(document.createTextNode(text));
    node.addEventListener('click', click);
    return node;
  }

  function iconButton(label, glyph, click) {
    const node = button('', 'cbench-icon', click, glyph);
    node.setAttribute('aria-label', label);
    node.title = label;
    return node;
  }

  function numberToken(v) {
    if (Number.isNaN(v)) return '__sctrial_nan__';
    if (v === Infinity) return '__sctrial_inf__';
    if (v === -Infinity) return '__sctrial_negative_inf__';
    return v;
  }
  const encode = (value) =>
    JSON.stringify(value, (_, v) =>
      typeof v === 'number' && !Number.isFinite(v) ? { $sctrialNumber: numberToken(v) } : v,
    );
  const decode = (value) =>
    JSON.parse(value, (_, v) => {
      if (!v || typeof v !== 'object' || Object.keys(v).length !== 1) return v;
      switch (v.$sctrialNumber) {
        case '__sctrial_nan__':
          return NaN;
        case '__sctrial_inf__':
          return Infinity;
        case '__sctrial_negative_inf__':
          return -Infinity;
        default:
          return v;
      }
    });
  const clone = (v) => (typeof structuredClone === 'function' ? structuredClone(v) : decode(encode(v)));
  const dict = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function stable(v) {
    if (Array.isArray(v)) return v.map(stable);
    if (!dict(v)) return v;
    return Object.fromEntries(
      Object.keys(v)
        .sort()
        .map((k) => [k, stable(v[k])]),
    );
  }

  const signatures = new WeakMap();
  function fingerprint(s) {
    if (!signatures.has(s)) {
      // Plot mode and highlighted feature travel with a pin when it is reopened.
      // The fitted comparison is identified by its study design and feature panel.
      const spec = { ...s.spec };
      delete spec.mode;
      delete spec.feature;
      const rows = [...s.rows].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
      signatures.set(s, encode(stable([spec, s.unit, s.method || '', rows])));
    }
    return signatures.get(s);
  }

  function isSnapshot(s) {
    if (!dict(s) || !dict(s.spec) || !Array.isArray(s.rows) || !s.rows.length) return false;
    const ids = new Set();
    return s.rows.every((row) => {
      if (!dict(row) || typeof row.id !== 'string' || !row.id || ids.has(row.id)) return false;
      ids.add(row.id);
      return true;
    });
  }

  function readSaved(key) {
    try {
      const raw = localStorage.getItem(prefix + key);
      if (!raw) return {};
      const saved = decode(raw);
      if (!dict(saved) || saved.version !== storageVersion || !Array.isArray(saved.pins)) return {};
      const seen = new Set();
      const valid = saved.pins.filter((p) => {
        if (
          !dict(p) ||
          typeof p.id !== 'string' ||
          !p.id ||
          seen.has(p.id) ||
          typeof p.name !== 'string' ||
          !isSnapshot(p.snapshot)
        )
          return false;
