    let legendX = 2;
    index.arms.forEach((arm, i) => {
      const room = Math.min(145, (w - 8) / Math.max(1, index.arms.length));
      node(chart, 'circle', { cx: legendX + 3, cy: 59, r: 3.4, fill: hues[i % hues.length] });
      clipped(chart, legendX + 13, 63, arm, 'ml-note', room - 18);
      legendX += room;
    });
    const cx = w / 2,
      cy = h * 0.54,
      rx = Math.min(w * 0.25, 277),
      ry = Math.min(h * 0.285, 145);
    for (const r of [0.45, 0.76, 1])
      node(chart, 'ellipse', { cx, cy, rx: rx * r, ry: ry * r, class: 'ml-orbit' });
    const match = new Map();
    for (const f of s.config.study.features || [])
      if (featureKind(f) === 'gene') {
        for (const sym of [f.id, nameOf(f), f.symbol].filter(Boolean))
          match.set(String(sym).toLowerCase(), f);
      }
    const obs = index.byPopulation.get(pop);
    const readings = (f) =>
      index.participants.flatMap((p) => {
        const v = measurement(obs?.get(key(p.id, visit)), f.id);
        return v === null ? [] : [{ ...p, v }];
      });
    genes.forEach((g, i) => {
      const angle = ((i + 0.27) * Math.PI * 2) / genes.length - Math.PI / 2,
        dx = Math.cos(angle),
        dy = Math.sin(angle);
      const x = cx + rx * dx,
        y = cy + ry * dy,
        dir = dx >= 0 ? 1 : -1;
      const f = match.get(g.toLowerCase()),
        values = f ? readings(f) : [],
        measured = values.length > 0;
      const edge = node(chart, 'path', {
        d:
          'M' +
          cx +
          ' ' +
          cy +
          'Q' +
          (cx + rx * dx * 0.33 - ry * dy * 0.09) +
          ' ' +
          (cy + ry * dy * 0.36 + rx * dx * 0.04) +
          ' ' +
          x +
          ' ' +
          y,
        class: 'ml-member-line',
        pathLength: 1,
        'data-membership': g,
        'aria-hidden': 'true',
      });
      const group = node(chart, 'g', {
        'data-member': g,
        class: 'ml-member' + (measured ? ' ml-measured' : ''),
      });
      node(group, 'circle', { cx: x, cy: y, r: 13, class: 'ml-hit' });
      node(group, 'circle', { cx: x, cy: y, r: 10, class: 'ml-member-ring' });
      node(group, 'circle', { cx: x, cy: y, r: 6, class: 'ml-member-node' });
      const mw = w >= 700 ? 135 : w >= 480 ? 106 : 70;
      const left = Math.max(3, Math.min(w - mw - 3, dir > 0 ? x + 15 : x - 15 - mw)),
        right = left + mw;
      clipped(
        group,
        dir > 0 ? left : right,
        y - 12,
        g,
        'ml-member-symbol',
        mw,
        dir > 0 ? 'start' : 'end',
      );
      const detail =
        g +
        ' · ' +
        nameOf(active) +
        ' member · ' +
        values.length +
        ' participants with measured expression at ' +
        visit +
        ' · ' +
        pop;
      inspect(
        s,
        group,
        detail,
        () => {
          selectMark(s, detail, group);
          chart
            .querySelectorAll('.ml-edge-picked')
            .forEach((e) => e.classList.remove('ml-edge-picked'));
          edge.classList.add('ml-edge-picked');
          if (f && measured && s.config.onAnalyze)
            s.insight.append(
              button('Analyze ' + nameOf(f), () => s.config.onAnalyze(f.id), 'ml-insight-link'),
            );
        },
        x,
        y,
      );
      group.onpointerenter = () => edge.classList.add('ml-edge-hot');
      group.onpointerleave = () => edge.classList.remove('ml-edge-hot');
      if (!measured) {
        clipped(
          chart,
          dir > 0 ? left : right,
          y + 6,
          'No expression',
          'ml-note',
          mw,
          dir > 0 ? 'start' : 'end',
        );
        return;
      }
      const sorted = values.slice().sort((a, b) => a.v - b.v),
        extent = [sorted[0].v, sorted[sorted.length - 1].v];
      const shown =
        sorted.length <= 32
          ? sorted
          : Array.from(
              { length: 32 },
              (_, j) => sorted[Math.round((j * (sorted.length - 1)) / 31)],
            );
      line(chart, left, y, right, y, 'ml-micro-axis');
      for (const item of shown) {
        const xx =
          extent[1] === extent[0]
            ? (left + right) / 2
            : left + ((item.v - extent[0]) / (extent[1] - extent[0])) * mw;
        const arm = index.arms.indexOf(item.arm),
          yy = y + (arm % 2 === 0 ? -2.4 : 2.4);
        const mark = node(chart, 'g', {
          'data-micro-reading': g,
          'data-id': item.id,
          'data-value': item.v,
        });
        node(mark, 'circle', { cx: xx, cy: yy, r: 4, class: 'ml-hit' });
        node(mark, 'circle', {
          cx: xx,
          cy: yy,
          r: 2.6,
          fill: hues[arm % hues.length],
          class: 'ml-micro-point',
        });
        const raw =
          item.id +
          ' · ' +
          item.arm +
          ' · ' +
          g +
          ' · ' +
          exact(item.v) +
          ' ' +
          unitOf(f) +
          ' · ' +
          visit;
        inspect(s, mark, raw, () => selectMark(s, raw, mark), xx, yy);
      }
      const range = fmt(extent[0], 3) + '–' + fmt(extent[1], 3);
      clipped(
        chart,
        dir > 0 ? left : right,
        y + 17,
        w < 480 ? 'n = ' + values.length : range + '  ·  n = ' + values.length,
        'ml-micro-n',
        mw + 4,
        dir > 0 ? 'start' : 'end',
      );
    });
    const observed = readings(active),
      mean = observed.length ? observed.reduce((sum, p) => sum + p.v / observed.length, 0) : null;
    const radius = Math.min(58, Math.max(38, w * 0.095));
    const hub = node(chart, 'g', { 'data-hub-mean': mean ?? '', 'data-n': observed.length });
    node(hub, 'circle', { cx, cy, r: radius + 6, class: 'ml-core-ring' });
    node(hub, 'circle', { cx, cy, r: radius, fill: 'url(#' + s.uid + '-core)', class: 'ml-core' });
    label(hub, cx, cy - 13, 'Score mean', 'ml-core-label', 'middle');
    clipped(hub, cx, cy + 9, fmt(mean, 4), 'ml-core-n', radius * 1.8, 'middle');
    label(hub, cx, cy + 27, 'n = ' + observed.length, 'ml-core-label', 'middle');
    const detail =
      nameOf(active) +
      ' · Participant mean ' +
      (mean === null ? 'unavailable' : exact(mean) + ' ' + unitOf(active)) +
      ' · n = ' +
      observed.length +
      ' at ' +
      visit;
    inspect(s, hub, detail, () => selectMark(s, detail, hub), cx, cy);
    s.caption.textContent =
      'Spokes indicate gene-set membership. The hub is the participant mean of the selected pathway score. Member strips show up to 32 observed participant values on each gene’s own expression scale.';
    if (active.membershipSource?.name)
      s.caption.textContent += ' Gene-set definition from ' + active.membershipSource.name + '.';
    pager(s, 'Members', view.members, listed.length, size, (x) => {
      view.members = x;
    });
  }

  function stableSubset(series, slots) {
    if (series.length <= slots) return series;
    const keep = new Set();
    let low = Infinity,
      high = -Infinity,
      lowRecord,
      highRecord;
    for (const p of series)
      for (const v of p.values)
        if (v !== null) {
          if (v < low) {
            low = v;
            lowRecord = p;
          }
          if (v > high) {
            high = v;
            highRecord = p;
          }
        }
    if (lowRecord) keep.add(lowRecord);
    if (highRecord) keep.add(highRecord);
    for (const { p } of series
      .map((p) => ({ p, n: hash(p.id) }))
      .sort((a, b) => a.n - b.n || compare.compare(a.p.id, b.p.id))) {
      if (keep.size >= slots) break;
      keep.add(p);
    }
    return [...keep];
  }

  function modules(s, w) {
    const { chart, index, pop, visit, active, features, view } = s;
    const compact = w < 520,
      per = w < 500 ? 4 : 6;
    view.lane = Math.min(
      Math.max(0, view.lane || 0),
      Math.max(0, Math.ceil(features.length / per) - 1),
    );
    const fs = features.slice(view.lane * per, (view.lane + 1) * per);
    const observation = index.byPopulation.get(pop);
    const rows = fs.map((f) => {
      const vals = index.participants.flatMap((p) => {
        const v = measurement(observation?.get(key(p.id, visit)), f.id);
        return v === null ? [] : [{ ...p, v, values: [v] }];
      });
      const range = domain(vals.map((p) => p.v));
      return { f, vals, scale: range ? ticks(range) : null };
    });
    const armH = 23,
      firstY = 69,
      rowH = (compact ? 47 : 29) + armH * Math.max(index.arms.length, 1) + 23;
    const h = firstY + rowH * rows.length + 10;
    s.size(w, h);
    label(chart, 2, 20, 'Score distributions', 'ml-chart-title');
    clipped(
      chart,
      2,
      42,
      pop + '  ·  ' + visit + '  ·  Independent scale per score',
      'ml-note',
      w - 6,
    );
    let sampled = false;
    rows.forEach(({ f, vals, scale }, r) => {
      const y = firstY + r * rowH;
      const labelW = compact ? w * 0.65 : Math.min(218, w * 0.205);
      const armX = compact ? 2 : labelW + 14,
        left = compact ? Math.min(97, w * 0.27) : armX + Math.min(94, w * 0.11);
      const right = w - 12,
        rowStart = y + (compact ? 43 : 15);
      const selectedScore = f.id === active.id;
      const head = node(chart, 'g', {
        'data-module-id': f.id,
        'aria-pressed': String(selectedScore),
      });
      node(head, 'rect', {
        x: 0,
        y: y - 12,
        width: labelW,
        height: compact ? 39 : rowH - 8,
        fill: 'transparent',
      });
      if (selectedScore)
        node(head, 'rect', {
          x: 0,
          y: y - 7,
          width: 3,
          height: compact ? 30 : Math.max(27, armH * index.arms.length),
          rx: 1.5,
          fill: '#79e6c5',
        });
      clipped(
        head,
        9,
        y + 8,
        nameOf(f),
        selectedScore ? 'ml-lane-name ml-active' : 'ml-lane-name',
        labelW - 15,
      );
      clipped(head, 9, y + 25, unitOf(f), 'ml-note', labelW - 14);
      inspect(
        s,
        head,
        'Select ' + nameOf(f) + ' · ' + unitOf(f),
        () => {
          if (f.id !== active.id) s.config.onFeature?.(f.id);
          else selectMark(s, nameOf(f) + ' · ' + unitOf(f), head);
        },
        labelW / 2,
        y + 6,
      );
      if (!scale) {
        label(chart, (left + right) / 2, rowStart + 16, 'No measured scores', 'ml-note', 'middle');
        line(chart, 0, y + rowH - 12, w, y + rowH - 12, 'ml-lane-divider');
        return;
      }
      const lo = scale.values[0],
        hi = scale.values[scale.values.length - 1];
      const xx = (v) => left + ((v - lo) / (hi - lo || 1)) * (right - left);
      const axisBottom = rowStart + armH * (index.arms.length - 1) + 12;
      const tickWidth =
        Math.max(...scale.values.map((tick) => scale.format(tick).length * 6.8)) + 8;
      const skip = Math.max(1, Math.ceil((tickWidth * (scale.values.length - 1)) / (right - left)));
      scale.values.forEach((tick, ti) => {
        const x = xx(tick);
        line(chart, x, rowStart - 10, x, axisBottom, 'ml-grid');
        const last = scale.values.length - 1;
        if (ti !== 0 && ti !== last && (ti % skip !== 0 || last - ti < skip)) return;
        const anchor = ti === 0 ? 'start' : ti === last ? 'end' : 'middle';
        label(chart, x, axisBottom + 14, scale.format(tick), 'ml-axis', anchor);
      });
      index.arms.forEach((arm, ai) => {
        const metrics = vals.filter((p) => p.arm === arm).sort((a, b) => a.v - b.v),
          n = metrics.length,
          yy = rowStart + armH * ai,
          shade = hues[ai % hues.length];
        const shown = stableSubset(metrics, 36).sort((a, b) => a.v - b.v);
        if (shown.length < n) sampled = true;
        node(chart, 'circle', { cx: armX + 3, cy: yy, r: 3.2, fill: shade });
        clipped(
          chart,
          armX + 12,
          yy + 4,
          arm + ' · ' + (n > shown.length ? shown.length + '/' + n : n),
          'ml-arm-n',
          left - armX - 15,
        );
        if (!n) return;
        line(chart, left, yy, right, yy, 'ml-lane-axis');
        const mid = Math.floor(n / 2),
          median = n % 2 ? metrics[mid].v : metrics[mid - 1].v / 2 + metrics[mid].v / 2;
        const mx = xx(median),
          med = node(chart, 'g', { 'data-median': f.id, 'data-arm': arm, 'data-value': median });
        line(med, mx, yy - 9, mx, yy + 9, 'ml-median-halo');
        line(med, mx, yy - 9, mx, yy + 9, 'ml-median');
        const packed = [];
        for (const d of shown) {
          const x = xx(d.v),
            neighbor = packed.filter((v) => x - v.x < 7);
          const lane =
            [0, -4.6, 4.6, -7, 7].find((dy) =>
              neighbor.every((v) => Math.hypot(x - v.x, dy - v.dy) > 5.8),
            ) ?? 0;
          const py = yy + lane;
          packed.push({ x, dy: lane });
          const mark = node(chart, 'g', {
            'data-reading': '',
            'data-id': d.id,
            'data-feature': f.id,
            'data-visit': visit,
            'data-value': d.v,
            class: 'ml-reading',
          });
          node(mark, 'circle', { cx: x, cy: py, r: 4.3, class: 'ml-hit' });
          node(mark, 'circle', { cx: x, cy: py, r: 3.3, fill: shade, class: 'ml-score-point' });
          const desc =
            d.id +
            ' · ' +
            arm +
            ' · ' +
            visit +
            ' · ' +
            nameOf(f) +
            ' · ' +
            exact(d.v) +
            ' ' +
            unitOf(f);
          inspect(s, mark, desc, () => selectMark(s, desc, mark), x, py);
        }
      });
      line(chart, 0, y + rowH - 12, w, y + rowH - 12, 'ml-lane-divider');
    });
    s.caption.textContent =
      'One point per measured participant. The white notch marks the arm median. Each score has its own numeric axis.' +
      (sampled
        ? ' Up to 36 individuals per arm and score are shown. Medians use all measured participants.'
        : '');
    pager(s, 'Scores', view.lane, features.length, per, (x) => {
      view.lane = x;
    });
  }

  function pathwayScores(s, w) {
    const { chart, index, active, pop } = s,
      dates = index.visits;
    const by = index.byPopulation.get(pop),
      palette = (arm) => hues[index.arms.indexOf(arm) % hues.length];
    const series = index.participants
      .map((p) => ({
        ...p,
        values: dates.map((v) => measurement(by?.get(key(p.id, v)), active.id)),
      }))
      .filter((p) => p.values.some((v) => v !== null));
    const all = series.flatMap((p) => p.values),
      extent = domain(all);
    const h = w < 500 ? 362 : Math.min(520, Math.max(360, (window.innerHeight || 800) - 325));
    s.size(w, h);
    label(chart, 2, 20, 'Pathway scores by visit', 'ml-chart-title');
    clipped(
      chart,
      2,
      42,
      nameOf(active) + '  ·  ' + unitOf(active) + '  ·  ' + pop,
      'ml-note',
      w - 6,
    );
    if (!extent) {
      label(
        chart,
        w / 2,
        h * 0.55,
        'No measured scores for this population',
        'ml-empty-copy',
        'middle',
      );
      s.caption.textContent = 'Missing measurements contribute no points.';
      return;
    }
    const scale = ticks(extent);
    const span = Math.max(1, Math.min(dates.length, w < 480 ? 5 : 9));
    s.view.visitPage = Math.min(
      Math.max(0, s.view.visitPage),
      Math.max(0, Math.ceil(dates.length / span) - 1),
    );
    const first = s.view.visitPage * span,
      selected = dates.slice(first, first + span);
    const left = Math.max(
        45,
        Math.max(...scale.values.map((v) => scale.format(v).length * 7)) + 12,
      ),
      right = w - 12,
      top = 82,
      bottom = h - 52;
    const column = (right - left) / selected.length,
      xs = selected.map((_, i) => left + column * (i + 0.5)),
      y = (v) => scale.y(v, top + 5, bottom - 5);
    for (const tick of scale.values) {
      const yy = y(tick);
      line(chart, left, yy, right, yy, 'ml-grid');
      label(chart, left - 8, yy + 4, scale.format(tick), 'ml-axis', 'end');
    }
    selected.forEach((v, i) => {
      line(chart, xs[i], top, xs[i], bottom, 'ml-visit-line');
      clipped(chart, xs[i], bottom + 21, v, 'ml-visit', column - 4, 'middle');
      label(
        chart,
        xs[i],
        bottom + 39,
        'n = ' + series.filter((p) => p.values[first + i] !== null).length,
        'ml-note',
        'middle',
      );
    });
    const shown = index.arms.flatMap((a) =>
      stableSubset(
        series.filter((p) => p.arm === a),
        35,
      ),
    );
    let lx = left;
    for (const a of index.arms) {
      const count = series.filter((p) => p.arm === a).length;
      if (!count) continue;
      const legend = a + ' · ' + count;
      const room = Math.min(140, (right - left) / index.arms.length - 10);
      node(chart, 'circle', { cx: lx + 3, cy: 61, r: 3.5, fill: palette(a) });
      clipped(chart, lx + 13, 65, legend, 'ml-note', room - 12);
      lx += room + 10;
    }
    const points = node(chart, 'g', {});
    shown.forEach((p) => {
      const selectedValues = p.values.slice(first, first + selected.length),
        arm = index.arms.indexOf(p.arm);
      const stroke = palette(p.arm);
      const offset = ((arm + 0.5) / index.arms.length - 0.5) * column * 0.72;
      const jitter = ((hash(p.id) % 101) / 100 - 0.5) * Math.min(12, column * 0.09);
      const xx = (i) => xs[i] + offset + jitter;
      selectedValues.forEach((v, i) => {
        if (v === null) return;
        const x = xx(i),
          yy = y(v),
          visit = selected[i];
        const mark = node(points, 'g', {
          'data-reading': '',
          'data-id': p.id,
          'data-visit': visit,
          'data-value': v,
          class: 'ml-reading',
        });
        node(mark, 'circle', { cx: x, cy: yy, r: 8, class: 'ml-hit' });
        node(mark, 'circle', { cx: x, cy: yy, r: 4, fill: stroke, class: 'ml-score-point' });
        const detail =
          p.id + ' · ' + p.arm + ' · ' + visit + ' · ' + exact(v) + ' ' + unitOf(active);
        inspect(s, mark, detail, () => selectMark(s, detail, mark), x, yy);
      });
    });
    s.caption.textContent =
      'Points are measured participant scores.' +
      (shown.length < series.length
        ? ' Showing ' +
          shown.length +
          ' of ' +
          series.length +
          ' participants. Visit counts include all measured participants.'
        : ' Visit counts include only participants with a measured score.');
    pager(s, 'Visits', s.view.visitPage, dates.length, span, (x) => {
      s.view.visitPage = x;
    });
  }

  function dispose(host) {
    const s = sessions.get(host);
    if (!s) return;
    s.observer?.disconnect();
    window.removeEventListener('resize', s.resize);
    s.abort?.abort();
    sessions.delete(host);
  }

  function render(host, config) {
    if (!host || !config?.study || !kinds[config.mode]) return;
    const old = sessions.get(host),
      reuse = old && old.config.study === config.study;
    const index = reuse ? old.index : studyIndex(config.study);
    const mode = config.mode;
    const view =
      reuse && old.config.mode === mode ? old.view : { row: 0, col: 0, members: 0, visitPage: 0 };
    const features = (config.study.features || []).filter(
      (f) => featureKind(f) === kinds[mode] || (mode === 'modules' && featureKind(f) === 'score'),
    );
    const wanted =
      typeof config.selectedFeature === 'object'
        ? config.selectedFeature?.id
        : config.selectedFeature;
    const active = features.find((f) => f.id === wanted) || features[0];
    const featureChanged = !old || old.active?.id !== active?.id;
    dispose(host);
    const root = html('section', 'ml-stage ml-' + mode);
    const top = html('header', 'ml-header'),
      titles = html('div', 'ml-titles');
    titles.append(
      html(
        'div',
        'ml-source',
        config.source || config.study.study?.source || config.study.source || 'Study',
      ),
    );
    const generic = mode === 'modules' && active && featureKind(active) === 'score';
    titles.append(html('h1', 'ml-title', generic ? 'Recorded scores' : names[mode]));
    top.append(titles);
    root.append(top);
    host.replaceChildren(root);
    const s = {
      config,
      mode,
      view,
      index,
      features,
      active,
      root,
      uid: 'ml-' + ++sequence,
      abort: new AbortController(),
    };
    sessions.set(host, s);
    if (!active) {
      const empty = html('div', 'ml-empty');
      const what = {
        genes: 'gene-expression measurements',
        pathways: 'pathway scores or gene-set definitions',
        modules: 'module or recorded scores',
      }[mode];
      empty.append(html('h2', '', 'This study has no ' + what + '.'));
      const help = {
        genes: 'Open an H5AD with selected genes, or a participant-level CSV with gene: columns.',
        pathways: 'Map a measured score named pathway:NAME in a CSV or H5AD study.',
        modules: 'Open a study with module scores or numeric participant-level measurements.',
      }[mode];
      empty.append(html('p', '', help));
      if (config.onOpenStudy)
        empty.append(button('Open study', () => config.onOpenStudy(), 'ml-action'));
      root.append(empty);
      return;
    }
    config.onDisplayedFeature?.(active.id);
    s.pop = index.pops.includes(config.selectedPopulation)
      ? config.selectedPopulation
      : index.pops[0];
    s.visit = index.visits.includes(config.selectedVisit) ? config.selectedVisit : index.visits[0];
    const memberLens =
      mode === 'pathways' &&
      Array.isArray(active.members) &&
      active.members.some((g) => String(g).trim());
    const controls = html('div', 'ml-controls');
    controls.append(
      selectControl(
        mode === 'genes' ? 'Gene' : mode === 'pathways' ? 'Pathway' : 'Score',
        features.map((f) => ({
          id: f.id,
          label:
            nameOf(f) +
            (mode === 'modules' && featureKind(f) === 'score' ? ' · recorded score' : ''),
        })),
        active.id,
        config.onFeature,
      ),
    );
    if (index.pops.length)
      controls.append(
        selectControl(
          'Cell population',
          index.pops.map((id) => ({ id, label: id })),
          s.pop,

    }
    const figure = html('figure', 'ml-figure');

    s.insight = html('p', 'ml-insight');
    s.insight.setAttribute('role', 'status');
    s.insight.setAttribute('aria-live', 'polite');

      firstDraw = true;
    s.size = (w, h) => {
      chart.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      chart.setAttribute('height', h);
    };
    s.redraw = (force = false) => {
      const w = Math.max(220, Math.round(figure.getBoundingClientRect().width));
      if (!force && lastSize === w + 'x' + window.innerHeight) return;
      lastSize = w + 'x' + window.innerHeight;
      const focus = chart.contains(document.activeElement)
        ? document.activeElement.getAttribute('aria-label')
        : null;
      s.abort.abort();
      s.abort = new AbortController();
      s.items = [];
      s.columns = 1;
      chart.replaceChildren();
      defs(chart, s.uid);
      s.actions.replaceChildren();
      s.insight.textContent = '';
      tip.hidden = true;
      if (mode === 'genes') {
        if (firstDraw && featureChanged) {
          const per = Math.max(1, Math.min(9, Math.floor((w - 115) / 83)));
          view.col = Math.floor(features.indexOf(active) / per);
        }
        genes(s, w);
      } else if (memberLens) membership(s, w);
      else if (mode === 'modules') {
        if (firstDraw && featureChanged)
          view.lane = Math.floor(features.indexOf(active) / (w < 500 ? 4 : 6));
        modules(s, w);
      } else pathwayScores(s, w);
      firstDraw = false;
      interactions(s);
      if (focus)
        s.items
          .find((i) => i.item.getAttribute('aria-label') === focus)
          ?.item.focus({ preventScroll: true });
    };
    s.redraw();
    s.resize = () => {
      if (!root.isConnected) {
        dispose(host);
        return;
      }
      s.redraw();
    };
    if (typeof ResizeObserver !== 'undefined') {
      s.observer = new ResizeObserver(s.resize);
      s.observer.observe(figure);
    }
    window.addEventListener('resize', s.resize, { passive: true });
    if (chart.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches)
      chart.animate(
        [
          { opacity: 0.48, transform: 'translateY(3px)' },
          { opacity: 1, transform: 'none' },
        ],
        { duration: 190, easing: 'ease-out' },
      );
  }

  window.SctrialMolecular = Object.freeze({ render, dispose });
})();

(() => {
  'use strict';

  const maxBytes = 16 * 1024 * 1024;
  const maxSets = 30000;
  const maxMembers = 25000;
  const maxOptions = 120;
  const libraries = new WeakMap();

  function parse(text) {
    const records = new Map();
    const lines = text.replace(/^\uFEFF/, '').split(/\r\n|[\r\n]/);
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const [rawName, rawDescription, ...fields] = lines[i].split('\t');
      const name = rawName.trim();
      const description = rawDescription?.trim() || '';
      const error = (message) => new Error('GMT line ' + (i + 1) + '. ' + message);
      if (!name || name.length > 512 || fields.length === 0)
        throw error('Supply a set name, description field and tab-separated gene symbols.');
      if (records.has(name)) throw error('A second set uses the name “' + name + '”.');
      if (records.size >= maxSets) throw error('Use a file with at most 30,000 sets.');
      if (/[\u0000-\u001f\u007f]/.test(name + description))
        throw error('Remove control characters from the name and description.');
      const members = new Set();
      for (const field of fields) {
        const symbol = field.trim();
        if (!symbol) continue;
        if (symbol.length > 256 || /[\s,\u0000-\u001f\u007f]/.test(symbol))
          throw error('Use one gene symbol per tab-separated field.');
        members.add(symbol);
        if (members.size > maxMembers) throw error('Use at most 25,000 distinct members per set.');
      }
      if (!members.size) throw error('Include at least one gene symbol.');
      records.set(name, { name, description, members: [...members] });
    }
    if (!records.size) throw new Error('The file contains no gene sets.');
    return records;
  }

  const content = `
    <form id="geneSetForm">
      <p class="hint">Link gene-set membership to the measured pathway <strong id="geneSetTarget"></strong>. Membership is kept for this open study.</p>
      <label class="field"><span>GMT file</span>
        <input id="geneSetFile" type="file" accept=".gmt,text/plain" class="field-input"></label>
      <p class="hint" id="geneSetStatus" role="status">Choose a local, tab-delimited GMT file.</p>
      <label class="field" id="geneSetSearchBox" hidden><span>Find a set</span>
        <input id="geneSetSearch" type="search" class="field-input" autocomplete="off"></label>
      <label class="field"><span>Gene set</span>
        <select id="geneSetChoice" class="field-input" disabled><option value="">Choose a gene set</option></select></label>
      <p class="hint" id="geneSetPreview" aria-live="polite"></p>
      <div class="error" id="geneSetError" role="alert" hidden></div>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelGeneSet">Cancel</button>
        <button type="submit" class="btn accent" id="applyGeneSet" disabled>Link membership</button>
      </div>
    </form>`;

  function open({ study, featureId, show, close, onChange }) {
    const target = study.features.find((f) => f.id === featureId && f.kind === 'pathway');
    if (!target) {
      show(
        'Link gene set',
        '<p class="hint">Open a study with a measured pathway score column named <code>pathway:NAME</code>.</p>',
      );
      return;
    }
    show('Link gene set', content, 'gene-set');
    const form = document.getElementById('geneSetForm');
    const get = (id) => form.querySelector('#' + id);
    const picker = get('geneSetFile');
    const choice = get('geneSetChoice');
    const search = get('geneSetSearch');
    const preview = get('geneSetPreview');
    const status = get('geneSetStatus');
    const error = get('geneSetError');
    const apply = get('applyGeneSet');
    const name = target.label || target.id;
    let library = libraries.get(study);
    let chosen = null;
    let generation = 0;
    get('geneSetTarget').textContent = name;
    if (target.membershipSource) apply.textContent = 'Replace membership';

    function describe() {
      const set = library?.sets.get(chosen);
      apply.disabled = !set;
      preview.textContent = '';
      if (!set) return;
      const head = set.members.slice(0, 7).join(', ');
      const rest = set.members.length > 7 ? '…' : '';
      const count =
        set.members.length.toLocaleString() + (set.members.length === 1 ? ' member' : ' members');
      const description =
        set.description && !/^n\/?a$/i.test(set.description) ? ' · ' + set.description : '';
      preview.textContent = count + ' · ' + head + rest + description;
    }

    function options() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = [...library.sets.keys()].filter((key) =>
        key.toLocaleLowerCase().includes(query),
      );
      const shown = matches.slice(0, maxOptions);
      if (chosen && !shown.includes(chosen)) shown.unshift(chosen);
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choose a gene set';
      const options = shown.map((key) => {
        const option = document.createElement('option');
        option.value = option.textContent = key;
        return option;
      });
      choice.replaceChildren(placeholder, ...options);
      choice.value = chosen || '';
      choice.disabled = !shown.length;
      if (matches.length > maxOptions)
        status.textContent =
          library.filename +
          ' · Showing the first ' +
          maxOptions +
          ' of ' +
          matches.length.toLocaleString() +
          ' matches. Refine the search to see more.';
      else if (!matches.length) status.textContent = 'No set names match this search.';
      else
        status.textContent =
          library.filename +
          ' · ' +
          library.sets.size.toLocaleString() +
          (library.sets.size === 1 ? ' set' : ' sets');
      describe();
    }

    function selectLibrary(next) {
      library = next;
      search.value = '';
      get('geneSetSearchBox').hidden = library.sets.size <= maxOptions;
      const label = name.replace(/^pathway\s*:\s*/i, '').trim();
      const previous = target.membershipSource?.name;
      chosen =
        next === libraries.get(study) && next.sets.has(previous)
          ? previous
          : next.sets.has(label)
            ? label
            : null;
      options();
    }

    if (library) selectLibrary(library);
    picker.addEventListener('change', async () => {
      const file = picker.files[0];
      if (!file) return;
      const own = ++generation;
      library = null;
      chosen = null;
      search.value = '';
      get('geneSetSearchBox').hidden = true;
      choice.replaceChildren();
      choice.disabled = apply.disabled = true;
      error.hidden = true;
      preview.textContent = '';
      status.textContent = 'Reading ' + file.name + '…';
      const active = () => own === generation && form.isConnected && form.closest('dialog')?.open;
      try {
        if (file.size > maxBytes) throw new Error('Choose a GMT file of 16 MB or less.');
        const text = await file.text();
        if (!active()) return;
        selectLibrary({ filename: file.name, sets: parse(text) });
      } catch (err) {
        if (!active()) return;
        status.textContent = 'Choose a different GMT file.';
        error.textContent = err.message;
        error.hidden = false;
      }
    });
    search.addEventListener('input', () => {
      chosen = null;
      options();
    });
    choice.addEventListener('change', () => {
      chosen = choice.value || null;
      describe();
    });
    get('cancelGeneSet').addEventListener('click', close);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const record = library?.sets.get(chosen);
      if (!record || study.features.find((f) => f.id === featureId) !== target) return;
      target.members = [...record.members];
      target.membershipSource = { name: record.name, description: record.description };
      libraries.set(study, library);
      close();
      onChange?.();
    });
  }

  window.SctrialGeneSets = Object.freeze({ open });
})();

    if (synthetic()) {
      const raw =
        study.results[[state.design, state.arm, state.visit, state.population].join('|')] || [];
      rows = raw.map((r) => ({
        ...r,
        id: r.feature,
        label: study.features.find((f) => f.id === r.feature).label,
      }));
    } else {
      const groups = armsIn(),
        visits = datesIn();
      rows = study.features.map((f) => {
        const values = groups.map((arm) =>
          study.participants
            .filter((p) => p.arm === arm)
            .flatMap((p) => {
              const vs = visits.map((v) => rowAt(p.id, v)?.scores[f.id]);
              return vs.every(Number.isFinite) ? [vs.length === 2 ? vs[1] - vs[0] : vs[0]] : [];
            }),
        );
        const av = values.map(mean);
        return {
          id: f.id,
          label: f.label,
          estimate: av.every(Number.isFinite) ? (av.length === 1 ? av[0] : av[0] - av[1]) : null,
          lo: null,
          hi: null,
          p: null,
          q: null,
          n: values.reduce((a, v) => a + v.length, 0),
          nFirst: values[0].length,
          nOther: values[1]?.length ?? null,
        };
      });
    }
    if (rowCache.size >= 32) rowCache.delete(rowCache.keys().next().value);
    rows = scopeRows(rows);
    rowCache.set(k, rows);
    return rows;
  }
  async function requestFit() {
    if (!native() || !fitted()) return;
    const k = key(),
      file = study;
    clearFit();
    if (fitCache.has(k)) {
      currentFit = fitCache.get(k);
      fitStatus = 'ready';
      refreshFit();
      return;
    }
    const own = new AbortController();
    fitTask = own;
    fitStatus = 'loading';
    refreshFit();
    try {
      const fit = await localStudyClient.fit(
        file,
        {
          design: state.design,
          arm: state.arm,
          reference: second(),
          visit: state.visit,
          baseline: state.baseline,
          population: state.population,
        },
        own.signal,
      );
      if (own.signal.aborted || file !== study || key() !== k) return;
      currentFit = { ...fit, rows: scopeRows(fit.rows) };
      fitStatus = 'ready';
      if (fitCache.size >= 24) fitCache.delete(fitCache.keys().next().value);
      fitCache.set(k, currentFit);
    } catch (error) {
      if (own.signal.aborted || study !== file || key() !== k) return;
      fitStatus = 'error';
      fitMessage = error.message;
    } finally {
      if (fitTask === own) {
        fitTask = null;
        refreshFit();
      }
    }
  }

  function comparisonRecords() {
    const specKey = JSON.stringify([
      state.design,
      state.arm,
      state.baseline,
      state.visit,
      state.population,
      state.feature,
    ]);
    if (lastRecords?.study === study && lastRecords.key === specKey) return lastRecords.rows;
    const groups = armsIn();
    const visitNames = datesIn();
    const rows = study.participants
      .filter((p) => groups.includes(p.arm))
      .map((p) => {

          return rowObserved(r) && Number.isFinite(score) ? score : null;

        return {
          id: p.id,
          arm: p.arm,
          baselineValue: isLong() ? values[0] : null,
          followupValue: values[values.length - 1],
          contributes: missing.length === 0,

  function paintCanvas() {

      '<label for="trajectoryBrowse">Browse visits</label><input id="trajectoryBrowse" type="range" aria-label="Browse observed visits" min="0" step="1">' +

  function setupPlayback(visits) {
    const slider = $('trajectoryBrowse'),
      button = $('trajectoryPlayback'),
      output = $('trajectoryFrame');
    slider.max = Math.max(0, visits.length - 1);
    slider.disabled = button.disabled = visits.length < 2;
    const show = (index) => {
      const visit = visits[index] ?? null;
      playbackVisit = visit;
      slider.value = index;
      slider.setAttribute('aria-valuetext', visit || 'No measured visits');
      output.textContent = visit
        ? visit + ' · ' + (index + 1) + '/' + visits.length
        : 'No measured visits';
      window.setContrastVisitCursor($('plot'), visit);
    };
    show(Math.max(0, visits.indexOf(playbackVisit)));
    slider.oninput = () => {
      stopPlayback();
      show(Number(slider.value));
    };
    button.onclick = () => {
      if (playbackTimer) {
        stopPlayback();
        return;
      }
      if (Number(slider.value) === visits.length - 1) show(0);
      button.textContent = 'Ⅱ';
      button.setAttribute('aria-label', 'Pause visits');
      button.title = 'Pause visit playback';
      button.setAttribute('aria-pressed', 'true');
      playbackTimer = setInterval(() => {
        if (!slider.isConnected) {
          stopPlayback();
          return;
        }
        const index = Number(slider.value) + 1;
        if (index < visits.length) show(index);
        if (index >= visits.length - 1) stopPlayback();
      }, 1050);
    };
  }

      onAnalyze: (id) => {

  function configure(focusField = 'design') {
    const draft = snapshotSpec();
    function selectField(field, label, options, disabled = false) {
      return (
        '<label class="ed-setting"><span>' +
        esc(label) +
        '</span><select data-setting="' +
        field +
        '" aria-label="' +
        esc(label) +
        '"' +
        (disabled ? ' disabled' : '') +
        '>' +
        options.map(([value, title]) => option(value, draft[field], title)).join('') +
        '</select></label>'
      );
    }
    const pairs = (items) => items.map((v) => [v, v]);
    function draw() {
      const longitudinal = ['did', 'paired'].includes(draft.design);
      const twoGroups = ['did', 'cross'].includes(draft.design);
      const visits = longitudinal ? study.visits.filter((v) => v !== draft.baseline) : study.visits;
      if (!visits.includes(draft.visit)) draft.visit = visits[0];
      modal(
        'Configure comparison',
        '<form id="comparisonSettings" class="ed-settings"><div class="ed-settings-grid">' +
          selectField(
            'design',
            'Study design',
            designs().map((d) => [d, labels[d]]),
          ) +
          selectField(
            'arm',
            twoGroups ? 'Group order' : 'Group',
            arms.map((a) => [a, twoGroups ? a + ' − ' + arms.find((other) => other !== a) : a]),
          ) +
          (longitudinal
            ? selectField(
                'baseline',
                synthetic() ? 'Baseline visit' : 'Reference visit',
                pairs(study.visits),
                synthetic(),
              )
            : '') +
          selectField(
            'visit',
            longitudinal ? (synthetic() ? 'Follow-up visit' : 'Comparison visit') : 'Selected visit',
            pairs(visits),
          ) +
          selectField('population', 'Cell population', pairs(study.populations)) +
          selectField(
            'feature',
            'Outcome',
            study.features.map((f) => [f.id, f.label]),
          ) +
          '</div>' +
          (!synthetic() && study.visits.length > 1
            ? '<button type="button" class="text-btn ed-order" id="visitOrder">' +
              icon('calendar') +
              'Set visit order…</button>'
            : '') +
          '<div class="ed-setting-actions"><button type="button" class="btn" id="cancelSettings">Cancel</button>' +
          '<button type="submit" class="btn accent">Apply changes</button></div></form>',
      );
      const form = $('comparisonSettings');
      form.onchange = (e) => {
        const field = e.target.dataset.setting;
        if (!field) return;
        draft[field] = e.target.value;
        if (['baseline', 'design'].includes(field)) {
          draw();
          formFocus(field);
        }
      };
      $('cancelSettings').onclick = finish;
      if ($('visitOrder'))
        $('visitOrder').onclick = async () => {
          const ordered = await localStudyClient.reviewVisitOrder({
            ...study,
            visits: draft.visitOrder || study.visits,
          });
          if (ordered) {
            draft.visitOrder = ordered;
            $('visitOrder').title = ordered.join(' → ');
          }
        };
      form.onsubmit = (e) => {
        e.preventDefault();
        const { visitOrder, ...next } = draft;
        if (
          JSON.stringify(next) !== JSON.stringify(snapshotSpec()) ||
          (visitOrder && JSON.stringify(visitOrder) !== JSON.stringify(study.visits))
        ) {
          remember();
          Object.assign(state, next, { selectedId: null });
          if (visitOrder) {
            study.visits = visitOrder;
          }
          clearFit();
          render();
        }
        finish();
        document.querySelector('#page [data-configure="design"]')?.focus();
      };
    }
    function formFocus(field) {
      document
        .querySelector('#comparisonSettings [data-setting="' + field + '"]:not([disabled])')
        ?.focus();
    }
    draw();
    formFocus(focusField);
  }

  function download(file, data, type) {

    $('openWorkbook').onclick = () => {

          const text = await file.text();
          if (!openDialog.open || !picker.isConnected) return;

          finish();
          toast(count === 1 ? 'One analysis sheet opened' : count + ' analysis sheets opened');
        } catch (e) {

    async function read(file) {

      ? '/sctrial-workbook.html'

    offlineApp.download = 'sctrial-workbook.html';
    $('dialogBody').append(offlineApp);
    if ($('h5map'))
      $('h5map').onclick = () => {

    $('csvFile').onchange = (e) => read(e.target.files[0]);
    $('drop').onkeydown = (e) => {
      if ([' ', 'Enter'].includes(e.key)) {

    for (const event of ['dragenter', 'dragover'])
      $('drop').addEventListener(event, (e) => {
        e.preventDefault();
        $('drop').classList.add('over');
      });
    $('drop').ondragleave = () => $('drop').classList.remove('over');
    $('drop').ondrop = (e) => {
      e.preventDefault();
      $('drop').classList.remove('over');
      read(e.dataTransfer.files[0]);
    };
    $('template').onclick = () => download('participant-summaries.csv', studyCSVTemplate(), 'text/csv');
    $('restore').onclick = () => {
      finish();
      init(sample);
      toast('Example study opened');
    };
  }
  function csv(rows) {
    return (
      rows
        .map((row) =>
          row
            .map((v) => {
              if (v == null) return '';
              if (typeof v === 'number') return String(v);
              let s = String(v);
              if (/^[\s]*[=+@-]/.test(s)) s = "'" + s;
              return '"' + s.replace(/"/g, '""') + '"';
            })
            .join(','),
        )
        .join('\r\n') + '\r\n'
    );
  }
  function exportFile(kind) {
    if (kind === 'workbook') {
      download('sctrial-workbook.json', sheets.exportWorkbook(), 'application/json');
    } else if (kind === 'settings') {
      const spec = {
        study: name(),
        source: source(),
        design: state.design,
        orderedGroups: armsIn(),
        visits: datesIn(),

        featurePanel: study.features.map((f) => ({

          fdrFamily: fdrFamily(f),
          fitPackage: fitProvenance(f).package || null,

        fdrFamily: fdrFamily(feature()),
        selectedFeature: state.feature,
        unit: unit(),
        method: method(),
        ...fitProvenance(feature()),
        ...(native()
          ? {
              mapping: study.mapping || null,
              version: study.version || null,

            }
          : {}),
      };
      download('sctrial-comparison.json', JSON.stringify(spec, null, 2), 'application/json');
    } else if (kind === 'results') {
      const headers = [
        'feature',

        'first_group',
        'second_group',
        'visits',
        'population',

        r.label,
        state.design === 'observe' ? 'mean' : fitted() ? 'model estimate' : 'descriptive difference',
        state.design,

        armsIn()[1] ?? '',

        state.population,
        r.estimate,

        ...(fitted() ? [r.lo, r.hi, r.p, r.q, r.fdrFamily, r.fitPackage] : []),

    } else {

        'participant',
        'arm',
        'visit',
        'population',
        'cells',
        ...study.features.map((f) => {
          if (f.inputSource === 'csv' && f.inputName) return f.inputName;

    toast('Export downloaded');
  }

      e.preventDefault();
      closeRecord(true);
      return;
    }
    if (
      document.querySelector('dialog[open]') ||
      ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) ||
      e.target.isContentEditable
    )
      return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      travel(!e.shiftKey);
      return;
    }
    if (
      (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) ||
      ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'k')
    ) {
      e.preventDefault();
      search();
    }
  });
  init(sample);
  if (localStudyClient.available())
    void localStudyClient.openMapping(init).catch((e) => toast(e.message));
})();

    </script>
