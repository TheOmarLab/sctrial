.modal {
  width: min(calc(100% - 26px), 500px);
  max-height: 85dvh;
  border: 1px solid #cbd3df;
  border-radius: 14px;
  color: var(--ink);
  padding: 0;
  box-shadow: 0 18px 70px #24392e44;
}
.modal::backdrop {
  background: #101b36a3;
}
.modal-head {
  padding: 19px 21px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px 21px 21px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}
.field {
  display: grid;
  align-content: start;
  gap: 5px;
  min-width: 0;
}
.field.wide {
  grid-column: 1/-1;
}
.field > span {
  font-size: 12px;
  font-weight: 620;
}
.field-input {
  width: 100%;
}
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 17px;
}
.hint {
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.contrast-note {
  margin-top: 14px;
  border-radius: 7px;
  background: #f2f1fc;
  color: #463e7b;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.45;
}
.choice {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 7px 0;
  background: #fff;
  cursor: pointer;
}
.choice:hover {
  border-color: #8db29a;
  background: #f2f8f0;
}
.choice > i {
  color: #397661;
}
.choice span {
  display: grid;
  gap: 3px;
}
.choice strong {
  font-size: 13px;
}
.choice small {
  font-size: 12px;
  color: var(--muted);
}
.drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  border: 1px dashed #98b4a2;
  border-radius: 9px;
  background: #f1f6ed;
  padding: 23px 12px;
  color: #2d654e;
  cursor: pointer;
}
.drop-zone.over {
  border: 2px solid var(--violet);
}
.drop-zone .btn {
  margin: 3px;
}
.drop-zone strong {
  font-size: 15px;
}
.drop-zone small {
  color: var(--muted);
}
.error {
  border-left: 3px solid #b43f48;
  padding: 8px;
  color: #913342;
  background: #fff3f3;
  font-size: 12px;
  margin-top: 8px;
}
.modal-list {
  display: grid;
  max-height: 42vh;
  overflow: auto;
  margin-top: 10px;
}
.modal-list button {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  gap: 8px;
}
.modal-list button:hover {
  background: #f6f5fd;
}
.modal-list small {
  color: var(--muted);
}
.meta-list {
  display: grid;
  gap: 0;
}
.meta-list div {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 7px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.meta-list dt {
  color: var(--muted);
}
.meta-list dd {
  margin: 0;
}
.toast {
  position: fixed;
  z-index: 20;
  bottom: 22px;
  right: 20px;
  background: #1b392d;
  color: white;
  border-radius: 8px;
  box-shadow: 0 4px 18px #24392e35;
  padding: 12px 15px;
  font-size: 13px;
}
.empty {
  color: var(--muted);
  padding: 15px;
  font-size: 13px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.pe.card {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 15px;
  background: white;
  color: var(--ink, #17243b);
}
.pe-head,
.pe-filters,
.pe-footer,
.pe-notes {
  padding-inline: clamp(16px, 2vw, 28px);
}
.pe-head {
  padding-top: 21px;
}
.pe-head h2,
.pe-detail h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.035em;
  color: var(--ink, #17243b);
}
.pe-sub,
.pe-dialog-sub {
  margin: 5px 0 0;
  font-size: 13px;
  color: #53647a;
}
.pe-filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  padding-block: 16px;
}
.pe-control {
  display: grid;
  gap: 5px;
  min-width: 132px;
}
.pe-label,
.pe-dialog-label {
  font-size: 12px;
  color: #52617a;
  font-weight: 600;
}
.pe-search {
  flex: 1 1 185px;
}
.pe-input,
.pe-control select {
  max-width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 10px;
  border: 1px solid #c5cede;
  border-radius: 7px;
  background: white;
  color: var(--ink, #17243b);
  font: inherit;
  font-size: 13px;
}
.pe-control select {
  cursor: pointer;
  min-width: 118px;
}
.pe-input::placeholder {
  color: #637086;
}
.pe :focus-visible,
.pe-detail :focus-visible {
  outline: 3px solid #237f60;
  outline-offset: 2px;
}
.pe-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.pe-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
  margin: 0;
}
.pe-table th,
.pe-table td {
  text-align: left;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid #e9edf3;
  color: #35445b;
  background: transparent;
}
.pe-table th:first-child,
.pe-table td:first-child {
  padding-left: clamp(16px, 2vw, 28px);
}
.pe-table th:last-child,
.pe-table td:last-child {
  padding-right: clamp(16px, 2vw, 28px);
}
.pe-table thead th {
  padding-block: 9px;
  background: #f4f6fb;
  font-weight: 600;
  font-size: 12px;
  color: #54627a;
  border-block: 1px solid #e2e6ee;
}
.pe-table tbody th {
  font-weight: 550;
}
.pe-table tbody tr:hover td,
.pe-table tbody tr:hover th {
  background: #f8f9fe;
}
.pe-person {
  color: #3d3289;
  background: transparent;
  border: 0;
  padding: 4px 3px 4px 0;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.pe-person:hover {
  text-decoration: underline;
}
.pe-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pe-group::before {
  content: '';
  display: block;
  height: 8px;
  width: 8px;
  border-radius: 3px;
  background: var(--violet, #34735c);
}
.pe-group.pe-second::before {
  background: var(--teal, #087f78);
}
.pe-num,
.pe-page-number,
.pe-detail-table {
  font-variant-numeric: tabular-nums;
}
.pe-mark {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  box-sizing: border-box;
  vertical-align: -1px;
}
.pe-yes {
  background: #11887e;
  box-shadow: inset 0 0 0 1px #087267;
}
.pe-unmeasured {
  border: 1px solid #96691b;
  background: radial-gradient(circle, #916416 0 1.5px, #fff6dd 2px);
}
.pe-partial {
  border: 1px solid #997120;
  background: repeating-linear-gradient(135deg, #f9e9bb 0 2px, #fff8e6 2px 4px);
}
.pe-no {
  border: 1px dashed #78879d;
  background: white;
}
.pe-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.pe-covered {
  color: #126359;
  background: #e5f5ef;
}
.pe-incomplete {
  color: #79540b;
  background: #fff2d3;
}
.pe-outside {
  color: #536278;
  background: #edf0f4;
}
.pe-table .pe-empty {
  padding: 22px;
  color: #53647a;
  text-align: center;
}
.pe-footer,
.pe-pages {
  display: flex;
  align-items: center;
}
.pe-footer {
  min-height: 48px;
  padding-block: 8px;
  justify-content: space-between;
  gap: 8px;
}
.pe-range,
.pe-note,
.pe-legend,
.pe-page-number {
  margin: 0;
  font-size: 12px;
  color: #52617a;
}
.pe-pages {
  gap: 8px;
}
.pe-step,
.pe-close {
  padding: 5px 9px;
  border: 1px solid #c9d1de;
  border-radius: 6px;
  color: #293449;
  background: white;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.pe-step:disabled {
  opacity: 0.45;
  cursor: default;
}
.pe-notes {
  background: #f9fafd;
  padding-block: 12px;
  border-top: 1px solid #e2e6ee;
}
.pe-legend,
.pe-key {
  display: flex;
  align-items: center;
}
.pe-legend {
  gap: 4px 16px;
  flex-wrap: wrap;
}
.pe-key {
  gap: 5px;
}
.pe-key .pe-mark {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}
.pe-note {
  margin-top: 6px;
  line-height: 1.5;
}
.pe-detail {
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(610px, calc(100% - 24px));
  max-width: none;
  max-height: 86dvh;
  padding: 22px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 14px;
  color: var(--ink, #17243b);
  box-shadow: 0 20px 80px #17243b38;
}
.pe-detail::backdrop {
  background: #15223c75;
}
.pe-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pe-dialog-label {
  margin: 0 0 4px;
}
.pe-dialog-sub {
  margin-bottom: 15px;
}
.pe-detail .pe-table th,
.pe-detail .pe-table td {
  padding-inline: 9px;
}
.pe-detail-table thead th:last-child {
  min-width: 78px;
  white-space: normal;
}
.pe-detail-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
@media (max-width: 600px) {
  .pe-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .pe-control {
    min-width: 0;
  }
  .pe-control select {
    min-width: 0;
  }
  .pe-search {
    grid-column: 1 / -1;
  }
  .pe-table {

.cbench {
  --cb-ink: #132f37;
  --cb-muted: #516974;
  --cb-line: #d5dedf;
  --cb-paper: #fff;
  --cb-a: #08766e;
  --cb-b: #995421;
  display: grid;
  gap: 18px;
  color: var(--cb-ink);
  min-width: 0;
}
.cbench * {
  box-sizing: border-box;
}
.cbench h2,
.cbench h3,
.cbench p {
  margin: 0;
}
.cbench h2 {
  font-size: clamp(20px, 2vw, 27px);
  letter-spacing: -0.045em;
  line-height: 1.1;
}
.cbench h3 {
  font-size: 16px;
  letter-spacing: -0.025em;
}
.cbench-main,
.cbench-shelf {
  border: 1px solid var(--cb-line);
  background: var(--cb-paper);
  border-radius: 12px;
  min-width: 0;
}
.cbench-header,
.cbench-shelf-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 15px;
}
.cbench-button {
  color: var(--cb-ink);
  background: #fff;
  border: 1px solid var(--cb-line);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 10px;
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  line-height: 1.4;
  min-height: 33px;
  cursor: pointer;
  white-space: nowrap;
}
.cbench-button:focus-visible,
.cbench select:focus-visible,
.cbench input:focus-visible {
  outline: 3px solid #00877c;
  outline-offset: 3px;
}
.cbench-button:hover {
  background: #edf4f0;
}
.cbench-button:disabled {
  opacity: 0.35;
  cursor: default;
}
.cbench-strong {
  background: #183b3d;
  border-color: #183b3d;
  color: #fff;
}
.cbench-strong:hover {
  background: #22554f;
}
.cbench-icon {
  padding: 4px;
  width: 31px;
  min-height: 31px;
  border: 0;
  background: transparent;
  color: var(--cb-muted);
}
.cbench-text {
  border: 0;
  color: var(--cb-a);
  padding: 3px 6px;
  background: transparent;
}
.cbench-pair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
  align-items: stretch;
  gap: 7px;
  margin: 0 22px 17px;
}
.cbench-side {
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 12px;
  border: 1px solid var(--cb-line);
  border-top: 3px solid currentColor;
  border-radius: 6px;
}
.cbench-a {
  color: var(--cb-a);
}
.cbench-b {
  color: var(--cb-b);
}
.cbench-letter,
.cbench-dot {
  display: inline-grid;
  place-items: center;
  font-size: 11px;
  font-weight: 750;
  font-family: ui-monospace, monospace;
  flex-shrink: 0;
}
.cbench-letter {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: #e5f2ed;
}
.cbench-b .cbench-letter {
  background: #f7eadf;
}
.cbench-choice {
  min-width: 0;
  flex: 1;
}
.cbench-select {
  width: 100%;
  color: var(--cb-ink);
  padding: 3px 17px 4px 0;
  min-height: 24px;
  border: 0;
  border-radius: 0;
  background: transparent;
  text-overflow: ellipsis;
  font-weight: 650;
  font-size: 13px;
  cursor: pointer;
}
.cbench-select:disabled {
  opacity: 0.7;
  cursor: default;
}
.cbench-side small,
.cbench-row-label small,
.cbench-value small {
  display: block;
  color: var(--cb-muted);
  font-size: 11px;
  line-height: 1.6;
}
.cbench-swap {
  align-self: center;
}
.cbench-empty {
  min-height: 142px;
  display: grid;
  align-content: center;
  gap: 6px;
  text-align: center;
  padding: 24px;
  border-top: 1px solid var(--cb-line);
}
.cbench-empty > .cbench-text {
  justify-self: center;
}
.cbench-empty p,
.cbench-tip,
.cbench-storage {
  font-size: 12px;
  line-height: 1.5;
  color: var(--cb-muted);
}
.cbench-tip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #f4f6f2;
  border-block: 1px solid var(--cb-line);
  padding: 8px 22px;
}
.cbench-scroll {
  overflow: auto;
  max-height: 58vh;
  border-bottom-left-radius: 12px;
  border-bottom-right-radius: 12px;
}
.cbench-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  table-layout: fixed;
}
.cbench-table th,
.cbench-table td {
  padding: 11px 18px;

  overflow-wrap: anywhere;
  vertical-align: top;
}
.cbench-table thead th {
  font-size: 11px;

}
.cbench-table tbody th {

}
.cbench-value {

}

.cbench-unavailable {

.cbench-shelf-head {

}
.cbench-count {
  font-size: 11px;

  background: #edf2f1;
  border-radius: 4px;

}
.cbench-shelf-head .cbench-text {

}
.cbench-pins {

  padding: 0 20px;
}
.cbench-pin {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 0;
  border-top: 1px solid var(--cb-line);
}
.cbench-dot {
  align-self: flex-start;
  width: 21px;
  height: 22px;
  margin-top: 4px;
  border: 1px solid #d4dcdd;
  color: #667b82;

}
.cbench-dot.cbench-a {
  background: #e5f2ed;

}

  background: #f7eadf;

}
.cbench-row-label {
  min-width: 0;
  flex: 1;
}
.cbench-row-label strong {
  font-size: 13px;
  overflow-wrap: anywhere;
}
.cbench-pin-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}
.cbench-storage {
  padding: 7px 20px 13px;

}
.cbench-name-form {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.cbench-name-input {
  appearance: none;

@media (max-width: 700px) {
  .cbench {
    gap: 12px;
  }
  .cbench-header {
    padding: 15px 12px 12px;
  }
  .cbench-header h2 {
    font-size: 18px;
  }
  .cbench-pair {
    margin: 0 12px 12px;
    gap: 5px;
    grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr);
  }
  .cbench-side {
    display: block;

  }
  .cbench-letter {

  }

  }
  .cbench-pins {

.cbench-scroll:focus-visible {
  outline: 3px solid #00877c;

}
.cbench-table.cbench-with-forest thead th:first-child {
  width: 40%;

.cbench-with-forest tbody th {

}
.cbench-axis {

    550 9px/1.35 ui-monospace,

.cbench-axis span {
  position: absolute;

}
.cbench-tick-lo {
  left: 5%;
}
.cbench-tick-zero {

}
.cbench-tick-hi {
  right: 5%;
}
.cbench-forest {
  display: block;

.cbench-key {

}

.cbench-key-2 {

}

.cc-surface {
  --cc-base: #fff;
  --cc-ink: #27304a;
  --cc-secondary: #586279;
  position: relative;
  width: 100%;
  overflow: hidden;
  isolation: isolate;
  color: var(--cc-ink);
  background: #fff;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.cc-surface svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.cc-surface svg text {
  font-family: inherit;
}
.cc-surface svg .cc-number {
  font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
}
.cc-surface .cc-interactive {
  outline: none;
}
.cc-person,
.cc-visit {
  cursor: pointer;
}
.cc-person .cc-ink {
  transition:
    opacity 110ms ease,
    stroke-width 110ms ease;
}
.cc-person.cc-active .cc-ink {
  opacity: 1;
  stroke-width: 2.6px;
}
.cc-person.cc-muted .cc-ink {
  opacity: 0.17;
}
.cc-person.cc-active .cc-dot {
  opacity: 1;
}
.cc-person[aria-pressed='true'] .cc-focus {
  opacity: 1;
}
.cc-person.cc-muted .cc-dot {
  opacity: 0.25;
}
.cc-person:focus-visible .cc-focus,
.cc-visit:focus-visible .cc-focus,
.cc-handle:focus-visible .cc-focus,
.cc-mean:focus-visible .cc-focus {
  opacity: 1;
}
.cc-visit:hover .cc-chip,
.cc-visit:focus-visible .cc-chip {
  fill: #edecfc;
  stroke: #a4a0da;
}
.cc-visit-head {
  cursor: pointer;
  touch-action: manipulation;
}
.cc-visit-head:hover .cc-destination,
.cc-visit-head.cc-aim .cc-destination {
  fill: #6458c0;
  stroke: #5e54a9;
}
.cc-handle:hover .cc-grip,
.cc-handle:focus-visible .cc-grip,
.cc-handle.cc-dragging .cc-grip {
  fill: #d6d2fa;
  stroke: #8379cd;
}
.cc-handle.cc-dragging {
  cursor: grabbing;
}
.cc-visit {
  touch-action: manipulation;
}
.cc-visit:not(:hover) .cc-chip {
  transition: fill 140ms ease;
}
.cc-handle {
  cursor: ew-resize;
  touch-action: none;
}
.cc-readout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  min-height: 39px;
  padding: 7px 16px 8px;
  border-top: 1px solid #dfe1eb;
  color: #565e73;
  background: #f8f9fc;
  font-size: 11px;
  line-height: 1.45;
}
.cc-readout-main {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 5px 10px;
  align-items: center;
  min-width: 0;
}
.cc-readout-main strong {
  color: #272c40;
  font-weight: 650;
}
.cc-readout-main span,
.cc-legend {
  overflow-wrap: anywhere;
}
.cc-readout-arm {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mark-color);
  flex: 0 0 auto;
}
.cc-legend {
  display: flex;
  gap: 10px;
  align-items: center;
  color: #565e73;
}
.cc-legend span {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  white-space: nowrap;
}
.cc-key {
  display: inline-block;
  width: 16px;
  height: 0;
  border-top: 1.5px solid #858b9a;
}
.cc-key.cc-key-mean {
  border-top: 3px solid #3f465e;
  position: relative;
}
.cc-key.cc-key-mean:before {
  content: '';
  position: absolute;
  border: 1.5px solid #3f465e;
  background: #fff;
  border-radius: 50%;
  width: 4px;
  height: 4px;
  left: 5px;
  top: -4.5px;
}
.cc-key.cc-key-dot {
  border: none;
  width: 7px;
  height: 7px;
  background: #82889b;
  border-radius: 50%;
}
.cc-key.cc-key-diamond {

}
.cc-tip {

  pointer-events: none;
  padding: 6px 9px;
  border: 1px solid #536880;
  border-radius: 5px;
  color: #f2f7ff;
  background: #0e192bf2;
  box-shadow: 0 5px 18px #060a1640;
  font-size: 11px;
  line-height: 1.45;
}
.cc-tip[hidden] {
  display: none;
}
.cc-surface .cc-empty {
  fill: #4d566a;
  font-size: 14px;
}
@media (max-width: 540px) {
  .cc-readout {
    padding: 7px 9px;
    gap: 5px 8px;
    font-size: 10px;
  }
  .cc-legend {
    gap: 7px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .cc-surface *,
  .cc-surface *::before {
    transition: none !important;
    animation: none !important;
  }

.cc-counts {

  content: '';
  width: 7px;
  height: 7px;
  background: var(--mapping-action);
  border-radius: 50%;
}
.local-mapping .lm-dismiss {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--mapping-line);
  background: transparent;
  color: var(--mapping-muted);
  border-radius: 7px;
  font-size: 21px;
  line-height: 1;
}
.local-mapping .lm-dismiss:hover {
  color: var(--mapping-ink);
  background: #f0eff8;
}
.local-mapping .lm-body {
  padding: 18px 25px 5px;
}
.local-mapping .lm-file {
  border: 1px solid var(--mapping-line);
  background: #f6f6fb;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: 8px;
}
.local-mapping .lm-file-mark {
  flex: none;
  width: 34px;
  height: 36px;
  display: grid;
  place-items: center;
  background: #eeecfa;
  color: #4d4492;
  border: 1px solid #d9d4f0;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.045em;
}
.local-mapping .lm-file b {
  display: block;
  font-size: 14px;
  font-weight: 620;
  overflow-wrap: anywhere;
}
.local-mapping .lm-file small {
  display: block;
  color: var(--mapping-muted);
  font-size: 12px;
  margin-top: 1px;
}
.local-mapping .lm-section {
  margin: 18px 0;
}
.local-mapping .lm-section h3 {
  font-size: 15px;
  letter-spacing: -0.025em;
  font-weight: 670;
}
.local-mapping .lm-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 13px;
  margin-top: 9px;
}
.local-mapping .lm-field {
  display: grid;
  min-width: 0;
  gap: 4px;
}
.local-mapping .lm-field > span {
  font-size: 12px;
  font-weight: 600;
  color: #41485d;
}
.local-mapping select,
.local-mapping input[type='search'] {
  min-width: 0;
  width: 100%;
  color: var(--mapping-ink);
  border-radius: 6px;
  background: #fff;
  border: 1px solid #bfc4d4;
  padding: 6px 9px;
  min-height: 36px;
  font-size: 13px;
}
.local-mapping select {
  cursor: pointer;
}
.local-mapping .lm-outcome-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}
.local-mapping .lm-count {
  font-size: 11px;
  color: var(--mapping-muted);
}
.local-mapping .lm-scores {
  margin-top: 7px;
  max-height: 133px;
  overflow: auto;
  border: 1px solid var(--mapping-line);
  border-radius: 6px;
  background: #fff;
}
.local-mapping .lm-score {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 33px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.local-mapping .lm-score + .lm-score {
  border-top: 1px solid #e8e9ef;
}
.local-mapping .lm-score:has(input:checked) {
  background: #f1f0fb;
}
.local-mapping .lm-score input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--mapping-action);
  flex: none;
}
.local-mapping .lm-score:has(input:disabled) {
  color: #717786;
  cursor: default;
}
.local-mapping .lm-empty,
.local-mapping .lm-note,
.local-mapping .lm-progress {
  color: var(--mapping-muted);
  font-size: 12px;
  line-height: 1.45;
}
.local-mapping .lm-empty {
  padding: 9px 10px;
}
.local-mapping .lm-note {
  margin-top: 5px;
}
.local-mapping .lm-progress {
  padding: 12px 0 17px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.local-mapping .lm-spinner {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid #d7d5e8;
  border-top-color: var(--mapping-action);
  animation: lm-turn 0.8s linear infinite;
}
.local-mapping .lm-error {
  background: #fff4e7;
  color: #6f3918;
  border: 1px solid #dfb285;
  border-radius: 6px;
  font-size: 12px;
  padding: 9px 11px;
  overflow-wrap: anywhere;
}
.local-mapping .lm-foot {
  position: sticky;
  bottom: 0;
  background: #fff;
  border-top: 1px solid var(--mapping-line);
  padding: 12px 25px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.local-mapping .lm-action {
  border-radius: 6px;
  min-height: 35px;
  padding: 7px 13px;
  border: 1px solid var(--mapping-line);
  background: #fff;
  color: var(--mapping-ink);
  font-size: 12px;
  font-weight: 630;
}
.local-mapping .lm-primary {
  color: #fff;
  background: var(--mapping-action);
  border-color: var(--mapping-action);
}
.local-mapping .lm-primary:enabled:hover {
  background: #40358e;
}
.local-mapping [hidden] {
  display: none !important;
}
@keyframes lm-turn {
  to {
    transform: rotate(360deg);
  }
}
@media (max-width: 480px) {
  .local-mapping .lm-header {
    padding: 15px 16px 12px;
  }
  .local-mapping .lm-body {
    padding: 12px 16px 2px;
  }
  .local-mapping .lm-foot {
    padding: 10px 16px;
  }
  .local-mapping .lm-fields {
    gap: 9px 8px;
  }
  .local-mapping .lm-header h2 {
    font-size: 22px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .local-mapping .lm-spinner {
    animation: none;
  }
}

.local-mapping.lm-visit-dialog {
  width: min(416px, calc(100vw - 28px));
}
.lm-visit-dialog .lm-body {
  padding-bottom: 17px;
}
.lm-visit-dialog select {
  padding: 3px;
}
.lm-visit-dialog option {
  padding: 5px 8px;
}
.lm-visit-dialog .lm-order-actions {
  display: flex;
  gap: 6px;
  margin: 7px 0 10px;
}
.lm-visit-dialog .lm-order-status {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

:root {
  color-scheme: light;
  --ink: #252639;
  --muted: #666b82;
  --line: #dadde7;
  --base: #f5f6fa;
  --surface: #fff;
  --violet: #5045b7;
  --teal: #21796f;
  --focus: #6158d3;
  --pine: #5145b7;
  --mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
  font:
    14px/1.45 Manrope,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Arial,
    sans-serif;
  font-synthesis: none;
  color: var(--ink);
  background: var(--base);
}
* {
  box-sizing: border-box;
}
body,
h1,
h2,
h3,
p {
  margin: 0;
}
button,
select,
input,
textarea {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button {
  background: none;
  border: 0;
  touch-action: manipulation;
}
button:disabled {
  cursor: default;
  opacity: 0.48;
}
:where(button, a, select, input, summary, [tabindex]):focus-visible {
  outline: 2px solid #7264ed;
  outline-offset: 3px;
}
svg {
  display: block;
}
i {
  font-style: normal;
}
[data-icon],
button > i {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
[hidden] {
  display: none !important;
}
.skip {
  position: fixed;
  top: -80px;
  left: 8px;
  z-index: 50;
  padding: 10px 14px;
  background: white;
}
.skip:focus {
  top: 8px;
}
h2 {
  font-size: 18px;
  line-height: 1.3;
  letter-spacing: -0.035em;
}
h3 {
  font-size: 15px;
  letter-spacing: -0.025em;
}
.workbook {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100dvh;
}
.project-sidebar {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  z-index: 5;
  background: #23243b;
  color: #f2f1fb;
  border-right: 1px solid #34344b;
  min-height: 0;
}
.sidebar-brand {
  min-height: 75px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 22px;
}
.brand-mark {
  flex-shrink: 0;
}
.sidebar-brand > strong {
  font-size: 29px;
  font-weight: 730;
  letter-spacing: -0.085em;
  line-height: 1;
  padding: 0 2px 4px 0;
}
.sidebar-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: auto;
  min-height: 0;
  padding: 5px 13px 20px;
  scrollbar-width: thin;
  scrollbar-color: #585871 transparent;
}
.study-switch {
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  width: 100%;
  border: 1px solid #48495f;
  border-radius: 8px;
  background: #2e2f47;
  padding: 12px 11px;
  color: #f6f5ff;
}
.study-switch:hover {
  background: #393950;
}
.study-switch > i {
  margin-left: auto;
  color: #aeaeca;
}
.study-switch > i svg {
  width: 13px;
}
.study-folder {
  display: grid;
  place-items: center;
  width: 29px;
  height: 32px;
  flex-shrink: 0;
  color: #d5ccff;
  background: #41415d;
  border-radius: 6px;
}
.study-file {
  display: grid;
  gap: 3px;
  min-width: 0;
}
.study-file small {
  color: #c2c1d5;
  font-size: 10px;
  line-height: 1.3;
}
.study-file b {
  line-height: 1.35;
  font-size: 12px;
  font-weight: 670;
  overflow-wrap: anywhere;
}
.project-nav {
  margin: 26px 0 20px;
}
.side-label {
  font-size: 10px;
  line-height: 16px;
  font-weight: 700;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: #b3b2ca;
}
.project-nav > .side-label {
  margin: 0 10px 7px;
}
.project-nav > button {
  border: 1px solid transparent;
  width: 100%;
  min-height: 35px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 9px;
  border-radius: 6px;
  color: #e4e3ed;
  text-align: left;
  font-size: 12.5px;
  font-weight: 550;
}
.project-nav button > i {
  color: #b4b2cd;
  width: 17px;
}
.project-nav button:hover {
  background: #34354c;
}
.project-nav button[aria-current='page'] {
  background: #413f61;
  color: #f7f5ff;
  border-color: #515071;
}
.project-nav button[aria-current='page'] i {
  color: #d9d1ff;
}
.project-nav button b {
  margin-left: auto;
  font: 600 10px/18px var(--mono);
  background: #46475f;
  padding: 0 5px;
  border-radius: 4px;
}
.side-head,
.map-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7px 5px 10px;
}
.side-head button,
.map-head button,
.sidebar-bottom button,
#closeSidebar {
  display: grid;
  place-items: center;
  color: #c8c8db;
  width: 27px;
  height: 27px;
  border-radius: 5px;
}
.side-head button:hover,
.map-head button:hover,
.sidebar-bottom button:hover,
#closeSidebar:hover {
  background: #45445f;
  color: white;
}
.design-map {
  padding: 15px 9px 0;
  border-top: 1px solid #434358;
  margin: 32px 0 0;
}
.map-head {
  padding: 0 0 3px;
}
.map-head button {
  width: 20px;
  height: 20px;
}
.map-head button svg {
  width: 14px;
  height: 14px;
}
#studyMap {
  max-height: 225px;
  overflow: auto;
  scrollbar-width: thin;
}
#studyMap table {
  width: 100%;
  table-layout: fixed;
  border-spacing: 0;
  font-size: 10px;
}
#studyMap th,
#studyMap td {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#studyMap th {
  text-align: start;
  font-weight: 540;
  color: #d1d0e0;
}
#studyMap thead th {
  height: 25px;
  font-size: 9px;
  color: #b1b0c8;
  border-bottom: 1px solid #3e3e55;
}
#studyMap th:first-child {
  width: 44%;
}
#studyMap th:not(:first-child),
#studyMap td {
  text-align: end;
  padding-inline: 4px;
}
#studyMap td {
  position: relative;
  height: 29px;
  font: 500 11px/1.25 var(--mono);
  color: #f0eff9;
}
#studyMap td span {
  position: relative;
  z-index: 1;
}
#studyMap td i {
  display: block;
  height: 2px;
  margin: 2px 0 0 auto;
  width: 85%;
  border-radius: 2px;
  background: linear-gradient(to right, #a194ea 0% var(--coverage), #48495e var(--coverage) 100%);
}
#studyMap td:nth-child(3) i {
  background: linear-gradient(to right, #65afa7 0% var(--coverage), #48495e var(--coverage) 100%);
}
.sidebar-bottom {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  border-top: 1px solid #414157;
  padding: 10px 18px;
}
.local-glyph {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border: 1px solid #4b4a63;
  border-radius: 6px;
  color: #bdb8f0;
}
.sidebar-bottom > span:nth-child(2) {
  display: grid;
}
.sidebar-bottom b {
  font-size: 11px;
  font-weight: 620;
}
.sidebar-bottom small {
  color: #b4b3ca;
  font-size: 10px;
}
.sidebar-bottom button {
  margin-left: auto;
}
.workspace-body {
  width: 100%;
  min-width: 0;
}
.workspace-bar {
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 clamp(18px, 2.3vw, 40px);
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: #6b6d83;
}
.breadcrumbs b {
  color: #37384e;
  font-weight: 600;
}
.breadcrumbs i {
  color: #73728e;
}
.breadcrumbs i svg {
  width: 16px;
}
.breadcrumbs span[aria-hidden] {
  color: #a5a9bc;
}
.workbook-search {
  color: #56596e;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 7px 5px 10px;
  border: 1px solid #e2e3ec;
  background: #f9f9fc;
  border-radius: 6px;
  font-size: 11.5px;
}
.workbook-search:hover {
  border-color: #bcbacf;
}
.workbook-search i svg {
  width: 14px;
  height: 14px;
}
.workbook-search kbd {
  margin-left: 24px;
  border: 1px solid #dcdde7;
  border-radius: 3px;
  background: #fff;
  color: #6e6f83;
  padding: 0 4px;
  font: 11px/15px var(--mono);
}
#showSidebar,
#closeSidebar {
  display: none;
}
main {
  max-width: 1660px;
  min-width: 0;
  padding: 25px clamp(18px, 2.3vw, 40px) 36px;
  margin: 0 auto;
  outline: none;
}
.work-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 18px;
}
.sheet-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  min-width: 0;
}
.document-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid #d7d4ee;
  background: #ebe9fa;
  color: #5a50a6;
  border-radius: 9px;
  flex-shrink: 0;
}
.document-mark svg {
  width: 20px;
  height: 20px;
}
.work-head h1 {
  font-size: clamp(23px, 2.15vw, 33px);
  letter-spacing: -0.055em;
  font-weight: 715;
  line-height: 1.18;
  overflow-wrap: anywhere;
}
.main-actions,
.history,
.btn,
.section-head,
.text-btn {
  display: flex;
  align-items: center;
  gap: 8px;
}
.main-actions {
  flex-shrink: 0;
}
.btn {
  justify-content: center;
  min-height: 33px;
  padding: 6px 11px;
  border: 1px solid #d2d4e1;
  border-radius: 6px;
  background: white;
  color: #35374a;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.btn:hover {
  background: #f4f3fc;
  border-color: #c0bbd7;
}
.btn.accent,
.btn.primary {
  color: white;
  background: #5348b6;
  border-color: #493da6;
}
.btn.accent:hover,
.btn.primary:hover {
  background: #443a9e;
}
.btn svg,
.text-btn svg {
  width: 15px;
  height: 15px;
}
.history {
  gap: 1px;
  padding-right: 7px;
  margin-right: 1px;
  border-right: 1px solid var(--line);
}
.history button,
.icon-btn,
#showSidebar {
  place-items: center;
  width: 31px;
  height: 31px;
  color: #64667d;
  border-radius: 5px;
}
.history button,
.icon-btn {
  display: grid;
}
.history button:hover:not(:disabled),
.icon-btn:hover,
#showSidebar:hover {
  background: #e9e9f3;
}
.history button:disabled {
  opacity: 0.33;
}
.history svg {
  width: 15px;
}
.small,
.muted {
  font-size: 12px;
  color: var(--muted);
}
.card {
  min-width: 0;
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
}
.section-head {
  justify-content: space-between;
}
.pill {
  border-radius: 4px;
  background: #eeecf8;
  color: #534b8a;
  padding: 3px 7px;
  font-size: 11px;
  font-weight: 650;
}
.text-btn {
  padding: 3px 0;
  justify-content: center;
  gap: 6px;
  color: var(--violet);
  font-size: 12px;
  font-weight: 650;
}
.text-btn:hover {
  text-decoration: underline;
}
.field-input {
  min-height: 36px;
  border: 1px solid #c7c8d7;
  border-radius: 5px;
  padding: 6px 9px;
}
.launch {
  margin-top: 16px;
  border-block-start: 1px solid var(--line);
  padding: 12px 0 0;
}
.launch summary {
  font-weight: 640;
  cursor: pointer;
}
.launch p,
.pending p,
.fit-warnings p {
  margin: 8px 0;
  color: var(--muted);
  font-size: 12px;
}
.launch code {
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.pending,
.fit-warnings {
  padding: 12px 15px;
  margin: 12px 0;
  border: 1px solid #e8d4a7;
  background: #fffaf0;
  border-radius: 6px;
}
.modal {
  font-family: inherit;
}
.choice:hover {
  border-color: #bfbbdd;
  background: #f6f5fd;
}
.choice > i,
.drop-zone {
  color: #50469b;
}
.drop-zone {
  border-color: #bcb8d7;
  background: #f7f6fd;
}
.toast {
  background: #2b2b41;
}
.results-layout .results-table tbody tr:hover {
  background: #f7f6fd;
}
.results-layout .results-table .chosen-feature {
  background: #eeecf9;
}
.results-layout .chosen-feature .feature-link,
.results-layout .feature-estimate dd {
  color: #51479e;
}
.cbench {
  --cb-a: #574bac;
  --cb-b: #237b71;
  --cb-ink: #29293b;
  --cb-line: var(--line);
}
.cbench .cbench-strong {
  border-color: var(--violet);
  background: var(--violet);
}
.cbench .cbench-button:not(.cbench-strong):hover {
  background: #f3f2fb;
}
@media (min-width: 1530px) {
  .workbook {
    grid-template-columns: 248px minmax(0, 1fr);
  }
}
@media (max-width: 1050px) and (min-width: 851px) {
  .workbook {
    grid-template-columns: 204px minmax(0, 1fr);
  }
  .history {
    padding-right: 2px;
  }
  .main-actions {
    gap: 5px;
  }
}
@media (max-width: 850px) {
  .workbook {
    display: block;
  }
  .project-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(275px, 87vw);
    transform: translateX(-100%);
    visibility: hidden;
    z-index: 10;
  }
  .project-sidebar.is-open {
    transform: none;
    visibility: visible;
  }
  #showSidebar,
  #closeSidebar {
    display: grid;
  }
  #closeSidebar {
    margin-left: auto;
  }
  #navigatorShade {
    position: fixed;

.top-open {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 7px;
  margin-left: auto;
  border-radius: 5px;
  color: #4e486a;
  font-size: 12px;
  font-weight: 620;
  white-space: nowrap;
}
.top-open:hover {
  background: #f3f1fa;
}
.top-open svg {
  width: 15px;
  height: 15px;
}
#mobileSource {
  display: none;
}
@media (max-width: 850px) {
  .breadcrumbs .crumb-root {
    display: none;
  }
  #mobileSource {
    display: inline;
    color: #5e507d;
    font-weight: 650;
  }
}
@media (max-width: 410px) {
  #sectionCrumb,
  .crumb-slash {
    display: none;
  }
}

.offline-app {
  display: inline-block;
  margin-top: 14px;
  font-size: 12px;
  font-weight: 610;
  color: var(--violet);
  text-underline-offset: 3px;
}

#sheetList {
  --sheet-ink: #deddf0;
  --sheet-accent: #f0efff;
  --sheet-selected: #cccbff;
  --sheet-hover: #383950;
  display: grid;
  align-content: start;
  gap: 2px;
  min-width: 0;
}
.sheet-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 27px;
  align-items: center;
  min-width: 0;
  border-radius: 6px;
  color: var(--sheet-ink, #51576b);
}
.sheet-item:has(.sheet-link[data-active]) {
  background: var(--sheet-selected, #e8eafd);
  color: #2d2b55;
}
.sheet-link,
.sheet-more,
.sheet-undo {
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
}
.sheet-link {
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  min-height: 34px;
  gap: 9px;
  padding: 6px 0 6px 9px;
  text-align: left;
  font-size: 12.5px;
  font-weight: 550;
}
.sheet-link[data-active] {
  font-weight: 690;
}
.sheet-icon {
  display: block;
  flex: 0 0 15px;
  width: 15px;
  height: 15px;
}
.sheet-label {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sheet-more {
  display: grid;
  min-width: 24px;
  min-height: 27px;
  padding: 0;
  place-items: center;
  justify-self: center;
  color: inherit;
  opacity: 0.7;
}
.sheet-link:hover,
.sheet-more:hover,
.sheet-more[aria-expanded='true'] {
  color: var(--sheet-accent, #434ab2);
  background: var(--sheet-hover, #e3e5f3);
}
.sheet-item:has(.sheet-link[data-active]) .sheet-link:hover,
.sheet-item:has(.sheet-link[data-active]) .sheet-more:hover,
.sheet-item:has(.sheet-link[data-active]) .sheet-more[aria-expanded='true'] {
  background: #bdbced;
  color: #23213d;
}
.sheet-undo {
  margin: 3px 5px;
  padding: 3px 5px;
  justify-self: start;
  color: var(--sheet-accent, #434ab2);
  font-size: 12px;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.sheet-name-form {
  grid-column: 1 / -1;
  padding: 2px;
}
.sheet-name {
  box-sizing: border-box;
  width: 100%;
  min-height: 30px;
  padding: 4px 7px;
  background: #fff;
  border: 1px solid #595ed4;
  border-radius: 4px;
  color: #212640;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}
.sheet-menu {
  display: grid;
  position: fixed;
  z-index: 400;
  box-sizing: border-box;
  width: 162px;
  padding: 4px;
  border: 1px solid #d5d6e3;
  border-radius: 8px;
  background: #fff;
  box-shadow:
    0 5px 22px #22254420,
    0 1px 3px #2225440d;
  color: #282c42;
}
.sheet-menu-item {
  display: flex;
  width: 100%;
  min-height: 32px;
  align-items: center;
  gap: 9px;
  padding: 6px 8px;
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: inherit;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 550;
  text-align: left;
}
.sheet-menu-item:enabled:hover,
.sheet-menu-item:focus {
  background: #eef0fc;
  color: #343990;
}
.sheet-menu-item:disabled {
  opacity: 0.4;
  cursor: default;
}
.sheet-item button:focus-visible,
.sheet-undo:focus-visible,
.sheet-menu-item:focus-visible {
  outline: 2px solid var(--sheet-accent, #595ed4);
  outline-offset: -2px;
}
.sheet-item:has(.sheet-link[data-active]) button:focus-visible {
  outline-color: #4b458a;
}

.ed-workbook {
  --ed-accent: #5242bd;
  --ed-ink: #262a3b;
  --ed-subtle: #535d70;
  --ed-rule: #dadde6;
  min-width: 0;
  color: var(--ed-ink);
}

.ed-definition {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-width: 0;
  padding: 14px 17px 11px;
  border: 1px solid var(--ed-rule);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  background: #fff;
}

.ed-outcome {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 12px;
  min-width: 0;
  color: var(--ed-subtle);
  font-size: 12px;
}

.ed-select-wrap {
  position: relative;
  display: inline-grid;
  min-width: 0;
  max-width: 100%;
  align-items: center;
}

.ed-select-wrap select {
  appearance: none;
  width: 100%;
  min-width: 0;
  padding: 3px 26px 3px 0;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: var(--ed-ink);
  line-height: 1.3;
  font-family: inherit;
  font-size: 16px;
  font-weight: 670;
  letter-spacing: -0.038em;
  cursor: pointer;
}

.ed-select-wrap svg {
  position: absolute;
  right: 4px;
  width: 13px;
  color: #777d91;
  pointer-events: none;
}

.ed-configure {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 6px;
  height: 29px;
  padding: 0 9px;
  border: 1px solid #d2d5e1;
  border-radius: 5px;
  background: #fff;
  color: #3e4057;
  font: inherit;
  font-size: 12px;
  font-weight: 620;
  cursor: pointer;
}

.ed-configure:hover,
.ed-spec button:hover {
  background: #f3f2fd;
  color: #473aa0;
}

.ed-configure svg {
  width: 14px;
}
.ed-spec {
  display: grid;
  grid-template-columns: minmax(130px, 1.2fr) minmax(98px, 0.85fr) minmax(130px, 1fr) minmax(
      100px,
      1fr
    );
  gap: 4px;
  padding: 2px 10px 10px;
  border: 1px solid var(--ed-rule);
  border-top: 0;
  border-radius: 0 0 10px 10px;
  background: #fff;
}

.ed-spec button {
  position: relative;
  display: grid;
  justify-items: start;
  align-content: start;
  min-width: 0;
  gap: 3px;
  padding: 3px 7px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--ed-ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.ed-spec button + button::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 4px;
  width: 1px;
  height: calc(100% - 8px);
  background: #e8e9ef;
}

.ed-spec span {
  color: var(--ed-subtle);
  font-size: 10.5px;
  line-height: 1.4;
}

.ed-spec b {
  font-size: 12px;
  font-weight: 610;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.ed-tabs {
  display: flex;
  gap: 17px;
  margin: 11px 0 14px;
  border-bottom: 1px solid var(--ed-rule);
}

.ed-tabs button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 1px 2px 0;
  border: 0;
  background: transparent;
  color: var(--ed-subtle);
  font: inherit;
  font-size: 12px;
  font-weight: 590;
  cursor: pointer;
}

.ed-tabs button[aria-pressed='true'] {
  color: var(--ed-accent);
  font-weight: 690;
}

.ed-tabs button[aria-pressed='true']::after {
  content: '';
  position: absolute;
  inset: auto 0 -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--ed-accent);
}

.ed-tabs button:hover {
  color: var(--ed-accent);
}
.ed-tabs svg {
  width: 14px;
  height: 14px;
}
#participantMatrix {
  margin-top: 16px;
  min-width: 0;
}
#fitRetry:not(:empty) {
  margin-top: 8px;
}
.ed-exploration {
  overflow: hidden;
  border: 1px solid var(--ed-rule);
  border-radius: 10px;
  background: #fff;
}

.ed-settings-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 15px 12px;
}
.ed-setting {
  display: grid;
  min-width: 0;
  gap: 5px;
}
.ed-setting span {
  font-size: 12px;
  font-weight: 620;
  color: #52586b;
}
.ed-setting select {
  min-width: 0;
  width: 100%;
  min-height: 36px;
  border: 1px solid #cbd0dd;
  border-radius: 5px;
  padding: 5px;
  background: #fff;
  font: inherit;
  font-size: 13px;
  color: #262a3b;
}
.ed-setting select:disabled {
  color: #666e81;
  background: #f6f6f9;
  opacity: 1;
}
.ed-setting-actions,
.ed-record-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #e2e4ec;
}
.ed-settings .ed-order {
  margin: 10px 0 0;
}

.ed-person-context {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.ed-person-context span {
  display: flex;
  gap: 5px;
  align-items: center;
  color: #535d70;
  font-size: 12px;
}
.ed-person-context svg {
  color: #6458ac;
  width: 15px;
}
.ed-record h3 {
  margin: 0;
  color: #272a3b;
  font-size: 17px;
}
.ed-record p {
  margin: 4px 0 12px;
  color: #62697a;
  font-size: 12px;
}
.ed-record-scroll {
  overflow-x: auto;
}
.ed-record table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.ed-record table th,
.ed-record table td {
  border-bottom: 1px solid #eaebf1;
  padding: 9px 7px;
  text-align: left;
}
.ed-record thead th {
  background: #f4f5f9;
  color: #555d72;
  font-weight: 600;
}
.ed-record tbody th {
  font-weight: 600;
}
.ed-record-footer {
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.ed-record-footer strong {
  color: #463a9d;
  font-size: 13px;
}
.ed-workbook :focus-visible,
.ed-settings :focus-visible {
  outline: 2px solid var(--ed-accent, #5242bd);
  outline-offset: 2px;
}

@media (max-width: 760px) {
  .ed-spec {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 4px;
  }
  .ed-spec button:nth-child(3)::before {
    display: none;
  }
}
@media (max-width: 480px) {
  .ed-definition {
    padding: 11px 11px 8px;
    gap: 6px;
    align-items: flex-end;
  }
  .ed-select-wrap select {
    font-size: 15px;
  }
  .ed-outcome {
    display: grid;
    gap: 0;
  }
  .ed-spec {
    padding: 1px 4px 8px;
  }
  .ed-tabs {
    gap: 9px;
    margin: 8px 0 10px;
  }
  .ed-tabs button {
    gap: 4px;
    font-size: 11.5px;
  }
  .ed-spec b {
    font-size: 11.5px;
  }
}

@media (min-width: 650px) {
  .modal[data-kind='participant'] {
    position: fixed;
    inset: 0 0 0 auto;
    width: min(460px, 85vw);
    height: 100dvh;
    max-height: 100dvh;
    margin: 0;
    border-radius: 0;
    border: 0;
    border-left: 1px solid #d7d9e4;
    box-shadow: -12px 0 45px #25294121;
  }
  .modal[data-kind='participant']::backdrop {
    background: #1e233935;
  }
}

.sce {
  --sce-ink: #202438;
  --sce-muted: #515b70;
  --sce-accent: #4c43bc;
  color: var(--sce-ink);
  background: #fff;
  border: 1px solid #dce0e9;
  border-radius: 12px;
  min-width: 0;
  overflow: hidden;
  container-type: inline-size;
  font-variant-numeric: tabular-nums;
}

.sce,
.sce * {
  box-sizing: border-box;
}

.sce-context {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 3px 16px;
  padding: 11px 19px;
  background: #f8f9fc;
  border-bottom: 1px solid #e6e8ef;
  font-size: 11px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.sce-context strong {
  font-size: 12px;
  font-weight: 640;
}
.sce-context span {
  color: var(--sce-muted);
}
.sce-details > summary {
  cursor: pointer;
  list-style: none;
}
.sce-details > summary::-webkit-details-marker {
  display: none;
}
.sce-details > summary:hover .sce-method-key {
  color: var(--sce-accent);
}
.sce-details > summary:focus-visible {
  outline: 2px solid var(--sce-accent);
  outline-offset: -3px;
}
.sce-method-key {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sce-method-key::after {
  content: '';
  display: block;
  width: 5px;
  height: 5px;
  border-right: 1.4px solid currentColor;
  border-bottom: 1.4px solid currentColor;
  transform: rotate(45deg) translateY(-1.5px);
}
.sce-details[open] .sce-method-key::after {
  transform: rotate(225deg) translate(-1px, -1px);
}
.sce-model-description {
  margin: 0;
  padding: 9px 19px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--sce-muted);
  border-bottom: 1px solid #e6e8ef;
  overflow-wrap: anywhere;
}

.sce-effect {
  display: grid;
  grid-template-columns: minmax(100px, 0.76fr) minmax(0, 2fr);
  column-gap: 22px;
  align-items: center;
  padding: 15px 22px 16px 19px;
}

.sce .sce-label {
  color: var(--sce-ink);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.35;
  letter-spacing: -0.015em;
  margin: 0;
}

.sce-summary {
  display: grid;
  gap: 2px;
}
.sce .sce-effect-number {
  color: var(--sce-accent);
  font-size: clamp(26px, 6.5cqi, 40px);
  font-weight: 600;
  letter-spacing: -0.055em;
  line-height: 1.1;
}

.sce-summary-unit,
.sce-visit,
.sce-ci-caption,
.sce-legend,
.sce-group-mean,
.sce-mean-caption,
.sce-arm-label,
.sce-no-estimate,
.sce-obs-empty {
  font-size: 11px;
  line-height: 1.4;
}
.sce-summary-unit,
.sce-visit,
.sce-legend,
.sce-mean-caption,
.sce-no-estimate,
.sce-obs-empty {
  color: var(--sce-muted);
}
.sce-model-chart {
  min-width: 0;
  padding: 0 6px;
}
.sce-ci-caption {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin: 0 0 4px;
  color: var(--sce-muted);
}
.sce-ci-caption strong {
  color: var(--sce-ink);
  font-weight: 620;
}

.sce svg.sce-track {
  display: block;
  overflow: visible;
  max-width: none;
}
.sce svg .sce-grid {
  stroke: #e0e3ec;
  stroke-width: 1;
}
.sce svg .sce-zero-line {
  stroke: #858fa4;
  stroke-dasharray: 2 2;
}
.sce svg .sce-whisker,
.sce svg .sce-cap {
  stroke: var(--sce-accent);
  stroke-width: 2;
}
.sce svg .sce-whisker {
  stroke-width: 2.5;
}
.sce svg .sce-estimate-point {
  fill: var(--sce-accent);
  stroke: white;
  stroke-width: 1.4;
}

.sce-axis {
  height: 16px;
  min-width: 0;
  position: relative;
}
.sce-tick {
  position: absolute;
  top: 1px;
  transform: translateX(-50%);
  font-size: 10px;
  line-height: 1.25;
  color: #647085;
  white-space: nowrap;
}
.sce-tick:first-child {
  transform: none;
}
.sce-tick:last-child {
  transform: translateX(-100%);
}
.sce-zero {
  color: var(--sce-ink);
}

.sce-observations {
  padding: 12px 19px 10px;
  border-top: 1px solid #e6e8ef;
}
.sce-observed-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 2px 9px;
  margin-bottom: 8px;
}
.sce-visit {
  overflow-wrap: anywhere;
}
.sce-data {
  display: grid;
  grid-template-columns: minmax(70px, 0.65fr) minmax(0, 2.35fr) minmax(40px, auto);
  gap: 1px 12px;
  align-items: center;
}
.sce-arm-label {
  display: grid;
  gap: 0;
  min-width: 0;
  padding: 2px 0;
}
.sce-arm-label strong {
  font-weight: 600;
  overflow-wrap: anywhere;
  color: var(--sce-ink);
}
.sce-arm-label small {
  font-size: 10px;
  color: var(--sce-muted);
}
.sce-obs-lane {
  display: grid;
  align-content: center;
  min-width: 0;
  min-height: 33px;
}
.sce-obs-empty {
  color: #70501e;
}
.sce-group-mean {
  text-align: right;
  font-weight: 600;
}
.sce-mean-caption {
  text-align: right;
  font-size: 10px;
}
.sce svg .sce-arm-0 {
  fill: #6662be;
}
.sce svg .sce-arm-1 {
  fill: #358278;
}
.sce svg .sce-arm-mark {
  opacity: 0.86;
}
.sce svg .sce-mean-halo {
  stroke: #fff;
  stroke-width: 4.5px;
}
.sce svg .sce-mean {
  stroke: #252b3e;
  stroke-width: 2px;
}

.sce-legend {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-top: 4px;
  font-size: 10px;
}
.sce-dot-key {
  width: 6px;
  height: 6px;
  background: #67718c;
  border-radius: 50%;
}
.sce-bin-key {
  width: 8px;
  height: 7px;
  background: #67718c;
}
.sce-mean-key {
  width: 2px;
  height: 10px;
  background: #252b3e;
  margin-left: 8px;
}

@container (max-width: 390px) {
