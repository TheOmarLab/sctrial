      pins.splice(index, 1);
      renameId = null;
      pendingFocus = 'undo';
      changed();
      notice('Pin removed.');
    }
    function restoreDeleted() {
      if (!undo) return;
      const item = undo;
      pins.splice(Math.min(item.index, pins.length), 0, item.pin);
      leftId = item.left;
      rightId = item.right;
      undo = null;
      pendingFocus = 'open-' + item.pin.id;
      changed();
      notice('Pin restored.');
    }
    function setPair(side, id) {
      if (!find(id)) return;
      if (side === 'a') {
        if (id === rightId) rightId = leftId;
        leftId = id;
      } else {
        if (id === leftId) leftId = rightId;
        rightId = id;
      }
      pendingFocus = 'selector-' + side;
      selection();
      persist();
      redraw();
    }
    function openPin(id) {
      const item = find(id);
      if (item && onRestore) onRestore(clone(item.snapshot.spec), clone(item.snapshot));
    }

    function sideSelector(side, item) {
      const block = el('div', 'cbench-side cbench-' + side);
      const badge = el('span', 'cbench-letter', side.toUpperCase());
      badge.setAttribute('aria-hidden', 'true');
      const col = el('div', 'cbench-choice');
      const select = el('select', 'cbench-select');
      select.dataset.benchFocus = 'selector-' + side;
      select.setAttribute('aria-label', 'Pinned contrast ' + side.toUpperCase());
      pins.forEach((p) => select.add(new Option(p.name, p.id)));
      if (!item) {
        const placeholder = new Option(
          side === 'a' ? 'First contrast' : 'Second contrast',
          '',
          true,
          true,
        );
        select.add(placeholder, 0);
        select.value = '';
        select.disabled = true;
      } else {
        select.value = item.id;
        select.addEventListener('change', () => setPair(side, select.value));
      }
      col.append(select);
      if (item) {
        const x = item.snapshot;
        col.append(
          el(
            'small',
            '',
            [designNames[x.spec.design] || x.spec.design, groups(x)].filter(Boolean).join(' · '),
          ),
        );
        col.append(el('small', '', [visits(x), x.spec.population].filter(Boolean).join(' · ')));
      }
      block.append(badge, col);
      return block;
    }

    function table(a, b) {
      const pins = [a, b];
      const cols = pins.map((p) =>
        p ? new Map(p.snapshot.rows.map((r) => [r.id, r])) : new Map(),
      );
      const ids = new Set([...cols[0].keys(), ...cols[1].keys()]);
      const units = cols.map(
        (rows, i) => new Set([...rows.values()].map((r) => rowUnit(r, pins[i]?.snapshot))),
      );
      const sameUnits = new Set([...units[0], ...units[1]]).size === 1;
      const matched = new Set(
        [...ids].filter((id) => {
          const left = cols[0].get(id);
          const right = cols[1].get(id);
          const unit = rowUnit(left, a?.snapshot);
          return left && right && unit && unit === rowUnit(right, b.snapshot);
        }),
      );
      const compare = matched.size > 0;
      const sharedDomain =
        compare && sameUnits && sharedFeatureUnit
          ? estimateDomain([...cols[0].values(), ...cols[1].values()])
          : null;
      const scroll = el('div', 'cbench-scroll');
      scroll.tabIndex = 0;
      scroll.setAttribute('role', 'region');
      scroll.setAttribute('aria-label', 'Scrollable comparison table');
      const t = el('table', 'cbench-table');
      t.setAttribute('aria-label', 'Side-by-side feature estimates for pinned contrasts');
      const header = t.createTHead().insertRow();
      const columnLabels = pins.map((pin, index) => {
        const side = index ? 'B' : 'A';
        if (!pin) return side;
        const unit = units[index].size === 1 ? [...units[index]][0] : '';
        return side + ' · ' + (unit || 'Estimate');
      });
      ['Feature', ...columnLabels].forEach((text) => {
        const c = el('th', '', text);
        c.scope = 'col';
        header.append(c);
      });
      if (compare) {
        t.classList.add('cbench-with-forest');
        if (sharedDomain) header.cells[0].append(axisLabels(sharedDomain));
        else header.cells[0].textContent = 'Feature · separate scales';
        [1, 2].forEach((column) => {
          const glyph = el('span', 'cbench-key cbench-key-' + column);
          glyph.setAttribute('aria-hidden', 'true');
          header.cells[column].prepend(glyph);
        });
      }
      const body = t.createTBody();
      ids.forEach((id) => {
        const tr = body.insertRow();
        const exemplar = cols[0].get(id) || cols[1].get(id);
        const name = el('th', 'cbench-row-label', exemplar.label || id);
        name.scope = 'row';
        const pair = cols.map((records) => records.get(id));
        const rowUnits = [
          ...new Set(pair.flatMap((row, i) => (row ? [rowUnit(row, pins[i].snapshot)] : []))),
        ];
        const showRowUnit =
          units.some((values) => values.size > 1) && rowUnits.length === 1 && rowUnits[0];
        if (showRowUnit) name.append(el('small', '', rowUnits[0]));
        name.setAttribute(
          'aria-label',
          (exemplar.label || id) + (showRowUnit ? ', ' + rowUnits[0] : ''),
        );
        if (matched.has(id)) {
          const domain = sharedDomain || estimateDomain(pair);
          if (domain) {
            name.append(pairPlot(pair[0], pair[1], domain, exemplar.label || id));
            if (!sharedDomain) name.append(axisLabels(domain));
          }
        }
        tr.append(name);
        cols.forEach((records, i) => {
          const row = records.get(id),
            td = tr.insertCell();
          td.className = 'cbench-value cbench-' + (i ? 'b' : 'a');
          if (!row) {
            td.append(el('span', 'cbench-unavailable', '—'));
            if (i === 0 || b) td.append(el('small', '', 'Feature absent'));
            return;
          }
          td.append(el('strong', '', estimate(row.estimate)));
          if (!showRowUnit && units[i].size > 1 && rowUnit(row, pins[i].snapshot)) {
            td.append(el('small', '', rowUnit(row, pins[i].snapshot)));
          }
          if (hasInterval(row))
            td.append(el('small', '', '95% CI ' + estimate(row.lo) + ' to ' + estimate(row.hi)));
          if (Number.isInteger(row.n) && row.n >= 0)
            td.append(el('small', '', 'n = ' + row.n.toLocaleString()));
        });
      });
      scroll.append(t);
      return scroll;
    }
    function renameForm(item) {
      const form = el('form', 'cbench-name-form');
      const input = el('input', 'cbench-name-input');
      input.maxLength = 110;
      input.value = item.name;
      input.setAttribute('aria-label', 'Pin name');
      input.dataset.benchFocus = 'edit-' + item.id;
      const apply = el('button', 'cbench-button cbench-strong', 'Save');
      apply.type = 'submit';
      const cancel = button('Cancel', '', () => {
        renameId = null;
        pendingFocus = 'rename-' + item.id;
        redraw();
      });
      form.append(input, apply, cancel);
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = input.value.trim();
        if (!title) {
          input.setCustomValidity('Enter a name.');
          input.reportValidity();
          return;
        }
        item.name = title;
        renameId = null;
        pendingFocus = 'rename-' + item.id;
        changed();
      });
      input.addEventListener('input', () => input.setCustomValidity(''));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          cancel.click();
        }
      });
      return form;
    }
    function shelfRow(item) {
      const li = el('li', 'cbench-pin');
      if (renameId === item.id) {
        li.append(renameForm(item));
        return li;
      }
      const badge = el(
        'span',
        'cbench-dot ' + (item.id === leftId ? 'cbench-a' : item.id === rightId ? 'cbench-b' : ''),
        item.id === leftId ? 'A' : item.id === rightId ? 'B' : '•',
      );
      badge.setAttribute('aria-hidden', 'true');
      const block = el('div', 'cbench-row-label');
      block.append(el('strong', '', item.name));
      block.append(
        el(
          'small',
          '',
          [groups(item.snapshot), item.snapshot.spec.population, visits(item.snapshot)]
            .filter(Boolean)
            .join(' · '),
        ),
      );
      const open = iconButton('Reopen ' + item.name, 'open', () => openPin(item.id));
      open.dataset.benchFocus = 'open-' + item.id;
      const rename = iconButton('Rename ' + item.name, 'pencil', () => {
        renameId = item.id;
        pendingFocus = 'edit-' + item.id;
        redraw();
      });
      rename.dataset.benchFocus = 'rename-' + item.id;
      const drop = iconButton('Remove ' + item.name, 'close', () => remove(item.id));
      const controls = el('div', 'cbench-pin-actions');
      controls.append(open, rename, drop);
      li.append(badge, block, controls);
      return li;
    }
    function render(target) {
      container = target;
      selection();
      const root = el('section', 'cbench');
      root.setAttribute('aria-label', 'Pinned comparisons');
      const a = find(leftId),
        b = find(rightId);
      const main = el('div', 'cbench-main'),
        head = el('header', 'cbench-header');
      head.append(el('h2', '', 'Side-by-side comparison'));
      const add = button('Pin current contrast', 'cbench-strong', pin, 'pin');
      add.dataset.benchFocus = 'pin';
      head.append(add);
      main.append(head);
      const pair = el('div', 'cbench-pair');
      const swap = iconButton('Swap pinned contrasts', 'swap', () => {
        [leftId, rightId] = [rightId, leftId];
        pendingFocus = 'swap';
        persist();
        redraw();
      });
      swap.classList.add('cbench-swap');
      swap.disabled = !a || !b;
      swap.dataset.benchFocus = 'swap';
      pair.append(sideSelector('a', a), swap, sideSelector('b', b));
      main.append(pair);
      if (!a) {
        const empty = el('div', 'cbench-empty');
        empty.append(
          el('h3', '', 'Pin a contrast to start'),
          el(
            'p',
            '',
            'Keep one comparison here, then change the visit, group, or population and pin the next.',
          ),
        );
        if (onExplore) empty.append(button('Open workspace', 'cbench-text', onExplore, 'open'));
        main.append(empty);
      } else {
        if (!b) {
          const tip = el('div', 'cbench-tip');
          tip.append(
            el('span', '', 'Change the study contrast and pin a second result to compare.'),
          );
          if (onExplore) tip.append(button('Open workspace', 'cbench-text', onExplore, 'open'));
          main.append(tip);
        } else {
          const differences = [];
          if (a.snapshot.spec.design !== b.snapshot.spec.design)
            differences.push('Different study designs');
          const rightRows = new Map(b.snapshot.rows.map((r) => [r.id, r]));
          if (
            a.snapshot.rows.some((r) => {
              const right = rightRows.get(r.id);
              return right && rowUnit(r, a.snapshot) !== rowUnit(right, b.snapshot);
            })
          )
            differences.push('Units differ for some outcomes');
          if (differences.length)
            main.append(
              el(
                'div',
                'cbench-tip',
                differences.join(' · ') + '. Interpret each estimate on its own scale.',
              ),
            );
        }
        main.append(table(a, b));
      }
      root.append(main);

  function disposeContrastCanvas(container) {
    const prior = states.get(container);
    if (!prior) return;
    prior.observer?.disconnect();
    if (prior.frame) cancelAnimationFrame(prior.frame);
    states.delete(container);
  }
  function renderContrastCanvas(container, model, actions = {}) {
    if (!container) return;
    let state = states.get(container);
    if (!state) {
      state = { container, lastWidth: 0, frame: 0 };
      states.set(container, state);
      if (typeof ResizeObserver === 'function') {
        state.observer = new ResizeObserver(() => {
          if (
            !container.isConnected ||
            Math.floor(container.clientWidth) === state.lastWidth ||
            state.frame
          )
            return;
          state.frame = requestAnimationFrame(() => {
            state.frame = 0;
            if (states.has(container)) paint(state);
          });
        });
        state.observer.observe(container);
      }
    }
    state.m = model;
    state.a = actions;
    state.data = prep(model);
    paint(state);
  }
  window.setContrastVisitCursor = (container, visit) => {
    const state = states.get(container);
    if (!state) return;
    state.cursor = visit;
    state.drawCursor?.(visit);
  };
  window.renderContrastCanvas = renderContrastCanvas;
  window.disposeContrastCanvas = disposeContrastCanvas;
})();

(() => {
  'use strict';

  const scoreLimit = 12;
  const roles = [
    { key: 'participant', label: 'Participant ID', empty: 'Choose a column' },
    { key: 'arm', label: 'Group', empty: 'One group' },
    { key: 'visit', label: 'Visit', empty: 'One collection occasion' },
    { key: 'population', label: 'Cell population', empty: 'All cells' },
  ];
  let active = null;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function makeButton(label, className, onClick) {
    const button = el('button', className, label);
    button.type = 'button';
    button.addEventListener('click', onClick);
    return button;
  }

  function available() {
    return typeof window.SCTRIAL_LOCAL?.session === 'string' && Boolean(window.SCTRIAL_LOCAL.session);
  }

  async function request(endpoint, payload, signal) {
    if (!available()) throw new Error('Open the workspace from the local H5AD launcher.');
    const headers = { Accept: 'application/json', 'X-sctrial-session': window.SCTRIAL_LOCAL.session };
    const options = {
      method: 'GET',
      headers,
      cache: 'no-store',
      credentials: 'same-origin',
      redirect: 'error',
      signal,
    };
    if (payload !== undefined) {
      options.method = 'POST';
      headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(payload);
    }
    let response;
    try {
      response = await fetch(endpoint, options);
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      throw new Error('The local workspace could not be reached. Check the launcher and try again.');
    }
    let result;
    try {
      result = await response.json();
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      throw new Error('The local workspace returned an unreadable response.');
    }
    if (!response.ok) {
      throw new Error(
        typeof result?.error === 'string'
          ? result.error
          : 'The local workspace could not complete this request.',
      );
    }
    return result;
  }

  async function fit(study, config, signal) {
    if (!study?.studyId) throw new Error('Map the study fields before fitting a comparison.');
    if (!['did', 'paired', 'cross'].includes(config.design))
      throw new Error('Choose a supported comparison.');
    const body = {
      studyId: study.studyId,
      design: config.design,
      arm: config.arm,
      visit: config.visit,
      population: config.population,
    };
    if (config.design !== 'cross') body.baseline = config.baseline;
    if (config.design !== 'paired') body.reference = config.reference;
    if (Array.isArray(config.participants)) body.participants = config.participants;
    const result = await request('/local/fit', body, signal);
    if (!result || !Array.isArray(result.rows))
      throw new Error('The local fit returned no results table.');
    return result;
  }

  function inferVisitOrder(visits) {
    if (visits.length < 2) return visits.slice();
    const labels = visits.map((visit) => visit.trim().toLowerCase());
    const baseline = /^(?:baseline|before|pre|pre[- ]?treatment)$/;
    const follow = /^(?:after|post|post[- ]?treatment|follow[- ]?up)$/;
    if (
      visits.length === 2 &&
      labels.some((v) => baseline.test(v)) &&
      labels.some((v) => follow.test(v))
    ) {
      return baseline.test(labels[0]) ? visits.slice() : [visits[1], visits[0]];
    }
    if (labels.every((v) => /^\d{4}-\d{2}-\d{2}$/.test(v))) return visits.slice().sort();
    // Order only a single explicit scale. Mixed scales or unrecognized stages need confirmation.
    const units = {
      day: 'day',
      d: 'day',
      week: 'week',
      wk: 'week',
      w: 'week',
      month: 'month',
      mo: 'month',
      visit: 'visit',
      v: 'visit',
      cycle: 'cycle',
    };
    const unitSet = new Set();
    const times = [];
    for (const label of labels) {
      if (baseline.test(label)) {
        times.push(0);
        continue;
      }
      const parts = /^(day|d|week|wk|w|month|mo|visit|v|cycle)?\s*([+-]?\d+(?:\.\d+)?)$/.exec(label);
      if (!parts) return null;
      unitSet.add(units[parts[1]] || 'number');
      times.push(Number(parts[2]));
    }
    if (unitSet.size !== 1 || new Set(times).size !== times.length) return null;
    return visits
      .map((visit, index) => ({ visit, time: times[index] }))
      .sort((a, b) => a.time - b.time)
      .map((point) => point.visit);
  }

  function reviewVisitOrder(study, keepOnCancel = false) {
    const visits = study.visits.slice();
    if (visits.length < 2) return Promise.resolve(visits);
    const prior = document.activeElement;
    const dialog = el('dialog', 'local-mapping lm-visit-dialog');
    dialog.setAttribute('aria-labelledby', 'lm-visit-heading');
    const header = el('div', 'lm-header');
    const heading = el('h2', '', 'Visit order');
    heading.id = 'lm-visit-heading';
    const title = el('div');
    title.append(el('p', 'lm-eyebrow', study.title), heading);
    header.append(title);
    const body = el('div', 'lm-body');
    const label = el('label', 'lm-field');
    label.append(el('span', '', 'Earliest to latest'));
    const box = el('select');
    box.size = Math.min(7, Math.max(3, visits.length));
    box.id = 'lm-ordered-visits';
    label.htmlFor = box.id;
    const announce = el('p', 'lm-order-status');
    announce.setAttribute('role', 'status');
    const actions = el('div', 'lm-order-actions');
    const up = makeButton('↑ Earlier', 'lm-action', () => move(-1));
    const down = makeButton('↓ Later', 'lm-action', () => move(1));
    actions.append(up, down);
    visits.forEach((visit) => box.append(new Option(visit, visit)));
    function updateButtons() {
      up.disabled = box.selectedIndex <= 0;
      down.disabled = box.selectedIndex < 0 || box.selectedIndex >= box.length - 1;
    }
    function move(direction) {
      const index = box.selectedIndex;
      const target = index + direction;
      if (target < 0 || target >= box.length || index < 0) return;
      const option = box.options[index];
      box.insertBefore(option, direction < 0 ? box.options[target] : box.options[target].nextSibling);
      box.selectedIndex = target;
      announce.textContent = option.label + ', position ' + (target + 1) + ' of ' + box.length + '.';
      updateButtons();
      if (up.disabled || down.disabled) box.focus();
    }
    box.selectedIndex = 0;
    box.addEventListener('change', updateButtons);
    updateButtons();
    label.append(box);
    body.append(
      label,
      actions,
      el(
        'p',
        'lm-note',
        'This order sets the trajectory axis. Choose the comparison visits in the sheet.',
      ),
      announce,
    );
    const foot = el('div', 'lm-foot');
    const cancel = makeButton(keepOnCancel ? 'Keep file order' : 'Cancel', 'lm-action', () =>
      dialog.close(),
    );
    const confirm = makeButton('Apply order', 'lm-action lm-primary', () => dialog.close('apply'));
    foot.append(cancel, confirm);
    dialog.append(header, body, foot);
    document.body.append(dialog);
    return new Promise((resolve) => {
      dialog.addEventListener(
        'close',
        () => {
          const chosen =
            dialog.returnValue === 'apply'
              ? Array.from(box.options, (option) => option.value)
              : keepOnCancel
                ? visits
                : null;
          dialog.remove();
          if (prior?.isConnected) prior.focus({ preventScroll: true });
          resolve(chosen);
        },
        { once: true },
      );
      dialog.showModal();
      box.focus();
    });
  }

  async function openCSV(study, onLoaded) {
    const visits = inferVisitOrder(study.visits) || (await reviewVisitOrder(study));
    if (!visits) return false;
    onLoaded({ ...study, visits });
    return true;
  }

  function openMapping(onLoaded) {
    if (!available()) return Promise.resolve(null);
    if (active) return active.promise;
    const focusBeforeOpen = document.activeElement;
    const controller = new AbortController();
    const dialog = el('dialog', 'local-mapping');
    dialog.setAttribute('aria-labelledby', 'lm-heading');
    const form = el('form');
    const header = el('div', 'lm-header');
    const title = el('div');
    const heading = el('h2', '', 'Map study fields');
    heading.id = 'lm-heading';
    title.append(el('p', 'lm-eyebrow', 'Local H5AD'), heading);
    const dismiss = makeButton('×', 'lm-dismiss', () => dialog.close());
    dismiss.setAttribute('aria-label', 'Close mapping');
    header.append(title, dismiss);
    const body = el('div', 'lm-body'),
      foot = el('div', 'lm-foot');
    const errorBox = el('p', 'lm-error');
    errorBox.hidden = true;
    errorBox.setAttribute('role', 'alert');
    const cancel = makeButton('Cancel', 'lm-action', () => dialog.close());
    const submit = el('button', 'lm-action lm-primary', 'Open study');
    submit.type = 'submit';
    submit.disabled = true;
    foot.append(cancel, submit);
    form.append(header, body, foot);
    dialog.append(form);
    document.body.append(dialog);
    const status = el('div', 'lm-progress');
    status.setAttribute('role', 'status');
    const spinner = el('span', 'lm-spinner');
    spinner.setAttribute('aria-hidden', 'true');
    status.append(spinner, el('span', '', 'Reading study columns…'));
    body.append(status);

    let finishPromise,
      preparedStudy = null,
      settled = false;
    const promise = new Promise((resolve) => {
      finishPromise = resolve;
    });
    active = { promise };
    dialog.addEventListener(
      'close',
      async () => {
        if (settled) return;
        settled = true;
        controller.abort();
        dialog.remove();
        active = null;
        if (focusBeforeOpen?.isConnected) focusBeforeOpen.focus({ preventScroll: true });
        if (preparedStudy && !preparedStudy.orderedVisits) {
          preparedStudy.visits =
            inferVisitOrder(preparedStudy.visits) || (await reviewVisitOrder(preparedStudy, true));
        }
        finishPromise(preparedStudy);
        if (preparedStudy && typeof onLoaded === 'function') onLoaded(preparedStudy);
      },
      { once: true },
    );
    dialog.showModal();

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function setUp(schema) {
      if (!Array.isArray(schema?.columns) || !schema.columns.every((c) => typeof c?.name === 'string')) {
        throw new Error('The file did not provide a readable observation-column list.');
      }
      const suggested = schema.suggested || {};
      const columns = [...schema.columns].sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { numeric: true }),
      );
      const numeric = columns.filter((c) => c.numeric).map((c) => c.name);
      const selected = new Set(
        (Array.isArray(suggested.scores) ? suggested.scores : [])
          .filter((s) => numeric.includes(s))
          .slice(0, scoreLimit),
      );
      const file = el('div', 'lm-file'),
        fileDetails = el('div');
      const cellCount = Number.isFinite(schema.nCells)
        ? schema.nCells.toLocaleString() + ' cells · '
        : '';
      fileDetails.append(
        el('b', '', schema.filename || 'Local study'),
        el('small', '', cellCount + columns.length + ' observation columns'),
      );
      const mark = el('span', 'lm-file-mark', 'H5');
      mark.setAttribute('aria-hidden', 'true');
      file.append(mark, fileDetails);
      const designSection = el('section', 'lm-section');
      designSection.append(el('h3', '', 'Study design'));
      const grid = el('div', 'lm-fields');
      const selectors = {};
      for (const role of roles) {
        const label = el('label', 'lm-field');
        const select = el('select');
        select.name = role.key;
        select.setAttribute('aria-label', role.label);
        select.append(new Option(role.empty, ''));
        columns.forEach((c) => select.append(new Option(c.name, c.name)));
        const suggestion = suggested[role.key];
        if (columns.some((c) => c.name === suggestion)) select.value = suggestion;
        selectors[role.key] = select;
        label.append(el('span', '', role.label), select);
        grid.append(label);
      }
      designSection.append(grid);

      const scoreSection = el('section', 'lm-section');
      const scoreHead = el('div', 'lm-outcome-head'),
        count = el('span', 'lm-count');
      scoreHead.append(el('h3', '', 'Outcome scores'), count);
      const search = el('input');
      search.type = 'search';
      search.placeholder = 'Filter numeric columns';
      search.setAttribute('aria-label', 'Filter numeric columns');
      const scoreList = el('div', 'lm-scores');
      scoreList.setAttribute('role', 'group');
      scoreList.setAttribute('aria-label', 'Outcome scores');
      const note = el(
        'p',
        'lm-note',
        'Choose up to 12 measurements across observation scores and genes.',
      );
      const typeOverrides = new Map();
      const geneBox = el('input');
      geneBox.type = 'text';
      geneBox.placeholder = 'Exact variable names, separated by commas';
      geneBox.setAttribute('aria-label', 'Genes from X');
      const geneLabel = el('label', 'lm-field lm-gene-input');
      geneLabel.append(el('span', '', 'Genes from X'), geneBox);
      const geneNote = el(
        'p',
        'lm-note',
        'Search var_names by typing the first two letters. Expression uses the values stored in X on their original scale.',
      );
      const suggestions = el('div', 'lm-gene-matches');
      suggestions.setAttribute('aria-label', 'Matching genes');
      suggestions.setAttribute('role', 'group');
      let lookupTimer, lookupRequest;
      function clearLookup() {
        clearTimeout(lookupTimer);
        lookupRequest?.abort();
        suggestions.replaceChildren();
      }
      function suggestGenes() {
        clearLookup();
        const parts = geneBox.value.split(',');
        const query = parts.pop().trim();
        if (query.length < 2 || query.length > 160) return;
        const selectedGenes = new Set(parts.map((part) => part.trim()));
        lookupRequest = new AbortController();
        const signal = lookupRequest.signal;
        lookupTimer = setTimeout(async () => {
          try {
            const result = await request('/local/genes', { query }, signal);
            if (signal.aborted || !dialog.open) return;
            for (const name of result.genes || []) {
              if (selectedGenes.has(name)) continue;
              const choose = makeButton(name, 'lm-gene-match', () => {
                clearLookup();
                geneBox.value = [...parts.map((part) => part.trim()).filter(Boolean), name, ''].join(
                  ', ',
                );
                updateState();
                geneBox.focus();
              });
              suggestions.append(choose);
            }
            if (!suggestions.childElementCount) {
              suggestions.append(el('span', 'lm-note', 'No additional matching variables.'));
            }
          } catch (error) {
            if (!signal.aborted && dialog.open) suggestions.append(el('span', 'lm-note', error.message));
          }
        }, 180);
      }
      controller.signal.addEventListener('abort', clearLookup, { once: true });
      geneBox.addEventListener('input', suggestGenes);
      geneBox.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown' && suggestions.querySelector('button')) {
          event.preventDefault();
          suggestions.querySelector('button').focus();
        } else if (event.key === 'Escape' && suggestions.childElementCount) {
          event.preventDefault();
          event.stopPropagation();
          clearLookup();
        }
      });
      const inputGenes = () =>
        geneBox.value
          .split(',')
          .map((gene) => gene.trim())
          .filter(Boolean);
      const validation = el('p', 'lm-note');
      validation.setAttribute('role', 'status');
      scoreSection.append(scoreHead, search, scoreList);
      if (schema.geneInput) scoreSection.append(geneLabel, suggestions, geneNote);
      scoreSection.append(note, validation);
      body.replaceChildren(file, designSection, scoreSection, errorBox);

      const mappedRoles = () => roles.map((r) => selectors[r.key].value).filter(Boolean);
      function updateState() {
        const mapped = mappedRoles();
        const overlap = new Set(mapped).size !== mapped.length;
        const genes = inputGenes();
        const total = selected.size + genes.length;
        const problem = !selectors.participant.value
          ? 'Choose the participant ID column.'
          : overlap
            ? 'Use a different column for each study role.'
            : new Set(genes).size !== genes.length
              ? 'Enter each X variable once.'
              : total === 0
                ? 'Choose at least one numeric score or X variable.'
                : total > scoreLimit
                  ? 'Choose up to 12 measurements in total.'
                  : '';
        submit.disabled = Boolean(problem);
        validation.textContent = problem;
        validation.hidden = !problem;
        count.textContent = total + ' selected';
        const locked = new Set(mapped);
        scoreList.querySelectorAll('input').forEach((box) => {
          box.disabled = locked.has(box.value) || (!box.checked && total >= scoreLimit);
        });
      }
      function drawScores() {
        const needle = search.value.trim().toLocaleLowerCase();
        const matches = numeric.filter((n) => n.toLocaleLowerCase().includes(needle));
        const fragment = document.createDocumentFragment();
        for (const name of matches) {
          const row = el('label', 'lm-score'),
            check = el('input');
          check.type = 'checkbox';
          check.value = name;
          check.checked = selected.has(name);
          check.addEventListener('change', () => {
            if (check.checked) selected.add(name);
            else selected.delete(name);
            errorBox.hidden = true;
            updateState();
          });
          row.append(check, el('span', '', name));
          const entry = el('div', 'lm-score-row');
          const type = el('select', 'lm-score-type');
          type.setAttribute('aria-label', 'Measurement type for ' + name);
          const implied = /^(gene|pathway|module):/i.exec(name)?.[1].toLowerCase() || 'score';
          for (const [key, label] of [
            ['score', 'Other score'],
            ['module', 'Module score'],
            ['pathway', 'Pathway score'],
            ['gene', 'Gene expression'],
          ]) {
            type.add(new Option(label, key));
          }
          type.value = typeOverrides.get(name) || implied;
          type.hidden = !check.checked;
          check.addEventListener('change', () => {
            type.hidden = !check.checked;
          });
          type.addEventListener('change', () => {
            if (type.value === implied) typeOverrides.delete(name);
            else typeOverrides.set(name, type.value);
          });
          entry.append(row, type);
          fragment.append(entry);
        }
        if (!matches.length)
          fragment.append(
            el(
              'p',
              'lm-empty',
              numeric.length ? 'No scores match this filter.' : 'No numeric columns found.',
            ),
          );
        scoreList.replaceChildren(fragment);
        updateState();
      }
      function roleChanged() {
        mappedRoles().forEach((name) => selected.delete(name));
        errorBox.hidden = true;
        drawScores();
      }
      Object.values(selectors).forEach((select) => select.addEventListener('change', roleChanged));
      search.addEventListener('input', drawScores);
      geneBox.addEventListener('input', updateState);
      roleChanged();
      selectors.participant.focus({ preventScroll: true });
      let sending = false;
      form.onsubmit = async (event) => {
        event.preventDefault();
        if (sending || submit.disabled) return;
        sending = true;
        clearLookup();
        const payload = Object.fromEntries(roles.map((r) => [r.key, selectors[r.key].value || null]));
        payload.scores = [...selected];
        const genes = inputGenes();
        if (genes.length) payload.genes = genes;
        const scoreKinds = [...typeOverrides].filter(([name]) => selected.has(name));
        if (scoreKinds.length) payload.scoreKinds = Object.fromEntries(scoreKinds);
        errorBox.hidden = true;
        submit.disabled = true;
        submit.textContent = 'Opening…';
        for (const control of body.querySelectorAll('input,select')) control.disabled = true;
        try {
          const result = await request('/local/study', payload, controller.signal);
          if (!dialog.open || controller.signal.aborted) return;
          if (
            !result?.studyId ||
            !Array.isArray(result.visits) ||
            !result.visits.length ||
            !Array.isArray(result.participants) ||
            !Array.isArray(result.features) ||
            !Array.isArray(result.observations)
          ) {
            throw new Error('The local workspace returned an incomplete study.');
          }
          preparedStudy = result;
          dialog.close();
        } catch (error) {
          if (controller.signal.aborted || !dialog.open) return;
          for (const control of body.querySelectorAll('input,select')) control.disabled = false;
          submit.textContent = 'Open study';
          updateState();
          showError(error.message);
          sending = false;
        }
      };
    }

    async function load() {
      errorBox.hidden = true;
      submit.hidden = false;
      submit.disabled = true;
      body.replaceChildren(status);
      try {
        const schema = await request('/local/schema', undefined, controller.signal);
        if (!controller.signal.aborted && dialog.open) setUp(schema);
      } catch (error) {
        if (controller.signal.aborted || !dialog.open) return;
        body.replaceChildren(errorBox);
        showError(error.message);
        submit.hidden = true;
        const retry = makeButton('Retry', 'lm-action lm-primary', () => {
          retry.remove();
          load();
        });
        foot.append(retry);
        retry.focus();
      }
    }
    load();
    return promise;
  }
  window.localStudyClient = Object.freeze({ available, openMapping, openCSV, reviewVisitOrder, fit });
})();

// A link selects a workspace view. Study names, participant IDs and outcomes stay in the document.
(() => {
  'use strict';
  const fragments = new Map(
    Object.entries({
      cells: 'cells',
      genes: 'expression',
      pathways: 'pathways',
      modules: 'scores',
      trajectory: 'time',
      comparison: 'plot',
      changes: 'changes',
      measurements: 'measurements',
      participants: 'participants',
      results: 'results',
      bench: 'pins',
    }),
  );
  const modes = new Map(Array.from(fragments, ([mode, hash]) => [hash, mode]));
  let listening = false;
  let lastMode = 'cells';
  const followFragment = () => {
    const fragment = location.hash.slice(1);
    const mode = fragment ? modes.get(fragment) : 'cells';
    if (!mode || mode === lastMode) return;
    lastMode = mode;
    const detail = ['participants', 'results', 'bench'].includes(mode)
      ? { view: mode }
      : { view: 'overview', mode };
    document.dispatchEvent(new CustomEvent('sctrial:menu-command', { detail }));
  };
  window.SctrialNavigation = {
    sync(mode) {
      if (!listening || !fragments.has(mode) || mode === lastMode) return;
      lastMode = mode;
      const hash = '#' + fragments.get(mode);
      if (location.hash !== hash) {
        try {
          history.pushState(null, '', hash);
        } catch {
          /* Embedded and local viewers can restrict browser history. */
        }
      }
    },
  };
  window.addEventListener('DOMContentLoaded', () => {
    listening = true;
    followFragment();
  });
  window.addEventListener('popstate', followFragment);
  window.addEventListener('hashchange', followFragment);
})();

(() => {
  'use strict';

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  const icons = {
    sheet: 'M4 2.5h6.8l3.4 3.4v9.6H4z M10.5 2.8v3.6h3.6 M6.5 12v-2.5m2.4 2.5V8.5m2.4 3.5v-2',
    rename: 'm4 12.5-.6 3.1 3.1-.6L15 6.5 12.5 4z M11 5.5 13.5 8',
    duplicate: 'M7 7h8v8H7z M4.5 12H3.3V3.3H12v1.2',
    remove: 'M3.5 5h11M7 5V3h4v2 M5 5l.7 10h6.6L13 5 M8 7.5v5 M10 7.5v5',
  };

  function glyph(name) {
    const ns = 'http://www.w3.org/2000/svg';

    svg.setAttribute('viewBox', '0 0 18 18');
    svg.setAttribute('fill', 'none');

        dot.setAttribute('cx', x);
        dot.setAttribute('cy', '9');
        dot.setAttribute('r', '1.2');
        dot.setAttribute('fill', 'currentColor');

      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', icons[name]);

      path.setAttribute('stroke-width', '1.45');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('stroke-linecap', 'round');

  window.createAnalysisSheets = function ({ getSpec, getStudy, onOpen, onRename = () => {} }) {

      overview = true;

    function open(paper, rebuild = false) {
      if (paper === active && overview) return;

      tab?.focus({ preventScroll: true });

    }

    function unique(base, names = new Set(papers.map((paper) => paper.title))) {
      let result = base.slice(0, 80);
      let number = 2;
      while (names.has(result)) {

        result = base.slice(0, 80 - suffix.length) + suffix;

      const left = Math.max(6, Math.min(box.right - width, window.innerWidth - width - 6));
      const top = box.bottom + height + 6 <= window.innerHeight ? box.bottom + 3 : box.top - height - 3;
      menu.style.left = left + 'px';
      menu.style.top = Math.max(4, top) + 'px';
    }

    function showMenu(paper, trigger) {
      const same = trigger === menuTrigger;
      dismissMenu();
      if (same) return;
      menuTrigger = trigger;
      menu = node('div', 'sheet-menu');
      menu.setAttribute('role', 'menu');
      menu.setAttribute('aria-label', 'Actions for ' + paper.title);
      trigger.setAttribute('aria-expanded', 'true');
      const items = [
        ['rename', 'Rename', () => editName(paper)],
        ['duplicate', 'Duplicate', () => create(paper)],
        ['remove', 'Remove', () => remove(paper)],
      ];
      items.forEach(([icon, label, action]) => {
        const item = button('sheet-menu-item', label, icon);
        item.setAttribute('role', 'menuitem');
        item.tabIndex = -1;
        item.disabled = icon === 'remove' && papers.length === 1;
        item.append(document.createTextNode(label));
        item.addEventListener('click', () => {
          dismissMenu();
          action();
        });
        menu.append(item);
      });
      menu.addEventListener('keydown', (event) => {
        const enabled = [...menu.querySelectorAll('button:enabled')];
        const index = enabled.indexOf(document.activeElement);
        switch (event.key) {
          case 'ArrowDown':
            enabled[(index + 1) % enabled.length].focus();
            break;
          case 'ArrowUp':
            enabled[(index + enabled.length - 1) % enabled.length].focus();
            break;
          case 'Home':
            enabled[0].focus();
            break;
          case 'End':
            enabled[enabled.length - 1].focus();
            break;
          case 'Escape':
            dismissMenu(true);
            break;
          case 'Tab':
            dismissMenu(true);
            return;
          default:
            return;
        }
        event.preventDefault();
        event.stopPropagation();
      });
      document.body.append(menu);
      placeMenu();
      menu.firstElementChild.focus();
      document.addEventListener('pointerdown', outside, true);
      document.addEventListener('focusin', focusOutside);
      window.addEventListener('resize', placeMenu);
      document.addEventListener('scroll', placeMenu, true);
    }

    function editName(paper) {
      renaming = paper;
      render();
      const input = list.querySelector('input');
      input.focus({ preventScroll: true });
      input.select();
      revealTab(input.closest('.sheet-item'));
    }

    function nameEditor(paper) {
      const form = node('form', 'sheet-name-form');
      const input = node('input', 'sheet-name');
      input.value = paper.title;
      input.maxLength = 80;
      input.autocomplete = 'off';
      input.setAttribute('aria-label', 'Analysis name');
      const finish = (commit, focus) => {
        if (renaming !== paper) return;
        renaming = null;
        const title = input.value
          .trim()
          .replace(/[\u0000-\u001f\u007f]/g, ' ')
          .trim();
        if (commit && title) paper.title = title;
        form.parentElement?.replaceWith(sheetRow(paper));
        markActive();
        onRename();
        if (focus) list.querySelector(`[data-sheet-id="${paper.id}"]`)?.focus();
      };
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        finish(true, true);
      });
      input.addEventListener('blur', () => finish(true, false));
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          finish(false, true);
        }
      });
      form.append(input);
      return form;
    }

    function revealTab(row) {
      if (!row) return;
      const bounds = list.getBoundingClientRect();
      const rect = row.getBoundingClientRect();
      if (rect.left < bounds.left) list.scrollLeft += rect.left - bounds.left;
      else if (rect.right > bounds.right) list.scrollLeft += rect.right - bounds.right;
    }

    function markActive() {
      for (const tab of list.querySelectorAll('[data-sheet-id]')) {
        const selected = tab.dataset.sheetId === String(active?.id);
        tab.tabIndex = selected ? 0 : -1;
        tab.nextElementSibling.tabIndex = selected ? 0 : -1;
        tab.setAttribute('aria-selected', String(overview && selected));
      }
      const panel = document.getElementById('page');
      if (!panel) return;
      if (overview && active) {
        panel.setAttribute('role', 'tabpanel');
        if (renaming === active) {
          panel.removeAttribute('aria-labelledby');
          panel.setAttribute('aria-label', active.title);
        } else {
          panel.removeAttribute('aria-label');
          panel.setAttribute('aria-labelledby', 'sheet-tab-' + active.id);
        }
      } else {
        panel.removeAttribute('aria-label');
        panel.removeAttribute('role');
        panel.removeAttribute('aria-labelledby');
      }
    }

    function navigateTab(event, paper, more) {
      const index = papers.indexOf(paper);
      const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End', 'F2', 'ArrowDown'];
      const contextMenu = event.key === 'F10' && event.shiftKey;
      if (!keys.includes(event.key) && !contextMenu) return;
      event.preventDefault();
      event.stopPropagation();
      if (contextMenu || event.key === 'ArrowDown') return showMenu(paper, more);
      if (event.key === 'F2') return editName(paper);
      if (event.key === 'Home') return open(papers[0]);
      if (event.key === 'End') return open(papers[papers.length - 1]);
      const step = event.key === 'ArrowLeft' ? -1 : 1;
      open(papers[(index + step + papers.length) % papers.length]);
    }

    function sheetRow(paper) {
      const row = node('div', 'sheet-item');
      row.setAttribute('role', 'presentation');
      if (renaming === paper) {
        row.append(nameEditor(paper));
        return row;
      }
      const select = button('sheet-link', paper.title, 'sheet');
      select.id = 'sheet-tab-' + paper.id;
      select.dataset.sheetId = paper.id;
      select.setAttribute('role', 'tab');
      select.setAttribute('aria-controls', 'page');
      select.title = paper.title;
      select.append(node('span', 'sheet-label', paper.title));
      select.addEventListener('click', () => open(paper));
      const more = button('sheet-more', 'Actions for ' + paper.title, 'more');
      more.title = 'Analysis actions';
      more.setAttribute('aria-haspopup', 'menu');
      more.setAttribute('aria-expanded', 'false');
      more.addEventListener('click', () => showMenu(paper, more));
      select.addEventListener('keydown', (event) => navigateTab(event, paper, more));
      row.append(select, more);
      return row;
    }

    function render() {
      dismissMenu();
      list.replaceChildren(...papers.map(sheetRow));
      if (removed) {
        const undoButton = button('sheet-undo', 'Undo removal of ' + removed.paper.title);
        undoButton.textContent = 'Undo removal';
        undoButton.addEventListener('click', undoRemove);
        list.append(undoButton);
      }
      markActive();
    }

    function studySchema(study) {
      const sorted = (values) => [...values].sort();
      const mapping = study.mapping
        ? Object.fromEntries(
            ['participant', 'arm', 'visit', 'population'].map((role) => [
              role,
              study.mapping[role] ?? null,
            ]),
          )
        : null;
      return {
        name: study.name,
        source: study.source,
        arms: sorted(study.arms),
        visits: sorted(study.visits),
        populations: sorted(study.populations),
        features: study.features
          .map(({ id, label, kind, unit }) => ({ id, label, kind: kind || 'score', unit: unit || null }))
          .sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)),
        mapping,
      };
    }

    function validatedSpec(settings, schema, study) {
      if (!settings || typeof settings !== 'object') throw Error('Missing comparison settings.');
      const { design, arm, baseline, visit, population, feature, mode, visitOrder } = settings;
      const browseVisit = settings.browseVisit ?? visit;
      if (!schema.visits.includes(browseVisit)) throw Error('Unknown molecular browsing visit.');
      if (!study.designs.includes(design)) throw Error('Unsupported study design.');
      if (!schema.arms.includes(arm)) throw Error('Unknown group.');
      if (!schema.populations.includes(population)) throw Error('Unknown cell population.');
      if (!schema.features.some((f) => f.id === feature)) throw Error('Unknown outcome.');
      if (!schema.visits.includes(baseline) || !schema.visits.includes(visit))
        throw Error('Unknown comparison visit.');
      if (study.fixedBaseline && baseline !== study.fixedBaseline)
        throw Error('The reference visit does not match the fitted study.');
      if (['did', 'paired'].includes(design) && baseline === visit)
        throw Error('Select two distinct visits for a paired comparison.');
      if (
        ![
          'cells',
          'genes',
          'pathways',
          'modules',
          'comparison',
          'measurements',
          'trajectory',
          'changes',
        ].includes(mode)
      )
        throw Error('Unknown analysis view.');
      if (
        !Array.isArray(visitOrder) ||
        visitOrder.length !== schema.visits.length ||
        !visitOrder.every((v) => schema.visits.includes(v)) ||
        new Set(visitOrder).size !== visitOrder.length
      )
        throw Error('Visit order must include each study visit exactly once.');
      if (study.fixedBaseline && !visitOrder.every((v, i) => v === study.visits[i]))
        throw Error('The visit order does not match the fitted study.');
      return {
        design,
        arm,
        baseline,
        visit,
        population,
        feature,
        visitOrder: [...visitOrder],
        browseVisit,
        mode,
      };
    }

    function exportWorkbook() {
      const study = getStudy();
      const schema = studySchema(study);
      const contents = papers.map((paper) => {
        const spec = paper === active ? getSpec() : paper.spec;
        return {
          title: paper.title,
          comparison: validatedSpec(spec, schema, study),
        };
      });
      return (
        JSON.stringify(
          {
            format: 'sctrial-workbook',
            version: 1,
            study: schema,
            sheets: contents,
            activeSheet: papers.indexOf(active) + 1,
          },
          null,
          2,
        ) + '\n'
      );
    }

    function importWorkbook(text) {
      let file;
      try {
        file = JSON.parse(text.replace(/^\uFEFF/, ''));
      } catch {
        throw Error('Choose a valid workbook JSON file.');
      }
      if (file?.format !== 'sctrial-workbook' || file.version !== 1)
        throw Error('Choose a version 1 sctrial analysis workbook.');
      const study = getStudy();
      const schema = studySchema(study);
      const saved = file.study;
      if (!saved || saved.name !== schema.name || saved.source !== schema.source)
        throw Error('Open the study that was used to save this workbook.');
      const sameList = (a, b) =>
        Array.isArray(a) && a.length === b.length && a.every((value, index) => value === b[index]);
      // Earlier releases of the example contained a subset of the same synthetic study.
      const referenceExample = schema.source === 'example';
      const populationsMatch = referenceExample
        ? Array.isArray(saved.populations) &&
          saved.populations.every((v) => schema.populations.includes(v))
        : sameList(saved.populations, schema.populations);
      if (
        !sameList(saved.arms, schema.arms) ||
        !populationsMatch ||
        !sameList(saved.visits, schema.visits)
      )
        throw Error('The groups, visits, or cell populations differ from the saved study.');
      if (
        !Array.isArray(saved.features) ||
        (!referenceExample && saved.features.length !== schema.features.length) ||
        !saved.features.every((prior) =>
          schema.features.some(
            (current) =>
              current.id === prior?.id &&
              current.label === prior?.label &&
              (prior.kind === undefined || current.kind === prior.kind) &&
              (prior.unit === undefined || current.unit === prior.unit),
          ),
        )
      )
        throw Error('The outcome columns differ from the saved study. Check their names and mapping.');
      if (
        schema.mapping === null
          ? saved.mapping !== null
          : !saved.mapping ||
            !Object.keys(schema.mapping).every((key) => saved.mapping[key] === schema.mapping[key])
      )
        throw Error('The H5AD column mapping differs from the saved study.');
      if (
        !Array.isArray(file.sheets) ||
        !file.sheets.length ||
        !Number.isInteger(file.activeSheet) ||
        file.activeSheet < 1 ||
        file.activeSheet > file.sheets.length
      )
        throw Error('The workbook has no valid active sheet.');

      const names = new Set(papers.map((paper) => paper.title));
      const imported = file.sheets.map((sheet, i) => {
        if (
          !sheet ||
          typeof sheet.title !== 'string' ||
          !sheet.title.trim() ||
          sheet.title.length > 80 ||
          /[\u0000-\u001f\u007f]/.test(sheet.title)
        )
          throw Error('Sheet ' + (i + 1) + ' has an invalid name.');
        let spec;
        try {
          spec = validatedSpec(sheet.comparison, schema, study);
        } catch (error) {
          throw Error('Sheet ' + (i + 1) + ': ' + error.message);
        }
        const title = unique(sheet.title.trim(), names);
        names.add(title);
        return { id: nextId + i, title, spec };
      });
      nextId += imported.length;
      papers = papers.concat(imported);
      open(imported[file.activeSheet - 1], true);
      return imported.length;
    }

    addButton.addEventListener('click', () => create());
    return Object.freeze({
      reset,
      exportWorkbook,
      importWorkbook,
      title: () => active?.title || '',
      setVisible(value) {
        if (overview === value) return;
        overview = value;
        markActive();
      },
    });
  };
})();

(function () {

    right: 'm9 6 6 6-6 6',
    asc: 'M12 19V5m-5 5 5-5 5 5',

  function valueLabel(value, signed = false) {

    if (value === 0) return '0';
    const magnitude = Math.abs(value);
    const display =
      magnitude < 0.0001 || magnitude >= 1000000
        ? magnitude.toExponential(2)
        : compactNumber.format(magnitude);
    return (value < 0 ? '−' : signed ? '+' : '') + display;
  }

  function normalize(record, config) {
    const baseline = Number.isFinite(record.baselineValue) ? record.baselineValue : null;
    const followup = Number.isFinite(record.followupValue) ? record.followupValue : null;
    const missing = [];
    if (config.longitudinal && baseline === null) missing.push(config.baseline);
    if (followup === null) missing.push(config.visit);
    const included = record.contributes === true && !missing.length;
    const change =
      config.longitudinal && baseline !== null && followup !== null ? followup - baseline : null;
    const reason = missing.length
      ? 'Missing ' + missing.join(' and ')

      if (event.key === 'ArrowLeft') target = items[Math.max(0, index - 1)];
      if (event.key === 'ArrowDown') target = items.find((p) => p.subject > item.subject && p.kind === item.kind) || item;
      if (event.key === 'ArrowUp') target = items.slice(0, index).reverse().find((p) => p.subject < item.subject && p.kind === item.kind) || item;
      if (target) { event.preventDefault(); target.node.focus({ preventScroll: true }); }
    };
  }

  function render(container, config) {
    if (!container || !config) return;
    sessions.get(container)?.disconnect();
    const model = prepare(config);
    const figure = document.createElement('figure');
    figure.className = 'sce';
    figure.setAttribute('aria-label', [config.feature, model.estimand].filter(Boolean).join(' · '));
    const chart = svg('svg', { class: 'sce-svg', role: 'group',
      'aria-label': 'Participant measurements and ' + model.estimand.toLowerCase(),
      'aria-description': 'Arrow keys explore the observations. Enter opens a participant record.' });
    const tooltip = document.createElement('span');
    tooltip.className = 'sce-point-tip';
    tooltip.setAttribute('aria-hidden', 'true'); tooltip.hidden = true;
    const caption = document.createElement('figcaption');
    caption.className = 'sce-caption';
    const notes = [];
    if (model.paired) notes.push('Lines join measurements from the same participant.');
    if (model.excluded) notes.push(model.excluded.toLocaleString() + (model.excluded === 1 ? ' participant excluded.' : ' participants excluded.'));
    if (model.drawn < model.total) notes.push('Trace sample includes observed extremes. The estimate uses all contributing participants.');
    if (!finite(config.estimate) && config.status) notes.push(config.status);
    caption.textContent = notes.join(' ');
    figure.append(chart, tooltip, caption);
    container.replaceChildren(figure);
    let previousLayout = '';
    function draw() {
      const width = Math.max(230, Math.round(figure.getBoundingClientRect().width));
      const sizeKey = width + 'x' + window.innerHeight;
      if (previousLayout === sizeKey) return;
      const prior = document.activeElement?.closest?.('[data-item]');
      const label = chart.contains(prior) ? prior?.getAttribute('aria-label') : null;
      previousLayout = sizeKey;
      const layout = geometry(width, model);
      const items = [];
      chart.setAttribute('viewBox', [0, 0, width, layout.height].join(' '));
      chart.setAttribute('height', layout.height);
      chart.replaceChildren();
      tooltip.hidden = true;
      drawRaw(chart, config, model, layout.raw, items);
      drawEffect(chart, config, model, layout);
      wire(chart, figure, tooltip, items, config);
      if (label) items.find((item) => item.node.getAttribute('aria-label') === label)?.node.focus({ preventScroll: true });
    }
    draw();
    if (typeof ResizeObserver !== 'undefined') {
      const disconnect = () => { observer.disconnect(); window.removeEventListener('resize', resize); };
      const resize = () => { if (figure.isConnected) draw(); else disconnect(); };
      const observer = new ResizeObserver(resize);
      observer.observe(figure);
      window.addEventListener('resize', resize, { passive: true });
      sessions.set(container, { disconnect });
    }
    if (typeof chart.animate === 'function' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      chart.animate([{ opacity: 0.48, transform: 'translateY(2px)' }, { opacity: 1, transform: 'none' }],
        { duration: 145, easing: 'ease-out' });
    }
  }

  window.SctrialEvidence = Object.freeze({ render });
})();

(() => {
  'use strict';

  const menus = {
    File: [
      { label: 'Open study', action: 'open' },
      { label: 'Save workbook', action: 'saveWorkbook' },
      { label: 'Export results…', action: 'export' },
      { label: 'Study information', action: 'info', divider: true },
    ],
    Analysis: [
      { label: 'Configure comparison…', action: 'configure' },
      { label: 'New analysis', newSheet: true },
      { label: 'Pin contrast', action: 'pin', divider: true },
      { label: 'Pinned contrasts', view: 'bench' },
    ],
    View: [
      { label: 'Cell populations', view: 'overview', mode: 'cells' },
      { label: 'Genes', view: 'overview', mode: 'genes' },
      { label: 'Pathways', view: 'overview', mode: 'pathways' },
      { label: 'Modules', view: 'overview', mode: 'modules' },
      { label: 'Time course', view: 'overview', mode: 'trajectory' },
      { label: 'Analysis plot', view: 'overview', mode: 'comparison', divider: true },
      { label: 'Participant measurements', view: 'overview', mode: 'measurements' },
      { label: 'Changes', view: 'overview', mode: 'changes' },
      { label: 'Participant register', view: 'participants', divider: true },
      { label: 'Results table', view: 'results' },
      { label: 'Find in study', action: 'search', shortcut: '/', divider: true },
    ],
  };
  const host = document.getElementById('appMenus');
  if (!host) return;
  const compact = window.matchMedia('(max-width: 639px)');
  const bar = document.createElement('div');
  bar.className = 'am-bar';
  bar.setAttribute('role', 'menubar');
  bar.setAttribute('aria-label', 'Application menus');
  const popup = document.createElement('div');
  popup.className = 'am-popup';
  popup.id = 'appMenuPopup';
  popup.setAttribute('role', 'menu');
  popup.hidden = true;
  host.replaceChildren(bar, popup);

  const categories = Object.keys(menus);
  const triggers = new Map();
  const state = { view: 'overview', mode: 'cells', longitudinal: true, canPin: true };
  let openName = '';
  let roving = compact.matches ? 'Menu' : categories[0];
  let items = [];
  let search = '';
  let lastKeyTime = 0;
  let hoveredTrigger = null;

  function visibleMenus() {
    return compact.matches ? ['Menu'] : categories;
  }

  function syncTriggers() {
    for (const [name, trigger] of triggers) {
      trigger.hidden = !visibleMenus().includes(name);
      trigger.tabIndex = name === roving ? 0 : -1;
      trigger.setAttribute('aria-expanded', String(openName === name));
    }
  }

  function close(restore = false) {
    if (!openName) return;
    const trigger = triggers.get(openName);
    openName = '';
    hoveredTrigger = null;
    items = [];
    popup.hidden = true;
    popup.replaceChildren();
    syncTriggers();
    if (restore) trigger.focus();
  }

  function activate(spec) {
    close(true);
    if (spec.newSheet) {
      document.getElementById('newSheet')?.click();
      return;
    }
    const detail = spec.action ? { action: spec.action } : { view: spec.view };
    if (spec.mode) detail.mode = spec.mode;
    document.dispatchEvent(new CustomEvent('sctrial:menu-command', { detail }));
  }

  function labelFor(spec) {
    return spec.mode === 'changes' && !state.longitudinal ? 'Distribution' : spec.label;
  }

  function updateItem({ control, label, spec }) {
    label.textContent = labelFor(spec);
    if (spec.view) {
      const current = spec.view === state.view && (!spec.mode || spec.mode === state.mode);
      control.setAttribute('aria-checked', String(current));
    }
    if (spec.action === 'pin') {
      control.setAttribute('aria-disabled', String(!state.canPin));
      control.title = state.canPin ? '' : 'A fitted contrast is required';
    }
  }

  function addGroup(category, mobile) {
    const group = document.createElement('div');
    group.className = 'am-group';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', category);
    if (mobile) {
      const title = document.createElement('div');
      title.className = 'am-category';
      title.setAttribute('aria-hidden', 'true');
      title.textContent = category;
      group.append(title);
    }
    for (const spec of menus[category]) {
      if (spec.divider) {
        const divider = document.createElement('div');
        divider.className = 'am-divider';
        divider.setAttribute('role', 'separator');
        group.append(divider);
      }
      const control = document.createElement('button');
      control.type = 'button';
      control.tabIndex = -1;
      control.className = 'am-item';
      control.setAttribute('role', spec.view ? 'menuitemradio' : 'menuitem');
      // Keep the check in its own column so labels never move as the view changes.
      const mark = document.createElement('span');
      mark.className = 'am-check';
      mark.setAttribute('aria-hidden', 'true');
      const label = document.createElement('span');
      label.className = 'am-item-label';
      control.append(mark, label);
      if (spec.shortcut) {
        const key = document.createElement('kbd');
        key.setAttribute('aria-hidden', 'true');
        key.textContent = spec.shortcut;
        control.setAttribute('aria-keyshortcuts', spec.shortcut);
        control.append(key);
      }
      const item = { control, label, spec };
      updateItem(item);
      control.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'mouse' && document.activeElement !== control) {
          control.focus({ preventScroll: true });
        }
      });
      control.addEventListener('click', () => {
        if (control.getAttribute('aria-disabled') !== 'true') activate(spec);
      });
      group.append(control);
      items.push(item);
    }
    popup.append(group);
  }

  function placePopup() {
    if (!openName) return;
    const anchor = triggers.get(openName).getBoundingClientRect();
    const gap = 5;
    const minLeft = 5;
    const width = popup.offsetWidth;
    const left = Math.max(minLeft, Math.min(anchor.left, window.innerWidth - width - minLeft));
    const top = Math.min(anchor.bottom + gap, window.innerHeight - gap);
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    popup.style.maxHeight = Math.max(72, window.innerHeight - top - gap) + 'px';
  }

  function open(name, last = false) {
    if (!visibleMenus().includes(name)) return;
    openName = roving = name;
    hoveredTrigger = null;
    search = '';
    lastKeyTime = 0;
    items = [];
    popup.replaceChildren();
    const trigger = triggers.get(name);
    popup.setAttribute('aria-labelledby', trigger.id);
    if (name === 'Menu') categories.forEach((category) => addGroup(category, true));
    else addGroup(name, false);
    popup.hidden = false;
    syncTriggers();
    placePopup();
    items[last ? items.length - 1 : 0]?.control.focus({ preventScroll: true });
    popup.scrollTop = last ? popup.scrollHeight : 0;
  }

  function topKey(event, name) {
    if (event.altKey || event.metaKey || event.ctrlKey) return;
    const names = visibleMenus();
    let index = names.indexOf(name);
    switch (event.key) {
      case 'ArrowLeft':
        index = (index + names.length - 1) % names.length;
        break;
      case 'ArrowRight':
        index = (index + 1) % names.length;
        break;
      case 'Home':
        index = 0;
        break;
      case 'End':
        index = names.length - 1;
        break;
      case 'ArrowDown':
      case 'ArrowUp':
        event.preventDefault();
        open(name, event.key === 'ArrowUp');
        return;
      case 'Escape':
        close(true);
        return;
      default:
        return;
    }
    event.preventDefault();
    roving = names[index];
    syncTriggers();
    triggers.get(roving).focus();
    if (openName) open(roving);
  }

  for (const name of [...categories, 'Menu']) {
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'am-trigger';
    trigger.id = 'appMenu' + name;
    trigger.setAttribute('role', 'menuitem');
    trigger.setAttribute('aria-controls', popup.id);
    trigger.setAttribute('aria-haspopup', 'menu');
    trigger.textContent = name;
    trigger.addEventListener('click', (event) => {
      if (event.detail && hoveredTrigger === name) {
        hoveredTrigger = null;
        items[0]?.control.focus();
        return;
      }
      if (openName === name) close(true);
      else open(name);
    });
    trigger.addEventListener('pointerenter', (event) => {
      if (event.pointerType === 'mouse' && openName && openName !== name) {
        open(name);
        hoveredTrigger = name;
      }
    });
    trigger.addEventListener('keydown', (event) => topKey(event, name));
    triggers.set(name, trigger);
    bar.append(trigger);
  }

  popup.addEventListener('keydown', (event) => {
    if (!openName || event.altKey || event.metaKey || event.ctrlKey) return;
    const index = items.findIndex((item) => item.control === document.activeElement);
    let next = index;
    switch (event.key) {
      case 'ArrowDown':
        next = (index + 1) % items.length;
        break;
      case 'ArrowUp':
        next = (index - 1 + items.length) % items.length;
        break;
      case 'Home':
        next = 0;
        break;
      case 'End':
        next = items.length - 1;
        break;
      case 'ArrowLeft':
      case 'ArrowRight': {
        event.preventDefault();
        const delta = event.key === 'ArrowRight' ? 1 : -1;
        if (compact.matches) {
          if (delta < 0) close(true);
          return;
        }
        open(
          categories[
            (categories.indexOf(openName) + delta + categories.length) % categories.length
          ],
        );
        return;
      }
      case 'Escape':
        event.preventDefault();
        close(true);
        return;
      case 'Tab':
        close(true);
        return;
      case '/':
        // The workbook has one global Find shortcut.
        close(true);
        return;
      default: {
        if (event.key.length !== 1 || event.key === ' ') return;
        const now = performance.now();
        const letter = event.key.toLocaleLowerCase();
        search = now - lastKeyTime > 600 || search === letter ? letter : search + letter;
        lastKeyTime = now;
        for (let i = 1; i <= items.length; i++) {
          const candidate = (index + i) % items.length;
          if (labelFor(items[candidate].spec).toLocaleLowerCase().startsWith(search)) {
            next = candidate;
            break;
          }
        }
      }
    }
    event.preventDefault();
    items[next]?.control.focus();
  });
  document.addEventListener('pointerdown', (event) => {
    if (openName && !host.contains(event.target)) close();
  });
  document.addEventListener('focusin', (event) => {
    if (openName && !host.contains(event.target)) close();
  });
  window.addEventListener('resize', placePopup);
  compact.addEventListener('change', () => {
    const ownedFocus = host.contains(document.activeElement);
    close();
    roving = visibleMenus()[0];
    syncTriggers();
    if (ownedFocus) triggers.get(roving).focus();
  });
  syncTriggers();
  window.SctrialAppMenu = {
    setState(next) {
      Object.assign(state, next);
      items.forEach(updateItem);
    },
  };
})();

(() => {
  'use strict';

  // Procedural illustrations. Geometry and pigments are independent of study observations.
  const TAU = 2 * Math.PI;
  const PAD = 1.09;
  const MAP_W = 384;
  const MAP_H = 192;
  const FRAME_COUNT = 96;
  const MAX_FRAME_PIXELS = 5_400_000;
  const tissues = new Map();
  const colors = new Map();
  const frames = new Map();
  const projectionGrids = new Map();
  let cachedPixels = 0;

  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const smooth = (x) => x * x * (3 - 2 * x);

  function hash(name, seed) {
    let h = (Number(seed) | 0) ^ 2166136261;
    for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function random(seed) {
    let state = seed;
    return () => {
      state = (Math.imul(1664525, state) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  // Seeded lattice noise in object coordinates. Sampling a sphere in 3D avoids polar seams.
  function noiseField(next) {
    const side = 32;
    const grid = Uint8Array.from({ length: side ** 3 }, () => Math.floor(next() * 256));
    return (x, y, z) => {
      const ix = Math.floor(x),
        iy = Math.floor(y),
        iz = Math.floor(z);
      const fx = smooth(x - ix),
        fy = smooth(y - iy),
        fz = smooth(z - iz);
      const x0 = ix & 31,
        x1 = (ix + 1) & 31;
      const y0 = (iy & 31) * 32,
        y1 = ((iy + 1) & 31) * 32;
      const z0 = (iz & 31) * 1024,
        z1 = ((iz + 1) & 31) * 1024;
      const a = grid[x0 + y0 + z0] * (1 - fx) + grid[x1 + y0 + z0] * fx;
      const b = grid[x0 + y1 + z0] * (1 - fx) + grid[x1 + y1 + z0] * fx;
      const c = grid[x0 + y0 + z1] * (1 - fx) + grid[x1 + y0 + z1] * fx;
      const d = grid[x0 + y1 + z1] * (1 - fx) + grid[x1 + y1 + z1] * fx;
      return ((a * (1 - fy) + b * fy) * (1 - fz) + (c * (1 - fy) + d * fy) * fz) / 255;
    };
  }

  function surface(kind, seed) {
    const next = random(hash(kind, seed));
    const noise = noiseField(next);
    const bCell = /(^|[^a-z])b(?:[ -]?(?:lymph|cell)|$)/i.test(kind);
    const myeloid = /monocyt|myeloid|macrophag/i.test(kind);
    const frequency = bCell ? 3.9 : myeloid ? 3.5 : 4.6 + next() * 0.4;
    const count = MAP_W * MAP_H;
    const height = new Float32Array(count);
    const normals = new Int8Array(count * 3);
    const grain = new Uint8Array(count);
    const pigment = new Uint8Array(count);
    const chromatin = new Uint8Array(count);
    const center = [
      next() * 0.07 - (bCell ? 0.07 : 0.18),
      next() * 0.09 + 0.015,
      0.025 + next() * 0.11,
    ];
    const phi = Array.from({ length: MAP_W }, (_, i) => ((i + 0.5) / MAP_W) * TAU - Math.PI);
    const sin = phi.map(Math.sin),
      cos = phi.map(Math.cos);
    const granules = [];
    for (let n = 0; n < (myeloid ? 55 : 37); n++) {
      const y = next() * 2 - 1,
        p = next() * TAU,
        r = 0.68 + next() * 0.17;
      const xy = Math.sqrt(1 - y * y);
      granules.push([
        r * xy * Math.sin(p),
        r * y,
        r * xy * Math.cos(p),
        0.013 + next() ** 2 * 0.029,
      ]);
    }

    for (let j = 0; j < MAP_H; j++) {
      const lat = ((j + 0.5) / MAP_H - 0.5) * Math.PI;
      const cy = Math.cos(lat),
        y = Math.sin(lat);
      for (let i = 0; i < MAP_W; i++) {
        const k = j * MAP_W + i,
          x = cy * sin[i],
          z = cy * cos[i];
        const wx = noise(2.3 * x + 9, 2.3 * y, 2.3 * z) - 0.5;
        const wy = noise(2 * x, 2 * y + 13, 2 * z) - 0.5;
        const wz = noise(2.2 * x, 2.2 * y, 2.2 * z + 18) - 0.5;
        const u = x * frequency + wx * 2.1,
          v = y * frequency + wy * 2.1,
          w = z * frequency + wz * 2.1;
        const coarse = noise(u, v, w);
        const warp = noise(u * 1.9 + 8, v * 1.9, w * 1.9 + 6);
        const field = coarse + 0.13 * (warp - 0.5);
        const foldDistance = Math.abs(field - 0.49);
        const ridge = Math.exp(-115 * foldDistance * foldDistance);
        const ripple = noise(x * 22 + 12 * wx, y * 18 + 1, z * 21 + 4 * wy);
        const fine = noise(x * 45 + 3, y * 42, z * 44);
        const offset = ripple - 0.52;
        const filament = Math.exp(-88 * offset * offset);
        const papilla = smooth(clamp((ripple - 0.42) * 2.9));
        height[k] =
          0.08 * wx +
          0.054 * wy +
          0.038 * (coarse - 0.5) +
          (bCell ? 0.039 : 0.084) * ridge * (0.32 + 0.68 * warp) +
          (bCell ? 0.042 * papilla + 0.008 * filament : 0.016 * filament) +
          0.009 * (fine - 0.5);
        grain[k] = (fine * 0.34 + ripple * 0.18 + warp * 0.29 + ridge * 0.19) * 255;
        chromatin[k] =
          255 *
          (0.4 * noise(5.8 * x + 7, 5.8 * y + 9, 5.8 * z) +
            0.38 * noise(11.7 * x, 11.7 * y + 2, 11.7 * z + 7) +
            0.22 * fine);
        pigment[k] =
          clamp(0.12 + 0.46 * coarse + 0.29 * ripple + 0.15 * noise(10 * x, 10 * y, 10 * z)) * 255;
      }
    }

    // Differentiate the displacement on its spherical tangent plane.
    for (let j = 0; j < MAP_H; j++) {
      const lat = ((j + 0.5) / MAP_H - 0.5) * Math.PI;
      const c = Math.cos(lat),
        s = Math.sin(lat);
      const northRow = Math.min(j + 1, MAP_H - 1) * MAP_W;
      const southRow = Math.max(j - 1, 0) * MAP_W;
      for (let i = 0; i < MAP_W; i++) {
        const k = j * MAP_W + i;
        const du =
          ((height[j * MAP_W + ((i + 1) % MAP_W)] - height[j * MAP_W + ((i + MAP_W - 1) % MAP_W)]) *
            MAP_W) /
          (2 * TAU * Math.max(0.07, c));
        const dv = ((height[northRow + i] - height[southRow + i]) * MAP_H) / (2 * Math.PI);
        const nx = c * sin[i] - du * cos[i] + dv * s * sin[i];
        const ny = s - dv * c;
        const nz = c * cos[i] + du * sin[i] + dv * s * cos[i];
        const scale = 127 / Math.sqrt(nx * nx + ny * ny + nz * nz);
        normals[3 * k] = Math.round(nx * scale);
        normals[3 * k + 1] = Math.round(ny * scale);
        normals[3 * k + 2] = Math.round(nz * scale);
      }
    }
    return {
      height,
      normals,
      grain,
      pigment,
      chromatin,
      center,
      granules,
      myeloid,
      nucleus: bCell ? 0.67 : myeloid ? 0.61 : 0.6,
    };
  }

  function hsl(h, saturation, lightness) {
    h = (((h % 360) + 360) % 360) / 360;
    const a = saturation * Math.min(lightness, 1 - lightness);
    return [0, 8, 4].map((v) => {
      const k = (v + h * 12) % 12;
      return 255 * (lightness - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)));
    });
  }

  function palette(hue) {
    const out = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      const deep = hue > 120 && hue < 225 ? 24 : hue < 70 ? -18 : -10;
      const shift = hue > 225 && hue < 310 ? -20 : hue < 70 ? 12 : -7;
      const h = hue + deep * (1 - t) ** 2 + shift * t * t;
      const c = hsl(h, 0.81 - 0.22 * smooth(t), 0.034 + 0.84 * t ** 1.14);
      out.set(c, 3 * i);
    }
    return out;
  }

  function bitmap(size) {
    if (typeof OffscreenCanvas === 'function') {
      try {
        const canvas = new OffscreenCanvas(size, size);
        const ctx = canvas.getContext('2d');
        if (ctx) return { canvas, ctx };
      } catch {
        // Some browsers expose the constructor while disabling its 2D context.
      }
    }
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    return { canvas, ctx: canvas.getContext('2d') };
  }

  function mapPoint(x, y, z) {
    const lon = Math.atan2(x, z) / TAU + 0.5;
    const lat = Math.asin(clamp(y, -1, 1)) / Math.PI + 0.5;
    const i = Math.floor(lon * MAP_W) % MAP_W;
    return Math.min(MAP_H - 1, Math.floor(lat * MAP_H)) * MAP_W + i;
  }

  function projectionGrid(size) {
    if (projectionGrids.has(size)) return projectionGrids.get(size);
    const radial = new Float32Array(size * size);
    const azimuth = new Uint16Array(size * size);
    const coordinate = Float32Array.from(
      { length: size },
      (_, i) => ((i + 0.5 - size / 2) * 2 * PAD) / size,
    );
    for (let j = 0; j < size; j++) {
      const y = -coordinate[j];
      for (let i = 0; i < size; i++) {
        const x = coordinate[i],

      for (const s of shown) {
        const g = geometries.get(s.name);

        queue();

      reset.hidden = false;
      queue();
    });

      targetZoom = 1;
      keyboardAngle = 0;

      reset.hidden = true;
      queue();
    };
    select.onchange = () => selectPop(select.value);
    analyze.onclick = () => options.onAnalyze(selected);

      help.textContent = 'Select a population to inspect its measurements.';
    }

    resize();
    return {
      host,
      config,
      update(next) {
        options = next;
        selected = next.selected;
        refresh();
      },
      stop() {
        alive = false;
        out.disconnect();
        cancelAnimationFrame(raf);

      },

  }

      }

    },

        current?.stop();

      }
    },
