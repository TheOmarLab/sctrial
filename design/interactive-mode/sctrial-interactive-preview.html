.modal {
  width: min(calc(100% - 26px), 500px);
  max-height: 85dvh;
  border: 1px solid #cbd3df;
  border-radius: 14px;
  color: var(--ink);
  padding: 0;
  box-shadow: 0 18px 70px #24392e44;
}
.modal::backdrop {
  background: #101b36a3;
}
.modal-head {
  padding: 19px 21px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px 21px 21px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}
.field {
  display: grid;
  align-content: start;
  gap: 5px;
  min-width: 0;
}
.field.wide {
  grid-column: 1/-1;
}
.field > span {
  font-size: 12px;
  font-weight: 620;
}
.field-input {
  width: 100%;
}
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 17px;
}
.hint {
  margin: 10px 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.contrast-note {
  margin-top: 14px;
  border-radius: 7px;
  background: #f2f1fc;
  color: #463e7b;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.45;
}
.choice {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 13px;
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 7px 0;
  background: #fff;
  cursor: pointer;
}
.choice:hover {
  border-color: #8db29a;
  background: #f2f8f0;
}
.choice > i {
  color: #397661;
}
.choice span {
  display: grid;
  gap: 3px;
}
.choice strong {
  font-size: 13px;
}
.choice small {
  font-size: 12px;
  color: var(--muted);
}
.drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  border: 1px dashed #98b4a2;
  border-radius: 9px;
  background: #f1f6ed;
  padding: 23px 12px;
  color: #2d654e;
  cursor: pointer;
}
.drop-zone.over {
  border: 2px solid var(--violet);
}
.drop-zone .btn {
  margin: 3px;
}
.drop-zone strong {
  font-size: 15px;
}
.drop-zone small {
  color: var(--muted);
}
.error {
  border-left: 3px solid #b43f48;
  padding: 8px;
  color: #913342;
  background: #fff3f3;
  font-size: 12px;
  margin-top: 8px;
}
.modal-list {
  display: grid;
  max-height: 42vh;
  overflow: auto;
  margin-top: 10px;
}
.modal-list button {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  gap: 8px;
}
.modal-list button:hover {
  background: #f6f5fd;
}
.modal-list small {
  color: var(--muted);
}
.meta-list {
  display: grid;
  gap: 0;
}
.meta-list div {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 7px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.meta-list dt {
  color: var(--muted);
}
.meta-list dd {
  margin: 0;
}
.toast {
  position: fixed;
  z-index: 20;
  bottom: 22px;
  right: 20px;
  background: #1b392d;
  color: white;
  border-radius: 8px;
  box-shadow: 0 4px 18px #24392e35;
  padding: 12px 15px;
  font-size: 13px;
}
.empty {
  color: var(--muted);
  padding: 15px;
  font-size: 13px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.pe.card {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 15px;
  background: white;
  color: var(--ink, #17243b);
}
.pe-head,
.pe-filters,
.pe-footer,
.pe-notes {
  padding-inline: clamp(16px, 2vw, 28px);
}
.pe-head {
  padding-top: 21px;
}
.pe-head h2,
.pe-detail h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -0.035em;
  color: var(--ink, #17243b);
}
.pe-sub,
.pe-dialog-sub {
  margin: 5px 0 0;
  font-size: 13px;
  color: #53647a;
}
.pe-filters {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  padding-block: 16px;
}
.pe-control {
  display: grid;
  gap: 5px;
  min-width: 132px;
}
.pe-label,
.pe-dialog-label {
  font-size: 12px;
  color: #52617a;
  font-weight: 600;
}
.pe-search {
  flex: 1 1 185px;
}
.pe-input,
.pe-control select {
  max-width: 100%;
  min-width: 0;
  height: 38px;
  padding: 0 10px;
  border: 1px solid #c5cede;
  border-radius: 7px;
  background: white;
  color: var(--ink, #17243b);
  font: inherit;
  font-size: 13px;
}
.pe-control select {
  cursor: pointer;
  min-width: 118px;
}
.pe-input::placeholder {
  color: #637086;
}
.pe :focus-visible,
.pe-detail :focus-visible {
  outline: 3px solid #237f60;
  outline-offset: 2px;
}
.pe-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
.pe-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
  margin: 0;
}
.pe-table th,
.pe-table td {
  text-align: left;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid #e9edf3;
  color: #35445b;
  background: transparent;
}
.pe-table th:first-child,
.pe-table td:first-child {
  padding-left: clamp(16px, 2vw, 28px);
}
.pe-table th:last-child,
.pe-table td:last-child {
  padding-right: clamp(16px, 2vw, 28px);
}
.pe-table thead th {
  padding-block: 9px;
  background: #f4f6fb;
  font-weight: 600;
  font-size: 12px;
  color: #54627a;
  border-block: 1px solid #e2e6ee;
}
.pe-table tbody th {
  font-weight: 550;
}
.pe-table tbody tr:hover td,
.pe-table tbody tr:hover th {
  background: #f8f9fe;
}
.pe-person {
  color: #3d3289;
  background: transparent;
  border: 0;
  padding: 4px 3px 4px 0;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.pe-person:hover {
  text-decoration: underline;
}
.pe-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pe-group::before {
  content: '';
  display: block;
  height: 8px;
  width: 8px;
  border-radius: 3px;
  background: var(--violet, #34735c);
}
.pe-group.pe-second::before {
  background: var(--teal, #087f78);
}
.pe-num,
.pe-page-number,
.pe-detail-table {
  font-variant-numeric: tabular-nums;
}
.pe-mark {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  box-sizing: border-box;
  vertical-align: -1px;
}
.pe-yes {
  background: #11887e;
  box-shadow: inset 0 0 0 1px #087267;
}
.pe-unmeasured {
  border: 1px solid #96691b;
  background: radial-gradient(circle, #916416 0 1.5px, #fff6dd 2px);
}
.pe-partial {
  border: 1px solid #997120;
  background: repeating-linear-gradient(135deg, #f9e9bb 0 2px, #fff8e6 2px 4px);
}
.pe-no {
  border: 1px dashed #78879d;
  background: white;
}
.pe-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.pe-covered {
  color: #126359;
  background: #e5f5ef;
}
.pe-incomplete {
  color: #79540b;
  background: #fff2d3;
}
.pe-outside {
  color: #536278;
  background: #edf0f4;
}
.pe-table .pe-empty {
  padding: 22px;
  color: #53647a;
  text-align: center;
}
.pe-footer,
.pe-pages {
  display: flex;
  align-items: center;
}
.pe-footer {
  min-height: 48px;
  padding-block: 8px;
  justify-content: space-between;
  gap: 8px;
}
.pe-range,
.pe-note,
.pe-legend,
.pe-page-number {
  margin: 0;
  font-size: 12px;
  color: #52617a;
}
.pe-pages {
  gap: 8px;
}
.pe-step,
.pe-close {
  padding: 5px 9px;
  border: 1px solid #c9d1de;
  border-radius: 6px;
  color: #293449;
  background: white;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.pe-step:disabled {
  opacity: 0.45;
  cursor: default;
}
.pe-notes {
  background: #f9fafd;
  padding-block: 12px;
  border-top: 1px solid #e2e6ee;
}
.pe-legend,
.pe-key {
  display: flex;
  align-items: center;
}
.pe-legend {
  gap: 4px 16px;
  flex-wrap: wrap;
}
.pe-key {
  gap: 5px;
}
.pe-key .pe-mark {
  width: 9px;
  height: 9px;
  border-radius: 3px;
}
.pe-note {
  margin-top: 6px;
  line-height: 1.5;
}
.pe-detail {
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(610px, calc(100% - 24px));
  max-width: none;
  max-height: 86dvh;
  padding: 22px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--line, #e2e5ed);
  border-radius: 14px;
  color: var(--ink, #17243b);
  box-shadow: 0 20px 80px #17243b38;
}
.pe-detail::backdrop {
  background: #15223c75;
}
.pe-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pe-dialog-label {
  margin: 0 0 4px;
}
.pe-dialog-sub {
  margin-bottom: 15px;
}
.pe-detail .pe-table th,
.pe-detail .pe-table td {
  padding-inline: 9px;
}
.pe-detail-table thead th:last-child {
  min-width: 78px;
  white-space: normal;
}
.pe-detail-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
@media (max-width: 600px) {
  .pe-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .pe-control {
    min-width: 0;
  }
  .pe-control select {
    min-width: 0;
  }
  .pe-search {
    grid-column: 1 / -1;
  }
  .pe-table {

.cbench {
  --cb-ink: #132f37;

}
.cbench * {
  box-sizing: border-box;
}
.cbench h2,
.cbench h3,
.cbench p {
  margin: 0;
}
.cbench h2 {
  font-size: clamp(20px, 2vw, 27px);

}

.cbench-shelf {

}
.cbench-header,
.cbench-shelf-head {
  display: flex;

  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 15px;
}
.cbench-button {
  color: var(--cb-ink);
  background: #fff;
  border: 1px solid var(--cb-line);

  justify-content: center;
  gap: 7px;
  padding: 7px 10px;
  font-family: inherit;

  line-height: 1.4;

.cbench-button:focus-visible,

}
.cbench-button:hover {
  background: #edf4f0;
}
.cbench-button:disabled {

}
.cbench-strong {
  background: #183b3d;

  color: #fff;
}
.cbench-strong:hover {
  background: #22554f;
}
.cbench-icon {
  padding: 4px;

.cbench-pair {
  display: grid;

  gap: 7px;

.cbench-side {

.cbench-b {

}
.cbench-letter,
.cbench-dot {

.cbench-choice {

  line-height: 1.6;
}
.cbench-swap {

}

  padding: 24px;
  border-top: 1px solid var(--cb-line);
}

.cc-surface {
  --cc-base: #fff;
  --cc-ink: #27304a;
  --cc-secondary: #586279;
  position: relative;
  width: 100%;
  overflow: hidden;
  isolation: isolate;
  color: var(--cc-ink);
  background: #fff;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.cc-surface svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.cc-surface svg text {
  font-family: inherit;
}
.cc-surface svg .cc-number {
  font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
}
.cc-surface .cc-interactive {
  outline: none;
}
.cc-person,
.cc-visit {
  cursor: pointer;
}
.cc-person .cc-ink {
  transition:
    opacity 110ms ease,
    stroke-width 110ms ease;
}
.cc-person.cc-active .cc-ink {
  opacity: 1;
  stroke-width: 2.6px;
}
.cc-person.cc-muted .cc-ink {
  opacity: 0.17;
}
.cc-person.cc-active .cc-dot {
  opacity: 1;
}
.cc-person[aria-pressed='true'] .cc-focus {
  opacity: 1;
}
.cc-person.cc-muted .cc-dot {
  opacity: 0.25;
}
.cc-person:focus-visible .cc-focus,
.cc-visit:focus-visible .cc-focus,
.cc-handle:focus-visible .cc-focus,
.cc-mean:focus-visible .cc-focus {
  opacity: 1;
}
.cc-visit:hover .cc-chip,
.cc-visit:focus-visible .cc-chip {
  fill: #edecfc;
  stroke: #a4a0da;
}
.cc-visit-head {
  cursor: pointer;
  touch-action: manipulation;
}
.cc-visit-head:hover .cc-destination,
.cc-visit-head.cc-aim .cc-destination {
  fill: #6458c0;
  stroke: #5e54a9;
}
.cc-handle:hover .cc-grip,
.cc-handle:focus-visible .cc-grip,
.cc-handle.cc-dragging .cc-grip {
  fill: #d6d2fa;
  stroke: #8379cd;
}
.cc-handle.cc-dragging {
  cursor: grabbing;
}
.cc-visit {
  touch-action: manipulation;
}
.cc-visit:not(:hover) .cc-chip {
  transition: fill 140ms ease;
}
.cc-handle {
  cursor: ew-resize;
  touch-action: none;
}
.cc-readout {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  min-height: 39px;

.cc-readout-main {

.cc-readout-main strong {

.cc-readout-main span,
.cc-legend {

}
.cc-readout-arm {

  height: 7px;
  border-radius: 50%;

.cc-legend {

}
.cc-legend span {
  display: inline-flex;
  gap: 5px;
  align-items: center;

}
.cc-key {

  height: 0;

}
.cc-key.cc-key-mean {
  border-top: 3px solid #3f465e;
  position: relative;
}
.cc-key.cc-key-mean:before {
  content: '';
  position: absolute;
  border: 1.5px solid #3f465e;

.cc-key.cc-key-diamond {

.cc-surface .cc-empty {

@media (max-width: 540px) {

:root {

.sheet-item {
  position: relative;

  flex: 0 0 auto;
  align-items: center;
  grid-template-columns: minmax(0, 1fr) 24px;
  width: max-content;
  min-width: 92px;
  max-width: 196px;

  border-radius: 4px 4px 0 0;

    color 110ms ease,
    background-color 140ms ease;

.sheet-item::before {
  position: absolute;
  right: 0;
  top: 10px;
  bottom: 9px;
  width: 1px;
  background: #48494e;
  content: '';
}

.sheet-item:has(.sheet-name) {
  color: #fffefa;
  background: #3c3c42;
}
.sheet-item::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 2px;
  background: #f5ad45;
  pointer-events: none;
  transform: scaleX(0.88);
  opacity: 0;
  transition:
    transform 150ms ease-out,
    opacity 130ms ease;
  content: '';
}
.sheet-item:has(.sheet-link[aria-selected='true'])::after {
  transform: scaleX(1);
  opacity: 1;
}
.sheet-item:has(.sheet-link[aria-selected='true'])::before {
  display: none;

}
.sheet-label {
  display: block;

  text-overflow: ellipsis;
  white-space: nowrap;

.sheet-more {
  display: grid;

  border-radius: 3px;
  opacity: 0;

.scl-matrix .mx-search:focus-within {

}
.scl-matrix input.mx-input {

  padding: 5px 0;
  margin: 0;

  height: auto;
  min-height: 0;

  font-size: 12px;
}
.scl-matrix input.mx-input::placeholder {

}
.scl-matrix .mx-filterbar {
  padding: 0 17px 13px;
}
.scl-matrix .mx-segments {
  display: inline-flex;
  gap: 2px;
  padding: 2px;

}
.scl-matrix button {

  cursor: pointer;
}
.scl-matrix .mx-segment {

.scl-matrix .mx-segment:hover {

}
.scl-matrix .mx-segment[aria-pressed='true'] {
  background: #fff;

  border-color: #d8dbe6;

}
.scl-matrix .mx-counter {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: #647083;
}
.scl-matrix .mx-segment[aria-pressed='true'] .mx-counter {
  color: #5145a1;
}
.scl-matrix .mx-viewport {

}
.scl-matrix .mx-table {
  width: 100%;
  min-width: 445px;
  border-collapse: separate;
  border-spacing: 0;
  margin: 0;

}
.scl-matrix .mx-table thead th {
  position: sticky;
  z-index: 1;
  top: 0;
  height: 43px;
  padding: 6px 13px;
  text-transform: none;
  letter-spacing: normal;

}
.scl-matrix .mx-table thead th strong {

  font-weight: 660;

}
.scl-matrix .mx-table thead th:first-child,
.scl-matrix .mx-table tbody .mx-participant {
  padding-left: 17px;
}
.scl-matrix .mx-table thead th:last-child {
  padding-right: 17px;
}
.scl-matrix .mx-col-label {
  display: grid;
  gap: 2px;
}
.scl-matrix .mx-col-label small {
  color: var(--mx-muted);
  font-size: 9.5px;
  font-weight: 450;
  white-space: nowrap;
  letter-spacing: normal;
  line-height: 1.3;
}
.scl-matrix .mx-sort {
  display: inline-flex;
  gap: 4px;
  padding: 0;
  min-height: 22px;
  align-items: center;
  background: transparent;
  border: 0;
  border-radius: 2px;
  box-shadow: none;
  font-family: inherit;
  font-size: 11.5px;
  text-transform: none;
  text-align: left;
  white-space: normal;
  color: inherit;
}
.scl-matrix .mx-table thead th.mx-numeric-heading,
.scl-matrix .mx-numeric-heading .mx-sort {
  text-align: right;
}
.scl-matrix .mx-sort-icon svg {
  width: 11px;
  height: 11px;
}
.scl-matrix .mx-sort-icon {
  color: #677084;
  opacity: 0;
}
.scl-matrix th[aria-sort] .mx-sort-icon,
.scl-matrix .mx-sort:is(:hover, :focus-visible) .mx-sort-icon {
  opacity: 1;
}
.scl-matrix .mx-table .mx-group td {
  padding: 5px 17px;
  height: 27px;
  border: 0;
  border-bottom: 1px solid #e5e7ee;
  background: #f5f5fb;
}
.scl-matrix .mx-group-line {
  display: flex;
  align-items: center;
  gap: 7px;
  line-height: 1.3;
  font-size: 11px;
}
.scl-matrix .mx-group-line strong {
  font-weight: 660;
  overflow-wrap: anywhere;
}
.scl-matrix .mx-arm-marker {
  display: inline-block;
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border: 1px solid #2969d5;
  border-radius: 2px;
  background: #b7cff5;
}
.scl-matrix .mx-arm-marker[data-arm='1'] {
  border-color: #b86120;
  background: #edbc93;
}
.scl-matrix .mx-group-count {
  color: var(--mx-muted);

}
.scl-matrix .mx-table .mx-row :is(td, th) {
  background: #fff;

  padding: 6px 13px;
  height: 33px;
  text-align: left;
  vertical-align: middle;
  border: 0;
  border-bottom: 1px solid #edeef3;
}
.scl-matrix .mx-table .mx-row .mx-participant {
  padding-left: 17px;
  font-weight: 600;
  min-width: 88px;
  word-break: break-word;
}
.scl-matrix .mx-row.mx-selectable {
  cursor: pointer;
}
.scl-matrix .mx-row.mx-selectable:hover > :is(td, th) {
  background: #f8f8fe;
}
.scl-matrix .mx-row.mx-active > :is(td, th) {

}
.scl-matrix .mx-row.mx-active .mx-participant {
  box-shadow: inset 3px 0 0 var(--mx-accent);
}
.scl-matrix .mx-person-btn {
  display: inline;
  color: #39356d;
  background: transparent;
  padding: 0;
  border: 0;
  box-shadow: none;
  border-radius: 2px;
  font: inherit;
  text-align: left;
  word-break: break-word;
  min-height: 0;
}
.scl-matrix .mx-row.mx-selectable:hover .mx-person-btn {
  text-decoration: underline;
  text-underline-offset: 2px;
}
.scl-matrix .mx-number {
  white-space: nowrap;
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: 'tnum';
}
.scl-matrix .mx-table .mx-row td.mx-number:not(.mx-delta) {
  text-align: right;
  padding-right: 27px;
}
.scl-matrix .mx-table .mx-row td.mx-missing {
  color: #7d8294;
}
.scl-matrix .mx-delta-value {
  display: inline-block;
  width: 8ch;
  text-align: right;
}
.scl-matrix .mx-delta-track {
  position: relative;
  display: inline-block;
  width: clamp(34px, 4vw, 64px);
  height: 9px;
  margin-left: 6px;
  vertical-align: middle;
}
.scl-matrix .mx-delta-track::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: #c3c5d3;
}
.scl-matrix .mx-delta-track i {
  position: absolute;
  top: 2px;
  height: 5px;
  border-radius: 1px;
}
.scl-matrix .mx-positive {
  left: 50%;
  background: #7664cd;
}
.scl-matrix .mx-negative {
  right: 50%;
  background: #788699;
}
.scl-matrix .mx-status {
  min-width: 78px;
}
.scl-matrix .mx-included,
.scl-matrix .mx-excluded {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  line-height: 1.3;
}
.scl-matrix .mx-included {
  color: #4f596b;
}
.scl-matrix .mx-included svg {
  width: 12px;
  height: 12px;
  color: #3b7161;
  stroke-width: 2.1;
}
.scl-matrix .mx-excluded {
  font-weight: 550;
  color: #825317;
}
.scl-matrix .mx-excluded i {
  flex: 0 0 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #bd7d27;
}
.scl-matrix .mx-table td.mx-empty {
  padding: 26px 17px;
  text-align: center;
  font-size: 12px;
  color: var(--mx-muted);
  background: #fff;
}
.scl-matrix .mx-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 14px 6px 17px;
  min-height: 32px;
  gap: 12px;
  border-top: 1px solid var(--mx-line);
  background: #fff;
  color: var(--mx-muted);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.scl-matrix .mx-pages {
  display: flex;
  align-items: center;
  gap: 3px;
}
.scl-matrix .mx-pages[hidden] {
  display: none;
}
.scl-matrix .mx-page-btn {
  align-content: center;
  justify-items: center;
  border: 1px solid var(--mx-line);
  border-radius: 4px;
  width: 25px;
  height: 23px;
  min-height: 0;
  padding: 0;
  color: var(--mx-muted);
  background: #fff;
  box-shadow: none;
}
.scl-matrix .mx-page-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
.scl-matrix :is(button, .mx-viewport):focus-visible {
  outline: 2px solid var(--mx-accent);
  outline-offset: -2px;
}
.scl-matrix .mx-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 650px) {
  .scl-matrix .mx-delta-track {
    display: none;
  }
  .scl-matrix .mx-delta-value {
    width: auto;
  }
  .scl-matrix .mx-table .mx-row td.mx-number:not(.mx-delta) {
    padding-right: 23px;
  }
  .scl-matrix .mx-table .mx-row :is(td, th),
  .scl-matrix .mx-table thead th {
    padding-inline: 9px;
  }
  .scl-matrix .mx-titlebar {
    padding-inline: 12px;
  }
  .scl-matrix .mx-filterbar {
    padding-inline: 12px;
  }
}

#appMenus {
  display: flex;
  align-self: stretch;
  align-items: center;
  flex: 0 0 auto;
  min-width: 0;
  color: #e7e9ef;
  font-family: inherit;
  -webkit-font-smoothing: antialiased;
}
#appMenus .am-bar {
  display: flex;
  align-items: center;
  gap: 2px;
}
#appMenus button {
  appearance: none;
  font-family: inherit;
  text-transform: none;
  letter-spacing: normal;
  box-shadow: none;
  cursor: default;
}
#appMenus .am-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 26px;
  margin: 0;
  padding: 2px 9px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #e7e9ef;
  font-size: 12px;
  line-height: 1.25;
  font-weight: 550;
}
#appMenus .am-trigger[hidden],
#appMenus .am-popup[hidden] { display: none; }
#appMenus .am-trigger:is(:hover, [aria-expanded="true"]) {
  background: #ffffff22;
  color: #fff;
}
#appMenus .am-trigger:focus-visible {
  outline: 2px solid #bbb6ff;
  outline-offset: -2px;
}
#appMenus .am-popup {
  position: fixed;
  z-index: 140;
  box-sizing: border-box;
  width: min(244px, calc(100vw - 10px));
  max-height: calc(100vh - 40px);
  margin: 0;
  padding: 4px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  border: 1px solid #cfd3df;
  border-radius: 7px;
  background: #fff;
  color: #202334;
  box-shadow: 0 9px 22px -5px #1c24342e, 0 2px 5px #1c243412;
  text-align: left;
  transform-origin: top left;
  animation: am-open 90ms ease-out;
}
@keyframes am-open {
  from { opacity: 0; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}
#appMenus .am-group { display: block; }
#appMenus .am-category {
  padding: 6px 10px 3px;
  color: #586078;
  font-size: 10.5px;
  line-height: 1.3;
  font-weight: 700;
}
#appMenus .am-divider {
  height: 1px;
  margin: 4px 5px;
  background: #e2e4ec;
}
#appMenus .am-item {
  display: grid;
  grid-template-columns: 13px 1fr auto;
  align-items: center;
  gap: 5px;
  width: 100%;
  box-sizing: border-box;
  min-height: 29px;
  margin: 0;
  padding: 5px 8px 5px 5px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #24273a;
  font-size: 12px;
  font-weight: 510;
  line-height: 1.35;
  text-align: left;
}
#appMenus .am-item:is(:hover, :focus) {
  outline: none;
  background: #eeedfc;
  color: #2e286e;
}
#appMenus .am-item[aria-disabled="true"] {
  color: #727681;
}
#appMenus .am-item[aria-disabled="true"]:is(:hover, :focus) {
  background: #f0f1f5;
}
#appMenus .am-check {
  justify-self: center;
  width: 9px;
  height: 5px;
  border-bottom: 1.7px solid currentColor;
  border-left: 1.7px solid currentColor;
  color: #5747b6;
  transform: translateY(-1px) rotate(-45deg);
  visibility: hidden;
}
#appMenus .am-item[aria-checked="true"] .am-check { visibility: visible; }
#appMenus .am-item kbd {
  grid-column: 3;
  justify-self: end;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: #656a7d;
  padding: 0 1px;
  font: inherit;
  font-size: 11px;
  line-height: 1;
}
#appMenus #appMenuMenu::after {
  content: '';
  height: 5px;
  width: 5px;
  margin: -3px 0 0 7px;
  border: solid currentColor;
  border-width: 0 1px 1px 0;
  transform: rotate(45deg);
}
@media (max-width: 639px) {
  #appMenus .am-trigger { min-height: 31px; }
  #appMenus .am-item { min-height: 34px; font-size: 13px; }
  #appMenus .am-category { padding-top: 7px; }
  #appMenus .am-group + .am-group { margin-top: 4px; border-top: 1px solid #e2e4ec; }
}
@media (prefers-reduced-motion: reduce) {
  #appMenus .am-popup { animation: none; }
}
@media (forced-colors: active) {
  #appMenus .am-item:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }
}

.cell-scene {
  position: relative;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  isolation: isolate;
  background: #0b2026;
  color: #eaf3f1;
}
.cell-world {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 29% 49%, #143b3b 0%, transparent 45%),
    radial-gradient(ellipse at 79% 34%, #262c40 0%, transparent 43%),
    linear-gradient(145deg, #101f29 0%, #0a2226 70%, #0c1c23);
}
.cell-world::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(145, 190, 190, 0.18) 0.6px, transparent 0.95px);
  background-size: 28px 28px;
  opacity: 0.55;
  mask-image: linear-gradient(140deg, #000, transparent 48%, #000);
}
.cell-field,
.cell-annotations {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.cell-field {
  display: block;
  touch-action: none;
  cursor: grab;
}
.cell-field:focus-visible {
  outline: 1px solid #9ad3cc;
  outline-offset: -5px;
}
.cell-field.cell-under-pointer {
  cursor: grab;
}
.cell-field.is-dragging {
  cursor: grabbing;
}
.cell-annotations {
  pointer-events: none;
  overflow: hidden;
}
.cell-heading {
  position: absolute;
  z-index: 2;
  top: clamp(19px, 3.6vh, 39px);
  left: clamp(20px, 3.4vw, 58px);
  pointer-events: none;
}
.cell-heading h1 {
  font-size: clamp(28px, 3.4vw, 54px);
  letter-spacing: -0.066em;
  font-weight: 560;
  line-height: 1.13;
}
.cell-summary {
  margin: 7px 0 0;
  color: #b9cfcd;
  font-size: clamp(11px, 1vw, 14px);
  font-weight: 510;
  font-variant-numeric: tabular-nums;
}
.cell-schematic {
  position: absolute;
  top: clamp(23px, 4.5vh, 44px);
  right: clamp(17px, 3.4vw, 54px);
  font: 500 10px/1.5 var(--mono);
  color: #abc3c4;
  letter-spacing: 0.015em;
  pointer-events: none;
}
.cell-reset {
  position: absolute;
  right: clamp(17px, 3.4vw, 54px);
  top: clamp(45px, 7.8vh, 73px);
  color: #d0e7e4;
  background: #172e36;
  border: 1px solid #52676e;
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 11px;
}
.cell-tag {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #deecea;
  height: 28px;
  max-width: min(42vw, 300px);
  padding: 3px 10px;
  border: 1px solid transparent;
  border-radius: 20px;
  background: #0d2228d4;
  font:
    580 13px/1.3 Manrope,
    system-ui,
    sans-serif;
  white-space: nowrap;
}
.cell-tag span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.cell-tag:hover,
.cell-tag:focus-visible,
.cell-tag.is-hovered,
.cell-tag[aria-pressed='true'] {
  background: #19323c;
  border-color: #5c747c;
}
.cell-tag-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: hsl(var(--marker-hue), 66%, 70%);
  box-shadow: 0 0 6px hsl(var(--marker-hue) 64% 59% / 0.4);
}
.cell-bottom {
  position: absolute;
  bottom: clamp(16px, 3.3vh, 38px);
  left: clamp(16px, 3.4vw, 58px);
  right: clamp(16px, 3.4vw, 58px);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  pointer-events: none;
}
.cell-gestures {
  color: #a6bfc2;
  font-size: 11px;
  letter-spacing: 0.005em;
}
.cell-dock {
  display: flex;
  align-items: stretch;
  gap: 3px;
  pointer-events: auto;
  padding: 4px;
  border: 1px solid #577079;
  border-radius: 8px;
  box-shadow: 0 6px 24px #0003;
  background: #122831ed;
  color: #e5eeef;
}
.cell-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  min-width: 0;
  position: relative;
}
.cell-pop-icon {
  width: 11px;
  height: 11px;
  background: #a4cec4;
  border: 2px solid #496863;
  box-shadow: inset 1px 1px 0 #d8f6e7;
  border-radius: 45% 54% 50% 41%;
  flex: none;
}
.cell-picker select {
  appearance: none;
  min-width: 0;
  padding: 7px 15px 7px 0;
  max-width: 230px;
  border: 0;
  background: transparent;
  color: inherit;
  font-size: 12px;
  font-weight: 620;
}
.cell-picker select option {
  color: #24333a;
  background: white;
}
.cell-chevron {
  pointer-events: none;
  width: 5px;
  height: 5px;
  border-right: 1px solid #c8d8d7;
  border-bottom: 1px solid #c8d8d7;
  transform: rotate(45deg);
  position: absolute;
  right: 10px;
  top: calc(50% - 4px);
}
.cell-analyze {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 11px;
  background: #b7e5d6;
  color: #193b38;
  border: 1px solid #bfeddd;
  border-radius: 5px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 720;
}
.cell-analyze:hover {
  background: #d0f3e5;
}
.cell-forward {
  font: 600 15px/1 system-ui;
}
@media (max-width: 650px) {
  .cell-heading {
    top: 18px;
    left: 18px;
  }
  .cell-heading h1 {
    font-size: 31px;
  }
  .cell-summary {
    margin-top: 3px;
  }
  .cell-schematic {
    font-size: 8.5px;
    top: auto;
    bottom: 67px;
    left: 17px;
    right: auto;
  }
  .cell-gestures {
    display: none;
  }
  .cell-bottom {
    left: 12px;
    right: 12px;
    bottom: 13px;
    justify-content: center;
  }
  .cell-dock {
    max-width: 100%;
  }
  .cell-picker select {
    max-width: 44vw;
    font-size: 11px;
  }
  .cell-analyze {
    font-size: 11px;
    gap: 6px;
  }
  .cell-tag {
    height: 26px;

    <script>
      /* Omitted rows mark unobserved specimens. Blank outcomes mark unmeasured scores. */
(() => {
  'use strict';

  const required = ['participant', 'arm', 'visit', 'population', 'cells'];
  const maxRows = 50000;
  const maxFeatures = 32;
  const maxBytes = 8 * 1024 * 1024;
  const decimal = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;

  function fieldLabel(value, name, line) {
    const result = value.trim();
    if (!result) throw new Error('Row ' + line + ' has an empty ' + name + '.');
    if (result.length > 160 || /[\u0000-\u001f\u007f]/.test(result)) {
      throw new Error(
        'Row ' + line + ' has an invalid ' + name + '. Use a single line of up to 160 characters.',
      );
    }
    return result;
  }

  const units = {
    gene: 'Recorded expression',
    pathway: 'Pathway score',
    module: 'Module score',
    score: 'Recorded score',
  };

  function featureColumn(header, index) {
    const match = /^(gene|pathway|module):(.*)$/i.exec(header);
    const kind = match ? match[1].toLowerCase() : 'score';
    const label = match ? match[2].trim() : header;
    if (!label) throw new Error('Add a name after the molecular prefix in “' + header + '”.');
    return {
      id: 'score_' + (index + 1),
      kind,
      label,
      unit: units[kind],
      inputName: header,
      inputSource: 'csv',
      index,
    };
  }

  function parseRows(text, accept) {
    let field = '',
      fields = [],
      quoted = false,
      closed = false;
    let line = 1,
      start = 1;

    function endField() {
      fields.push(field);
      if (fields.length > required.length + maxFeatures) {
        throw new Error(
          'Row ' + start + ' has too many fields. Include up to ' + maxFeatures + ' score columns.',
        );
      }
      field = '';
      closed = false;
    }

    function endRow() {
      endField();
      if (fields.length !== 1 || fields[0].trim()) accept(fields, start);
      fields = [];
    }

    for (let i = 0; i < text.length; i++) {
      const character = text[i];
      if (character === '\r' || character === '\n') {
        if (character === '\r' && text[i + 1] === '\n') i++;
        if (quoted) field += '\n';
        else endRow();
        line++;
        if (!quoted) start = line;
      } else if (quoted) {
        if (character !== '"') field += character;
        else if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = false;
          closed = true;
        }
      } else if (character === ',') {
        endField();
      } else if (closed) {
        if (character !== ' ' && character !== '\t') {
          throw new Error(
            'Row ' + line + ' has text after a closing quote. Use a comma between fields.',
          );
        }
      } else if (character === '"') {
        if (field.trim())
          throw new Error('Row ' + line + ' has a misplaced quote. Enclose the whole field in quotes.');
        field = '';
        quoted = true;
      } else field += character;
    }
    if (quoted) throw new Error('Row ' + start + ' has an unclosed quoted field.');
    endRow();
  }

  function readStudyCSV(text, fileName) {
    if (typeof text !== 'string') throw new Error('Choose a UTF-8 CSV file.');
    if (text.length > maxBytes || new Blob([text]).size > maxBytes) {
      throw new Error(
        'This preview supports CSV files up to 8 MiB. Select a smaller set of participant summaries.',
      );
    }
    const groups = new Set(),
      people = new Map(),
      visits = new Set(),
      populations = new Set();
    const keys = new Set(),
      observations = [];
    let positions, features, columnCount;

    function readHeader(fields, line) {
      const headers = fields.map((value) => fieldLabel(value, 'column name', line));
      const names = headers.map((name) => name.toLowerCase());
      if (new Set(names).size !== names.length)
        throw new Error('The header has duplicate column names. Give each column a unique name.');
      const missing = required.filter((name) => !names.includes(name));
      if (missing.length) throw new Error('Add the required CSV columns ' + missing.join(', ') + '.');
      positions = Object.fromEntries(required.map((name) => [name, names.indexOf(name)]));
      features = headers.flatMap((label, index) =>
        required.includes(names[index]) ? [] : [featureColumn(label, index)],
      );
      const duplicateNames = new Set(
        features
          .filter((feature, i) => features.some((other, j) => i !== j && other.label === feature.label))
          .map((feature) => feature.label),
      );
      for (const feature of features) {
        if (duplicateNames.has(feature.label)) feature.label = feature.inputName;
      }
      if (!features.length)
        throw new Error('Include at least one numeric score column after the study fields.');
      columnCount = fields.length;
    }

    function readObservation(fields, line) {
      if (observations.length >= maxRows)
        throw new Error('This preview supports up to 50,000 participant-level rows.');
      if (fields.length !== columnCount) {
        throw new Error(
          'Row ' + line + ' has ' + fields.length + ' fields. The header has ' + columnCount + '.',
        );
      }
      const id = fieldLabel(fields[positions.participant], 'participant ID', line);
      const arm = fieldLabel(fields[positions.arm], 'group label', line);
      const visit = fieldLabel(fields[positions.visit], 'visit label', line);
      const population = fieldLabel(fields[positions.population], 'population label', line);
      const previous = people.get(id);
      if (previous !== undefined && previous !== arm) {
        throw new Error(
          'Row ' + line + ' assigns ' + id + ' to a second group. Use one group per participant.',
        );
      }
      if (groups.size === 2 && !groups.has(arm)) {
        throw new Error(
          'Row ' + line + ' adds a third group. Import one or two groups for this comparison.',
        );
      }
      const key = JSON.stringify([id, visit, population]);
      if (keys.has(key)) {
        throw new Error(
          'Row ' +
            line +
            ' repeats ' +
            id +
            ' / ' +
            visit +
            ' / ' +
            population +
            '. Combine replicates before import.',
        );
      }
      const countText = fields[positions.cells].trim();
      const cells = Number(countText);
      if (!decimal.test(countText) || !Number.isSafeInteger(cells) || cells < 1) {
        throw new Error(
          'Row ' + line + ' requires a positive whole cell count. Omit rows with no observed cells.',
        );
      }
      const scores = {};
      for (const feature of features) {
        const value = fields[feature.index].trim();
        if (!value) {
          scores[feature.id] = null;
          continue;
        }
        const score = Number(value);
        if (!decimal.test(value) || !Number.isFinite(score)) {
          throw new Error(
            'Row ' + line + ' requires a finite number or an empty field in “' + feature.label + '”.',
          );
        }
        scores[feature.id] = score;
      }
      keys.add(key);
      groups.add(arm);
      people.set(id, arm);
      visits.add(visit);
      populations.add(population);
      observations.push({ id, arm, visit, population, cells, scores });
    }

    parseRows(text.replace(/^\uFEFF/, ''), (fields, line) => {
      if (positions) readObservation(fields, line);
      else readHeader(fields, line);
    });
    if (!positions) throw new Error('The CSV is empty. Start with the example template.');
    if (!observations.length)
      throw new Error('The CSV contains a header only. Add at least one participant observation.');
    const stem = String(fileName || '')
      .split(/[\\/]/)
      .pop()
      .replace(/\.csv$/i, '')
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .trim();
    return {
      title: stem.slice(0, 100) || 'Imported study',
      source: 'import',
      participants: Array.from(people, ([id, arm]) => ({ id, arm })),
      visits: Array.from(visits),
      populations: Array.from(populations),
      features: features.map(({ index, ...feature }) => feature),
      observations,
      results: {},
    };
  }

  function studyCSVTemplate() {
    const lines = [
      'participant,arm,visit,population,cells,module:Interferon response,module:Cytotoxicity',
    ];
    const visits = ['Baseline', 'Week 4', 'Week 12'];
    const populations = ['CD8 T cells', 'B cells'];
    for (let person = 0; person < 6; person++) {
      const first = person < 3;
      const participant = (first ? 'A' : 'B') + '0' + ((person % 3) + 1);
      for (let t = 0; t < visits.length; t++) {
        if (person === 5 && t === 2) continue;
        for (let c = 0; c < populations.length; c++) {
          const baseline = (person % 3) * 0.08;
          const response = 0.62 + baseline + (first ? 0.27 : 0.13) * t - c * 0.11;
          const cytotoxicity = 0.88 + baseline + (first ? 0.16 : 0.09) * t - c * 0.49;
          lines.push(
            [
              participant,
              first ? 'Arm A' : 'Arm B',
              visits[t],
              populations[c],
              32 + person * 3 + t * 4 + c,
              response.toFixed(2),
              cytotoxicity.toFixed(2),
            ].join(','),
          );
        }
      }
    }
    return lines.join('\r\n') + '\r\n';
  }

  globalThis.readStudyCSV = readStudyCSV;
  globalThis.studyCSVTemplate = studyCSVTemplate;
})();

(() => {
  'use strict';

  const recordsPerPage = 12;
  const previousViews = new WeakMap();
  const counts = new Intl.NumberFormat('en-US');
  const scores = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
  let nextId = 0;

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function makeButton(label, className, handler) {
    const button = node('button', className, label);
    button.type = 'button';
    button.addEventListener('click', handler);
    return button;
  }

  function makeSelect(name, items, initial, change) {
    const field = node('label', 'pe-control');
    field.append(node('span', 'pe-label', name));
    const select = node('select', 'select');
    select.setAttribute('aria-label', name);
    for (const [value, label] of items) select.add(new Option(label, value));
    select.value = initial;
    select.addEventListener('change', () => change(select.value));
    field.append(select);
    return field;
  }

  function indexVisits(observations, population) {
    const index = new Map();
    for (const obs of observations) {
      let visits = index.get(obs.id);
      if (!visits) {
        visits = new Map();
        index.set(obs.id, visits);
      }
      // A specimen may contain other populations but no observations in the selected one.
      if (!visits.has(obs.visit)) visits.set(obs.visit, null);
      if (obs.population === population && obs.cells > 0) visits.set(obs.visit, obs);
    }
    return index;
  }

  function status(entry, featureId) {
    if (entry === undefined) return ['no', 'No specimen recorded'];
    if (entry === null) return ['partial', 'Population unobserved'];
    if (!Number.isFinite(entry.scores[featureId])) return ['unmeasured', 'Score unmeasured'];
    return ['yes', 'Score measured'];
  }

  function visitMark(kind, label) {
    const mark = node('span', 'pe-mark pe-' + kind);
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', label);
    mark.title = label;
    return mark;
  }

  function pageControls(page, pageCount, onPage) {
    const pager = node('div', 'pe-pages');
    const prev = makeButton('Previous', 'pe-step', () => onPage(page - 1));
    const next = makeButton('Next', 'pe-step', () => onPage(page + 1));
    prev.disabled = page === 0;
    next.disabled = page >= pageCount - 1;
    pager.append(prev, node('span', 'pe-page-number', page + 1 + ' / ' + pageCount), next);
    return pager;
  }

  function renderPeople(container, model, actions = {}) {
    const old = previousViews.get(container);
    const state =
      old && old.study === model.participants
        ? old
        : {
            study: model.participants,
            arm: '',
            coverage: '',
            query: '',
            page: 0,
          };
    const prefix = 'pe-' + ++nextId;
    const { participants, arms, visits, population, feature } = model;
    const selected = [...new Set(model.selectedVisits)];
    const analysisArms = new Set(model.analysisArms);
    const index = indexVisits(model.observations, population);
    const shownVisits = visits.length <= 5 ? visits : selected;
    const unused = new Map();
    if (model.filterArm !== undefined && model.filterArm !== state.requestedArm) {
      state.arm = model.filterArm;
      state.requestedArm = model.filterArm;
    }
    if (model.query !== undefined && model.query !== state.requestedQuery) {
      state.query = model.query;
      state.requestedQuery = model.query;
    }
    if (!arms.includes(state.arm)) state.arm = '';
    const rows = participants.map((person) => {
      const visitsByPerson = index.get(person.id) || unused;
      const observed = selected.map((v) => visitsByPerson.get(v));
      const inArm = analysisArms.has(person.arm);
      const covered = inArm && selected.length > 0 && observed.every((entry) => Number.isFinite(entry?.scores[feature.id]));
      const cells = observed.reduce((sum, obs) => sum + (obs?.cells || 0), 0);
      return { person, visitsByPerson, inArm, covered, cells };
    });
    previousViews.set(container, state);

    const root = node('section', 'pe card');
    root.setAttribute('aria-labelledby', prefix + '-title');
    const head = node('div', 'pe-head');
    const title = node('h2', '', 'Visit coverage');
    title.id = prefix + '-title';
    head.append(
      title,
      node('p', 'pe-sub', [feature.label, population, selected.join(' and ')].filter(Boolean).join(' · ')),
    );
    const filters = node('div', 'pe-filters');
    const searchField = node('label', 'pe-control pe-search');
    searchField.append(node('span', 'pe-label', 'Participant ID'));
    const input = node('input', 'pe-input');
    input.type = 'search';
    input.placeholder = 'Search participants';
    input.value = state.query;
    searchField.append(input);
    const groupSelect = makeSelect(
      'Group',
      [['', 'All groups'], ...arms.map((a) => [a, a])],
      state.arm,
      (value) => {
        state.arm = value;
        state.page = 0;
        update();
      },
    );
    const coverageSelect = makeSelect(
      'Coverage',
      [
        ['', 'All participants'],
        ['included', 'Contributing'],
        ['missing', 'Missing required score'],
        ['outside', 'Outside selected groups'],
      ],
      state.coverage,
      (value) => {
        state.coverage = value;
        state.page = 0;
        update();
      },
    );
    filters.append(searchField, groupSelect, coverageSelect);
    const scroller = node('div', 'pe-scroll');
    const table = node('table', 'pe-table');
    table.setAttribute('aria-label', 'Participant visit coverage');
    const tableHead = table.createTHead().insertRow();
    ['Participant', 'Group', ...shownVisits, 'Cells¹', 'Contribution'].forEach((header) => {
      const th = node('th', '', header);
      th.scope = 'col';
      tableHead.append(th);
    });
    const body = table.createTBody();
    scroller.append(table);
    const footer = node('div', 'pe-footer'),
      range = node('p', 'pe-range');
    range.setAttribute('aria-live', 'polite');
    const pager = node('div');
    footer.append(range, pager);
    const legend = node('div', 'pe-legend');
    for (const [kind, label] of [
      ['yes', 'Score measured'],
      ['unmeasured', 'Score unmeasured'],
      ['partial', 'Population unobserved'],
      ['no', 'Specimen unrecorded'],
    ]) {
      const k = node('span', 'pe-key');
      const mark = visitMark(kind, label);
      mark.setAttribute('aria-hidden', 'true');
      k.append(mark, node('span', '', label));
      legend.append(k);
    }
    const note = node(
      'p',
      'pe-note',
      '¹ Cells in the selected population and visits. Each contributing participant has a measured score at every visit in the comparison.',
    );
    const extras = node('div', 'pe-notes');
    extras.append(legend, note);
    root.append(head, filters, scroller, footer, extras);
    container.replaceChildren(root);

    function update() {
      const needle = state.query.trim().toLocaleLowerCase();
      const visible = rows.filter(
        (r) =>
          (!needle || String(r.person.id).toLocaleLowerCase().includes(needle)) &&
          (!state.arm || r.person.arm === state.arm) &&
          (!state.coverage ||
            (state.coverage === 'included' && r.covered) ||
            (state.coverage === 'missing' && r.inArm && !r.covered) ||
            (state.coverage === 'outside' && !r.inArm)),
      );
      const pages = Math.max(1, Math.ceil(visible.length / recordsPerPage));
      state.page = Math.max(0, Math.min(state.page, pages - 1));
      const first = state.page * recordsPerPage;
      body.replaceChildren();
      visible.slice(first, first + recordsPerPage).forEach((record) => {
        const tr = body.insertRow();
        const id = node('th');
        id.scope = 'row';
        const open = makeButton(String(record.person.id), 'pe-person', () => openParticipant(record));
        open.setAttribute('aria-label', 'Inspect participant ' + record.person.id);
        id.append(open);
        tr.append(id);
        const group = tr.insertCell();
        const badge = node('span', 'pe-group', record.person.arm);
        badge.classList.toggle('pe-second', arms.indexOf(record.person.arm) === 1);
        group.append(badge);
        shownVisits.forEach((v) => tr.insertCell().append(visitMark(...status(record.visitsByPerson.get(v), feature.id))));
        tr.insertCell().append(node('span', 'pe-num', counts.format(record.cells)));
        const label = record.covered ? 'Contributing' : record.inArm ? 'Missing score' : 'Outside groups';
        tr.insertCell().append(
          node(
            'span',
            'pe-status pe-' + (record.covered ? 'covered' : record.inArm ? 'incomplete' : 'outside'),
            label,
          ),
        );
      });
      if (!visible.length) {
        const td = body.insertRow().insertCell();
        td.colSpan = shownVisits.length + 4;
        td.className = 'pe-empty';
        td.textContent = 'No participants match these filters.';
      }
      const last = Math.min(first + recordsPerPage, visible.length);
      range.textContent = visible.length
        ? first + 1 + '–' + last + ' of ' + counts.format(visible.length) + ' participants'
        : '0 participants';
      pager.replaceChildren();
      if (pages > 1) {
        const move = (page) => {
          state.page = page;
          update();
          const preferred = page > 0 ? 'button:first-child' : 'button:last-child';
          pager.querySelector(preferred)?.focus();
        };
        pager.append(pageControls(state.page, pages, move));
      }
    }

    function openParticipant(record) {
      const dialog = node('dialog', 'pe-detail');
      const title = node('h2', '', String(record.person.id));
      title.id = prefix + '-detail-title';
      dialog.setAttribute('aria-labelledby', title.id);
      const heading = node('div', 'pe-dialog-head');
      const titleBlock = node('div');
      titleBlock.append(node('p', 'pe-dialog-label', 'Participant'), title);
      const close = makeButton('Close', 'pe-close', () => dialog.close());
      heading.append(titleBlock, close);
      const context = node('p', 'pe-dialog-sub', record.person.arm + ' · ' + population);
      const panel = node('div', 'pe-scroll');
      const detail = node('table', 'pe-table pe-detail-table');
      const thead = detail.createTHead().insertRow();
      for (const h of ['Visit', 'Status', 'Cells', feature.label]) {
        const th = node('th', '', h);
        th.scope = 'col';
        thead.append(th);
      }
      const detailBody = detail.createTBody();
      panel.append(detail);
      const nav = node('div', 'pe-detail-nav');
      const totalPages = Math.max(1, Math.ceil(visits.length / recordsPerPage));
      function detailPage(page) {
        detailBody.replaceChildren();
        visits.slice(page * recordsPerPage, (page + 1) * recordsPerPage).forEach((v) => {
          const obs = record.visitsByPerson.get(v);
          const tr = detailBody.insertRow();
          const th = node('th', '', v);
          th.scope = 'row';
          tr.append(th);
          tr.insertCell().textContent = status(obs, feature.id)[1];
          tr.insertCell().textContent = obs ? counts.format(obs.cells) : '—';
          const val = obs?.scores?.[feature.id];
          tr.insertCell().textContent = Number.isFinite(val) ? scores.format(val) : '—';
        });
        nav.replaceChildren();
        if (totalPages > 1) nav.append(pageControls(page, totalPages, detailPage));
      }
      detailPage(0);
      dialog.append(heading, context, panel, nav);
      root.append(dialog);
      dialog.addEventListener('close', () => dialog.remove(), { once: true });
      dialog.showModal();
      close.focus();
      if (typeof actions.onParticipant === 'function') actions.onParticipant(record.person.id);
    }

    input.addEventListener('input', () => {
      state.query = input.value;
      state.page = 0;
      update();
    });
    update();
    if (model.initialId !== undefined) {
      const initial = rows.find((record) => record.person.id === model.initialId);
      if (initial) openParticipant(initial);
    }
  }

  globalThis.renderPeople = renderPeople;
})();

(() => {
  'use strict';

  const sorting = new WeakMap();
  const formatDecimal = new Intl.NumberFormat('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
  const signed = (n) =>
    Number.isFinite(n) ? (n < 0 ? '−' : n > 0 ? '+' : '') + formatDecimal.format(Math.abs(n)) : '—';
  const bound = (n) => (n === Infinity ? '∞' : n === -Infinity ? '−∞' : signed(n));
  const interval = (row) =>
    row.lo === null ||
    row.lo === undefined ||
    Number.isNaN(row.lo) ||
    row.hi === null ||
    row.hi === undefined ||
    Number.isNaN(row.hi)
      ? '—'
      : bound(row.lo) + ' to ' + bound(row.hi);
  function probability(n) {
    if (!Number.isFinite(n)) return '—';
    if (n === 0) return '0';
    return n < 0.001 ? n.toExponential(1).replace('e-', 'e−') : n.toFixed(3);
  }
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderResults(container, model, actions) {
    const isMean = !model.reference && Boolean(model.isMean);
    const currentFocus = container.contains(document.activeElement)
      ? document.activeElement.dataset.resultFocus
      : undefined;
    const sort = sorting.get(container) || { key: '', ascending: true };
    const source = Array.isArray(model.rows) ? model.rows : [];
    const selected = source.find((row) => row.id === model.selected) || source[0];
    const rows = [...source];
    const available = model.reference
      ? ['label', 'estimate', 'p', 'q', 'n']
      : ['label', 'estimate', 'n'];
    if (available.includes(sort.key)) {
      rows.sort((a, b) => {
        if (sort.key === 'label') return a.label.localeCompare(b.label) * (sort.ascending ? 1 : -1);
        const x = a[sort.key],
          y = b[sort.key];
        if (!Number.isFinite(x)) return Number.isFinite(y) ? 1 : 0;
        if (!Number.isFinite(y)) return -1;
        return (x - y) * (sort.ascending ? 1 : -1);
      });
    }
    const layout = el('div', 'results-layout');
    const card = el('section', 'card results-table-card');
    const heading = el('div', 'section-head result-head');
    const left = el('div');
    left.append(
      el(
        'h2',
        '',
        model.reference
          ? 'Feature estimates'
          : isMean
            ? 'Participant means'
            : 'Descriptive contrasts',
      ),
    );
    heading.append(left);
    const exportButton = el('button', 'btn small', 'Export CSV');
    exportButton.type = 'button';
    exportButton.dataset.resultFocus = 'export';
    exportButton.disabled = source.length === 0;
    exportButton.addEventListener('click', actions.onExport);
    heading.append(exportButton);
    card.append(heading);

    const scroller = el('div', 'results-scroll');
    const table = el('table', 'results-table');
    table.setAttribute(
      'aria-label',
      model.reference
        ? 'Feature estimates and uncertainty'
        : isMean
          ? 'Participant means by feature'
          : 'Descriptive participant-level contrasts',
    );
    const header = table.createTHead().insertRow();
    function createColumn(key, name) {
      const th = el('th');
      th.scope = 'col';
      if (!available.includes(key)) {
        th.textContent = name;
        header.append(th);
        return;
      }
      const sorted = sort.key === key;
      if (sorted) th.setAttribute('aria-sort', sort.ascending ? 'ascending' : 'descending');
      const button = el('button', 'sort-head');
      button.type = 'button';
      button.title = 'Sort by ' + name;
      button.dataset.resultFocus = 'sort-' + key;
      const glyph = el('span', 'sort-arrow', sorted ? (sort.ascending ? '↑' : '↓') : '↕');
      glyph.setAttribute('aria-hidden', 'true');
      button.append(document.createTextNode(name), glyph);
      button.addEventListener('click', () => {
        sorting.set(container, {
          key,
          ascending: sorted ? !sort.ascending : key !== 'n' && key !== 'estimate',
        });
        renderResults(container, model, actions);
      });
      th.append(button);
      header.append(th);
    }
    createColumn('label', 'Feature');
    createColumn('estimate', model.reference ? 'Estimate' : isMean ? 'Mean' : 'Difference');
    if (model.reference) {
      createColumn('ci', '95% CI');
      createColumn('p', 'p');
      createColumn('q', 'FDR');
    }
    createColumn('n', 'n');
    const body = table.createTBody();
    for (const row of rows) {
      const tr = body.insertRow();
      if (row.id === selected?.id) tr.classList.add('chosen-feature');
      const nameCell = el('th', 'feature-cell');
      nameCell.scope = 'row';
      const featureButton = el('button', 'feature-link', row.label);
      featureButton.type = 'button';
      featureButton.dataset.resultFocus = 'feature-' + row.id;
      featureButton.setAttribute('aria-pressed', String(row.id === selected?.id));
      function selectRow() {
        actions.onSelect(row.id);
      }
      featureButton.addEventListener('click', selectRow);
      tr.addEventListener('click', (event) => {
        if (!featureButton.contains(event.target)) selectRow();
      });
      nameCell.append(featureButton);
      tr.append(nameCell);
      tr.append(el('td', 'result-number', signed(row.estimate)));
      if (model.reference) {
        const adjusted = el('td', 'result-number', probability(row.q));
        if (row.fdrFamily) adjusted.title = row.fdrFamily;
        tr.append(
          el('td', 'result-interval', interval(row)),
          el('td', 'result-number', probability(row.p)),
          adjusted,
        );
      }
      tr.append(el('td', 'result-number', Number.isFinite(row.n) ? String(row.n) : '—'));
    }
    if (!source.length) {
      const td = el('td', 'result-empty', 'No features are available for this comparison.');
      td.colSpan = header.cells.length;
      body.insertRow().append(td);
    }
    scroller.append(table);
    card.append(scroller);
    const foot = el(
      'p',
      'result-foot muted',
      model.reference
        ? 'n = contributing participants. ' +
            (model.fdrDescription || 'FDR is reported across the tested features.')
        : isMean
          ? 'Each participant contributes one summary at the selected visit.'
          : 'Differences are calculated from the imported participant summaries.',
    );
    card.append(foot);
    layout.append(card);

    if (selected) {
      const detail = el('section', 'card result-detail');
      const group = el('div', 'result-detail-top');
      const name = el('div');
      name.append(el('span', 'detail-kicker', 'Selected feature'), el('h2', '', selected.label));
      group.append(name);
      const trace = el('button', 'btn small', 'View trajectory');
      trace.type = 'button';
      trace.dataset.resultFocus = 'trace';
      trace.addEventListener('click', () => actions.onShowOverview(selected.id));
      group.append(trace);
      detail.append(group);
      const facts = el('dl', 'detail-facts');
      function fact(label, value, special) {
        const div = el('div', special ? 'fact feature-estimate' : 'fact');
        div.append(el('dt', '', label), el('dd', '', value));
        facts.append(div);
      }
      fact(
        model.reference ? 'Estimate' : isMean ? 'Participant mean' : 'Descriptive difference',
        signed(selected.estimate),
        true,
      );
      if (model.reference) fact('95% confidence interval', interval(selected));
      fact('Participants', Number.isFinite(selected.n) ? String(selected.n) : '—');
      const selectedUnit = selected.unit || model.unit;
      if (selectedUnit) fact('Units', selectedUnit);
      if (model.reference && selected.fdrFamily) {
        fact('Adjusted p-value', probability(selected.q));
        fact('FDR family', selected.fdrFamily);
      }
      detail.append(facts);
      if (model.contrast) {
        const contrast = el('div', 'selected-contrast');
        contrast.append(
          el('span', '', isMean ? 'Summary' : 'Contrast'),
          el('p', '', model.contrast),
        );
        detail.append(contrast);
      }
      layout.append(detail);
    }
    container.replaceChildren(layout);
    if (currentFocus)
      Array.from(container.querySelectorAll('[data-result-focus]'))
        .find((node) => node.dataset.resultFocus === currentFocus)
        ?.focus({ preventScroll: true });
  }
  globalThis.renderResults = renderResults;
})();

(() => {
  'use strict';

  const storageVersion = 1;
  const prefix = 'sctrial.pinned-contrasts.v1.';
  const icons = {
    pin: 'M16 3l5 5-3 1-4 5v3l-2 2-3-5-5-3 2-2h3l5-4zM8 16l-5 5',
    pencil: 'M14 5l5 5M4 20l5-1L21 7l-5-5L4 14z',
    close: 'M7 7l10 10M17 7L7 17',
    open: 'M5 12h13m-5-5 5 5-5 5',
    swap: 'M3 8h16m-4-4 4 4-4 4M21 16H5m4-4-4 4 4 4',
  };

  function el(name, className, text) {
    const node = document.createElement(name);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function shape(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    Object.entries({
      viewBox: '0 0 24 24',
      width: '15',
      height: '15',
      fill: 'none',
      stroke: 'currentColor',
      'stroke-width': '1.7',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round',
      'aria-hidden': 'true',
    }).forEach(([key, value]) => svg.setAttribute(key, value));
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', icons[name]);
    svg.append(path);
    return svg;
  }

  function button(text, style, click, glyph) {
    const node = el('button', 'cbench-button ' + style);
    node.type = 'button';
    if (glyph) node.append(shape(glyph));
    if (text) node.append(document.createTextNode(text));
    node.addEventListener('click', click);
    return node;
  }

  function iconButton(label, glyph, click) {
    const node = button('', 'cbench-icon', click, glyph);
    node.setAttribute('aria-label', label);
    node.title = label;
    return node;
  }

  function numberToken(v) {
    if (Number.isNaN(v)) return '__sctrial_nan__';
    if (v === Infinity) return '__sctrial_inf__';
    if (v === -Infinity) return '__sctrial_negative_inf__';
    return v;
  }
  const encode = (value) =>
    JSON.stringify(value, (_, v) =>
      typeof v === 'number' && !Number.isFinite(v) ? { $sctrialNumber: numberToken(v) } : v,
    );
  const decode = (value) =>
    JSON.parse(value, (_, v) => {
      if (!v || typeof v !== 'object' || Object.keys(v).length !== 1) return v;
      switch (v.$sctrialNumber) {
        case '__sctrial_nan__':
          return NaN;
        case '__sctrial_inf__':
          return Infinity;
        case '__sctrial_negative_inf__':
          return -Infinity;
        default:
          return v;
      }
    });
  const clone = (v) =>
    typeof structuredClone === 'function' ? structuredClone(v) : decode(encode(v));
  const dict = (v) => v && typeof v === 'object' && !Array.isArray(v);

  function stable(v) {
    if (Array.isArray(v)) return v.map(stable);
    if (!dict(v)) return v;
    return Object.fromEntries(
      Object.keys(v)
        .sort()
        .map((k) => [k, stable(v[k])]),
    );
  }

  const rowUnit = (row, snapshot) => row?.unit || snapshot?.unit || '';
  const signatures = new WeakMap();
  function fingerprint(s) {
    if (!signatures.has(s)) {
      // Plot mode and highlighted feature travel with a pin when it is reopened.
      // The fitted comparison is identified by its study design and feature panel.
      const spec = { ...s.spec };
      delete spec.mode;
      delete spec.feature;
      const rows = s.rows
        .map((row) => ({ ...row, unit: rowUnit(row, s) }))
        .sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
      signatures.set(s, encode(stable([spec, s.method || '', rows])));
    }
    return signatures.get(s);
  }

  function isSnapshot(s) {
    if (!dict(s) || !dict(s.spec) || !Array.isArray(s.rows) || !s.rows.length) return false;
    const ids = new Set();
    return s.rows.every((row) => {
      if (!dict(row) || typeof row.id !== 'string' || !row.id || ids.has(row.id)) return false;
      ids.add(row.id);
      return true;
    });
  }

  function readSaved(key) {
    try {
      const raw = localStorage.getItem(prefix + key);
      if (!raw) return {};
      const saved = decode(raw);
      if (!dict(saved) || saved.version !== storageVersion || !Array.isArray(saved.pins)) return {};
      const seen = new Set();
      const valid = saved.pins.filter((p) => {
        if (
          !dict(p) ||
          typeof p.id !== 'string' ||
          !p.id ||
          seen.has(p.id) ||
          typeof p.name !== 'string' ||
          !isSnapshot(p.snapshot)
        )
          return false;
        seen.add(p.id);
        return true;
      });
      return { pins: valid, left: saved.left, right: saved.right };
    } catch {
      return {};
    }
  }

  const designNames = {
    did: 'Difference-in-differences',
    paired: 'Paired change',
    cross: 'Cross-sectional',
    observe: 'Participant mean',
  };
  function visits(s) {
    const x = s.spec;
    if ((x.design === 'did' || x.design === 'paired') && x.baseline && x.visit)
      return x.baseline + ' → ' + x.visit;
    return x.visit || (Array.isArray(x.visits) ? x.visits.join(' → ') : '');
  }
  function groups(s) {
    const x = s.spec;
    if (Array.isArray(x.orderedGroups)) return x.orderedGroups.join(' − ');
    if (x.arm && x.reference && ['did', 'cross'].includes(x.design))
      return x.arm + ' − ' + x.reference;
    return x.arm || '';
  }
  function defaultTitle(s) {
    return String(
      s.title ||
        [s.spec.population, visits(s)].filter(Boolean).join(' · ') ||
        designNames[s.spec.design] ||
        'Current contrast',
    ).slice(0, 110);
  }

  function estimate(x) {
    if (x === Infinity || x === 'Infinity') return '+∞';
    if (x === -Infinity || x === '-Infinity') return '−∞';
    if (!Number.isFinite(x)) return '—';
    const magnitude = Math.abs(x);
    const exact =
      magnitude > 0 && magnitude < 0.001
        ? magnitude.toExponential(2)
        : new Intl.NumberFormat('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 3,
          }).format(magnitude);
    return (x < 0 ? '−' : x > 0 ? '+' : '') + exact;
  }
  function hasInterval(r) {
    const usable = (n) =>
      (typeof n === 'number' && !Number.isNaN(n)) || n === 'Infinity' || n === '-Infinity';
    return usable(r.lo) && usable(r.hi);
  }

  function plotNode(tag, attributes, parent) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, String(value));
    if (parent) parent.append(node);
    return node;
  }

  function estimateDomain(rows) {
    let bound = 0,
      finite = false;
    for (const row of rows) {
      if (!row) continue;
      for (const value of [row.estimate, row.lo, row.hi]) {
        if (Number.isFinite(value)) {
          finite = true;
          bound = Math.max(bound, Math.abs(value));
        }
      }
    }
    if (!finite) return null;
    if (bound === 0) return 1;
    const base = 10 ** Math.floor(Math.log10(bound));
    if (!Number.isFinite(base) || base === 0) return bound;
    const step = [1, 2, 2.5, 5, 10].find((v) => v * base >= bound);
    return Number.isFinite(step * base) ? step * base : bound;
  }

  function axisNumber(x) {
    if (x === 0) return '0';
    const n = Math.abs(x);
    const label = n < 0.001 || n >= 10000 ? n.toExponential(0) : String(Number(n.toPrecision(3)));
    return (x < 0 ? '−' : '+') + label;
  }

  function axisLabels(domain) {
    const box = el('div', 'cbench-axis');
    box.setAttribute(
      'aria-label',
      'Shared estimate scale from ' + estimate(-domain) + ' to ' + estimate(domain),
    );
    for (const [className, value] of [
      ['lo', -domain],
      ['zero', 0],
      ['hi', domain],
    ])
      box.append(el('span', 'cbench-tick-' + className, axisNumber(value)));
    return box;
  }

  function pairPlot(ra, rb, domain, name) {
    const x = (v) => 50 + 45 * Math.max(-1, Math.min(1, Number(v) / domain)) + '%';
    const summary = [ra, rb]
      .map((r, i) => {
        const pin = i ? 'B' : 'A';
        if (!r) return pin + ' feature absent';
        return (
          pin +
          ' ' +
          estimate(r.estimate) +
          (hasInterval(r) ? ', 95% interval ' + estimate(r.lo) + ' to ' + estimate(r.hi) : '')
        );
      })
      .join('. ');
    const svg = plotNode('svg', {
      class: 'cbench-forest',
      width: '100%',
      height: 29,
      role: 'img',
      'aria-label': name + '. ' + summary,
    });
    const line = (x1, y1, x2, y2, attributes) =>
      plotNode('line', { x1, y1, x2, y2, ...attributes }, svg);
    line('50%', 0, '50%', 29, { stroke: '#93a7a7', 'stroke-dasharray': '2 2' });
    [ra, rb].forEach((r, i) => {
      const y = i ? 22 : 7,
        color = i ? 'var(--cb-b)' : 'var(--cb-a)';
      line('5%', y, '95%', y, { stroke: '#e6eced' });
      if (!r) return;
      if (hasInterval(r)) {
        const left = x(r.lo),
          right = x(r.hi);
        line(left, y, right, y, { stroke: color, 'stroke-width': 2.2 });
        for (const [end, at, sign] of [
          [r.lo, left, -1],
          [r.hi, right, 1],
        ]) {
          if (Number.isFinite(end))
            line(at, y - 3, at, y + 3, { stroke: color, 'stroke-width': 1.4 });
          else {
            const place = plotNode(
              'svg',
              { x: at, y, width: 1, height: 1, overflow: 'visible' },
              svg,
            );
            plotNode(
              'path',
              {
                d: 'M ' + -sign * 4 + ' -3 L 0 0 L ' + -sign * 4 + ' 3',
                stroke: color,
                'stroke-width': 1.5,
                fill: 'none',
              },
              place,
            );
          }
        }
      }
      if (Number.isFinite(r.estimate)) {
        const point = plotNode(
          'svg',
          { x: x(r.estimate), y, width: 1, height: 1, overflow: 'visible' },
          svg,
        );
        if (i)
          plotNode(
            'path',
            {
              d: 'M 0 -4.6 L 4.6 0 L 0 4.6 L -4.6 0 Z',
              fill: color,
              stroke: '#fff',
              'stroke-width': 1,
            },
            point,
          );
        else
          plotNode(
            'circle',
            { cx: 0, cy: 0, r: 4, fill: color, stroke: '#fff', 'stroke-width': 1 },
            point,
          );
      }
    });
    return svg;
  }

  function createContrastBench({

      } catch {
        notice('Pins are available for this session. Browser storage is unavailable.');

    function setStudy(key, options = {}) {

      const store = options.persist === true;

      scope = key;
      persistent = store;
      sharedFeatureUnit = commonUnit;
      const saved = store ? readSaved(key) : {};

      leftId = saved.left || pins[0]?.id || null;

    function pin() {

        return false;
      }
      const snapshot = clone(current);
      const signature = fingerprint(snapshot);
      const duplicate = pins.find((p) => fingerprint(p.snapshot) === signature);
      if (duplicate) {

        return false;
      }

      pins.push({ id, name: defaultTitle(snapshot), snapshot });

    }
    function remove(id) {
