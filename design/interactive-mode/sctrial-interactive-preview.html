    dialog.setAttribute('aria-labelledby', 'lm-heading');
    const form = el('form');
    const header = el('div', 'lm-header');
    const title = el('div');
    const heading = el('h2', '', 'Map study fields');
    heading.id = 'lm-heading';
    title.append(el('p', 'lm-eyebrow', 'Local H5AD'), heading);
    const dismiss = makeButton('×', 'lm-dismiss', () => dialog.close());
    dismiss.setAttribute('aria-label', 'Close mapping');
    header.append(title, dismiss);
    const body = el('div', 'lm-body'),
      foot = el('div', 'lm-foot');
    const errorBox = el('p', 'lm-error');
    errorBox.hidden = true;
    errorBox.setAttribute('role', 'alert');
    const cancel = makeButton('Cancel', 'lm-action', () => dialog.close());
    const submit = el('button', 'lm-action lm-primary', 'Open study');
    submit.type = 'submit';
    submit.disabled = true;
    foot.append(cancel, submit);
    form.append(header, body, foot);
    dialog.append(form);
    document.body.append(dialog);
    const status = el('div', 'lm-progress');
    status.setAttribute('role', 'status');
    const spinner = el('span', 'lm-spinner');
    spinner.setAttribute('aria-hidden', 'true');
    status.append(spinner, el('span', '', 'Reading study columns…'));
    body.append(status);

    let finishPromise,
      preparedStudy = null,
      settled = false;
    const promise = new Promise((resolve) => {
      finishPromise = resolve;
    });
    active = { promise };
    dialog.addEventListener(
      'close',
      async () => {
        if (settled) return;
        settled = true;
        controller.abort();
        dialog.remove();
        active = null;
        if (focusBeforeOpen?.isConnected) focusBeforeOpen.focus({ preventScroll: true });
        if (preparedStudy && !preparedStudy.orderedVisits) {
          preparedStudy.visits = inferVisitOrder(preparedStudy.visits) ||
            await reviewVisitOrder(preparedStudy, true);
        }
        finishPromise(preparedStudy);
        if (preparedStudy && typeof onLoaded === 'function') onLoaded(preparedStudy);
      },
      { once: true },
    );
    dialog.showModal();

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function setUp(schema) {
      if (
        !Array.isArray(schema?.columns) ||
        !schema.columns.every((c) => typeof c?.name === 'string')
      ) {
        throw new Error('The file did not provide a readable observation-column list.');
      }
      const suggested = schema.suggested || {};
      const columns = [...schema.columns].sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { numeric: true }),
      );
      const numeric = columns.filter((c) => c.numeric).map((c) => c.name);
      const selected = new Set(
        (Array.isArray(suggested.scores) ? suggested.scores : [])
          .filter((s) => numeric.includes(s))
          .slice(0, scoreLimit),
      );
      const file = el('div', 'lm-file'),
        fileDetails = el('div');
      const cellCount = Number.isFinite(schema.nCells)
        ? schema.nCells.toLocaleString() + ' cells · '
        : '';
      fileDetails.append(
        el('b', '', schema.filename || 'Local study'),
        el('small', '', cellCount + columns.length + ' observation columns'),
      );
      const mark = el('span', 'lm-file-mark', 'H5');
      mark.setAttribute('aria-hidden', 'true');
      file.append(mark, fileDetails);
      const designSection = el('section', 'lm-section');
      designSection.append(el('h3', '', 'Study design'));
      const grid = el('div', 'lm-fields');
      const selectors = {};
      for (const role of roles) {
        const label = el('label', 'lm-field');
        const select = el('select');
        select.name = role.key;
        select.setAttribute('aria-label', role.label);
        select.append(new Option(role.empty, ''));
        columns.forEach((c) => select.append(new Option(c.name, c.name)));
        const suggestion = suggested[role.key];
        if (columns.some((c) => c.name === suggestion)) select.value = suggestion;
        selectors[role.key] = select;
        label.append(el('span', '', role.label), select);
        grid.append(label);
      }
      designSection.append(grid);

      const scoreSection = el('section', 'lm-section');
      const scoreHead = el('div', 'lm-outcome-head'),
        count = el('span', 'lm-count');
      scoreHead.append(el('h3', '', 'Outcome scores'), count);
      const search = el('input');
      search.type = 'search';
      search.placeholder = 'Filter numeric columns';
      search.setAttribute('aria-label', 'Filter numeric columns');
      const scoreList = el('div', 'lm-scores');
      scoreList.setAttribute('role', 'group');
      scoreList.setAttribute('aria-label', 'Outcome scores');
      const note = el('p', 'lm-note', 'Select up to 12 numeric scores from the observation table.');
      const validation = el('p', 'lm-note');
      validation.setAttribute('role', 'status');
      scoreSection.append(scoreHead, search, scoreList, note, validation);
      body.replaceChildren(file, designSection, scoreSection, errorBox);

      const mappedRoles = () => roles.map((r) => selectors[r.key].value).filter(Boolean);
      function updateState() {
        const mapped = mappedRoles();
        const overlap = new Set(mapped).size !== mapped.length;
        const problem = !selectors.participant.value
          ? 'Choose the participant ID column.'
          : overlap
            ? 'Use a different column for each study role.'
            : !numeric.length
              ? 'This file has no numeric observation scores.'
              : selected.size === 0
                ? 'Choose at least one outcome score.'
                : '';
        submit.disabled = Boolean(problem);
        validation.textContent = problem;
        validation.hidden = !problem;
        count.textContent = selected.size + ' selected';
        const locked = new Set(mapped);
        scoreList.querySelectorAll('input').forEach((box) => {
          box.disabled = locked.has(box.value) || (!box.checked && selected.size >= scoreLimit);
        });
      }
      function drawScores() {
        const needle = search.value.trim().toLocaleLowerCase();
        const matches = numeric.filter((n) => n.toLocaleLowerCase().includes(needle));
        const fragment = document.createDocumentFragment();
        for (const name of matches) {
          const row = el('label', 'lm-score'),
            check = el('input');
          check.type = 'checkbox';
          check.value = name;
          check.checked = selected.has(name);
          check.addEventListener('change', () => {
            if (check.checked) selected.add(name);
            else selected.delete(name);
            errorBox.hidden = true;
            updateState();
          });
          row.append(check, el('span', '', name));
          fragment.append(row);
        }
        if (!matches.length)
          fragment.append(
            el(
              'p',
              'lm-empty',
              numeric.length ? 'No scores match this filter.' : 'No numeric columns found.',
            ),
          );
        scoreList.replaceChildren(fragment);
        updateState();
      }
      function roleChanged() {
        mappedRoles().forEach((name) => selected.delete(name));
        errorBox.hidden = true;
        drawScores();
      }
      Object.values(selectors).forEach((select) => select.addEventListener('change', roleChanged));
      search.addEventListener('input', drawScores);
      roleChanged();
      selectors.participant.focus({ preventScroll: true });
      let sending = false;
      form.onsubmit = async (event) => {
        event.preventDefault();
        if (sending || submit.disabled) return;
        sending = true;
        const payload = Object.fromEntries(roles.map((r) => [r.key, selectors[r.key].value || null]));
        payload.scores = [...selected];
        errorBox.hidden = true;
        submit.disabled = true;
        submit.textContent = 'Opening…';
        for (const control of body.querySelectorAll('input,select')) control.disabled = true;
        try {
          const result = await request('/local/study', payload, controller.signal);
          if (!dialog.open || controller.signal.aborted) return;
          if (
            !result?.studyId ||
            !Array.isArray(result.visits) ||
            !result.visits.length ||
            !Array.isArray(result.participants) ||
            !Array.isArray(result.features) ||
            !Array.isArray(result.observations)
          ) {
            throw new Error('The local workspace returned an incomplete study.');
          }
          preparedStudy = result;
          dialog.close();
        } catch (error) {
          if (controller.signal.aborted || !dialog.open) return;
          for (const control of body.querySelectorAll('input,select')) control.disabled = false;
          submit.textContent = 'Open study';
          updateState();
          showError(error.message);
          sending = false;
        }
      };
    }

    async function load() {
      errorBox.hidden = true;
      submit.hidden = false;
      submit.disabled = true;
      body.replaceChildren(status);
      try {
        const schema = await request('/local/schema', undefined, controller.signal);
        if (!controller.signal.aborted && dialog.open) setUp(schema);
      } catch (error) {
        if (controller.signal.aborted || !dialog.open) return;
        body.replaceChildren(errorBox);
        showError(error.message);
        submit.hidden = true;
        const retry = makeButton('Retry', 'lm-action lm-primary', () => {
          retry.remove();
          load();
        });
        foot.append(retry);
        retry.focus();
      }
    }
    load();
    return promise;
  }
  window.localStudyClient = Object.freeze({ available, openMapping, openCSV, reviewVisitOrder, fit });
})();

(() => {
  'use strict';
  const get = (id) => document.getElementById(id);
  const sidebar = get('projectSidebar');
  const trigger = get('showSidebar');
  const shade = get('navigatorShade');
  const compact = matchMedia('(max-width: 850px)');
  let lastStudy;
  let lastOrder;

  function toggleSidebar(open, returnFocus = true) {
    const wasOpen = trigger.getAttribute('aria-expanded') === 'true';
    trigger.setAttribute('aria-expanded', String(open));
    sidebar.classList.toggle('is-open', open);
    shade.hidden = !open;
    sidebar.inert = compact.matches && !open;
    document.querySelector('.workspace-body').inert = open;
    if (open) get('closeSidebar').focus();
    else if (wasOpen && returnFocus && compact.matches) trigger.focus();
  }
  trigger.onclick = () => toggleSidebar(true);
  get('closeSidebar').onclick = () => toggleSidebar(false);
  shade.onclick = () => toggleSidebar(false);
  sidebar.addEventListener(
    'click',
    (event) => {
      if (!compact.matches) return;
      if (event.target.closest('[data-view], [data-action], [data-sheet-id]')) toggleSidebar(false);
    },
    true,
  );
  document.addEventListener('keydown', (event) => {
    if (
      event.key === 'Escape' &&
      !document.querySelector('dialog[open]') &&
      sidebar.classList.contains('is-open')
    )
      toggleSidebar(false);
  });
  compact.addEventListener('change', () => toggleSidebar(false));
  toggleSidebar(false);

  // Count a participant once per visit across all recorded populations.
  function setStudy(study) {
    const order = JSON.stringify(study.visits);
    if (lastStudy === study && lastOrder === order) return;
    lastStudy = study;
    lastOrder = order;
    get('mobileSource').textContent =
      study.source === 'h5ad' ? 'Local H5AD' : study.study ? 'Synthetic study' : 'Local CSV';
    const arms = [...new Set(study.participants.map((person) => person.arm))];
    const counts = new Map(
      arms.map((arm) => [arm, new Map(study.visits.map((visit) => [visit, new Set()]))]),
    );
    const totals = new Map(arms.map((arm) => [arm, 0]));
    for (const row of study.participants) totals.set(row.arm, totals.get(row.arm) + 1);
    for (const row of study.observations) {
      if (row.cells > 0) counts.get(row.arm)?.get(row.visit)?.add(row.id);
    }
    const stage = get('studyMap');
    stage.replaceChildren();
    const format = (tag, label) => {
      const el = document.createElement(tag);
      el.textContent = label;
      return el;
    };
    const table = document.createElement('table');
    table.setAttribute(
      'aria-label',
      'Participants sampled per group and visit across all populations',
    );
    const header = table.createTHead().insertRow();
    header.append(format('th', 'Visit'));
    for (const arm of arms) {
      const th = format('th', arm);
      th.scope = 'col';
      th.title = arm;
      header.append(th);
    }
    const body = table.createTBody();
    for (const visit of study.visits) {
      const tr = body.insertRow();
      const th = format('th', visit);
      th.scope = 'row';
      th.title = visit;
      tr.append(th);
      for (const arm of arms) {
        const td = tr.insertCell();
        const n = counts.get(arm).get(visit).size;
        const bar = document.createElement('i');
        td.append(format('span', n), bar);
        td.style.setProperty('--coverage', (100 * n) / totals.get(arm) + '%');
      }
    }
    stage.append(table);
  }
  window.SctrialChrome = { setStudy, closeNavigator: () => toggleSidebar(false, false) };
})();

(() => {
  'use strict';

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  const icons = {
    sheet: 'M4.5 3.5h10v12h-10z M7 12V9m2.5 3V6.5M12 12V8',
    rename: 'm4 12.5-.6 3.1 3.1-.6L15 6.5 12.5 4z M11 5.5 13.5 8',
    duplicate: 'M7 7h8v8H7z M4.5 12H3.3V3.3H12v1.2',
    remove: 'M3.5 5h11M7 5V3h4v2 M5 5l.7 10h6.6L13 5 M8 7.5v5 M10 7.5v5',
  };

  function glyph(name) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 18 18');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('class', 'sheet-icon');
    if (name === 'more') {
      [4, 9, 14].forEach((x) => {
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', x);
        dot.setAttribute('cy', '9');
        dot.setAttribute('r', '1.2');
        dot.setAttribute('fill', 'currentColor');
        svg.append(dot);
      });
    } else {
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', icons[name]);
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '1.45');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('stroke-linecap', 'round');
      svg.append(path);
    }
    return svg;
  }

  function button(className, label, icon) {
    const control = node('button', className);
    control.type = 'button';
    control.setAttribute('aria-label', label);
    if (icon) control.append(glyph(icon));
    return control;
  }

  window.createAnalysisSheets = function ({ getSpec, getStudy, onOpen, onRename = () => {} }) {
    const list = document.getElementById('sheetList');
    const addButton = document.getElementById('newSheet');
    let papers = [];
    let active = null;
    let defaults;
    let nextId = 1;
    let overview = true;
    let removed = null;
    let menu = null;
    let menuTrigger = null;
    let renaming = null;

    function reset(label = 'Primary analysis') {
      dismissMenu();
      renaming = null;
      removed = null;
      defaults = { ...getSpec() };
      nextId = 1;
      active = { id: nextId++, title: label, spec: { ...defaults } };
      papers = [active];
      overview = true;
      render();
    }

    function open(paper) {
      const navigator = list.closest('[inert], #projectSidebar');
      window.SctrialChrome?.closeNavigator();
      if (paper === active && overview) {
        if (navigator?.inert) document.getElementById('main')?.focus({ preventScroll: true });
        return;
      }
      if (active) active.spec = { ...getSpec() };
      active = paper;
      overview = true;
      onOpen({ ...paper.spec });
      render();
      const target = navigator?.inert
        ? document.getElementById('main')
        : list.querySelector(`[data-sheet-id="${paper.id}"]`);
      target?.focus({ preventScroll: true });
    }

    function unique(base, names = new Set(papers.map((paper) => paper.title))) {
      let result = base.slice(0, 80);
      let number = 2;
      while (names.has(result)) {
        const suffix = ' (' + number++ + ')';
        result = base.slice(0, 80 - suffix.length) + suffix;
      }
      return result;
    }

    function create(original) {
      if (!active) return;
      active.spec = { ...getSpec() };
      const paper = {
        id: nextId,
        title: unique(original ? original.title + ' copy' : 'Analysis ' + nextId),
        spec: { ...(original ? original.spec : defaults) },
      };
      nextId++;
      const index = original ? papers.indexOf(original) + 1 : papers.length;
      papers.splice(index, 0, paper);
      open(paper);
      if (!list.closest('[inert]'))
        list.querySelector(`[data-sheet-id="${paper.id}"]`)?.scrollIntoView({ block: 'nearest' });
    }

    function remove(paper) {
      if (papers.length === 1) return;
      const index = papers.indexOf(paper);
      if (active === paper) paper.spec = { ...getSpec() };
      removed = { index, paper };
      papers.splice(index, 1);
      if (active === paper) open(papers[Math.min(index, papers.length - 1)]);
      else render();
      list.querySelector('.sheet-undo')?.focus();
    }

    function undoRemove() {
      if (!removed) return;
      const { index, paper } = removed;
      removed = null;
      papers.splice(Math.min(index, papers.length), 0, paper);
      open(paper);
    }

    function dismissMenu(restoreFocus = false) {
      menu?.remove();
      menu = null;
      if (menuTrigger) {
        menuTrigger.setAttribute('aria-expanded', 'false');
        if (restoreFocus) menuTrigger.focus();
      }
      menuTrigger = null;
      document.removeEventListener('pointerdown', outside, true);
      document.removeEventListener('focusin', focusOutside);
      window.removeEventListener('resize', placeMenu);
      document.removeEventListener('scroll', placeMenu, true);
    }

    function outside(event) {
      if (!menu?.contains(event.target) && !menuTrigger?.contains(event.target)) dismissMenu();
    }

    function focusOutside(event) {
      if (!menu?.contains(event.target) && event.target !== menuTrigger) dismissMenu();
    }

    function placeMenu() {
      if (!menu || !menuTrigger) return;
      const box = menuTrigger.getBoundingClientRect();
      const width = menu.offsetWidth;
      const height = menu.offsetHeight;
      const left = Math.max(6, Math.min(box.right - width, window.innerWidth - width - 6));
      const top =
        box.bottom + height + 6 <= window.innerHeight ? box.bottom + 3 : box.top - height - 3;
      menu.style.left = left + 'px';
      menu.style.top = Math.max(4, top) + 'px';
    }

    function showMenu(paper, trigger) {
      const same = trigger === menuTrigger;
      dismissMenu();
      if (same) return;
      menuTrigger = trigger;
      menu = node('div', 'sheet-menu');
      menu.setAttribute('role', 'menu');
      menu.setAttribute('aria-label', 'Actions for ' + paper.title);
      trigger.setAttribute('aria-expanded', 'true');
      const items = [
        ['rename', 'Rename', () => editName(paper)],
        ['duplicate', 'Duplicate', () => create(paper)],
        ['remove', 'Remove', () => remove(paper)],
      ];
      items.forEach(([icon, label, action]) => {
        const item = button('sheet-menu-item', label, icon);
        item.setAttribute('role', 'menuitem');
        item.tabIndex = -1;
        item.disabled = icon === 'remove' && papers.length === 1;
        item.append(document.createTextNode(label));
        item.addEventListener('click', () => {
          dismissMenu();
          action();
        });
        menu.append(item);
      });
      menu.addEventListener('keydown', (event) => {
        const enabled = [...menu.querySelectorAll('button:enabled')];
        const index = enabled.indexOf(document.activeElement);
        switch (event.key) {
          case 'ArrowDown':
            enabled[(index + 1) % enabled.length].focus();
            break;
          case 'ArrowUp':
            enabled[(index + enabled.length - 1) % enabled.length].focus();
            break;
          case 'Home':
            enabled[0].focus();
            break;
          case 'End':
            enabled[enabled.length - 1].focus();
            break;
          case 'Escape':
            dismissMenu(true);
            break;
          case 'Tab':
            dismissMenu(true);
            return;
          default:
            return;
        }
        event.preventDefault();
        event.stopPropagation();
      });
      document.body.append(menu);
      placeMenu();
      menu.firstElementChild.focus();
      document.addEventListener('pointerdown', outside, true);
      document.addEventListener('focusin', focusOutside);
      window.addEventListener('resize', placeMenu);
      document.addEventListener('scroll', placeMenu, true);
    }

    function editName(paper) {
      renaming = paper;
      render();
      const input = list.querySelector('input');
      input.focus();
      input.select();
    }

    function nameEditor(paper) {
      const form = node('form', 'sheet-name-form');
      const input = node('input', 'sheet-name');
      input.value = paper.title;
      input.maxLength = 80;
      input.autocomplete = 'off';
      input.setAttribute('aria-label', 'Analysis name');
      const finish = (commit, focus) => {
        if (renaming !== paper) return;
        renaming = null;
        const title = input.value
          .trim()
          .replace(/[\u0000-\u001f\u007f]/g, ' ')
          .trim();
        if (commit && title) paper.title = title;
        form.parentElement?.replaceWith(sheetRow(paper));
        markActive();
        onRename();
        if (focus) list.querySelector(`[data-sheet-id="${paper.id}"]`)?.focus();
      };
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        finish(true, true);
      });
      input.addEventListener('blur', () => finish(true, false));
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          finish(false, true);
        }
      });
      form.append(input);
      return form;
    }

    function markActive() {
      for (const item of list.querySelectorAll('[data-sheet-id]')) {
        const current = overview && item.dataset.sheetId === String(active?.id);
        item.toggleAttribute('data-active', current);
        if (current) item.setAttribute('aria-current', 'page');
        else item.removeAttribute('aria-current');
      }
    }

    function sheetRow(paper) {
      const row = node('div', 'sheet-item');
      if (renaming === paper) {
        row.append(nameEditor(paper));
        return row;
      }
      const select = button('sheet-link', paper.title, 'sheet');
      select.dataset.sheetId = paper.id;
      select.title = paper.title;
      select.append(node('span', 'sheet-label', paper.title));
      select.addEventListener('click', () => open(paper));
      const more = button('sheet-more', 'Actions for ' + paper.title, 'more');
      more.title = 'Analysis actions';
      more.setAttribute('aria-haspopup', 'menu');
      more.setAttribute('aria-expanded', 'false');
      more.addEventListener('click', () => showMenu(paper, more));
      row.append(select, more);
      return row;
    }

    function render() {
      dismissMenu();
      list.replaceChildren(...papers.map(sheetRow));
      if (removed) {
        const undoButton = button('sheet-undo', 'Undo removal of ' + removed.paper.title);
        undoButton.textContent = 'Undo removal';
        undoButton.addEventListener('click', undoRemove);
        list.append(undoButton);
      }
      markActive();
    }

    function studySchema(study) {
      const sorted = (values) => [...values].sort();
      const mapping = study.mapping
        ? Object.fromEntries(
            ['participant', 'arm', 'visit', 'population'].map((role) => [
              role,
              study.mapping[role] ?? null,
            ]),
          )
        : null;
      return {
        name: study.name,
        source: study.source,
        arms: sorted(study.arms),
        visits: sorted(study.visits),
        populations: sorted(study.populations),
        features: study.features
          .map(({ id, label }) => ({ id, label }))
          .sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)),
        mapping,
      };
    }

    function validatedSpec(settings, schema, study) {
      if (!settings || typeof settings !== 'object') throw Error('Missing comparison settings.');
      const { design, arm, baseline, visit, population, feature, mode, visitOrder } = settings;
      if (!study.designs.includes(design)) throw Error('Unsupported study design.');
      if (!schema.arms.includes(arm)) throw Error('Unknown group.');
      if (!schema.populations.includes(population)) throw Error('Unknown cell population.');
      if (!schema.features.some((f) => f.id === feature)) throw Error('Unknown outcome.');
      if (!schema.visits.includes(baseline) || !schema.visits.includes(visit))
        throw Error('Unknown comparison visit.');
      if (study.fixedBaseline && baseline !== study.fixedBaseline)
        throw Error('The reference visit does not match the fitted study.');
      if (['did', 'paired'].includes(design) && baseline === visit)
        throw Error('Select two distinct visits for a paired comparison.');
      if (!['comparison', 'trajectory', 'changes'].includes(mode))
        throw Error('Unknown analysis view.');
      if (
        !Array.isArray(visitOrder) ||
        visitOrder.length !== schema.visits.length ||
        !visitOrder.every((v) => schema.visits.includes(v)) ||
        new Set(visitOrder).size !== visitOrder.length
      )
        throw Error('Visit order must include each study visit exactly once.');
      if (study.fixedBaseline && !visitOrder.every((v, i) => v === study.visits[i]))
        throw Error('The visit order does not match the fitted study.');
      return {
        design,
        arm,
        baseline,
        visit,
        population,
        feature,
        visitOrder: [...visitOrder],
        mode,
      };
    }

    function exportWorkbook() {
      const study = getStudy();
      const schema = studySchema(study);
      const contents = papers.map((paper) => {
        const spec = paper === active ? getSpec() : paper.spec;
        return {
          title: paper.title,
          comparison: validatedSpec(spec, schema, study),
        };
      });
      return (
        JSON.stringify(
          {
            format: 'sctrial-workbook',
            version: 1,
            study: schema,
            sheets: contents,
            activeSheet: papers.indexOf(active) + 1,
          },
          null,
          2,
        ) + '\n'
      );
    }

    function importWorkbook(text) {
      let file;
      try {
        file = JSON.parse(text.replace(/^\uFEFF/, ''));
      } catch {
        throw Error('Choose a valid workbook JSON file.');
      }
      if (file?.format !== 'sctrial-workbook' || file.version !== 1)
        throw Error('Choose a version 1 sctrial analysis workbook.');
      const study = getStudy();
      const schema = studySchema(study);
      const saved = file.study;
      if (!saved || saved.name !== schema.name || saved.source !== schema.source)
        throw Error('Open the study that was used to save this workbook.');
      const sameList = (a, b) =>
        Array.isArray(a) && a.length === b.length && a.every((value, index) => value === b[index]);
      if (
        !sameList(saved.arms, schema.arms) ||
        !sameList(saved.populations, schema.populations) ||
        !sameList(saved.visits, schema.visits)
      )
        throw Error('The groups, visits, or cell populations differ from the saved study.');
      if (
        !Array.isArray(saved.features) ||
        saved.features.length !== schema.features.length ||
        !schema.features.every(
          (f, i) => saved.features[i]?.id === f.id && saved.features[i]?.label === f.label,
        )
      )
        throw Error(
          'The outcome columns differ from the saved study. Check their names and mapping.',
        );
      if (
        schema.mapping === null
          ? saved.mapping !== null
          : !saved.mapping ||
            !Object.keys(schema.mapping).every((key) => saved.mapping[key] === schema.mapping[key])
      )
        throw Error('The H5AD column mapping differs from the saved study.');
      if (
        !Array.isArray(file.sheets) ||
        !file.sheets.length ||
        !Number.isInteger(file.activeSheet) ||
        file.activeSheet < 1 ||
        file.activeSheet > file.sheets.length
      )
        throw Error('The workbook has no valid active sheet.');

      const names = new Set(papers.map((paper) => paper.title));
      const imported = file.sheets.map((sheet, i) => {
        if (
          !sheet ||
          typeof sheet.title !== 'string' ||
          !sheet.title.trim() ||
          sheet.title.length > 80 ||
          /[\u0000-\u001f\u007f]/.test(sheet.title)
        )
          throw Error('Sheet ' + (i + 1) + ' has an invalid name.');
        let spec;
        try {
          spec = validatedSpec(sheet.comparison, schema, study);
        } catch (error) {
          throw Error('Sheet ' + (i + 1) + ': ' + error.message);
        }
        const title = unique(sheet.title.trim(), names);
        names.add(title);
        return { id: nextId + i, title, spec };
      });
      nextId += imported.length;
      papers = papers.concat(imported);
      open(imported[file.activeSheet - 1]);
      return imported.length;
    }

    addButton.addEventListener('click', () => create());
    return Object.freeze({
      reset,
      exportWorkbook,
      importWorkbook,
      title: () => active?.title || '',
      setVisible(value) {
        if (overview === value) return;
        overview = value;
        markActive();
      },
    });
  };
})();

(function () {

  const compactNumber = new Intl.NumberFormat(undefined, { maximumSignificantDigits: 5 });
  const symbols = {
    search: 'M19.5 19.5l-4.4-4.4m2.2-5a7.2 7.2 0 1 1-14.4 0 7.2 7.2 0 0 1 14.4 0Z',

    if (config.longitudinal && baseline === null) missing.push(config.baseline);
    if (followup === null) missing.push(config.visit);
    const included = record.contributes === true && !missing.length;
    const change =
      config.longitudinal && baseline !== null && followup !== null ? followup - baseline : null;
    const reason = missing.length
      ? 'Missing ' + missing.join(' and ')
      : String(record.reason || 'Outside the analysis set');

      id: String(record.id),
      arm: String(record.arm ?? ''),

      followup,

            scope,
            query: '',
            filter: 'all',
            sort: 'id',
            descending: false,

    const counts = new Map();
    let includedCount = 0;

    records.forEach((row) => {

    const heading = node('div', 'mx-heading');

    const feature = typeof config.feature === 'string' ? config.feature : config.feature?.label;
    const subtitle = [feature, config.unit && config.unit !== feature ? config.unit : '']

    filterChoices.forEach(([key, label, total]) => {

    const table = node('table', 'mx-table');
    const caption = node(
      'caption',
      'mx-sr-only',
      config.longitudinal

    const head = node('thead');
    const headings = node('tr');
    const columnHeaders = new Map();
    function addColumn(label, sublabel, key) {

      if (key) {

        const headingText = node('span', 'mx-col-label');
        headingText.append(node('strong', '', label));
        if (sublabel) headingText.append(node('small', '', sublabel));
        const arrow = node('span', 'mx-sort-icon');
        sort.append(headingText, arrow);
        sort.addEventListener('click', () => {

    if (config.longitudinal) addColumn(config.baseline, 'Reference visit', 'baseline');
    addColumn(
      config.visit,
      config.longitudinal ? 'Comparison visit' : 'Selected visit',
      'followup',
    );
    if (config.longitudinal) addColumn('Change', 'Comparison − reference', 'delta');
    addColumn('Analysis set');

    const footer = node('div', 'mx-footer');

      for (const row of body.querySelectorAll('tr[data-participant]')) {

      const query = state.query.trim().toLocaleLowerCase();
      const rows = records.filter(
        (row) =>
          (state.filter === 'all' || (state.filter === 'included') === row.included) &&
          (!query ||
            row.id.toLocaleLowerCase().includes(query) ||
            row.arm.toLocaleLowerCase().includes(query)),
      );
      rows.sort((a, b) => {
        if (a.arm !== b.arm) return armOrder.get(a.arm) - armOrder.get(b.arm);
        const key = state.sort;
        const order = state.descending ? -1 : 1;
        if (key === 'id') return compareIds.compare(a.id, b.id) * order;
        if (a[key] === null && b[key] !== null) return 1;
        if (b[key] === null && a[key] !== null) return -1;

        Math.max(0, Math.ceil(rows.length / pageSize) - 1),
        Math.max(0, state.page),

      const fragment = document.createDocumentFragment();
      let lastArm;

          const group = node('tr', 'mx-group');
          const cell = node('td');

          cell.append(line);
          group.append(cell);
          fragment.append(group);

        const row = node('tr', 'mx-row');
        row.dataset.participant = record.id;
        row.setAttribute('aria-label', record.id + (record.arm ? ', ' + record.arm : ''));
        const active = config.selectedId != null && String(config.selectedId) === record.id;
        row.classList.toggle('mx-active', active);

          idCell.textContent = record.id;

        row.append(idCell);
        if (config.longitudinal) row.append(numberCell(record.baseline));
        row.append(numberCell(record.followup));
        if (config.longitudinal) row.append(changeCell(record.delta, maxDelta));
        const status = node('td', 'mx-status');
        const badge = node('span', record.included ? 'mx-included' : 'mx-excluded');
        if (record.included) badge.append(icon('check'), node('span', '', 'Included'));
        else {
          badge.append(node('i'), node('span', '', record.reason));
          badge.setAttribute('aria-label', 'Excluded: ' + record.reason);
        }
        status.append(badge);
        row.append(status);
        fragment.append(row);
      });
      if (!page.length) {
        const empty = node('tr');
        const cell = node(
          'td',
          'mx-empty',
          records.length
            ? 'No participants match these filters.'
            : 'No participant records are available.',
        );
        cell.colSpan = headings.children.length;
        empty.append(cell);
        fragment.append(empty);
      }
      body.replaceChildren(fragment);
      viewport.scrollTop = 0;
      live.textContent = page.length
        ? start +
          1 +
          '–' +
          (start + page.length) +
          ' of ' +
          rows.length +
          (rows.length === 1 ? ' participant' : ' participants')
        : '0 participants';
      navigation.hidden = rows.length <= pageSize;
      lastPage.disabled = state.page === 0;
      nextPage.disabled = start + pageSize >= rows.length;
    }
    input.addEventListener('input', () => {
      state.query = input.value;
      state.page = 0;
      refresh();
    });
    refresh();
  }

  window.SctrialMatrix = { render };
})();

(() => {
  'use strict';

  const finite = Number.isFinite;
  const svgNS = 'http://www.w3.org/2000/svg';

  function element(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined && content !== null) node.textContent = content;
    return node;
  }

  function shape(tag, attributes, title) {
    const node = document.createElementNS(svgNS, tag);
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
    if (title) {
      const label = document.createElementNS(svgNS, 'title');
      label.textContent = title;
      node.append(label);
    }
    return node;
  }

  function number(value, signed = false, digits = 3) {
    if (!finite(value)) return '—';
    if (value === 0) return '0';
    const magnitude = Math.abs(value);
    const formatted =
      magnitude < 0.001 || magnitude >= 1e6
        ? magnitude.toExponential(Math.max(0, digits - 1)).replace(/\.?(0+)(?=e)/, '')
        : magnitude.toLocaleString('en-US', { maximumSignificantDigits: digits });
    return (value < 0 ? '−' : signed ? '+' : '') + formatted;
  }

  function scale(values, includeZero) {
    let lo = includeZero ? 0 : Infinity;
    let hi = includeZero ? 0 : -Infinity;
    for (const value of values) {
      if (!finite(value)) continue;
      lo = Math.min(lo, value);
      hi = Math.max(hi, value);
    }
    if (!finite(lo) || !finite(hi)) return null;
    if (lo === hi) {
      const padding = lo === 0 ? 1 : Math.abs(lo) * 0.1;
      lo -= padding;
      hi += padding;
    }
    const width = hi - lo;
    if (!finite(width) || width === 0) return null;
    const rough = width / 4;
    const power = 10 ** Math.floor(Math.log10(rough));
    if (!finite(power) || power === 0) return null;
    const multiple = [1, 2, 2.5, 5, 10].find((step) => step >= rough / power) || 10;
    const step = multiple * power;
    const first = Math.floor(lo / step);
    const last = Math.ceil(hi / step);
    const ticks = [];
    for (let index = first; index <= last && ticks.length <= 7; index++) {
      ticks.push(index === 0 ? 0 : +(index * step).toPrecision(14));
    }
    const min = first * step;
    const max = last * step;
    if (!finite(min) || !finite(max) || min === max) return null;
    return { ticks, position: (value) => 100 * ((value - min) / (max - min)) + '%' };
  }

  function axis(mapping, unit) {
    const row = element('div', 'sce-axis');
    row.setAttribute('aria-hidden', 'true');
    for (const value of mapping.ticks) {
      const label = element(
        'span',
        value === 0 ? 'sce-tick sce-zero' : 'sce-tick',
        number(value, false, 5),
      );
      label.style.left = mapping.position(value);
      row.append(label);
    }
    if (unit) row.title = unit;
    return row;
  }

  function track(mapping, height) {
    const plot = shape('svg', { class: 'sce-track', width: '100%', height, 'aria-hidden': 'true' });
    for (const tick of mapping.ticks) {
      const x = mapping.position(tick);
      plot.append(
        shape('line', {
          class: tick === 0 ? 'sce-grid sce-zero-line' : 'sce-grid',
          x1: x,
          x2: x,
          y1: 0,
          y2: height,
        }),
      );
    }
    return plot;
  }

  function ciFor(estimate, interval) {
    return finite(estimate) &&
      Array.isArray(interval) &&
      interval.length === 2 &&
      interval.every(finite) &&
      interval[0] <= interval[1]
      ? interval
      : null;
  }

  function effectChart(config, interval) {
    const block = element('div', 'sce-effect');
    const summary = element('div', 'sce-summary');
    const between = config.arms.length > 1;
    const estimand = config.longitudinal
      ? between
        ? 'Difference in change'
        : 'Mean paired change'
      : between
        ? 'Between-arm difference'
        : 'Participant mean';
    summary.append(
      element(
        'h3',
        'sce-label',
        config.descriptive ? 'Descriptive ' + estimand.toLowerCase() : estimand,
      ),
    );
    const sign = config.longitudinal || config.arms.length > 1;
    summary.append(element('strong', 'sce-effect-number', number(config.estimate, sign)));
    if (config.unit) summary.append(element('span', 'sce-summary-unit', config.unit));
    block.append(summary);

    const visual = element('div', 'sce-model-chart');
    if (!finite(config.estimate)) {
      const status = element('div', 'sce-no-estimate', config.status || 'Estimate unavailable');
      status.setAttribute('role', 'status');
      visual.append(status);
      block.append(visual);
      return block;
    }

    if (interval) {
      const caption = element('div', 'sce-ci-caption');
      caption.append(
        element('span', '', '95% CI'),
        element('strong', '', number(interval[0], sign) + ' to ' + number(interval[1], sign)),
      );
      visual.append(caption);
    } else {
      visual.append(
        element(
          'div',
          'sce-ci-caption',
          config.descriptive ? 'Observed summary' : '95% CI unavailable',
        ),
      );
    }

    const mapping = scale([config.estimate, ...(interval || [])], true);
    if (mapping) {
      const plot = track(mapping, 29);
      const x = mapping.position(config.estimate);
      if (interval) {
        const left = mapping.position(interval[0]);
        const right = mapping.position(interval[1]);
        plot.append(shape('line', { class: 'sce-whisker', x1: left, x2: right, y1: 15, y2: 15 }));
        for (const end of [left, right]) {
          plot.append(shape('line', { class: 'sce-cap', x1: end, x2: end, y1: 10, y2: 20 }));
        }
      }
      plot.append(shape('circle', { class: 'sce-estimate-point', cx: x, cy: 15, r: 4.8 }));
      visual.append(plot, axis(mapping, config.unit));
    }

    block.append(visual);
    return block;
  }

  function pointLayout(group, mapping, width) {
    if (group.readings.length > 90) return null;
    const lanes = [0, -1, 1, -2, 2, -3, 3];
    const occupied = lanes.map(() => -Infinity);
    const points = [];
    let extent = 0;
    for (const reading of group.readings) {
      const x = parseFloat(mapping.position(reading.value));
      const pixel = (width * x) / 100;
      const lane = occupied.findIndex((last) => pixel - last >= 9.5);
      if (lane < 0) return null;
      occupied[lane] = pixel;
      extent = Math.max(extent, Math.abs(lanes[lane]));
      points.push({ reading, x, pixel, offset: lanes[lane] * 9.5, hitRadius: 12 });
    }
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        const a = points[i];
        const b = points[j];
        if (b.pixel - a.pixel > 13) break;
        const separation = Math.hypot(b.pixel - a.pixel, b.offset - a.offset);
        const radius = Math.max(8.7, separation - 0.8);
        a.hitRadius = Math.min(a.hitRadius, radius);
        b.hitRadius = Math.min(b.hitRadius, radius);
      }
    }
    return { height: Math.max(32, 18 + 19 * extent), points };
  }

  function binsFor(readings, mapping) {
    const counts = new Uint32Array(44);
    for (const { value } of readings) {
      const fraction = parseFloat(mapping.position(value)) / 100;
      const index = Math.max(0, Math.min(counts.length - 1, Math.floor(fraction * counts.length)));
      counts[index] += 1;
    }
    return counts;
  }

  function showBins(plot, bins, largest, markClass) {
    bins.forEach((count, i) => {
      if (!count) return;
      const height = (24 * count) / largest;
      plot.append(
        shape(
          'rect',
          {
            class: markClass,
            x: (100 * (i + 0.05)) / bins.length + '%',
            y: 29 - height,
            width: (100 * 0.9) / bins.length + '%',
            height,
          },
          count + (count === 1 ? ' participant' : ' participants'),
        ),
      );
    });
  }

  function wireReadings(plot, items, tooltip, onSelect) {
    if (!items.size) return;
    const buttons = [...items.keys()];
    plot.removeAttribute('aria-hidden');
    plot.setAttribute('role', 'group');
    plot.setAttribute(
      'aria-description',
      'Use the arrow keys to move between participants. Press Enter to open a record.',
    );
    buttons[0].setAttribute('tabindex', '0');

    const markAt = (target) => target?.closest?.('.sce-observation');
    function identify(button) {
      const item = items.get(button);
      if (!item) {
        tooltip.hidden = true;
        return;
      }
      tooltip.textContent = item.label;
      tooltip.style.left = item.x + '%';
      tooltip.dataset.side = item.x < 18 ? 'start' : item.x > 82 ? 'end' : 'center';
      tooltip.hidden = false;
    }
    plot.addEventListener('pointerover', (event) => identify(markAt(event.target)));
    plot.addEventListener('pointerout', (event) =>
      identify(markAt(event.relatedTarget) || markAt(document.activeElement)),
    );
    plot.addEventListener('focusin', (event) => {
      const current = markAt(event.target);
      for (const button of buttons)
        button.setAttribute('tabindex', current === button ? '0' : '-1');
      identify(current);
    });
    plot.addEventListener('focusout', (event) => identify(markAt(event.relatedTarget)));
    plot.addEventListener('click', (event) => {
      const item = items.get(markAt(event.target));
      if (item) onSelect(item.id);
    });
    plot.addEventListener('keydown', (event) => {
      const button = markAt(event.target);
      const index = buttons.indexOf(button);
      if (index < 0) return;
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        onSelect(items.get(button).id);
        return;
      }
      if (event.key === 'Escape' && !tooltip.hidden) {
        tooltip.hidden = true;
        event.stopPropagation();
        return;
      }
      const next = {
        ArrowRight: index + 1,
        ArrowLeft: index - 1,
        ArrowDown: index + 1,
        ArrowUp: index - 1,
        Home: 0,
        End: buttons.length - 1,
      }[event.key];
      if (next !== undefined) {
        event.preventDefault();
        buttons[Math.min(buttons.length - 1, Math.max(0, next))].focus();
      }
    });
  }

  function showPoints(plot, layout, markClass, group, config, tooltip) {
    const items = new Map();
    for (const { reading, x, offset, hitRadius } of layout.points) {
      const y = layout.height / 2 + offset;
      const label = String(reading.id ?? group.name) + ' · ' + number(reading.value, true, 5);
      const dot = shape('circle', { class: markClass, cx: x + '%', cy: y, r: 3.7 });
      if (
        reading.id === undefined ||
        reading.id === null ||
        typeof config.onSelect !== 'function'
      ) {
        const staticMark = shape('g', {}, label);
        staticMark.append(dot);
        plot.append(staticMark);
        continue;
      }
      const button = shape('g', {
        class: 'sce-observation',
        role: 'button',
        tabindex: '-1',
        'aria-label': 'Inspect ' + label,
      });
      button.append(shape('circle', { class: 'sce-hit', cx: x + '%', cy: y, r: hitRadius }), dot);
      items.set(button, { id: reading.id, label, x });
      plot.append(button);
    }
    plot.setAttribute('aria-label', group.name + ' participant observations');
    wireReadings(plot, items, tooltip, config.onSelect);
    return items.size;
  }

  function matrixLink(config) {
    const table = document.getElementById('participantMatrix');
    if (!table && !config.onOpenMatrix) return null;
    const button = element('button', 'sce-open-matrix', 'Inspect participants');
    button.type = 'button';
    button.onclick = () => {
      if (config.onOpenMatrix) {
        config.onOpenMatrix();
      } else {
        table.scrollIntoView({ block: 'nearest' });
        table.querySelector('input, button')?.focus({ preventScroll: true });
      }
    };
    return button;
  }

  function groupSummary(arm) {
    const supplied = Array.isArray(arm.values);
    const readings = [];
    if (supplied)
      arm.values.forEach((value, index) => {
        if (finite(value)) readings.push({ value, id: arm.ids?.[index] });
      });
    const n = supplied ? readings.length : Number.isInteger(arm.n) && arm.n >= 0 ? arm.n : null;
    const mean =
      finite(arm.mean) && n !== 0
        ? arm.mean
        : readings.length
          ? readings.reduce((sum, reading) => sum + reading.value / readings.length, 0)
          : null;
    if (readings.length <= 90) readings.sort((a, b) => a.value - b.value);
    return { name: String(arm.name ?? ''), colorIndex: arm.colorIndex, n, mean, readings };
  }

  const observers = new WeakMap();
  function observations(panel, config) {
    const area = element('section', 'sce-observations');
    const groups = config.arms.map(groupSummary);
    const all = groups.flatMap((group) =>
      group.readings.map((reading) => reading.value).concat(finite(group.mean) ? [group.mean] : []),
    );
    const mapping = all.length ? scale(all, config.longitudinal) : null;
    const head = element('div', 'sce-observed-head');
    head.append(
      element(
        'h4',
        'sce-label',
        config.longitudinal ? 'Paired participant changes' : 'Participant scores',
      ),
    );
    const visit = config.longitudinal
      ? [config.visit, config.baseline].filter(Boolean).join(' − ')
      : config.visit;
    if (visit) head.append(element('span', 'sce-visit', visit));
    area.append(head);
    const data = element('div', 'sce-data');
    const lanes = groups.map((group) => {
      const label = element('div', 'sce-arm-label');
      label.append(
        element('strong', '', group.name),
        element('small', '', 'n = ' + (group.n ?? '—')),
      );
      const lane = element('div', 'sce-obs-lane');
      const amount = element('div', 'sce-group-mean', number(group.mean, config.longitudinal));
      amount.setAttribute(
        'aria-label',
        group.name + ' mean ' + number(group.mean, config.longitudinal, 5),
      );
      data.append(label, lane, amount);
      return lane;
    });
    if (mapping)
      data.append(
        element('span'),
        axis(mapping, config.unit),
        element('small', 'sce-mean-caption', 'Mean'),
      );
    const legend = element('div', 'sce-legend');
    area.append(data, legend);
    panel.append(area);

    let drawnWidth = -1;
    function draw() {
      const width = Math.round(lanes[0].getBoundingClientRect().width);
      if (drawnWidth === width) return;
      drawnWidth = width;
      const focused = area.contains(document.activeElement)
        ? document.activeElement.getAttribute('aria-label')
        : '';
      const layouts = groups.map((group) => mapping && pointLayout(group, mapping, width));
      const binned = mapping && layouts.some((layout) => !layout);
      const counts = binned ? groups.map((group) => binsFor(group.readings, mapping)) : [];
      const largest = counts.length ? Math.max(...counts.map((bins) => Math.max(...bins))) : 0;
      let individual = false;
      groups.forEach((group, index) => {
        const lane = lanes[index];
        lane.replaceChildren();
        if (!mapping || (!group.readings.length && !finite(group.mean))) {
          lane.append(
            element(
              'span',
              'sce-obs-empty',
              group.n === 0 ? 'No contributing participants' : 'Values unavailable',
            ),
          );
          return;
        }
        const height = binned ? 32 : layouts[index].height;
        const plot = track(mapping, height);
        const tooltip = element('span', 'sce-point-tip');
        tooltip.setAttribute('aria-hidden', 'true');
        tooltip.hidden = true;
        const markClass = 'sce-arm-mark sce-arm-' + ((group.colorIndex ?? index) % 2);
        if (binned) {
          showBins(plot, counts[index], largest, markClass);
        } else {
          const count = showPoints(plot, layouts[index], markClass, group, config, tooltip);
          individual = individual || count > 0;
        }
        if (finite(group.mean)) {
          const x = mapping.position(group.mean);
          for (const cls of ['sce-mean-halo', 'sce-mean']) {
            plot.append(shape('line', { class: cls, x1: x, x2: x, y1: 5, y2: height - 5 }));
          }
        }
        lane.append(plot, tooltip);
      });
      if (focused) {
        const replacement = [...area.querySelectorAll('.sce-observation')].find(
          (node) => node.getAttribute('aria-label') === focused,
        );
        replacement?.focus({ preventScroll: true });
      }
      legend.replaceChildren();
      if (!groups.some((group) => group.readings.length)) return;
      const marker = element('i', binned ? 'sce-bin-key' : 'sce-dot-key');
      const meanKey = element('i', 'sce-mean-key');
      marker.setAttribute('aria-hidden', 'true');
      meanKey.setAttribute('aria-hidden', 'true');
      legend.append(
        marker,
        element(
          'span',
          '',
          binned
            ? 'Participant counts per bin'
            : individual
              ? 'Select a participant'
              : 'One participant',
        ),
        meanKey,
        element('span', '', 'Group mean'),
      );
      if (!individual) {
        const link = matrixLink(config);
        if (link) legend.append(link);
      }
    }
    draw();
    if (typeof ResizeObserver === 'undefined') return;
    const observer = new ResizeObserver(() => {
      if (area.isConnected) draw();
      else observer.disconnect();
    });
    observer.observe(area);
    observers.set(panel.parentElement, observer);
  }

  function render(container, config) {
    if (!container || !config) return;
    const options = { ...config, arms: Array.isArray(config.arms) ? config.arms : [] };
    const panel = element('section', 'sce');
    panel.setAttribute(
      'aria-label',
      ['Effect estimate', options.feature].filter(Boolean).join(' for '),
    );
    if (options.model) {
      const details = element('details', 'sce-details');
      const summary = element('summary', 'sce-context');
      if (options.contrast) summary.append(element('strong', '', options.contrast));
      summary.append(
        element('span', 'sce-method-key', options.descriptive ? 'Calculation' : 'Model details'),
      );
      details.append(summary, element('p', 'sce-model-description', options.model));
      panel.append(details);
    } else if (options.contrast) {
      const head = element('div', 'sce-context');
      head.append(element('strong', '', options.contrast));
      panel.append(head);
    }
    panel.append(effectChart(options, ciFor(options.estimate, options.interval)));
    observers.get(container)?.disconnect();
    container.replaceChildren(panel);
    if (options.arms.length) observations(panel, options);
  }

  window.SctrialEvidence = Object.freeze({ render });
})();

(() => {
  'use strict';
  const node = (tag, cls, label) => {
    const element = document.createElement(tag);
    if (cls) element.className = cls;
    if (label != null) element.textContent = label;
    return element;
  };

  function drawGroup(group, visits, paired, onSelect) {
    const block = node('div', 'pm-group');
    block.dataset.arm = String(group.colorIndex);
    const heading = node('div', 'pm-group-head');
    const count = group.rows.filter((r) => r.contributes).length;
    heading.append(
      node('strong', '', group.arm),
      node('small', '', count + ' / ' + group.rows.length + (paired ? ' paired' : ' measured')),
    );
    block.append(heading);
    const grid = node('div', 'pm-grid');
    const labels = node('div', 'pm-visits');
    for (const visit of visits) {
      const item = node('span', '', visit);
      item.title = visit;
      labels.append(item);
    }
    grid.append(labels);
    const columns = node('div', 'pm-columns');
    const visible = group.rows.slice(0, 12);
    columns.style.gridTemplateColumns =
      'repeat(' + Math.max(visible.length, 1) + ', minmax(0, 1fr))';
    for (const row of visible) {
      const values = paired ? [row.baselineValue, row.followupValue] : [row.followupValue];
      const description =
        row.id +
        ' · ' +
        visits
          .map((v, i) => v + ' ' + (Number.isFinite(values[i]) ? 'measured' : 'missing'))
          .join(', ');
      const item = node('button', 'pm-sample');
      item.type = 'button';
      item.title = description;
      item.setAttribute('aria-label', 'Open sampling record for ' + row.id + '. ' + description);
      item.classList.toggle('pm-complete', paired && values.every(Number.isFinite));
      for (const value of values)
        item.append(node('i', Number.isFinite(value) ? 'pm-observed' : 'pm-absent'));
      item.addEventListener('click', () => onSelect(row.id));
      columns.append(item);
    }
    grid.append(columns);
    block.append(grid);
    if (visible.length < group.rows.length)
      block.append(
        node(
          'small',
          'pm-limit',
          'Showing ' + visible.length + ' of ' + group.rows.length + ' participants',
        ),
      );
    return block;
  }

  function render(host, { records, arms, studyArms, baseline, visit, longitudinal, onSelect }) {
    if (!host) return;
    const section = node('section', 'pair-map');
    section.setAttribute(
      'aria-label',
      longitudinal ? 'Participant pairing map' : 'Participant sampling map',
    );
    const groups = arms.map((arm) => ({
      arm,
      colorIndex: studyArms.indexOf(arm),
      rows: records.filter((row) => row.arm === arm),
    }));
    const visits = longitudinal ? [baseline, visit] : [visit];
    const head = node('div', 'pm-head');
    const title = node('h3', '', longitudinal ? 'Sample pairing' : 'Sample coverage');
    head.append(title);
    const graph = node('div', 'pm-graph');
    graph.id = 'samplingGraph';
    const expander = node('button', 'pm-expand');
    expander.type = 'button';
    expander.setAttribute('aria-controls', graph.id);
    expander.setAttribute('aria-label', 'Show sampling map');
    expander.setAttribute('aria-expanded', 'false');
    expander.addEventListener('click', () => {
      const open = !section.classList.contains('pm-expanded');
      section.classList.toggle('pm-expanded', open);
      expander.setAttribute('aria-expanded', String(open));
      expander.setAttribute('aria-label', (open ? 'Hide' : 'Show') + ' sampling map');
    });
    head.append(expander);
    graph.append(node('div', 'pm-caption', 'One column per participant'));
    for (const group of groups) graph.append(drawGroup(group, visits, longitudinal, onSelect));
    const key = node('div', 'pm-key');
    key.append(
      node('i', 'pm-observed'),
      node('span', '', 'Measured'),
      node('i', 'pm-absent'),
      node('span', '', 'Missing'),
    );
    graph.append(key);
    section.append(head, graph);
    host.replaceChildren(section);
  }

  window.SctrialPairMap = { render };
})();

  const feature = () => study.features.find((f) => f.id === state.feature) || study.features[0];
  const unit = () =>
    synthetic() ? 'Mean module score' : native() ? study.unit || 'Mean score' : 'Recorded score';
  const nfmt = (n) => (Number.isFinite(n) ? n.toLocaleString('en-US') : '—');
  const mean = (xs) => (xs.length ? xs.reduce((x, y) => x + y, 0) / xs.length : null);
  const second = () => arms.find((a) => a !== state.arm);
  const armsIn = () =>
    ['paired', 'observe'].includes(state.design)
      ? [state.arm]
      : [state.arm, second()].filter(Boolean);
  const datesIn = () => (isLong() ? [state.baseline, state.visit] : [state.visit]);
  const designs = () => [
    ...(arms.length > 1 && study.visits.length > 1 ? ['did'] : []),
    ...(study.visits.length > 1 ? ['paired'] : []),
    ...(arms.length > 1 ? ['cross'] : []),
    ...(arms.length === 1 && study.visits.length === 1 ? ['observe'] : []),
  ];
  const contrast = () => armsIn().join(' − ') + ' · ' + datesIn().join(' → ');
  const key = () =>
    JSON.stringify([state.design, state.arm, state.baseline, state.visit, state.population]);
  const color = (a) => (arms.indexOf(a) === 0 ? '#5145bb' : '#247778');
  const rowAt = (id, v) => obsByPerson.get(id)?.get(v)?.get(state.population);
  const rowObserved = (r) => r && r.cells > 0;
  const method = () =>
    synthetic()
      ? study.study.methods[state.design]
      : fitted()
        ? currentFit?.method || 'Participant-level model'
        : state.design === 'observe'
          ? 'Mean across observed participants'
          : 'Unadjusted descriptive participant differences';
  const ready = () => !native() || !fitted() || fitStatus === 'ready';
  function clearFit() {
    if (fitTask) fitTask.abort();
    fitTask = null;
    currentFit = null;
    fitStatus = 'idle';
    fitMessage = '';
  }
  function init(next) {
    clearFit();
    past = [];
    future = [];
    fitCache.clear();
    rowCache.clear();
    study = next;
    window.SctrialChrome?.setStudy(study);
    arms = [...new Set(study.participants.map((p) => p.arm))];
    personById = new Map(study.participants.map((p) => [p.id, p]));
    obsByPerson = new Map();
    byPopulation = new Map();
    for (const row of study.observations) {
      if (!byPopulation.has(row.population)) byPopulation.set(row.population, []);
      byPopulation.get(row.population).push(row);
      if (!obsByPerson.has(row.id)) obsByPerson.set(row.id, new Map());
      const at = obsByPerson.get(row.id);
      if (!at.has(row.visit)) at.set(row.visit, new Map());
      at.get(row.visit).set(row.population, row);
    }
    const baseline =
      study.visits.find((v) =>
        /^(baseline|pre|pretreatment|pre-treatment|day 0|week 0)$/i.test(v.trim()),
      ) || study.visits[0];
    state = {
      view: 'overview',
      design: designs()[0],
      arm: arms[0],
      baseline,
      visit: study.visits.find((v) => v !== baseline) || baseline,
      population: study.populations[0],
      feature: study.features[0].id,
      mode: 'comparison',
      selectedId: null,
    };
    peopleContext = {};
    sheets.reset('Primary analysis');
    bench.setStudy(synthetic() ? 'immune-study-62834-v1' : 'local-' + ++privateCounter, {
      persist: synthetic(),
      sharedFeatureUnit: synthetic(),
    });
    render();
    if (native() && fitted()) void requestFit();
  }
  function currentRows() {
    if (native() && fitted()) return currentFit?.rows || [];
    const k = key();
    if (rowCache.has(k)) return rowCache.get(k);
    let rows;
    if (synthetic()) {
      const raw =
        study.results[[state.design, state.arm, state.visit, state.population].join('|')] || [];
      rows = raw.map((r) => ({
        ...r,
        id: r.feature,
        label: study.features.find((f) => f.id === r.feature).label,
      }));
    } else {
      const groups = armsIn(),
        visits = datesIn();
      rows = study.features.map((f) => {
        const values = groups.map((arm) =>
          study.participants
            .filter((p) => p.arm === arm)
            .flatMap((p) => {
              const vs = visits.map((v) => rowAt(p.id, v)?.scores[f.id]);
              return vs.every(Number.isFinite) ? [vs.length === 2 ? vs[1] - vs[0] : vs[0]] : [];
            }),
        );
        const av = values.map(mean);
        return {
          id: f.id,
          label: f.label,
          estimate: av.every(Number.isFinite) ? (av.length === 1 ? av[0] : av[0] - av[1]) : null,
          lo: null,
          hi: null,
          p: null,
          q: null,
          n: values.reduce((a, v) => a + v.length, 0),
          nFirst: values[0].length,
          nOther: values[1]?.length ?? null,
        };
      });
    }
    if (rowCache.size >= 32) rowCache.delete(rowCache.keys().next().value);
    rowCache.set(k, rows);
    return rows;
  }
  async function requestFit() {
    if (!native() || !fitted()) return;
    const k = key(),
      file = study;
    clearFit();
    if (fitCache.has(k)) {
      currentFit = fitCache.get(k);
      fitStatus = 'ready';
      refreshFit();
      return;
    }
    const own = new AbortController();
    fitTask = own;
    fitStatus = 'loading';
    refreshFit();
    try {
      const fit = await localStudyClient.fit(
        file,
        {
          design: state.design,
          arm: state.arm,
          reference: second(),
          visit: state.visit,
          baseline: state.baseline,
          population: state.population,
        },
        own.signal,
      );
      if (own.signal.aborted || file !== study || key() !== k) return;
      currentFit = fit;
      fitStatus = 'ready';
      if (fitCache.size >= 24) fitCache.delete(fitCache.keys().next().value);
      fitCache.set(k, fit);
    } catch (error) {
      if (own.signal.aborted || study !== file || key() !== k) return;
      fitStatus = 'error';
      fitMessage = error.message;
    } finally {
      if (fitTask === own) {
        fitTask = null;
        refreshFit();
      }
    }
  }
  function refreshFit() {
    updateTop();
    if (state.view === 'overview') paintEvidence();
    else if (state.view === 'results') renderResultsView();
  }
  function setParam(field, value) {
    if (state[field] === value) return;
    remember();
    state[field] = value;
    state.selectedId = null;
    if (isLong() && state.baseline === state.visit)
      state.visit = study.visits.find((v) => v !== state.baseline);
    clearFit();
    render();
    if (native() && fitted()) void requestFit();
  }
  const bench = createContrastBench({
    getSnapshot: () =>
      !ready()
        ? null
        : {
            title: contrast(),
            spec: {
              design: state.design,
              arm: state.arm,
              reference: armsIn()[1] || null,
              baseline: isLong() ? state.baseline : null,
              visit: state.visit,
              population: state.population,
              feature: state.feature,
              mode: state.mode,
            },
            rows: currentRows(),
            unit: unit(),
            method: method(),
          },
    onRestore: (spec) => {
      const { design, arm, baseline, visit, population, feature: id, mode } = spec;
      if (
        !designs().includes(design) ||
        !arms.includes(arm) ||
        !study.visits.includes(visit) ||
        !study.populations.includes(population)
      )
        return;
      Object.assign(state, {
        design,
        arm,
        baseline: baseline || state.baseline,
        visit,
        population,
        feature: study.features.some((f) => f.id === id) ? id : study.features[0].id,
        mode: mode || 'trajectory',
        selectedId: null,
      });
      clearFit();
      navigate('overview');
      if (native() && fitted()) void requestFit();
    },
    onNotice: (message) => toast(message),
    onChange: (n) => setBadge(n),
    onExplore: () => navigate('overview'),
  });
  const sheets = window.createAnalysisSheets({
    getStudy: () => ({
      name: name(),
      source: study.source || 'example',
      arms,
      visits: study.visits,
      populations: study.populations,
      features: study.features,
      mapping: study.mapping || null,
      designs: designs(),
      fixedBaseline: synthetic() ? sample.visits[0] : null,
    }),
    getSpec: () => ({ ...snapshotSpec(), mode: state.mode, visitOrder: [...study.visits] }),
    onOpen: ({ visitOrder, ...spec }) => {
      past = [];
      future = [];
      if (visitOrder) {
        study.visits = [...visitOrder];
        window.SctrialChrome?.setStudy(study);
      }
      Object.assign(state, spec, { selectedId: null });
      clearFit();
      navigate('overview');
      if (native() && fitted()) void requestFit();
    },
    onRename: () => updateTop(),
  });

  function setBadge(count) {
    $('pinCount').textContent = String(count);
    $('pinCount').hidden = !count;
  }
  function updateTop() {
    $('studyName').textContent = name();
    $('sourceBadge').textContent = source();
    $('studyCount').textContent = nfmt(study.participants.length) + ' participants';
    $('pageTitle').textContent = state.view === 'overview' ? sheets.title() : titles[state.view];
    $('sectionCrumb').textContent =
      state.view === 'overview' ? 'Analysis workbook' : titles[state.view];
    sheets.setVisible(state.view === 'overview');
    $('pinButton').hidden = state.view === 'bench';
    $('pinButton').disabled = !ready();
    $('pinButton').title = ready() ? 'Save this comparison' : 'Waiting for a fitted result';
    document.querySelectorAll('[data-view]').forEach((n) => {
      if (n.dataset.view === state.view) n.setAttribute('aria-current', 'page');
      else n.removeAttribute('aria-current');
    });
    $('undo').disabled = !past.length;
    $('redo').disabled = !future.length;
    setBadge(bench.count());
  }
  const button = (action, glyph, text, css = 'text-btn') =>
    '<button type="button" class="' +
    css +
    '" data-action="' +
    action +
    '">' +
    icon(glyph) +
    esc(text) +
    '</button>';
  function modes() {
    return [
      ['comparison', 'Comparison', 'chart'],
      ['trajectory', 'Trajectories', 'trend'],
      ['changes', isLong() ? 'Changes' : 'Distribution', 'points'],
    ];
  }

  function comparisonRecords() {
    const groups = armsIn();
    const visitNames = datesIn();
    return study.participants
      .filter((p) => groups.includes(p.arm))
      .map((p) => {
        const values = visitNames.map((v) => {
          const r = rowAt(p.id, v);
          const score = r?.scores[state.feature];
          return rowObserved(r) && Number.isFinite(score) ? score : null;
        });
        const missing = visitNames.filter((v, i) => values[i] === null);
        return {
          id: p.id,
          arm: p.arm,
          baselineValue: isLong() ? values[0] : null,
          followupValue: values[values.length - 1],
          contributes: missing.length === 0,
          reason: missing.length ? 'Missing score at ' + missing.join(' and ') : '',
        };
      });
  }

  function paintEvidence(records = comparisonRecords()) {
    const host = $('effectPlot');
    if (!host) return;
    const r = currentRows().find((row) => row.id === state.feature);
    const armData = armsIn().map((name) => {
      const people = records.filter((p) => p.arm === name && p.contributes);
      const values = people.map((p) =>
        isLong() ? p.followupValue - p.baselineValue : p.followupValue,
      );
      const ids = people.map((p) => p.id);
      return {
        name,
        colorIndex: arms.indexOf(name),
        n: values.length,
        mean: mean(values),
        values,
        ids,
      };
    });
    const formula = armsIn().join(' − ');
    window.SctrialEvidence.render(host, {
      arms: armData,
      onSelect: selectPerson,
      estimate: r?.estimate ?? null,
      interval: [r?.lo, r?.hi].every(Number.isFinite) ? [r.lo, r.hi] : null,
      contrast: formula,
      unit: unit(),
      feature: feature().label,
      longitudinal: isLong(),
      baseline: state.baseline,
      visit: state.visit,
      model: method(),
      descriptive: !fitted(),
      status: fitStatus === 'loading' ? 'Fitting comparison…' : fitMessage || r?.reason || '',
    });
    const retryArea = $('fitRetry');
    retryArea.replaceChildren();
    if (fitStatus === 'error') retryArea.innerHTML = button('retry', 'refresh', 'Retry fit', 'btn');
    if (currentFit?.warnings?.length) {
      const notes = document.createElement('details');
      notes.className = 'fit-warnings';
      const title = document.createElement('summary');
      title.textContent = 'Model notes (' + currentFit.warnings.length + ')';
      notes.append(title);
      for (const message of currentFit.warnings) {
        const p = document.createElement('p');
        p.textContent = message;
        notes.append(p);
      }
      retryArea.append(notes);
    }
  }

  function paintMatrix(records) {
    window.SctrialMatrix.render($('participantMatrix'), {
      records,
      baseline: state.baseline,
      visit: state.visit,
      feature: feature().label,
      unit: unit(),
      armLabels: armsIn(),
      studyArms: arms,
      longitudinal: isLong(),
      selectedId: state.selectedId,
      onSelect: selectPerson,
    });
  }

  function paintCanvas() {
    const active = armsIn();
    const byId = new Map();
    const id = state.feature;
    for (const row of byPopulation.get(state.population) || []) {
      if (!active.includes(row.arm) || !rowObserved(row) || !Number.isFinite(row.scores[id]))
        continue;
      if (!byId.has(row.id)) byId.set(row.id, { id: row.id, arm: row.arm, points: [] });
      byId.get(row.id).points.push({ visit: row.visit, value: row.scores[id] });
    }
    renderContrastCanvas(
      $('plot'),
      {
        visits: study.visits,
        baseline: state.baseline,
        visit: state.visit,
        design: state.design,
        feature: feature(),
        unit: unit(),
        groups: active.map((a) => ({ name: a, color: color(a) })),
        series: [...byId.values()],
        mode: state.mode,
        selectedId: null,
        canSelectVisit: study.visits.length > 1,
        editableVisits: study.visits.filter((v) => !isLong() || v !== state.baseline),
      },
      { onSelectParticipant: selectPerson, onVisit: (v) => setParam('visit', v) },
    );
  }

  const scoreFormat = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 6 });
  function measurement(value, signed = false) {
    if (!Number.isFinite(value)) return '—';
    return (signed && value > 0 ? '+' : '') + scoreFormat.format(value).replace('-', '−');
  }

  function participantDetail(person) {
    const rows = study.visits.map((v) => {
      const r = rowAt(person.id, v);
      const score = r?.scores[state.feature];
      const status = !obsByPerson.get(person.id)?.has(v)
        ? 'No specimen'
        : !rowObserved(r)
          ? 'Population absent'
          : !Number.isFinite(score)
            ? 'Missing score'
            : 'Measured';
      return (
        '<tr><th scope="row">' +
        esc(v) +
        '</th><td>' +
        measurement(score) +
        '</td><td>' +
        nfmt(r?.cells) +
        '</td><td>' +
        esc(status) +
        '</td></tr>'
      );
    });
    const record = comparisonRecords().find((p) => p.id === person.id);
    const summary = record?.contributes
      ? isLong()
        ? 'Paired change ' + measurement(record.followupValue - record.baselineValue, true)
        : 'Selected score ' + measurement(record.followupValue)
      : record?.reason || 'Outside this comparison';
    return (
      '<div class="ed-record"><div class="ed-person-context"><span>' +
      icon('people') +
      esc(person.arm) +
      '</span><span>' +
      icon('cells') +
      esc(state.population) +
      '</span></div><h3>' +
      esc(feature().label) +
      '</h3><p>' +
      esc(unit()) +
      '</p><div class="ed-record-scroll"><table><thead><tr><th>Visit</th><th>Score</th>' +
      '<th>Cells</th><th>Measurement</th></tr></thead><tbody>' +
      rows.join('') +
      '</tbody></table></div><div class="ed-record-footer"><strong>' +
      esc(summary) +
      '</strong>' +
      button('personRecord', 'arrow', 'Open cohort record') +
      '</div></div>'
    );
  }

  function selectPerson(id) {
    if (id == null || !personById.has(id)) return;
    state.selectedId = id;
    modal('Participant ' + id, participantDetail(personById.get(id)), 'participant');
  }

  function setFeature(id) {
    if (!study.features.some((f) => f.id === id) || id === state.feature) return;
    remember();
    state.feature = id;
    state.selectedId = null;
    if (state.view !== 'overview') navigate('overview');
    else render();
  }

  function editorTabs() {
    return (
      '<div class="ed-tabs" role="group" aria-label="Analysis view">' +
      modes()
        .map(
          ([key, label, glyph]) =>
            '<button type="button" data-mode="' +
            key +
            '" aria-pressed="' +
            (state.mode === key) +
            '">' +
            icon(glyph) +
            esc(label) +
            '</button>',
        )
        .join('') +
      '</div>'
    );
  }

  function editorSummary() {
    const scope = [
      ['Study design', labels[state.design], 'design'],
      [armsIn().length > 1 ? 'Group order' : 'Group', armsIn().join(' − '), 'arm'],
      [isLong() ? 'Visits' : 'Visit', datesIn().join(' → '), 'visit'],
      ['Population', state.population, 'population'],
    ];
    return (
      '<div class="ed-spec">' +
      scope
        .map(
          ([label, value, field]) =>
            '<button type="button" data-configure="' +
            field +
            '" aria-label="Configure ' +

            '"><span>' +
            esc(label) +
            '</span><b>' +
            esc(value) +
            '</b></button>',
        )
        .join('') +
      '</div>'

  }

  function outcomePicker() {
    return (
      '<label class="ed-outcome"><span>Outcome</span><span class="ed-select-wrap">' +
      '<select aria-label="Outcome" data-param="feature">' +
      study.features.map((f) => option(f.id, state.feature, f.label)).join('') +
      '</select>' +
      icon('down') +
      '</span></label>'
    );
  }

  function overview() {
    const focusKey = document.activeElement?.getAttribute('data-param');

    $('page').innerHTML =

        ? '<div class="comparison-workarea"><div id="effectPlot"></div><div id="pairMap"></div></div>' +
