        'aria-valuetext': m.visit,
      });
      h.dataset.ccFocus = 'visit-handle';
      make(h, 'rect', {
        x: Math.max(0, Math.min(width - 48, xx - 24)),
        y: hy - 23,
        width: 48,
        height: 44,
        fill: 'transparent',
      });
      make(h, 'path', {
        d:
          'M ' +
          (xx - 12) +
          ' ' +
          (hy - 7) +
          ' h24 q3 0 3 3 v6 q0 3 -3 3 h-8 l-4 5 -4 -5 h-8 q-3 0 -3 -3 v-6 q0 -3 3 -3 z',
        fill: '#d4e4f8',
        class: 'cc-grip',
      });
      make(h, 'path', {
        d: 'M ' + (xx - 5) + ' ' + (hy - 4) + ' l-3 3 3 3 m10 -6 3 3 -3 3',
        fill: 'none',
        stroke: '#37506e',
        'stroke-width': 1.45,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        'pointer-events': 'none',
      });
      line(h, xx, hy - 3.7, xx, hy + 1.7, { stroke: '#527193', 'stroke-width': 1.3 });
      make(h, 'rect', {
        x: xx - 18,
        y: hy - 10,
        width: 36,
        height: 24,
        rx: 3,
        fill: 'none',
        stroke: '#fff',
        opacity: 0,
        class: 'cc-focus',
      });
      const help = 'Drag to change the visit, or use the arrow keys.';
      addTitle(h, help);
      h.setAttribute('aria-description', help);
      const showHelp = () => {
        if (!drag) ctx.tooltip(help, xx, hy + 43);
      };
      const hideHelp = () => {
        if (!drag) ctx.tip.hidden = true;
      };
      h.addEventListener('pointerenter', showHelp);
      h.addEventListener('pointerleave', hideHelp);
      h.addEventListener('focus', showHelp);
      h.addEventListener('blur', hideHelp);
      h.addEventListener('keydown', (e) => {
        const current = valid.indexOf(followIndex);
        let index;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') index = Math.max(0, current - 1);
        else if (e.key === 'ArrowRight' || e.key === 'ArrowUp')
          index = Math.min(valid.length - 1, current + 1);
        else if (e.key === 'Home') index = 0;
        else if (e.key === 'End') index = valid.length - 1;
        else return;
        e.preventDefault();
        if (valid[index] !== followIndex) a.onVisit?.(visits[valid[index]]);
      });
      let pending = followIndex,
        drag = false;
      const ruler = line(svg, xx, top, xx, bottom, {
        stroke: '#e7f0ff',
        'stroke-width': 1.5,
        'stroke-dasharray': '3 3',
        visibility: 'hidden',
        'pointer-events': 'none',
      });
      function move(e) {
        const rect = svg.getBoundingClientRect(),
          px = ((e.clientX - rect.left) * width) / rect.width;
        pending = valid.reduce(
          (best, j) => (Math.abs(x(j) - px) < Math.abs(x(best) - px) ? j : best),
          valid[0],
        );
        const vx = x(pending);
        h.setAttribute('transform', 'translate(' + (vx - xx) + ' 0)');
        ruler.setAttribute('x1', vx);
        ruler.setAttribute('x2', vx);
        ruler.setAttribute('visibility', 'visible');
        ctx.tooltip(visits[pending], vx, top + 28);
      }
      h.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        drag = true;
        h.classList.add('cc-dragging');
        h.setPointerCapture(e.pointerId);
        move(e);
      });
      h.addEventListener('pointermove', (e) => {
        if (drag) move(e);
      });
      function end(commit) {
        if (!drag) return;
        drag = false;
        h.classList.remove('cc-dragging');
        ctx.tip.hidden = true;
        ruler.setAttribute('visibility', 'hidden');
        h.removeAttribute('transform');
        if (commit && pending !== followIndex) a.onVisit?.(visits[pending]);
      }
      h.addEventListener('pointerup', () => end(true));
      h.addEventListener('pointercancel', () => end(false));
    }
    return { total: roster, shown };
  }

  function drawChanges(ctx) {
    const { svg, m, b, data, bindPerson, meanTarget } = ctx;
    const { width, height, tight } = b;
    const groups = data.groups,
      top = 28,
      bottom = height - 55,
      left = tight ? 28 : 42,
      right = width - (tight ? 20 : 35);
    const paired = longitudinal(m.design),
      values = [];
    const lanes = groups.map((g) => {
      const rows = g.rows
        .map((row) => ({ id: row.id, row, value: change(row, m) }))
        .filter((p) => Number.isFinite(p.value));
      rows.forEach((p) => values.push(p.value));
      return {
        group: g,
        rows,
        mean: rows.length ? rows.reduce((sum, p) => sum + p.value, 0) / rows.length : null,
      };
    });
    if (!values.length) {
      text(
        svg,
        width / 2,
        height / 2 - 3,
        paired ? 'No complete participant pairs' : 'No observed scores',
        { 'text-anchor': 'middle', class: 'cc-empty' },
      );
      text(
        svg,
        width / 2,
        height / 2 + 19,
        trim(paired ? m.baseline + ' → ' + m.visit : m.visit, width - 20),
        { 'text-anchor': 'middle' },
      );
      return { total: 0, shown: 0 };
    }
    const d = domain(values, true),
      x = (v) => left + ((v - d.min) * (right - left)) / (d.max - d.min);
    const laneHeight = (bottom - top) / Math.max(1, lanes.length);
    const zero = x(0);
    ticks(d).forEach((v) => {
      line(svg, x(v), top, x(v), bottom + 6, {
        stroke: Math.abs(v) < d.step / 1000 ? '#8799b2' : grid,
        'stroke-width': v === 0 ? 1.3 : 0.75,
        'stroke-dasharray': v === 0 ? '4 4' : '2 5',
      });
      text(svg, x(v), bottom + 21, tickNum(v, d.step), {
        'text-anchor': 'middle',
        class: 'cc-number',
        'font-size': 10,
      });
    });
    const unit = paired ? 'Change in ' + (m.unit || 'score').toLowerCase() : m.unit || 'Score';
    text(svg, (left + right) / 2, bottom + 42, trim(unit, right - left, 11), {
      'text-anchor': 'middle',
      'font-size': 10.6,
      fill: fg,
    });
    let total = 0,
      shown = 0;
    lanes.forEach(({ group, rows, mean }, k) => {
      const y0 = top + k * laneHeight,
        center = y0 + laneHeight * 0.58;
      make(svg, 'rect', {
        x: left,
        y: y0 + 2,
        width: right - left,
        height: Math.max(1, laneHeight - 5),
        rx: 4,
        fill: group.color,
        'fill-opacity': 0.045,
        'pointer-events': 'none',
      });
      line(svg, left, center, right, center, {
        stroke: group.color,
        'stroke-opacity': 0.23,
        'stroke-width': 0.7,
      });
      const name = trim(group.name, Math.max(50, (right - left) * 0.4), 12);
      marker(svg, left + 7, y0 + 14, 3.2, group.color, k);
      text(svg, left + 17, y0 + 18, name, { 'font-size': 11.5, 'font-weight': 650, fill: fg });
      text(svg, right - 3, y0 + 18, 'n = ' + rows.length, {
        'text-anchor': 'end',
        'font-size': 10.5,
        class: 'cc-number',
        fill: subdued,
      });
      total += rows.length;
      if (!rows.length) {
        text(svg, (left + right) / 2, center + 3, paired ? 'No complete pairs' : 'No observations', {
          'text-anchor': 'middle',
          'font-size': 11,
        });
        return;
      }
      const show = sampled(rows, dotLimit, m.selectedId)
        .slice()
        .sort((p, q) => p.value - q.value || String(p.id).localeCompare(String(q.id)));
      shown += show.length;
      // Jitter acts only vertically. Positions on the score axis retain the measured value.
      const occupied = [];
      const limit = Math.max(4, Math.floor((laneHeight * 0.32 - 7) / 8));
      const offsets = [0];
      for (let z = 1; z <= limit; z++) offsets.push(-z * 8, z * 8);
      for (const p of show) {
        const xx = x(p.value),
          recent = occupied.filter((q) => Math.abs(q.x - xx) < 10);
        const scoring = (off) =>
          recent.reduce((sum, q) => sum + Math.max(0, 100 - ((q.x - xx) ** 2 + (q.off - off) ** 2)), 0);
        const offset = offsets.reduce(
          (best, off) => (scoring(off) < scoring(best) ? off : best),
          offsets[0],
        );
        occupied.push({ x: xx, off: offset });
        const yy = center + offset,
          g = make(svg, 'g');
        make(g, 'circle', { cx: xx, cy: yy, r: 8, fill: 'transparent' });
        const pt = marker(g, xx, yy, 4.6, group.color, 0, {
          stroke: '#19273b',
          'stroke-width': 1.1,
          opacity: 0.91,
          class: 'cc-dot',
        });
        make(g, 'circle', {
          cx: xx,
          cy: yy,
          r: 8.2,
          fill: 'none',
          stroke: group.color,
          'stroke-width': 1.15,
          opacity: 0,
          class: 'cc-focus',
        });
        const msg =
          p.id + ' · ' + group.name + ' · ' + (paired ? 'Change ' : 'Score ') + num(p.value, paired);
        bindPerson(g, p.row, pt, msg);
      }
      const xx = x(mean),
        ym = y0 + laneHeight - 12;
      const gm = make(svg, 'g');
      line(gm, xx, center - 8, xx, ym - 6, {
        stroke: group.color,
        'stroke-dasharray': '2 4',
        'stroke-opacity': 0.65,
        'pointer-events': 'none',
      });
      const mk = marker(gm, xx, ym, 5.8, group.color, 1, { stroke: '#172436', 'stroke-width': 1.2 });
      make(gm, 'circle', {
        cx: xx,
        cy: ym,
        r: 8.6,
        fill: 'none',
        stroke: fg,
        opacity: 0,
        class: 'cc-focus',
      });
      const labelRight = xx < right - 67;
      text(gm, xx + (labelRight ? 10 : -10), ym + 3.4, num(mean, paired), {
        'text-anchor': labelRight ? 'start' : 'end',
        class: 'cc-number',
        'font-size': 10.4,
        'font-weight': 650,
        fill: group.color,
      });
      meanTarget(
        gm,
        group.name +
          ' · Mean ' +
          (paired ? 'change ' : 'score ') +
          num(mean, paired) +
          ' · n = ' +
          rows.length,
        mk,
      );
    });
    return { total, shown };
  }

  function disposeContrastCanvas(container) {
    const prior = states.get(container);
    if (!prior) return;
    prior.observer?.disconnect();
    if (prior.frame) cancelAnimationFrame(prior.frame);
    states.delete(container);
  }
  function renderContrastCanvas(container, model, actions = {}) {
    if (!container) return;
    let state = states.get(container);
    if (!state) {
      state = { container, lastWidth: 0, frame: 0 };
      states.set(container, state);
      if (typeof ResizeObserver === 'function') {
        state.observer = new ResizeObserver(() => {
          if (
            !container.isConnected ||
            Math.floor(container.clientWidth) === state.lastWidth ||
            state.frame
          )
            return;
          state.frame = requestAnimationFrame(() => {
            state.frame = 0;
            if (states.has(container)) paint(state);
          });
        });
        state.observer.observe(container);
      }
    }
    state.m = model;
    state.a = actions;
    state.data = prep(model);
    paint(state);
  }
  window.renderContrastCanvas = renderContrastCanvas;
  window.disposeContrastCanvas = disposeContrastCanvas;
})();

(() => {
  'use strict';

  const scoreLimit = 12;
  const roles = [
    { key: 'participant', label: 'Participant ID', empty: 'Choose a column' },
    { key: 'arm', label: 'Group', empty: 'One group' },
    { key: 'visit', label: 'Visit', empty: 'One collection occasion' },
    { key: 'population', label: 'Cell population', empty: 'All cells' },
  ];
  let active = null;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function makeButton(label, className, onClick) {
    const button = el('button', className, label);
    button.type = 'button';
    button.addEventListener('click', onClick);
    return button;
  }

  function available() {
    return typeof window.SCTRIAL_LOCAL?.session === 'string' && Boolean(window.SCTRIAL_LOCAL.session);
  }

  async function request(endpoint, payload, signal) {
    if (!available()) throw new Error('Open the workspace from the local H5AD launcher.');
    const headers = { Accept: 'application/json', 'X-sctrial-session': window.SCTRIAL_LOCAL.session };
    const options = {
      method: 'GET',
      headers,
      cache: 'no-store',
      credentials: 'same-origin',
      redirect: 'error',
      signal,
    };
    if (payload !== undefined) {
      options.method = 'POST';
      headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(payload);
    }
    let response;
    try {
      response = await fetch(endpoint, options);
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      throw new Error('The local workspace could not be reached. Check the launcher and try again.');
    }
    let result;
    try {
      result = await response.json();
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      throw new Error('The local workspace returned an unreadable response.');
    }
    if (!response.ok) {
      throw new Error(
        typeof result?.error === 'string'
          ? result.error
          : 'The local workspace could not complete this request.',
      );
    }
    return result;
  }

  async function fit(study, config, signal) {
    if (!study?.studyId) throw new Error('Map the study fields before fitting a comparison.');
    if (!['did', 'paired', 'cross'].includes(config.design))
      throw new Error('Choose a supported comparison.');
    const body = {
      studyId: study.studyId,
      design: config.design,
      arm: config.arm,
      visit: config.visit,
      population: config.population,
    };
    if (config.design !== 'cross') body.baseline = config.baseline;
    if (config.design !== 'paired') body.reference = config.reference;
    if (Array.isArray(config.participants)) body.participants = config.participants;
    const result = await request('/local/fit', body, signal);
    if (!result || !Array.isArray(result.rows))
      throw new Error('The local fit returned no results table.');
    return result;
  }

  function openMapping(onLoaded) {
    if (!available()) return Promise.resolve(null);
    if (active) return active.promise;
    const focusBeforeOpen = document.activeElement;
    const controller = new AbortController();
    const dialog = el('dialog', 'local-mapping');
    dialog.setAttribute('aria-labelledby', 'lm-heading');
    const form = el('form');
    const header = el('div', 'lm-header');
    const title = el('div');
    const heading = el('h2', '', 'Map study fields');
    heading.id = 'lm-heading';
    title.append(el('p', 'lm-eyebrow', 'Local H5AD'), heading);
    const dismiss = makeButton('×', 'lm-dismiss', () => dialog.close());
    dismiss.setAttribute('aria-label', 'Close mapping');
    header.append(title, dismiss);
    const body = el('div', 'lm-body'),
      foot = el('div', 'lm-foot');
    const errorBox = el('p', 'lm-error');
    errorBox.hidden = true;
    errorBox.setAttribute('role', 'alert');
    const cancel = makeButton('Cancel', 'lm-action', () => dialog.close());
    const submit = el('button', 'lm-action lm-primary', 'Open study');
    submit.type = 'submit';
    submit.disabled = true;
    foot.append(cancel, submit);
    form.append(header, body, foot);
    dialog.append(form);
    document.body.append(dialog);
    const status = el('div', 'lm-progress');
    status.setAttribute('role', 'status');
    const spinner = el('span', 'lm-spinner');
    spinner.setAttribute('aria-hidden', 'true');
    status.append(spinner, el('span', '', 'Reading study columns…'));
    body.append(status);

    let finishPromise,
      preparedStudy = null,
      settled = false;
    const promise = new Promise((resolve) => {
      finishPromise = resolve;
    });
    active = { promise };
    dialog.addEventListener(
      'close',
      () => {
        if (settled) return;
        settled = true;
        controller.abort();
        dialog.remove();
        active = null;
        if (focusBeforeOpen?.isConnected) focusBeforeOpen.focus({ preventScroll: true });
        finishPromise(preparedStudy);
        if (preparedStudy && typeof onLoaded === 'function') onLoaded(preparedStudy);
      },
      { once: true },
    );
    dialog.showModal();

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function setUp(schema) {
      if (
        !Array.isArray(schema?.columns) ||
        !schema.columns.every((c) => typeof c?.name === 'string')
      ) {
        throw new Error('The file did not provide a readable observation-column list.');
      }
      const suggested = schema.suggested || {};
      const columns = [...schema.columns].sort((a, b) =>
        a.name.localeCompare(b.name, undefined, { numeric: true }),
      );
      const numeric = columns.filter((c) => c.numeric).map((c) => c.name);
      const selected = new Set(
        (Array.isArray(suggested.scores) ? suggested.scores : [])
          .filter((s) => numeric.includes(s))
          .slice(0, scoreLimit),
      );
      const file = el('div', 'lm-file'),
        fileDetails = el('div');
      const cellCount = Number.isFinite(schema.nCells)
        ? schema.nCells.toLocaleString() + ' cells · '
        : '';
      fileDetails.append(
        el('b', '', schema.filename || 'Local study'),
        el('small', '', cellCount + columns.length + ' observation columns'),
      );
      const mark = el('span', 'lm-file-mark', 'H5');
      mark.setAttribute('aria-hidden', 'true');
      file.append(mark, fileDetails);
      const designSection = el('section', 'lm-section');
      designSection.append(el('h3', '', 'Study design'));
      const grid = el('div', 'lm-fields');
      const selectors = {};
      for (const role of roles) {
        const label = el('label', 'lm-field');
        const select = el('select');
        select.name = role.key;
        select.setAttribute('aria-label', role.label);
        select.append(new Option(role.empty, ''));
        columns.forEach((c) => select.append(new Option(c.name, c.name)));
        const suggestion = suggested[role.key];
        if (columns.some((c) => c.name === suggestion)) select.value = suggestion;
        selectors[role.key] = select;
        label.append(el('span', '', role.label), select);
        grid.append(label);
      }
      designSection.append(grid);

      const scoreSection = el('section', 'lm-section');
      const scoreHead = el('div', 'lm-outcome-head'),
        count = el('span', 'lm-count');
      scoreHead.append(el('h3', '', 'Outcome scores'), count);
      const search = el('input');
      search.type = 'search';
      search.placeholder = 'Filter numeric columns';
      search.setAttribute('aria-label', 'Filter numeric columns');
      const scoreList = el('div', 'lm-scores');
      scoreList.setAttribute('role', 'group');
      scoreList.setAttribute('aria-label', 'Outcome scores');
      const note = el('p', 'lm-note', 'Select up to 12 numeric scores from the observation table.');
      const validation = el('p', 'lm-note');
      validation.setAttribute('role', 'status');
      scoreSection.append(scoreHead, search, scoreList, note, validation);
      body.replaceChildren(file, designSection, scoreSection, errorBox);

      const mappedRoles = () => roles.map((r) => selectors[r.key].value).filter(Boolean);
      function updateState() {
        const mapped = mappedRoles();
        const overlap = new Set(mapped).size !== mapped.length;
        const problem = !selectors.participant.value
          ? 'Choose the participant ID column.'
          : overlap
            ? 'Use a different column for each study role.'
            : !numeric.length
              ? 'This file has no numeric observation scores.'
              : selected.size === 0
                ? 'Choose at least one outcome score.'
                : '';
        submit.disabled = Boolean(problem);
        validation.textContent = problem;
        validation.hidden = !problem;
        count.textContent = selected.size + ' selected';
        const locked = new Set(mapped);
        scoreList.querySelectorAll('input').forEach((box) => {
          box.disabled = locked.has(box.value) || (!box.checked && selected.size >= scoreLimit);
        });
      }
      function drawScores() {
        const needle = search.value.trim().toLocaleLowerCase();
        const matches = numeric.filter((n) => n.toLocaleLowerCase().includes(needle));
        const fragment = document.createDocumentFragment();
        for (const name of matches) {
          const row = el('label', 'lm-score'),
            check = el('input');
          check.type = 'checkbox';
          check.value = name;
          check.checked = selected.has(name);
          check.addEventListener('change', () => {
            if (check.checked) selected.add(name);
            else selected.delete(name);
            errorBox.hidden = true;
            updateState();
          });
          row.append(check, el('span', '', name));
          fragment.append(row);
        }
        if (!matches.length)
          fragment.append(
            el(
              'p',
              'lm-empty',
              numeric.length ? 'No scores match this filter.' : 'No numeric columns found.',
            ),
          );
        scoreList.replaceChildren(fragment);
        updateState();
      }
      function roleChanged() {
        mappedRoles().forEach((name) => selected.delete(name));
        errorBox.hidden = true;
        drawScores();
      }
      Object.values(selectors).forEach((select) => select.addEventListener('change', roleChanged));
      search.addEventListener('input', drawScores);
      roleChanged();
      selectors.participant.focus({ preventScroll: true });
      let sending = false;
      form.onsubmit = async (event) => {
        event.preventDefault();
        if (sending || submit.disabled) return;
        sending = true;
        const payload = Object.fromEntries(roles.map((r) => [r.key, selectors[r.key].value || null]));
        payload.scores = [...selected];
        errorBox.hidden = true;
        submit.disabled = true;
        submit.textContent = 'Opening…';
        for (const control of body.querySelectorAll('input,select')) control.disabled = true;
        try {
          const result = await request('/local/study', payload, controller.signal);
          if (!dialog.open || controller.signal.aborted) return;
          if (
            !result?.studyId ||
            !Array.isArray(result.participants) ||
            !Array.isArray(result.features) ||
            !Array.isArray(result.observations)
          ) {
            throw new Error('The local workspace returned an incomplete study.');
          }
          preparedStudy = result;
          dialog.close();
        } catch (error) {
          if (controller.signal.aborted || !dialog.open) return;
          for (const control of body.querySelectorAll('input,select')) control.disabled = false;
          submit.textContent = 'Open study';
          updateState();
          showError(error.message);
          sending = false;
        }
      };
    }

    async function load() {
      errorBox.hidden = true;
      submit.hidden = false;
      submit.disabled = true;
      body.replaceChildren(status);
      try {
        const schema = await request('/local/schema', undefined, controller.signal);
        if (!controller.signal.aborted && dialog.open) setUp(schema);
      } catch (error) {
        if (controller.signal.aborted || !dialog.open) return;
        body.replaceChildren(errorBox);
        showError(error.message);
        submit.hidden = true;
        const retry = makeButton('Retry', 'lm-action lm-primary', () => {
          retry.remove();
          load();
        });
        foot.append(retry);
        retry.focus();
      }
    }
    load();
    return promise;
  }
  window.localStudyClient = Object.freeze({ available, openMapping, fit });
})();

(() => {
  'use strict';
  const icons = {
    dashboard:
      '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    people:

  function intervalGraphic(row) {
    if (![row.lo, row.estimate, row.hi].every(Number.isFinite) || row.lo > row.hi) return '';
    const extent = Math.max(Math.abs(row.lo), Math.abs(row.hi), Math.abs(row.estimate));
    if (!extent) return '';
    const position = (value) => 50 + 45 * (value / extent);
    const start = position(row.lo),
      end = position(row.hi);
    return (
      '<div class="interval-ruler" aria-hidden="true"><div class="ruler-line"></div><div class="ruler-zero"><small>0</small></div>' +
      '<div class="ruler-whisker" style="left:' +
      start +
      '%;width:' +
      (end - start) +
      '%"></div>' +
      '<i style="left:' +
      position(row.estimate) +
      '%"></i></div>'
    );
  }
  function chartInstruction() {
    const el = $('chartInstruction');
    if (!el) return;
    if (state.selectedId != null) {
      el.innerHTML = button('inspectSelection', 'person', 'Inspect ' + state.selectedId);
    } else {
      el.innerHTML =
        icon('crosshair') +
        '<span>' +
        (state.mode === 'changes' ? 'Select a point' : 'Select a trace') +
        ' to inspect</span>';
    }
  }
  function paintInspector() {
    const box = $('inspector');
    if (!box) return;
    const active = box.contains(document.activeElement)
      ? document.activeElement.dataset.featureId
      : null;
    const person = state.selectedId == null ? null : personById.get(state.selectedId);
    if (person) {
      const visits = study.visits.map((v) => ({ v, r: rowAt(person.id, v) })),
        first = rowAt(person.id, state.baseline)?.scores[state.feature],
        last = rowAt(person.id, state.visit)?.scores[state.feature];
      const summary = isLong()
        ? Number.isFinite(last) && Number.isFinite(first)
          ? last - first
          : null
        : last;
      box.innerHTML =
        '<div class="ins-head"><span>' +
        icon('person') +
        'Participant inspector</span><button class="icon-btn" id="clearSelection" aria-label="Clear participant selection">' +
        icon('close') +
        '</button></div><div class="subject-title"><span class="subject-swatch" style="background:' +
        lightColor(person.arm) +
        '"></span><h3>' +
        esc(person.id) +
        '</h3><span>' +
        esc(person.arm) +
        '</span></div><div class="est-box"><div class="est-num">' +
        number(summary, isLong()) +
        '</div><div class="est-caption">' +
        esc(isLong() ? 'Within-participant change' : unit()) +
        '</div></div><h3>Visit measurements</h3><div class="ins-scroll"><table class="ins-tbl"><thead><tr><th>Visit</th><th>Score</th><th>Cells</th></tr></thead><tbody>' +
        visits
          .map(
            ({ v, r }) =>
              '<tr class="' +
              (datesIn().includes(v) ? 'in' : '') +
              '"><td>' +
              esc(v) +
              '</td><td>' +
              number(r?.scores[state.feature]) +
              '</td><td>' +
              nfmt(r?.cells) +
              '</td></tr>',
          )
          .join('') +
        '</tbody></table></div><div class="ins-bottom">' +
        button('personRecord', 'arrow', 'Participant record') +
        '</div>';
      $('clearSelection').onclick = () => {
        selectPerson(null);
        document.querySelector('[data-feature-id][aria-pressed=true]')?.focus();
      };
      return;
    }
    const rows = currentRows(),
      r = selectedEstimate(),
      loading = fitStatus === 'loading',
      have = ready(),
      finite = Number.isFinite(r?.estimate);
    const ci = r && r.lo != null && r.hi != null,
      ciText = ci ? number(r.lo, true) + ' to ' + number(r.hi, true) : 'Unavailable';
    const subtitle = synthetic() ? 'Reference fit' : native() && fitted() ? 'Local fit' : 'Descriptive';
    const fitLabel =
      state.design === 'did'
        ? 'Difference in change'
        : state.design === 'paired'
          ? 'Paired change'
          : state.design === 'cross'
            ? 'Group difference'
            : 'Participant mean';
    let result =
      '<div class="ins-head"><span>' +
      icon('crosshair') +
      'Contrast inspector</span><small class="ins-method">' +
      subtitle +
      '</small></div><div class="est-box"><h3>' +
      fitLabel +
      '</h3><div class="est-num">' +
      (have && finite ? number(r.estimate, true) : '—') +
      '</div><div class="est-caption">' +
      esc(contrast()) +
      '</div>';
    if (have && r) {
      if (ci) result += intervalGraphic(r);
      result +=
        '<div class="estimate-ticks">' +
        (fitted() ? '<span>95% interval<b>' + esc(ciText) + '</b></span>' : '') +
        '<span>Participants<b>' +
        nfmt(r.n) +
        '</b></span></div>';
    } else {
      result +=
        '<p class="small" role="status">' +
        (loading ? 'Fitting selected comparison…' : esc(fitMessage || 'Fit unavailable.')) +
        '</p>' +
        (!loading ? button('retry', 'refresh', 'Retry fit') : '');
    }
    if (have && r && !finite && r.reason) result += '<p class="small">' + esc(r.reason) + '</p>';
    result +=
      '</div><div class="outcomes-head"><h3>Outcome panel</h3><span>' +
      study.features.length +
      ' scores</span></div><div class="outcomes-shell"><div class="outcomes">' +
      study.features
        .map((f) => {
          const row = rows.find((x) => x.id === f.id);
          return (
            '<button data-feature-id="' +
            esc(f.id) +
            '" class="outcome" aria-pressed="' +
            (f.id === state.feature) +
            '"><i class="radio"></i><span class="flabel">' +
            esc(f.label) +
            '</span><strong>' +
            number(row?.estimate, true) +
            '</strong></button>'
          );
        })
        .join('') +
      '</div></div><div class="ins-bottom">' +
      button('results', 'arrow', 'Open results table') +
      '</div>';
    box.innerHTML = result;
    if (active)
      Array.from(box.querySelectorAll('[data-feature-id]'))
        .find((b) => b.dataset.featureId === active)
        ?.focus();
  }
  function renderResultsView() {
    const page = $('page');
    if (!ready()) {
      page.innerHTML =
        '<div class="card pending"><h2>Model results</h2><p role="status">' +
        esc(
          fitStatus === 'loading'
            ? 'Fitting selected comparison…'
            : fitMessage || 'Results unavailable.',
        ) +
        '</p>' +
        (!fitTask ? button('retry', 'refresh', 'Run fit', 'btn') : '') +
        '</div>';
      return;
    }
    renderResults(
      page,
      {
        rows: currentRows(),
        selected: state.feature,
        unit: unit(),
        reference: fitted(),
        isMean: state.design === 'observe',
        contrast: contrast(),
      },
      {
        onSelect: (id) => {
          state.feature = id;
          renderResultsView();
        },
        onShowOverview: (id) => {
          state.feature = id;
          state.selectedId = null;
          navigate('overview');
        },
        onExport: () => exportFile('results'),
      },
    );
    if (currentFit?.warnings?.length) {
      const d = document.createElement('details');
      d.className = 'fit-warnings';
      const summary = document.createElement('summary');
      summary.textContent = 'Model notes (' + currentFit.warnings.length + ')';
      d.append(summary);
      for (const w of currentFit.warnings) {
        const p = document.createElement('p');
        p.textContent = w;
        d.append(p);
      }
      page.append(d);
    }
  }
  function render() {
    updateTop();
    if (state.view !== 'overview' && $('plot')) disposeContrastCanvas($('plot'));
    if (state.view === 'overview') overview();
    else if (state.view === 'participants') {
      renderPeople(
        $('page'),
        {
          ...peopleContext,
          participants: study.participants,
          arms,
          visits: study.visits,
          observations: study.observations,
          population: state.population,
          selectedVisits: datesIn(),
          analysisArms: armsIn(),
          feature: feature(),
        },
        {},
      );
      peopleContext = {};
    } else if (state.view === 'results') renderResultsView();
    else bench.render($('page'));
  }
  function navigate(view, context = {}) {
    peopleContext = context;
    state.view = view;
    state.focus = false;
    render();
    window.scrollTo(0, 0);
  }
  function modal(title, html) {
    const d = $('dialog');
    if (!d.open) previousTrigger = document.activeElement;
    $('dialogTitle').textContent = title;
    $('dialogBody').innerHTML = html;
    if (!d.open) d.showModal();
  }
  function finish() {
    if ($('dialog').open) $('dialog').close();
  }
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      $('toast').hidden = true;
    }, 2600);
  }
  $('dialog').addEventListener('close', () => {
    if (previousTrigger?.isConnected) previousTrigger.focus();
    previousTrigger = null;
  });
  $('dismiss').onclick = finish;
  $('dialog').addEventListener('click', (e) => {
    if (e.target === $('dialog')) {
      const r = $('dialog').getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
        finish();
    }
  });
  function search() {
    modal(
      'Find in study',
      '<label class="field"><span>Participant ID or score</span><input class="field-input" id="query" autocomplete="off" type="search" placeholder="Search this study"></label><div class="modal-list" id="matches"></div>',
    );
    const data = [
      ...study.features.map((f) => ({ key: f.id, title: f.label, type: 'Outcome score' })),
      ...study.participants.map((p) => ({ key: p.id, title: p.id, type: p.arm })),
    ];
    function update() {
      const q = $('query').value.trim().toLowerCase(),
        hits = data.filter((i) => (i.title + ' ' + i.type).toLowerCase().includes(q)).slice(0, 30);
      $('matches').innerHTML =
        hits
          .map(
            (i, n) =>
              '<button data-match="' +
              n +
              '"><b>' +
              esc(i.title) +
              '</b><small>' +
              esc(i.type) +
              '</small></button>',
          )
          .join('') || '<p class="empty">No matches.</p>';
      document.querySelectorAll('[data-match]').forEach(
        (b) =>
          (b.onclick = () => {
            const i = hits[Number(b.dataset.match)];
            finish();
            if (data.indexOf(i) < study.features.length) {
              state.feature = i.key;
              state.selectedId = null;
              navigate('overview');
            } else navigate('participants', { initialId: i.key });
          }),
      );
    }
    $('query').oninput = update;
    update();
    $('query').focus();
  }
  function download(file, data, type) {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a');
    a.download = file;
    a.href = url;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  const choice = (id, glyph, title, note) =>
    '<button class="choice" id="' +
    id +
    '"><i>' +
    icon(glyph) +
    '</i><span><strong>' +
    esc(title) +
    '</strong><small>' +
    esc(note) +
    '</small></span></button>';
  function openStudy() {
    modal(
      'Open study',
      '<label class="drop-zone" id="drop" tabindex="0" role="button">' +
        icon('upload') +
        '<strong>Choose a participant CSV</strong><small>or drop a file here · up to 8 MB</small><input id="csvFile" type="file" accept=".csv,text/csv" hidden></label><p class="hint">One row per participant, group, visit, and cell population. Include cell counts and at least one numeric score. Imported studies support descriptive comparisons.</p><div id="importError" class="error" role="alert" hidden></div>' +
        (localStudyClient.available()
          ? choice(
              'h5map',
              'layers',
              'Map H5AD columns',
              'Participant, visits, groups and outcome scores',
            )
          : '<details class="launch"><summary>Use an H5AD file</summary><p>From a checkout of this branch, install the package and launch it with a local study file.</p><code>python -m pip install -e .<br>python -m sctrial.interactive study.h5ad</code></details>') +
        choice('template', 'file', 'Download example CSV', 'Column names and a small test study') +
        choice(
          'restore',
          'layers',
          'Open example study',
          'Synthetic cohort with fitted reference results',
        ),
    );
    async function read(file) {
      if (!file) return;
      try {
        if (file.size > 8 * 1024 * 1024) throw Error('Choose a CSV smaller than 8 MB.');
        const next = readStudyCSV(await file.text(), file.name);
        finish();
        init(next);
        toast('Study opened');
      } catch (e) {
        $('importError').textContent = e.message;
        $('importError').hidden = false;
      }
    }
    if ($('h5map'))
      $('h5map').onclick = () => {
        finish();
        void localStudyClient.openMapping(init).catch((e) => toast(e.message));
      };
    $('csvFile').onchange = (e) => read(e.target.files[0]);
    $('drop').onkeydown = (e) => {
      if ([' ', 'Enter'].includes(e.key)) {
        e.preventDefault();
        $('csvFile').click();
      }
    };
    for (const event of ['dragenter', 'dragover'])
      $('drop').addEventListener(event, (e) => {
        e.preventDefault();
        $('drop').classList.add('over');
      });
    $('drop').ondragleave = () => $('drop').classList.remove('over');
    $('drop').ondrop = (e) => {
      e.preventDefault();
      $('drop').classList.remove('over');
      read(e.dataTransfer.files[0]);
    };
    $('template').onclick = () => download('participant-summaries.csv', studyCSVTemplate(), 'text/csv');
    $('restore').onclick = () => {
      finish();
      init(sample);
      toast('Example study opened');
    };
  }
  function csv(rows) {
    return (
      rows
        .map((row) =>
          row
            .map((v) => {
              if (v == null) return '';
              if (typeof v === 'number') return String(v);
              let s = String(v);
              if (/^[\s]*[=+@-]/.test(s)) s = "'" + s;
              return '"' + s.replace(/"/g, '""') + '"';
            })
            .join(','),
        )
        .join('\r\n') + '\r\n'
    );
  }
  function exportFile(kind) {
    if (kind === 'settings') {
      const spec = {
        study: name(),
        source: source(),
        design: state.design,
        orderedGroups: armsIn(),
        visits: datesIn(),
        population: state.population,
        featurePanel: study.features,
        selectedFeature: state.feature,
        unit: unit(),
        method: method(),
        ...(synthetic()
          ? { package: study.study.package, commit: study.study.commit, seed: study.study.seed }
          : {}),
        ...(native()
          ? {
              mapping: study.mapping || null,
              version: study.version || null,
              warnings: currentFit?.warnings || [],
            }
          : {}),
      };
      download('sctrial-comparison.json', JSON.stringify(spec, null, 2), 'application/json');
    } else if (kind === 'results') {
      const headers = [
        'feature',
        'measure',
        'design',
        'first_group',
        'second_group',
        'visits',
        'population',
        'estimate',
        'n',
        ...(fitted() ? ['ci_lower', 'ci_upper', 'p', 'fdr'] : []),
      ];
      const rows = currentRows().map((r) => [
        r.label,
        state.design === 'observe' ? 'mean' : fitted() ? 'model estimate' : 'descriptive difference',
        state.design,
        state.arm,
        armsIn()[1] ?? '',
        datesIn().join(' to '),
        state.population,
        r.estimate,
        r.n,
        ...(fitted() ? [r.lo, r.hi, r.p, r.q] : []),
      ]);
      download('sctrial-results.csv', csv([headers, ...rows]), 'text/csv');
    } else {
      const header = [
        'participant',
        'arm',
        'visit',
        'population',
        'cells',
        ...study.features.map((f) => f.label),
      ];
      const rows = (byPopulation.get(state.population) || [])
        .filter((r) => armsIn().includes(r.arm) && datesIn().includes(r.visit))
        .map((r) => [
          r.id,
          r.arm,
          r.visit,
          r.population,
          r.cells,
          ...study.features.map((f) => r.scores[f.id]),
        ]);
      download('sctrial-participant-summaries.csv', csv([header, ...rows]), 'text/csv');
    }
    toast('Export downloaded');
  }
  function exportMenu() {
    modal(
      'Export study data',
      choice(
        'resFile',
        'chart',
        'Feature results · CSV',
        fitted()
          ? 'Estimates, intervals, p-values and fitted counts'
          : 'Descriptive estimates and participant counts',
      ) +
        choice(
          'setFile',
          'code',
          'Comparison settings · JSON',
          'Group order, visits, population and feature panel',
        ) +
        choice(
          'obsFile',
          'people',
          'Participant summaries · CSV',
          'Includes participant IDs for the selected groups and visits',
        ),
    );
    $('resFile').disabled = !ready();
    for (const [id, kind] of [
      ['resFile', 'results'],
      ['setFile', 'settings'],
      ['obsFile', 'observations'],
    ])
      $(id).onclick = () => {
        finish();
        exportFile(kind);
      };
  }
  function info() {
    const entries = [
      ['Study', name()],
      ['Source', source()],
      ['Measurement', unit()],
      ['Method', method()],
      ...(synthetic()
        ? [
            ['Package', sample.study.package],
            ['FDR', sample.study.multiplicity],
            ['Interpretation', sample.study.smallSample],
          ]
        : []),
      ...(native() && currentFit?.warnings?.length
        ? [['Model notes', currentFit.warnings.join(' ')]]
        : []),
    ];
    modal(
      'Study information',
      '<dl class="meta-list">' +
        entries.map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>').join('') +
        '</dl>',
    );
  }
  function snapshotSpec() {
    return Object.fromEntries(
      ['design', 'arm', 'baseline', 'visit', 'population'].map((k) => [k, state[k]]),
    );
  }
  function travel(back) {
    const from = back ? past : future,
      to = back ? future : past;
    if (!from.length) return;
    to.push(snapshotSpec());
    Object.assign(state, from.pop());
    state.selectedId = null;
    clearFit();
    render();
    if (native() && fitted()) void requestFit();
  }
  function remember() {
    past.push(snapshotSpec());
    if (past.length > 40) past.shift();
    future.length = 0;
  }
  const actions = {
    inspectSelection: () => {
      const panel = $('inspector');
      panel?.focus({ preventScroll: true });
      panel?.scrollIntoView({ block: 'nearest' });
    },
    open: openStudy,
    export: exportMenu,
    search,
    info,
    results: () => navigate('results'),
    cohort: () => navigate('participants'),
    personRecord: () => {
      if (state.selectedId) navigate('participants', { initialId: state.selectedId });
    },
    pin: () => {
      if (ready()) bench.pin();
    },
    retry: () => void requestFit(),
    focus: () => {
      state.focus = !state.focus;
      updateTop();
      overview();
      document.querySelector('[data-action="focus"]').focus();
    },
    undo: () => travel(true),
    redo: () => travel(false),
  };
  document.addEventListener('click', (e) => {
    const view = e.target.closest('[data-view]');
    if (view) {
      navigate(view.dataset.view);
      return;
    }
    const f = e.target.closest('[data-feature-id]');
    if (f) {
      setFeature(f.dataset.featureId);
      return;
    }
    const p = e.target.closest('[data-person-index]');
    if (p) {
      const id = study.participants[Number(p.dataset.personIndex)].id;
      selectPerson(state.selectedId === id ? null : id);
      return;
    }
    const m = e.target.closest('[data-mode]');
    if (m) {
      if (state.mode !== m.dataset.mode) {
        state.mode = m.dataset.mode;
        overview();
        document.querySelector('[data-mode="' + state.mode + '"]').focus();
      }
      return;
    }
    const action = e.target.closest('[data-action]');
    if (action) actions[action.dataset.action]?.();
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset.param) {
      const field = e.target.dataset.param;
      setParam(field, e.target.value);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (
      document.querySelector('dialog[open]') ||
      ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) ||
      e.target.isContentEditable
    )
      return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      travel(!e.shiftKey);
      return;
    }
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      search();
    }
    if (e.key === 'Escape' && state.focus) {
      state.focus = false;
      render();
    }
  });
  init(sample);
  if (localStudyClient.available())
    void localStudyClient.openMapping(init).catch((e) => toast(e.message));
})();

    </script>
  </body>
