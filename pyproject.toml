[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "sctrial"
version = "0.2.1.dev1"
description = "Trial-aware inference utilities for single-cell AnnData: DiD, crossover, module scoring, pseudobulk, and abundance."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = {  text = "MIT" }
authors = [{ name = "Contributors" }]
keywords = ["single-cell", "anndata", "trial", "difference-in-differences", "crossover", "pseudobulk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]

dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scipy>=1.8",
  "statsmodels>=0.13",
  "anndata>=0.9",
  "joblib>=1.2",
]

[project.urls]
Homepage = "https://github.com/TheOmarLab/sctrial"
Repository = "https://github.com/TheOmarLab/sctrial"
Issues = "https://github.com/TheOmarLab/sctrial/issues"

[project.optional-dependencies]
plots = ["matplotlib>=3.6", "seaborn>=0.12", "scanpy>=1.9"]
gsea = ["gseapy>=1.0"]
aucell = ["pyscenic>=0.12"]
survival = ["lifelines>=0.27"]
all = [
  "matplotlib>=3.6",
  "seaborn>=0.12",
  "scanpy>=1.9",
  "gseapy>=1.0",
  "pyscenic>=0.12",
  "lifelines>=0.27",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.5",
  "mypy>=1.5",
  "pre-commit>=3.0",
  "build>=1.0",
  "twine>=5.0",
  "psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sctrial"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sctrial",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Ignore line-too-long errors

[tool.coverage.run]
branch = true
source = ["src/sctrial"]
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
