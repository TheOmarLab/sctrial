<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" width="72" height="64">
  <defs>
    <linearGradient id="gi1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0096C7"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    <linearGradient id="gi2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- Left circle (single-cell) -->
  <circle cx="26" cy="32" r="24" fill="url(#gi1)" opacity="0.8"/>
  <!-- Right circle (clinical trial) -->
  <circle cx="48" cy="32" r="24" fill="url(#gi2)" opacity="0.8"/>

  <!-- Scatter dots in left circle (cells) -->
  <circle cx="14" cy="24" r="2.2" fill="#fff" opacity="0.55"/>
  <circle cx="20" cy="40" r="2.0" fill="#fff" opacity="0.50"/>
  <circle cx="10" cy="35" r="1.6" fill="#fff" opacity="0.40"/>
  <circle cx="22" cy="20" r="1.4" fill="#fff" opacity="0.35"/>
  <circle cx="16" cy="48" r="1.8" fill="#fff" opacity="0.45"/>
  <circle cx="8" cy="28" r="1.3" fill="#fff" opacity="0.30"/>
  <circle cx="26" cy="46" r="1.5" fill="#fff" opacity="0.40"/>

  <!-- Delta triangle in overlap -->
  <path d="M37,18 L45,46 L29,46 Z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" opacity="0.92"/>

  <!-- Upward arrow in right circle -->
  <line x1="56" y1="44" x2="56" y2="24" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <polyline points="50.5,29 56,23.5 61.5,29" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
