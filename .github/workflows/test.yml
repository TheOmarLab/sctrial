name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y pandoc
        python -m pip install --upgrade pip
        pip install .[dev,plots,gsea]
        pip install ipykernel
        python -m ipykernel install --user --name python3
    - name: Lint with Ruff
      run: |
        ruff check src tests
    # Python 3.12 resolves anndata 0.13, whose annotations type X, the layers and obs as
    # unions the package does not narrow yet. The types are checked on the other versions.
    - name: Check types with Mypy
      if: matrix.python-version != '3.12'
      run: |
        mypy src
    - name: Run tests
      run: |
        pip install -e .[dev,plots,gsea]
        pip list
        pytest -v -rs --cov=sctrial --cov-report=xml
    - name: Build documentation
      run: |
        pip install -e .[plots,gsea]
        pip install .[docs]
        cd docs && sphinx-build -b html -d build/doctrees source build/html
        touch build/html/.nojekyll

  test-workspace:
    name: Browser workspace
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install the workspace and browser
      run: |
        python -m pip install . pytest playwright
        python -m playwright install --with-deps chromium
    - name: Test participant selection, comparisons and private imports
      run: python -m pytest -q tests/test_interactive_browser.py tests/test_interactive_atlas.py

  test-extras:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install with the optional extras
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,plots,gsea,bayes,survival]
    - name: Run the tests that need the optional extras
      run: |
        pytest -v -rs tests/test_bayes.py tests/test_survival.py tests/test_two_arm_restriction.py

  deploy-docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y pandoc
        pip install .[plots,gsea,docs]
        pip install ipykernel
        python -m ipykernel install --user --name python3
    - name: Build documentation
      run: |
        cd docs && sphinx-build -b html -d build/doctrees source build/html
        touch build/html/.nojekyll
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build/html
