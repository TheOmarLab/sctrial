name: Bug report
description: Create a report to help us improve sctrial
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you did!
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducible Example
      description: Please provide a minimal, self-contained example that reproduces the issue.
      placeholder: |
        import sctrial as st
        ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Versions of python, sctrial, anndata, pandas, etc.
