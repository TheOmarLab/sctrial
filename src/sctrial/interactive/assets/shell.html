<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>sctrial · Analysis workbook</title>
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <a href="#main" class="skip">Skip to analysis</a>
    <div class="workbook">
      <aside id="projectSidebar" class="project-sidebar" aria-label="Project navigator">
        <div class="sidebar-brand">
          <svg class="brand-mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="#6d68ee" />
            <path
              d="M6 21.5h4.5l4.8-12h4.1L14.7 21.5h4.1l4.8-12H27"
              fill="none"
              stroke="#fff"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <strong>sctrial</strong>
          <button type="button" id="closeSidebar" aria-label="Close project navigator">
            <i data-icon="close"></i>
          </button>
        </div>
        <div class="sidebar-content">
          <button
            type="button"
            data-action="open"
            class="study-switch"
            aria-label="Switch active study"
          >
            <span class="study-folder"><i data-icon="folder"></i></span>
            <span class="study-file"><small id="sourceBadge"></small><b id="studyName"></b></span>
            <i data-icon="chevrons"></i>
          </button>
          <nav class="project-nav" aria-label="Study views">
            <div class="side-label">Study</div>
            <button data-view="participants">
              <i data-icon="people"></i><span>Participant register</span>
            </button>
            <button data-view="results"><i data-icon="chart"></i><span>Results table</span></button>
            <button data-view="bench">
              <i data-icon="pin"></i><span>Pinned contrasts</span><b id="pinCount" hidden>0</b>
            </button>
          </nav>
          <section class="analysis-list" aria-labelledby="analysisLabel">
            <div class="side-head">
              <h2 class="side-label" id="analysisLabel">Analyses</h2>
              <button id="newSheet" type="button" aria-label="New analysis" title="New analysis">
                <svg
                  aria-hidden="true"
                  viewBox="0 0 20 20"
                  width="16"
                  height="16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <path d="M10 4v12M4 10h12" />
                </svg>
              </button>
            </div>
            <div id="sheetList"></div>
          </section>
          <section class="design-map" aria-labelledby="designMapTitle">
            <div class="map-head">
              <h2 class="side-label" id="designMapTitle">Study coverage</h2>
              <button type="button" data-action="info" aria-label="Study information">
                <i data-icon="info"></i>
              </button>
            </div>
            <div id="studyMap"></div>
          </section>
        </div>
        <div class="sidebar-bottom">
          <span class="local-glyph"><i data-icon="layers"></i></span
          ><span><b>Current study</b><small id="studyCount"></small></span
          ><button
            type="button"
            data-action="open"
            aria-label="Change data source"
            title="Change data source"
          >
            <i data-icon="open"></i>
          </button>
        </div>
      </aside>
      <div id="navigatorShade" hidden></div>
      <div class="workspace-body">
        <header class="workspace-bar">
          <button
            id="showSidebar"
            type="button"
            aria-label="Open project navigator"
            aria-controls="projectSidebar"
            aria-expanded="false"
          >
            <i data-icon="menu"></i>
          </button>
          <div class="breadcrumbs">
            <i data-icon="layers"></i><span class="crumb-root">Workspace</span
            ><span id="mobileSource"></span><span class="crumb-slash" aria-hidden="true">/</span
            ><b id="sectionCrumb">Analysis workbook</b>
          </div>
          <button type="button" class="top-open" data-action="open">
            <i data-icon="open"></i><span>Open study</span>
          </button>
          <button
            type="button"
            class="workbook-search"
            data-action="search"
            aria-label="Find in study"
          >
            <i data-icon="search"></i><span>Find in study</span><kbd>/</kbd>
          </button>
        </header>
        <main id="main" tabindex="-1">
          <div class="work-head">
            <div class="sheet-heading">
              <span class="document-mark" aria-hidden="true"><i data-icon="file"></i></span>
              <h1 id="pageTitle">Primary analysis</h1>
            </div>
            <div class="main-actions">
              <div class="history">
                <button
                  id="undo"
                  data-action="undo"
                  aria-label="Undo contrast change"
                  title="Undo contrast change"
                >
                  <i data-icon="undo"></i></button
                ><button
                  id="redo"
                  data-action="redo"
                  aria-label="Redo contrast change"
                  title="Redo contrast change"
                >
                  <i data-icon="redo"></i>
                </button>
              </div>
              <button class="btn export-button" data-action="export">
                <i data-icon="download"></i><span>Export</span>
              </button>
              <button class="btn accent" data-action="pin" id="pinButton">
                <i data-icon="pin"></i><span>Pin contrast</span>
              </button>
            </div>
          </div>
          <div id="page"></div>
        </main>
      </div>
    </div>
    <dialog class="modal" id="dialog" aria-labelledby="dialogTitle">
      <header class="modal-head">
        <h2 id="dialogTitle"></h2>
        <button id="dismiss" class="icon-btn" aria-label="Close dialog">
          <i data-icon="close"></i>
        </button>
      </header>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script id="dataset" type="application/json">
      /*FIXTURE*/
    </script>
    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
